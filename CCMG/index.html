 Đất đai\"; Đề 2A chọn phương án liệt kê đầy đủ các luật.","multi":false,"id":530,"fix":true,"sets":{"2A":3}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 53","q":"Nếu bên mua, thuê mua nhà ở, công trình xây dựng tự thực hiện việc xin cấp Giấy chứng nhận thì tổng số tiền thanh toán trước khi được cấp giấy không vượt quá bao nhiêu % giá trị hợp đồng?","opts":{"A":"70%","B":"80%","C":"90%","D":"95%"},"ans":["D"],"exp":"","note":"","multi":false,"id":531,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 54 · Đề 2A câu 39","q":"Đâu KHÔNG phải là tác động tích cực được kỳ vọng từ việc áp dụng Luật kinh doanh bất động sản 2023?","opts":{"A":"Thị trường BĐS minh bạch, ổn định và chuyên nghiệp hơn.","B":"Quyền lợi của người mua nhà được bảo vệ tốt hơn.","C":"Giảm thiểu tình trạng đầu cơ, sốt ảo trên thị trường.","D":"Giảm giá nhà ở trên diện rộng ngay lập tức."},"ans":["D"],"exp":"","note":"Hiệu đính: tài liệu gốc tô C; Đề 2A chọn D.","multi":false,"id":532,"fix":true,"sets":{"2A":39}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 55","q":"Tại sao việc yêu cầu \"hoàn thành việc đầu tư xây dựng hạ tầng kỹ thuật thiết yếu\" trước khi kinh doanh quyền sử dụng đất lại quan trọng trong việc quản lý phát triển đô thị?","opts":{"A":"Đảm bảo chủ đầu tư thu hồi vốn nhanh hơn.","B":"Tăng giá trị cho các lô đất nền.","C":"Ngăn chặn tình trạng hình thành các khu dân cư tự phát thiếu hạ tầng đồng bộ, đảm bảo điều kiện sống cơ bản và kết nối khu vực.","D":"Giúp việc cấp Giấy chứng nhận cho người mua dễ dàng hơn."},"ans":["C"],"exp":"","note":"","multi":false,"id":533,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 56","q":"Luật kinh doanh bất động sản 2023 quy định \"Tổ chức, cá nhân kinh doanh BĐS phải ghi đúng giá giao dịch thực tế vào trong hợp đồng\". Biện pháp này có mối liên hệ chặt chẽ nhất với luật nào khác trong việc thực thi?","opts":{"A":"Bộ luật Dân sự (về hiệu lực hợp đồng).","B":"Luật Nhà ở (về quản lý nhà ở).","C":"Luật Quản lý thuế (về cơ sở tính thuế và chống thất thu thuế).","D":"Luật Xây dựng (về chất lượng công trình)."},"ans":["C"],"exp":"","note":"Hiệu đính: tài liệu gốc tô \"Luật Nhà ở\". Ghi đúng giá giao dịch thực tế gắn với cơ sở tính thuế và chống thất thu thuế, nên liên hệ chặt nhất là Luật Quản lý thuế.","multi":false,"id":534,"fix":true,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 57 · Đề 1A câu 44","q":"Yêu cầu về việc sàn giao dịch BĐS phải có \"quy chế hoạt động\" và \"thực hiện các biện pháp phòng chống rửa tiền\" thể hiện sự quan tâm của nhà làm luật đến khía cạnh nào?","opts":{"A":"Chỉ quan tâm đến hiệu quả kinh doanh của sàn.","B":"Tăng cường tính chuyên nghiệp, minh bạch và ngăn ngừa rủi ro pháp lý, tài chính tiêu cực thông qua hoạt động của sàn.","C":"Đảm bảo cạnh tranh lành mạnh giữa các sàn.","D":"Giảm thủ tục hành chính cho các giao dịch qua sàn."},"ans":["B"],"exp":"","note":"","multi":false,"id":535,"fix":false,"sets":{"1A":44}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 58","q":"Việc giảm yêu cầu số lượng người có chứng chỉ môi giới tối thiểu trong doanh nghiệp môi giới từ 02 (Luật kinh doanh bất động sản 2014) xuống 01 (Luật kinh doanh bất động sản 2023) có thể được hiểu là:","opts":{"A":"Hạ thấp tiêu chuẩn ngành môi giới, nhằm giúp nhiều người hoạt động môi giới hơn.","B":"Tạo điều kiện thuận lợi hơn cho việc thành lập và hoạt động của các doanh nghiệp môi giới (đặc biệt là quy mô nhỏ), nhưng vẫn đảm bảo có người chịu trách nhiệm chuyên môn.","C":"Khuyến khích môi giới hoạt động độc lập trở lại, tăng nguồn thu cho ngân sách.","D":"Do thiếu hụt nguồn nhân lực môi giới có chứng chỉ."},"ans":["B"],"exp":"","note":"","multi":false,"id":536,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 59","q":"Điều kiện nào sau đây KHÔNG phải là điều kiện để cá nhân được dự thi sát hạch cấp chứng chỉ hành nghề môi giới BĐS theo Luật kinh doanh bất động sản 2023?","opts":{"A":"Có năng lực hành vi dân sự đầy đủ.","B":"Có trình độ tốt nghiệp từ cao đẳng trở lên.","C":"Có giấy chứng nhận hoàn thành khóa học đào tạo kiến thức hành nghề môi giới BĐS.","D":"Không đang trong tình trạng bị truy cứu trách nhiệm hình sự hoặc chấp hành án hình sự."},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc tô C. Theo Điều 25 NĐ 96/2024/NĐ-CP, thí sinh cần tốt nghiệp THPT trở lên và có giấy chứng nhận hoàn thành khóa đào tạo, bồi dưỡng kiến thức hành nghề môi giới; \"tốt nghiệp cao đẳng\" không phải là điều kiện.","multi":false,"id":537,"fix":true,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 60","q":"Tại sao Luật kinh doanh bất động sản 2023 lại nhấn mạnh việc \"Tổ chức, cá nhân được kinh doanh BĐS ngoài phạm vi khu vực bảo vệ theo quy định của pháp luật về quốc phòng, an ninh\"?","opts":{"A":"Để khuyến khích đầu tư BĐS vào các khu vực biên giới, hải đảo.","B":"Để khẳng định chủ quyền quốc gia đối với các khu vực này.","C":"Để phân định rõ ràng phạm vi được phép kinh doanh BĐS, gắn hoạt động kinh tế với yêu cầu đảm bảo quốc phòng, an ninh quốc gia.","D":"Để tạo cơ chế đặc thù cho kinh doanh BĐS tại các khu kinh tế quốc phòng."},"ans":["C"],"exp":"","note":"","multi":false,"id":538,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 61","q":"Nghĩa vụ nào sau đây KHÔNG thuộc về bên nhận chuyển nhượng dự án BĐS?","opts":{"A":"Kế thừa và thực hiện quyền, nghĩa vụ của chủ đầu tư chuyển nhượng đã chuyển giao","B":"Tiếp tục triển khai dự án theo đúng nội dung đã được chấp thuận.","C":"Chịu trách nhiệm về các vi phạm của chủ đầu tư cũ trước thời điểm chuyển nhượng.","D":"Thực hiện nghĩa vụ tài chính đối với Nhà nước theo quy định."},"ans":["C"],"exp":"","note":"","multi":false,"id":539,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 62","q":"Việc Luật kinh doanh bất động sản 2023 không quy định bắt buộc công chứng đối với hợp đồng mua bán BĐS giữa chủ đầu tư và khách hàng cá nhân có thể nhằm mục đích gì?","opts":{"A":"Giảm tính pháp lý của hợp đồng.","B":"Giảm thủ tục hành chính, tạo sự linh hoạt cho giao dịch có tính chất kinh doanh chuyên nghiệp.","C":"Khuyến khích giao dịch bằng giấy viết tay.","D":"Tăng vai trò của sàn giao dịch BĐS."},"ans":["B"],"exp":"","note":"","multi":false,"id":540,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 63","q":"Quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án BĐS chỉ được đưa vào kinh doanh khi:","opts":{"A":"Chủ đầu tư đã bán hết nhà ở hình thành trong tương lai của dự án.","B":"Đã có văn bản nghiệm thu hạ tầng và đáp ứng các điều kiện khác theo luật định.","C":"Đã có ít nhất 10% số lô đất được xây dựng nhà ở.","D":"Dự án đã hoàn thành trên 5 năm."},"ans":["B"],"exp":"","note":"","multi":false,"id":541,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 64","q":"Nếu một cá nhân môi giới BĐS có chứng chỉ hành nghề nhưng làm việc môi giới cho một công ty không đăng ký kinh doanh dịch vụ môi giới BĐS thì:","opts":{"A":"Vẫn hợp pháp vì cá nhân có chứng chỉ.","B":"Chỉ vi phạm nếu không nộp thuế thu nhập cá nhân.","C":"Là vi phạm quy định của Luật kinh doanh bất động sản 2023 (cá nhân phải hành nghề trong doanh nghiệp dịch vụ BĐS).","D":"Chỉ công ty vi phạm, cá nhân không vi phạm."},"ans":["C"],"exp":"","note":"","multi":false,"id":542,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 65","q":"Việc thu thập thông tin về \"số liệu điều tra, thống kê về nhà ở\", \"số liệu cấp GCN\" trong cơ sở dữ liệu quốc gia về nhà ở nhằm mục đích gì?","opts":{"A":"Chỉ để báo cáo thành tích của ngành xây dựng.","B":"Cung cấp cái nhìn tổng quan, định lượng về tình hình nhà ở, thị trường và hiệu quả quản lý đất đai, làm cơ sở hoạch định chính sách.","C":"Xác định các cá nhân sở hữu nhiều nhà đất để áp thuế, tăng thu ngân sách.","D":"Phục vụ công tác quy hoạch đô thị chi tiết."},"ans":["B"],"exp":"","note":"","multi":false,"id":543,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 66","q":"Thời hạn tối thiểu mà sàn giao dịch BĐS phải đảm bảo về địa điểm hoạt động (ví dụ: hợp đồng thuê địa điểm) theo Nghị định 96/2024/NĐ-CP là bao lâu?","opts":{"A":"03 tháng","B":"06 tháng","C":"12 tháng (01 năm)","D":"Không quy định"},"ans":["C"],"exp":"","note":"","multi":false,"id":544,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 67","q":"Luật kinh doanh bất động sản 2023 quy định các hành vi bị cấm liên quan đến việc thu và sử dụng tiền của khách hàng mua BĐS hình thành trong tương lai nhằm giải quyết vấn đề gì tồn tại trước đây?","opts":{"A":"Tình trạng chủ đầu tư bán BĐS với giá quá cao.","B":"Tình trạng chủ đầu tư huy động vốn trái phép hoặc sử dụng vốn huy động không đúng mục đích, gây rủi ro cho khách hàng và dự án.","C":"Tình trạng khách hàng chậm thanh toán tiền mua nhà.","D":"Tình trạng các ngân hàng không muốn cho vay dự án BĐS."},"ans":["B"],"exp":"","note":"","multi":false,"id":545,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 68","q":"Việc Luật kinh doanh bất động sản 2023 cho phép kinh doanh BĐS là \"phần diện tích sàn xây dựng trong công trình xây dựng có công năng phục vụ mục đích du lịch, lưu trú\" có tác động như thế nào đến thị trường condotel, officetel?","opts":{"A":"Hạn chế sự phát triển của loại hình này.","B":"Không có tác động gì đáng kể","C":"Tạo cơ sở pháp lý rõ ràng hơn cho việc đầu tư, kinh doanh, giao dịch loại hình này, có thể thúc đẩy thị trường phát triển minh bạch hơn.","D":"Biến các loại hình này thành nhà ở thông thường."},"ans":["C"],"exp":"","note":"","multi":false,"id":546,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 69","q":"Nếu Luật Đất đai, Luật Nhà ở có quy định khác với Luật kinh doanh bất động sản về cùng một vấn đề liên quan đến kinh doanh BĐS, nguyên tắc áp dụng pháp luật là gì?","opts":{"A":"Luôn ưu tiên áp dụng Luật kinh doanh bất động sản hơn Luật Đất đai, Luật Nhà ở.","B":"Áp dụng luật được ban hành sau cùng, có thời gian hiệu lực gần nhất","C":"Tùy trường hợp cụ thể, ưu tiên áp dụng luật chuyên ngành trực tiếp điều chỉnh vấn đề đó (ví dụ: vấn đề về QSDĐ áp dụng Luật Đất đai, vấn đề về quản lý nhà ở áp dụng Luật Nhà ở).","D":"Các bên tự thỏa thuận luật áp dụng."},"ans":["C"],"exp":"","note":"","multi":false,"id":547,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 70","q":"Việc Luật kinh doanh bất động sản 2023 quy định hợp đồng mẫu và yêu cầu công khai hợp đồng mẫu trước khi áp dụng mang lại lợi ích gì cho người mua BĐS?","opts":{"A":"Giúp người mua có thể tự soạn thảo hợp đồng theo ý mình.","B":"Biết trước các điều khoản chính, giảm thiểu rủi ro bị cài cắm các điều khoản bất lợi, đảm bảo các quyền và nghĩa vụ cơ bản được quy định rõ ràng.","C":"Được miễn phí công chứng hợp đồng.","D":"Có thể yêu cầu chủ đầu tư thay đổi hoàn toàn hợp đồng mẫu."},"ans":["B"],"exp":"","note":"","multi":false,"id":548,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 71","q":"Thủ tục chuyển nhượng dự án BĐS theo Luật Đầu tư được áp dụng trong trường hợp nào?","opts":{"A":"Chỉ khi dự án có vốn đầu tư trên 5000 tỷ đồng","B":"Đối với tất cả các dự án BĐS.","C":"Đối với dự án BĐS được chấp thuận nhà đầu tư hoặc được cấp Giấy chứng nhận đăng ký đầu tư theo Luật Đầu tư.","D":"Chỉ khi bên nhận chuyển nhượng là nhà đầu tư nước ngoài."},"ans":["C"],"exp":"","note":"","multi":false,"id":549,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 72","q":"Cơ sở dữ liệu về thị trường BĐS địa phương KHÔNG bao gồm thông tin nào sau đây?","opts":{"A":"Thông tin về các dự án BĐS trên địa bàn (giao dịch, tồn kho).","B":"Hoạt động của các tổ chức kinh doanh dịch vụ BĐS tại địa phương.","C":"Thông tin chi tiết về thu nhập cá nhân của các nhà môi giới BĐS.","D":"Số lượng chứng chỉ môi giới BĐS được cấp trong kỳ tại địa phương."},"ans":["C"],"exp":"","note":"","multi":false,"id":550,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 73","q":"Nếu một người Việt Nam định cư ở nước ngoài là công dân Việt Nam, họ có được phép mua nhà ở có sẵn từ một cá nhân khác tại Việt Nam để bán lại không?","opts":{"A":"Không, chỉ được mua để ở.","B":"Không, chỉ được đầu tư xây dựng dự án mới.","C":"Có, vì họ được kinh doanh BĐS như công dân Việt Nam trong nước.","D":"Chỉ được phép nếu thành lập doanh nghiệp tại Việt Nam."},"ans":["C"],"exp":"","note":"","multi":false,"id":551,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 74","q":"Khi nhận chuyển nhượng Quyền sử dụng đất đã có hạ tầng kỹ thuật, nghĩa vụ nào của bên nhận KHÔNG được nêu rõ trong Điều 30 Luật kinh doanh bất động sản 2023?","opts":{"A":"Thanh toán tiền đầy đủ, đúng hạn.","B":"Sử dụng đất đúng mục đích, đúng ranh giới.","C":"Phải xây dựng nhà ở trong vòng 2 năm kể từ ngày nhận đất.","D":"Thực hiện nghĩa vụ tài chính đối với Nhà nước."},"ans":["C"],"exp":"","note":"","multi":false,"id":552,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 75","q":"Mục đích của việc yêu cầu chủ đầu tư thông báo và nhận được văn bản trả lời chấp thuận của Sở Xây dựng trước khi bán nhà ở hình thành trong tương lai là gì?","opts":{"A":"Để Sở Xây dựng thu phí quản lý.","B":"Để xác nhận chính thức từ cơ quan quản lý nhà nước rằng nhà ở đó đã đáp ứng đủ các điều kiện pháp lý và kỹ thuật để được phép bán ra thị trường.","C":"Để Sở Xây dựng giới thiệu khách hàng tiềm năng cho chủ đầu tư.","D":"Chỉ là thủ tục mang tính hình thức."},"ans":["B"],"exp":"","note":"","multi":false,"id":553,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 76","q":"Việc Luật kinh doanh bất động sản 2023 không còn quy định về vốn pháp định tối thiểu (như Luật kinh doanh bất động sản 2014 từng có) mà thay bằng tỷ lệ vốn chủ sở hữu/tổng mức đầu tư có ý nghĩa gì?","opts":{"A":"Giảm yêu cầu về vốn cho tất cả doanh nghiệp BĐS.","B":"Tăng yêu cầu về vốn cho tất cả doanh nghiệp BĐS.","C":"Giúp yêu cầu về vốn trở nên linh hoạt, phù hợp hơn với quy mô và rủi ro của từng dự án cụ thể, thay vì một mức cố định có thể không phù hợp.","D":"Chuyển trách nhiệm quản lý vốn từ cơ quan nhà nước sang các ngân hàng thương mại."},"ans":["C"],"exp":"","note":"","multi":false,"id":554,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 77","q":"Nghĩa vụ chứng minh nhà ở, công trình xây dựng hình thành trong tương lai đủ điều kiện được bán, cho thuê mua thuộc về ai?","opts":{"A":"Người mua, thuê mua.","B":"Ngân hàng bảo lãnh.","C":"Chủ đầu tư dự án.","D":"Cơ quan đăng ký đất đai."},"ans":["C"],"exp":"","note":"","multi":false,"id":555,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 78","q":"Cơ quan nào có trách nhiệm chính trong việc xây dựng, quản lý, vận hành Hệ thống thông tin, cơ sở dữ liệu về nhà ở và thị trường BĐS ở cấp Trung ương?","opts":{"A":"Văn phòng Chính phủ.","B":"Bộ Tài nguyên và Môi trường.","C":"Bộ Xây dựng.","D":"Bộ Thông tin và Truyền thông."},"ans":["C"],"exp":"","note":"","multi":false,"id":556,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 79 · Đề 2A câu 9","q":"Việc phải kê khai nộp thuế theo quy định của pháp luật có áp dụng đối với cá nhân kinh doanh BĐS quy mô nhỏ không?","opts":{"A":"Không, vì được miễn thành lập doanh nghiệp.","B":"Chỉ áp dụng nếu có lãi trên 100 triệu đồng/năm.","C":"Có, mặc dù không phải lập doanh nghiệp nhưng vẫn phải kê khai và nộp thuế.","D":"Chỉ áp dụng nếu bán BĐS có giá trị trên 1 tỷ đồng."},"ans":["C"],"exp":"","note":"","multi":false,"id":557,"fix":false,"sets":{"2A":9}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 80","q":"Đâu là hệ quả pháp lý quan trọng nhất khi một cá nhân môi giới BĐS hoạt động mà không có chứng chỉ hành nghề hoặc không thuộc một doanh nghiệp dịch vụ BĐS?","opts":{"A":"Chỉ bị phạt tiền nếu bị phát hiện.","B":"Hoạt động đó là bất hợp pháp, vi phạm quy định của Luật kinh doanh bất động sản, có thể bị xử phạt và các giao dịch do môi giới đó thực hiện có thể bị ảnh hưởng về tính pháp lý.","C":"Khách hàng có quyền từ chối trả hoa hồng.","D":"Không có hệ quả gì nếu giao dịch thành công."},"ans":["B"],"exp":"","note":"","multi":false,"id":558,"fix":false,"sets":{}},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là khái niệm về nhà ở thương mại?","opts":{"A":"Là nhà ở có sự hỗ trợ của Nhà nước cho các đối tượng được hưởng chính sách hỗ trợ về nhà ở theo quy định của Luật nhà ở.","B":"Là nhà ở được đầu tư xây dựng để bán, cho thuê, cho thuê mua theo cơ chế thị trường.","C":"Là nhà ở để bố trí cho các hộ gia đình, cá nhân thuộc diện được tái định cư khi Nhà nước thu hồi đất ở, bị giải tỏa nhà ở theo quy định của pháp luật.","D":"Là nhà ở đã hoàn thành việc đầu tư xây dựng và đưa vào sử dụng."},"ans":["B"],"exp":"Đây là định nghĩa chính xác tại Khoản 5, Điều 2, Luật Nhà ở 2023. Phương án A là định nghĩa về \"Nhà ở xã hội\" (Khoản 6, Điều 2). Phương án C là định nghĩa về \"Nhà ở phục vụ tái định cư\" (Khoản 4, Điều 2). Phương án D là định nghĩa về \"Nhà ở có sẵn\" (Khoản 7, Điều 2).","note":"","multi":false,"id":27,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là khái niệm về nhà ở riêng lẻ?","opts":{"A":"Là nhà ở được đầu tư xây dựng để bán, cho thuê, cho thuê mua theo cơ chế thị trường.","B":"Là nhà ở đang trong quá trình đầu tư xây dựng và chưa được nghiệm thu đưa vào sử dụng.","C":"Là nhà ở đã hoàn thành việc đầu tư xây dựng và đưa vào sử dụng.","D":"Là nhà ở được xây dựng trên thửa đất ở riêng biệt thuộc quyền sử dụng hợp pháp của tổ chức, hộ gia đình, cá nhân, bao gồm nhà biệt thự, nhà ở liền kề và nhà ở độc lập."},"ans":["D"],"exp":"Đây là định nghĩa chính xác tại Khoản 2, Điều 2, Luật Nhà ở 2023. Phương án A là \"Nhà ở thương mại\". Phương án B là \"Nhà ở hình thành trong tương lai\" (Khoản 8, Điều 2). Phương án C là \"Nhà ở có sẵn\".","note":"","multi":false,"id":28,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Sau khi hoàn thành việc xây dựng và nghiệm thu đưa vào sử dụng thì nhà chung cư được bảo hành trong thời hạn bao lâu? (NHÀ RIÊNG LẺ 24 THÁNG, CHUNG CƯ 60 THÁNG)","opts":{"A":"50 tháng","B":"60 tháng","C":"70 tháng","D":"80 tháng"},"ans":["B"],"exp":"Theo Khoản 2, Điều 46, Luật Nhà ở 2023, \"Nhà chung cư được bảo hành tối thiểu là 60 tháng kể từ ngày hoàn thành việc xây dựng và nghiệm thu đưa vào sử dụng...\"","note":"","multi":false,"id":29,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Dự án đầu tư xây dựng nhà ở là gì?","opts":{"A":"Là tổng hợp các đề xuất có liên quan đến việc sử dụng vốn để xây dựng mới nhà ở, các công trình hạ tầng kỹ thuật, hạ tầng xã hội phục vụ nhu cầu ở hoặc để cải tạo, sửa chữa nhà ở trên một địa điểm nhất định.","B":"Là việc đầu tư xây dựng mới, xây dựng lại hoặc cải tạo làm tăng diện tích nhà ở.","C":"có. Là việc nâng cấp chất lượng, mở rộng diện tích hoặc điều chỉnh cơ cấu diện tích của nhà ở hiện","D":"Là nhà ở được đầu tư xây dựng để bán, cho thuê, cho thuê mua theo cơ chế thị trường."},"ans":["A"],"exp":"Đây là định nghĩa chính xác tại Khoản 11, Điều 2, Luật Nhà ở 2023. Phương án B là định nghĩa về \"Phát triển nhà ở\" (Khoản 9, Điều 2). Phương án C là định nghĩa về \"Cải tạo nhà ở\" (Khoản 10, Điều 2).","note":"","multi":false,"id":30,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Bên thuê mua, bên mua nhà ở xã hội không được bán lại nhà ở trong thời hạn tối thiểu bao lâu?","opts":{"A":"2 năm","B":"3 năm","C":"5 năm","D":"7 năm"},"ans":["C"],"exp":"Đây là quy định \"khóa\" 5 năm nổi tiếng của NƠXH. Cụ thể, theo Khoản 4, Điều 98, Luật Nhà ở 2023, bên mua, thuê mua NƠXH \"không được bán lại nhà ở trong thời hạn tối thiểu là 05 năm\" kể từ ngày thanh toán đủ tiền và nhận bàn giao.","note":"","multi":false,"id":31,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Anh chị hãy cho biết, chủ đầu tư muốn thế chấp một phần hoặc toàn bộ dự án đầu tư xây dựng nhà ở thì cần những điều kiện nào sau đây?","opts":{"A":"Phải có hồ sơ dự án","B":"Phải có thiết kế kỹ thuật của dự án được phê duyệt","C":"Đã có Giấy chứng nhận hoặc quyết định giao đất, cho thuê đất của cơ quan nhà nước có thẩm quyền.","D":"Phải đủ cả 3 điều kiện nêu trên"},"ans":["D"],"exp":"Câu hỏi này liên quan đến Luật Kinh doanh Bất động sản 2023. Theo Khoản 2, Điều 27, Luật KDBĐS 2023, chủ đầu tư được thế chấp dự án khi đáp ứng đủ cả 3 điều kiện: a) Phải có hồ sơ dự án (Phương án A); b) Phải có thiết kế kỹ thuật của dự án được phê duyệt (Phương án B); c) Đã có Giấy chứng nhận hoặc quyết định giao đất, cho thuê đất của cơ quan nhà nước có thẩm quyền (Phương án C).","note":"","multi":false,"id":32,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"“Việc đầu tư xây dựng mới, xây dựng lại hoặc cải tạo làm tăng diện tích nhà ở” là định nghĩa của cụm từ ngữ nào?","opts":{"A":"Cải tạo nhà ở","B":"Phát triển nhà ở","C":"Dự án đầu tư xây dựng nhà ở","D":"Bảo trì nhà ở"},"ans":["B"],"exp":"Đây là định nghĩa chính xác tại Khoản 9, Điều 2, Luật Nhà ở 2023.","note":"","multi":false,"id":33,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Giá mua bán nhà ở, giá chuyển nhượng hợp đồng mua bán nhà ở thương mại được quy định như thế nào?","opts":{"A":"Do các bên thỏa thuận và được ghi rõ trong hợp đồng mua bán nhà ở, văn bản chuyển nhượng hợp đồng mua bán nhà ở.","B":"Do UBND tỉnh quy định.","C":"Do bên bán quy định.","D":"Do bên mua quy định."},"ans":["A"],"exp":"Đối với nhà ở thương mại, giá cả tuân theo cơ chế thị trường. Khoản 1, Điều 166, Luật Nhà ở 2023 quy định rõ \"Giá mua bán nhà ở, giá chuyển nhượng hợp đồng mua bán nhà ở do các bên thỏa thuận...\". (Lưu ý: Nhà nước chỉ thẩm định giá bán NƠXH, không can thiệp giá nhà ở thương mại).","note":"","multi":false,"id":34,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Việc ủy quyền quản lý nhà ở chỉ được thực hiện đối với trường hợp nào sau đây?","opts":{"A":"Nhà ở hình thành trong tương lai","B":"Nhà ở trong khu đô thị","C":"Nhà ở có sẵn.","D":"Nhà ở ở nông thôn."},"ans":["C"],"exp":"Khoản 1, Điều 170, Luật Nhà ở 2023 quy định: \"Chủ sở hữu nhà ở có thể ủy quyền cho tổ chức, cá nhân khác quản lý nhà ở có sẵn thuộc sở hữu của mình.\" Việc ủy quyền quản lý không áp dụng cho nhà ở chưa hình thành.","note":"","multi":false,"id":35,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Việc ủy quyền quản lý nhà ở được hiểu như thế nào?","opts":{"A":"Là việc chủ sở hữu nhà ở ủy quyền cho tổ chức, cá nhân khác thực hiện các quyền và nghĩa vụ của chủ sở hữu nhà ở trong việc quản lý, sử dụng nhà ở trong thời hạn được ủy quyền.","B":"Là tổ chức, cá nhân nước ngoài đầu tư xây dựng nhà ở theo dự án tại Việt Nam theo quy định của Luật này và pháp luật có liên quan.","C":"Là cá nhân nước ngoài được phép nhập cảnh vào Việt Nam.","D":"Là việc các chủ sở hữu nhà ở thuộc sở hữu chung có thể ủy quyền cho người đại diện ký hợp đồng cho mượn, cho ở nhờ nhà ở."},"ans":["A"],"exp":"Đây là định nghĩa chính xác tại Khoản 1, Điều 170, Luật Nhà ở 2023.","note":"","multi":false,"id":36,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Cá nhân nước ngoài được sở hữu nhà ở theo thỏa thuận trong các giao dịch hợp đồng mua bán, thuê mua, tặng cho nhận thừa kế nhà ở tối đa bao nhiêu năm kể từ ngày được cấp Giấy chứng nhận?","opts":{"A":"40 năm","B":"50 năm","C":"60 năm","D":"70 năm"},"ans":["B"],"exp":"Đây là quy định về giới hạn thời hạn sở hữu (temporal limit) đối với cá nhân nước ngoài, quy định tại Điểm c, Khoản 2, Điều 19, Luật Nhà ở 2023. (Hết thời hạn 50 năm, có thể được gia hạn 01 lần).","note":"","multi":false,"id":37,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào thống nhất quản lý nhà nước về nhà ở trong phạm vi cả nước?","opts":{"A":"Chính Phủ","B":"Bộ Xây dựng","C":"Sở Xây dựng","D":"UBND cấp tỉnh"},"ans":["A"],"exp":"Khoản 1, Điều 177, Luật Nhà ở 2023 quy định: \"Chính phủ thống nhất quản lý nhà nước về nhà ở trong phạm vi cả nước.\" (Lưu ý: Bộ Xây dựng là cơ quan đầu mối chịu trách nhiệm trước Chính phủ về việc quản lý nhà nước về nhà ở - theo Khoản 2).","note":"","multi":false,"id":38,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Anh chị hãy cho biết, cơ quan nào quy định việc phân hạng và công nhận phân hạng nhà chung cư?","opts":{"A":"Chính phủ","B":"Bộ Xây dựng","C":"Sở Xây dựng","D":"UBND cấp tỉnh"},"ans":["B"],"exp":"Khoản 3, Điều 45, Luật Nhà ở 2023 quy định: \"Bộ trưởng Bộ Xây dựng quy định chi tiết việc phân hạng và công nhận phân hạng nhà chung cư.\"","note":"","multi":false,"id":39,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Tổ chức, cá nhân nước ngoài được mua, thuê mua, nhận tặng cho, nhận thừa kế và sở hữu không quá bao nhiêu phần trăm số lượng căn hộ trong một tòa nhà chung cư?","opts":{"A":"10%","B":"20%","C":"30%","D":"40%"},"ans":["C"],"exp":"Đây là quy định về giới hạn số lượng (quantity cap) đối với người nước ngoài, quy định tại Điểm a, Khoản 3, Điều 19, Luật Nhà ở 2023: \"...sở hữu không quá 30% tổng số căn hộ của một tòa nhà chung cư...\".","note":"","multi":false,"id":40,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Anh chị hiểu như thế nào là nhà ở?","opts":{"A":"Là nhà ở được xây dựng trên thửa đất ở riêng biệt thuộc quyền sử dụng hợp pháp của tổ chức, hộ gia đình, cá nhân, bao gồm nhà biệt thự, nhà ở liền kề và nhà ở độc lập.","B":"Là công trình xây dựng với mục đích để ở và phục vụ các nhu cầu sinh hoạt của hộ gia đình, cá nhân.","C":"Là nhà ở có sự hỗ trợ của Nhà nước cho các đối tượng được hưởng chính sách hỗ trợ về nhà ở theo quy định của Luật Nhà ở 2014.","D":"Là nhà ở được đầu tư xây dựng để bán, cho thuê, cho thuê mua theo cơ chế thị trường."},"ans":["B"],"exp":"Đây là định nghĩa chung và cơ bản nhất về \"Nhà ở\" tại Khoản 1, Điều 2, Luật Nhà ở 2023.","note":"","multi":false,"id":41,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Thời điểm chuyển quyền sở hữu nhà ở trong trường hợp mua bán nhà ở giữa chủ đầu tư dự án xây dựng nhà ở với người mua được tính khi nào?","opts":{"A":"Kể từ thời điểm bên nhận góp vốn, bên nhận tặng cho, bên nhận đổi nhận bàn giao nhà ở từ bên góp vốn, bên tặng cho, bên đổi nhà ở.","B":"Kể từ thời điểm bên mua nhận bàn giao nhà ở hoặc kể từ thời điểm bên mua thanh toán đủ tiền mua nhà ở cho chủ đầu tư","C":"Kể từ thời điểm bên mua, bên thuê mua đã thanh toán đủ tiền mua, tiền thuê mua và đã nhận bàn giao nhà ở, trừ trường hợp các bên có thỏa thuận khác.","D":"Thời điểm chuyển quyền sở hữu nhà ở được thực hiện theo quy định của pháp luật về thừa kế."},"ans":["C"],"exp":"Theo Khoản 1, Điều 14, Luật Nhà ở 2023, \"Thời điểm chuyển quyền sở hữu... là kể từ thời điểm bên mua, bên thuê mua đã thanh toán đủ tiền mua, tiền thuê mua và đã nhận bàn giao nhà ở, trừ trường hợp các bên có thỏa thuận khác.\" (Lưu ý: Phân tích lại các phương án) A. Góp vốn, tặng cho (Sai ngữ cảnh). B. \"hoặc\" (Sai, luật dùng chữ \"và\"). C. \"đã thanh toán đủ tiền... và đã nhận bàn giao...\" (Đúng theo luật). D. Thừa kế (Sai ngữ cảnh). Hiệu đính là sai, vì luật yêu cầu đồng thời cả 2 điều kiện \"và\" (thanh toán đủ VÀ nhận bàn giao). mua, tiền thuê mua và đã nhận bàn giao nhà ở, trừ trường hợp các bên có thỏa thuận khác.","note":"","multi":false,"id":42,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"“Nhà ở được đầu tư xây dựng để bán, cho thuê, cho thuê mua theo cơ chế thị trường” là định nghĩa cho cụm từ ngữ nào sau đây?","opts":{"A":"Dự án đầu tư xây dựng nhà ở","B":"Nhà ở thương mại.","C":"Nhà ở hình thành trong tương lai.","D":"Nhà ở có sẵn."},"ans":["B"],"exp":"Đây là định nghĩa chính xác tại Khoản 5, Điều 2, Luật Nhà ở 2023. (Câu này lặp lại nội dung của Câu 1).","note":"","multi":false,"id":43,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"“Nhà ở được xây dựng trên thửa đất ở riêng biệt thuộc quyền sử dụng hợp pháp của tổ chức, hộ gia đình, cá nhân, bao gồm nhà biệt thự, nhà ở liền kề và nhà ở độc lập” là định nghĩa cho cụm từ ngữ nào sau đây?","opts":{"A":"Nhà ở hình thành trong tương lai.","B":"Nhà ở thương mại.","C":"Dự án đầu tư xây dựng nhà ở","D":"Nhà ở riêng lẻ."},"ans":["D"],"exp":"Định nghĩa “Nhà ở riêng lẻ” tại khoản 2 Điều 2 Luật Nhà ở 2023.","note":"Đề gốc in nhầm phương án D (“Nhà ở có sẵn”); đã sửa thành “Nhà ở riêng lẻ”.","multi":false,"id":44,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là quyền của chủ đầu tư dự án xây dựng nhà ở thương mại?","opts":{"A":"Dành diện tích đất ở đã đầu tư xây dựng hạ tầng kỹ thuật trong dự án để xây dựng nhà ở xã hội theo quy định của pháp luật về nhà ở. NGHĨA VỤ","B":"Bảo hành nhà ở theo quy định của Luật này và pháp luật về xây dựng; thực hiện các nghĩa vụ tài chính cho Nhà nước theo quy định của pháp luật. NVỤ","C":"Lập, thẩm định, phê duyệt và triển khai thực hiện dự án theo đúng quy định của Luật nhà ở và pháp luật về xây dựng. NGHĨA VỤ","D":"Được chuyển nhượng một phần hoặc toàn bộ dự án theo quy định của pháp luật về kinh doanh bất động sản. Q"},"ans":["D"],"exp":"Theo Khoản 6, Điều 41, Luật Nhà ở 2023, đây là một trong các quyền của chủ đầu tư. Các phương án A, B, C đều là nghĩa vụ (trách nhiệm) của chủ đầu tư, được quy định tại Khoản 7, Điều 41.","note":"","multi":false,"id":45,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là trách nhiệm của chủ đầu tư dự án xây dựng nhà ở thương mại?","opts":{"A":"Dành diện tích đất ở đã đầu tư xây dựng hạ tầng kỹ thuật trong dự án để xây dựng nhà ở xã hội theo quy định của pháp luật về nhà ở. NV","B":"Thực hiện các quyền của người sử dụng đất và kinh doanh sản phẩm trong dự án theo quy định của pháp luật về đất đai và pháp luật về kinh doanh bất động sản. Q","C":"Được thực hiện quản lý, khai thác hệ thống hạ tầng kỹ thuật trong phạm vi dự án theo quyết định chủ trương đầu tư dự án của cơ quan nhà nước có thẩm quyền. Q","D":"Được chuyển nhượng một phần hoặc toàn bộ dự án theo quy định của pháp luật về kinh doanh bất động sản. Q"},"ans":["A"],"exp":"Đây là nghĩa vụ (trách nhiệm) của chủ đầu tư, quy định tại Điểm d, Khoản 7, Điều 41, Luật Nhà ở 2023. Các phương án B, C, D đều là quyền của chủ đầu tư (quy định tại Khoản 6, Điều 41).","note":"","multi":false,"id":46,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Nhà ở xã hội là gì?","opts":{"A":"Là nhà ở được xây dựng trên thửa đất ở riêng biệt thuộc quyền sử dụng hợp pháp của tổ chức, hộ gia đình, cá nhân, bao gồm nhà biệt thự, nhà ở liền kề và nhà ở độc lập.","B":"nhân. Là công trình xây dựng với mục đích để ở và phục vụ các nhu cầu sinh hoạt của hộ gia đình, cá","C":"Là nhà ở có sự hỗ trợ của Nhà nước cho các đối tượng được hưởng chính sách hỗ trợ về nhà ở theo quy định của Luật Nhà ở.","D":"Là nhà ở được đầu tư xây dựng để bán, cho thuê, cho thuê mua theo cơ chế thị trường."},"ans":["C"],"exp":"Đây là định nghĩa chính xác tại Khoản 6, Điều 2, Luật Nhà ở 2023. (Câu này lặp lại nội dung của Câu 1).","note":"","multi":false,"id":47,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là phần sở hữu riêng trong nhà chung cư ?","opts":{"A":"Hệ thống hạ tầng kỹ thuật bên ngoài nhưng được kết nối với nhà chung cư đó, trừ hệ thống hạ tầng kỹ thuật sử dụng vào mục đích công cộng hoặc thuộc diện phải bàn giao cho Nhà nước hoặc giao cho chủ đầu tư quản lý theo nội dung dự án đã được phê duyệt.","B":"Không gian và hệ thống kết cấu chịu lực, trang thiết bị kỹ thuật dùng chung trong nhà chung cư.","C":"Phần diện tích bên trong căn hộ bao gồm cả diện tích ban công, lô gia gắn liền với căn hộ đó","D":"Các công trình công cộng trong khu vực nhà chung cư nhưng không thuộc diện đầu tư xây dựng để kinh doanh hoặc phải bàn giao cho Nhà nước."},"ans":["C"],"exp":"Đây là thành phần cơ bản nhất của sở hữu riêng, quy định tại Điểm a, Khoản 1, Điều 43, Luật Nhà ở 2023. Các phương án A, B, D đều là các thành phần thuộc \"Phần sở hữu chung\" (quy định tại Khoản 2, Điều 43).","note":"","multi":false,"id":48,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Phần sở hữu riêng trong nhà chung cư bao gồm những phần nào?","opts":{"A":"Phần diện tích bên trong căn hộ bao gồm cả diện tích ban công, lô gia gắn liền với căn hộ đó","B":"Phần diện tích khác trong nhà chung cư được công nhận là sở hữu riêng cho chủ sở hữu nhà chung cư","C":"Hệ thống trang thiết bị kỹ thuật sử dụng riêng gắn liền với căn hộ hoặc gắn liền với phần diện tích khác thuộc sở hữu riêng.","D":"Cả 3 đáp án trên"},"ans":["D"],"exp":"Khoản 1, Điều 43, Luật Nhà ở 2023 quy định sở hữu riêng bao gồm cả 3 mục: a) Phần diện tích bên trong căn hộ... (Phương án A); b) Phần diện tích khác... được công nhận là sở hữu riêng... (Phương án B); c) Hệ thống trang thiết bị kỹ thuật sử dụng riêng... (Phương án C).","note":"","multi":false,"id":49,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"“Nhà ở đã hoàn thành việc đầu tư xây dựng và đưa vào sử dụng” là định nghĩa cho cụm từ ngữ nào sau đây?","opts":{"A":"Cải tạo nhà ở","B":"Phát triển nhà ở","C":"Nhà ở có sẵn","D":"Nhà ở riêng lẻ"},"ans":["C"],"exp":"Đây là định nghĩa chính xác tại Khoản 7, Điều 2, Luật Nhà ở 2023.","note":"","multi":false,"id":50,"sets":{},"fix":false},{"topic":"cd2","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là hình thức để lựa chọn chủ đầu tư dự án xây dựng nhà ở thương mại?","opts":{"A":"Được Nhà nước giao đất để xây dựng nhà ở cho thuê, cho thuê mua, để bán.","B":"Đấu giá quyền sử dụng đất theo quy định của pháp luật về đất đai","C":"Được Nhà nước cho thuê đất để xây dựng nhà ở cho thuê.","D":"Chỉ định thầu thông thường."},"ans":["B"],"exp":"Điều 39, Luật Nhà ở 2023 quy định 3 hình thức lựa chọn CĐT, trong đó Điểm a, Khoản 1 là \"Đấu giá quyền sử dụng đất...\" (Phương án B). Hai hình thức còn lại là đấu thầu dự án và chấp thuận nhà đầu tư (khi nhà đầu tư đã có quyền sử dụng đất). Phương án A và C là hình thức Nhà nước giao/cho thuê đất (thường áp dụng cho NƠXH), không phải hình thức lựa chọn CĐT nhà ở thương mại.","note":"","multi":false,"id":51,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo quy định của Luật số: 27/2023/QH15- Luật nhà ở, nhận định nào sau đây đúng:","opts":{"A":"Nhà chung cư là nhà ở có từ 02 tầng trở lên, có nhiều căn hộ, có lối đi, cầu thang chung, có phần sở hữu riêng, phần sở hữu chung và hệ thống công trình hạ tầng sử dụng chung cho gia đình, cá nhân, tổ chức, bao gồm nhà chung cư được xây dựng với mục đích để ở và nhà chung cư được xây dựng có mục đích sử dụng hỗn hợp.","B":"Nhà chung cư là nhà ở có từ 03 tầng trở lên, có nhiều căn hộ, có lối đi, cầu thang chung, có phần sở hữu riêng, phần sở hữu chung và hệ thống công trình hạ tầng sử dụng chung cho gia đình, cá nhân, tổ chức, bao gồm nhà chung cư được xây dựng với mục đích để ở và nhà chung cư được xây dựng có mục đích sử dụng hỗn hợp.","C":"Nhà chung cư là nhà ở có từ 04 tầng trở lên, có nhiều căn hộ, có lối đi, cầu thang chung, có phần sở hữu riêng, phần sở hữu chung và hệ thống công trình hạ tầng sử dụng chung cho gia đình, cá nhân, tổ chức, bao gồm nhà chung cư được xây dựng với mục đích để ở và nhà chung cư được xây dựng có mục đích sử dụng hỗn hợp.","D":"Nhà chung cư là nhà ở có từ 05 tầng trở lên, có nhiều căn hộ, có lối đi, cầu thang chung, có phần sở hữu riêng, phần sở hữu chung và hệ thống công trình hạ tầng sử dụng chung cho gia đình, cá nhân, tổ chức, bao gồm nhà chung cư được xây dựng với mục đích để ở và nhà chung cư được xây dựng có mục đích sử dụng hỗn hợp."},"ans":["A"],"exp":"Nhà chung cư là nhà ở có từ 02 tầng trở lên, có nhiều căn hộ, có lối đi, cầu thang chung, có phần sở hữu riêng, phần sở hữu chung và hệ thống công trình hạ tầng sử dụng chung cho gia đình, cá nhân, tổ chức, bao gồm nhà chung cư được xây dựng với mục đích để ở và nhà chung cư được xây dựng có mục đích sử dụng hỗn hợp. Căn cứ PL: k22- điều 2","note":"","multi":false,"id":391,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo quy định của Luật số: 27/2023/QH15- Luật nhà ở, thế nào là nhà ở thương mại?","opts":{"A":"Nhà ở thương mại là nhà ở được đầu tư xây dựng để bán, cho thuê mua, cho thuê theo cơ chế thị trường.","B":"Nhà ở thương mại là công trình xây dựng với mục đích để ở và phục vụ nhu cầu sinh hoạt của gia đình, cá nhân.","C":"Nhà ở thương mại là nhà ở để bố trí cho đối tượng thuộc trường hợp được tái định cư khi Nhà nước thu hồi đất ở, giải tỏa nhà ở theo quy định của pháp luật.","D":"Tất cả đáp án trên đều sai"},"ans":["A"],"exp":"“Nhà ở thương mại là nhà ở được đầu tư xây dựng để bán, cho thuê mua, cho thuê theo cơ chế thị trường” Căn cứ PL: khoản 4 -điều 2","note":"","multi":false,"id":392,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Nghị định 95/2024/NĐ-CP, hướng dẫn thi hành Luật Nhà ở, Giấy tờ chứng minh đối tượng là cá nhân được sở hữu nhà ở tại Việt Namlà gì?","opts":{"A":"Đối với cá nhân là công dân Việt Nam thì phải có thẻ căn cước hoặc hộ chiếu hoặc các giấy tờ khác có giá trị chứng minh quốc tịch Việt Nam","B":"Đối với người gốc Việt Nam định cư ở nước ngoài thì phải có hộ chiếu nước ngoài hoặc giấy tờ có giá trị đi lại quốc tế theo pháp luật về xuất nhập cảnh và giấy tờ xác nhận là người gốc Việt Nam theo quy định của pháp luật về quốc tịch; Đối với cá nhân nước ngoài thì phải có hộ chiếu nước ngoài và cam kết bằng văn bản về việc không thuộc diện được quyền ưu đãi, miễn trừ ngoại giao, lãnh sự.","C":"Thẻ căn cước hoặc hộ chiếu","D":"Không có quy định"},"ans":["A","B"],"exp":"“Giấy tờ chứng minh đối tượng là cá nhân được sở hữu nhà ở tại Việt Nam được quy định như sau: a) đối với cá nhân là công dân Việt Nam thì phải có thẻ căn cước hoặc hộ chiếu hoặc các giấy tờ khác có giá trị chứng minh quốc tịch Việt Nam; b) đối với người gốc Việt Nam định cư ở nước ngoài thì phải có hộ chiếu nước ngoài hoặc giấy tờ có giá trị đi lại quốc tế theo pháp luật về xuất nhập cảnh và giấy tờ xác nhận là người gốc Việt Nam theo quy định của pháp luật về quốc tịch; c) đối với cá nhân nước ngoài thì phải có hộ chiếu nước ngoài và cam kết bằng văn bản về việc không thuộc diện được quyền ưu đãi, miễn trừ ngoại giao, lãnh sự.” Căn cứ PL: điều 3","note":"","multi":true,"id":393,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, thời hạn sử dụng nhà chung cư được quy định như thế nào?","opts":{"A":"Quy định thời hạn là 50 năm","B":"Quy định thời hạn là 70 năm","C":"Không quy định","D":"Luật không quy định thời hạn sở hữu chung cư mà chỉ quy định thời hạn sử dụng chung cư."},"ans":["D"],"exp":"“Thời hạn sử dụng nhà chung cư được xác định theo hồ sơ thiết kế và thời gian sử dụng thực tế nhà chung cư theo kết luận kiểm định của cơ quan có thẩm quyền. Thời hạn sử dụng nhà chung cư theo hồ sơ thiết kế phải được ghi rõ trong văn bản thẩm định của cơ quan có thẩm quyền theo quy định của pháp luật về xây dựng” Căn cứ PL: điều 58 không ấn định cố định mà tùy thuộc vào cấp công trình và kết luận kiểm định cl thực tế","note":"","multi":false,"id":394,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, điều kiện nào sau đây là bắt buộc đối với việc bán, cho thuê mua Nhà ở xã hội hình thành trong t ương lai?","opts":{"A":"Toàn bộ dự án phải hoàn thành việc xây dựng công trình trên đất.","B":"Phải có xác nhận hoàn thành công tác phòng cháy, chữa cháy.","C":"Đã có giấy phép xây dựng và hoàn thành việc xây dựng phần móng của nhà ở.","D":"Phải hoàn thành việc xây dựng phần thân và mái của nhà ở."},"ans":["C"],"exp":"“Việc bán, cho thuê mua nhà ở xã hội hình thành trong tương lai phải tuân thủ các điều kiện sau đây: a) đã có hồ sơ dự án đầu tư xây dựng nhà ở, có thiết kế kỹ thuật nhà ở được phê duyệt và có giấy phép xây dựng nếu thuộc trường hợp phải có giấy phép xây dựng; b) đã hoàn thành việc xây dựng phần móng của nhà ở theo quy định của pháp luật về xây dựng và hoàn thành việc đầu tư xây dựng hệ thống đường giao thông, cấp nước, thoát nước...” Căn cứ PL: k3 -điều 88","note":"","multi":false,"id":395,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, tổng số tiền ứng trước mà bên mua nhà ở xã hội hình thành trong tương lai được thanh toán đến trước khi bàn giao nhà ở cho người mua không được vượt quá bao nhiêu phần trăm (%) giá trị hợp đồng?","opts":{"A":"Không được vượt quá 95% giá trị hợp đồng.","B":"Không được vượt quá 70% giá trị hợp đồng.","C":"Không được vượt quá 50% giá trị hợp đồng.","D":"Không được vượt quá 30% giá trị hợp đồng (bao gồm cả tiền đặt cọc)."},"ans":["B"],"exp":"Việc ứng tiền trước của người mua nhà ở xã hội được thực hiện theo thỏa thuận trong hợp đồng mua bán nhà ở, phù hợp với tỷ lệ hoàn thành xây dựng công trình nhà ở và tiến độ thực hiện dự án đã được phê duyệt nhưng số tiền ứng trước lần đầu không vượt quá 30% giá trị hợp đồng bao gồm cả tiền đặt cọc (nếu có), tổng số tiền các lần thanh toán không được vượt quá 70% giá trị hợp đồng đến trước khi bàn giao nhà ở cho người mua và không được vượt quá 95% giá trị hợp đồng đến trước khi người mua nhà được cấp giấy chứng nhận đối với nhà ở đó; Căn cứ PL: điểm c khoản 1 điều 89","note":"","multi":false,"id":396,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, cơ quan nhà nước nào thống nhất quản lý nhà nước về nhà ở trong phạm vi cả nước?","opts":{"A":"Chính phủ","B":"Bộ Xây dựng","C":"Quốc Hội","D":"Bộ Nông nghiệp và Môi trường"},"ans":["A"],"exp":"Chính phủ thống nhất quản lý Nhà nước về nhà ở trong phạm vi cả nước. “Chính phủ thống nhất quản lý Nhà nước về nhà ở trong phạm vi cả nước. Bộ xây dựng là cơ quan đầu mối giúp Chính phủ thống nhất quản lý Nhà nước về nhà ở...” Căn cứ PL điều 190","note":"","multi":false,"id":397,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, Giao dịch về nhà ở sau đây thì nhà ở không bắt buộc phải có Giấy chứng nhận?","opts":{"A":"Mua bán, thuê mua, thế chấp nhà ở hình thành trong tương lai.","B":"Tổ chức tặng cho nhà tình nghĩa, nhà tình thương, nhà đại đoàn kết.","C":"Góp vốn bằng nhà ở","D":"Mua bán, tặng cho nhà ở"},"ans":["A","B"],"exp":"“Giao dịch về nhà ở sau đây thì nhà ở không bắt buộc phải có giấy chứng nhận: a) mua bán, thuê mua, thế chấp nhà ở hình thành trong tương lai; bán nhà ở trong trường hợp giải thể, phá sản; b) tổ chức tặng cho nhà tình nghĩa, nhà tình thương, nhà đại đoàn kết...” Căn cứ PL: k2 điều 160 Luật Nhà ở","note":"","multi":true,"id":398,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, hợp đồng nhà ở nào sau đây bắt buộc phải công chứng?","opts":{"A":"Mua bán, thuê mua, tặng cho, thế chấp nhà ở","B":"Thuê nhà ở","C":"Mượn nhà ở","D":"Tất cả trường hợp trên đều phải công chứng."},"ans":["A"],"exp":"“Trường hợp mua bán, thuê mua, tặng cho, đổi, góp vốn, thế chấp nhà ở thì phải thực hiện công chứng hoặc chứng thực hợp đồng, trừ trường hợp quy định tại khoản 2 điều này. Đối với giao dịch quy định tại khoản này thì thời điểm có hiệu lực của hợp đồng là thời điểm hoàn thành việc công chứng hoặc chứng thực theo quy định của pháp luật về công chứng, chứng thực. Căn cứ PL: đ 164","note":"","multi":false,"id":399,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Luật số: 27/2023/QH15- Luật nhà ở, người nước ngoài có được bán hoặc tặng lại nhà ở cho người khác trước khi thời hạn sở hữu theo quy định của Luật Nhà ở?","opts":{"A":"Không được phép được bán hoặc tặng lại nhà ở cho người khác trước khi thời hạn sở hữu nhà.","B":"Trước khi hết thời hạn sở hữu nhà ở theo quy định của Luật Nhà ở, chủ sở hữu có thể trực tiếp hoặc ủy quyền cho tổ chức, cá nhân khác thực hiện quyền tặng cho hoặc bán nhà ở này cho đối tượng thuộc trường hợp được sở hữu nhà ở tại Việt Nam.","C":"Được phép, nhưng chỉ được bán hoặc tặng lại nhà ở cho công dân Việt Nam.","D":"Được phép được bán hoặc tặng lại nhà ở cho bất kỳ ai."},"ans":["B"],"exp":"“Trước khi hết thời hạn sở hữu nhà ở theo quy định của Luật này, chủ sở hữu có thể trực tiếp hoặc ủy quyền cho tổ chức, cá nhân khác thực hiện quyền tặng cho hoặc bán nhà ở này cho đối tượng thuộc trường hợp được sở hữu nhà ở tại Việt Nam; nếu quá thời hạn được sở hữu nhà ở mà chủ sở hữu không bán, tặng cho thì nhà ở đó thuộc tài sản công” Căn cứ PL: k2 đ 20","note":"","multi":false,"id":400,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, tổ chức, cá nhân nước ngoài được sở hữu nhà ở tại Việt Nam trong khu vực nào?","opts":{"A":"Trong bất kỳ dự án nhà ở thương mại nào trên toàn quốc.","B":"Trong dự án đầu tư xây dựng nhà ở, trừ dự án thuộc khu vực cần bảo đảm quốc phòng, an ninh theo quy định của pháp luật Việt Nam.","C":"Chỉ được sở hữu nhà ở tại các khu công nghiệp, khu kinh tế.","D":"Trong dự án nhà ở thương mại đã hoàn thành xây dựng và có Giấy chứng nhận."},"ans":["B"],"exp":"“Tổ chức, cá nhân nước ngoài được sở hữu nhà ở trong dự án đầu tư xây dựng nhà ở theo quy định tại điều 17 của Luật này, trừ dự án thuộc khu vực cần bảo đảm quốc phòng, an ninh theo quy định của pháp luật Việt Nam.” Căn cứ PL: k1 đ 16","note":"","multi":false,"id":401,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở (Điều 17), tổ chức, cá nhân nước ngoài được phép sở hữu nhà ở tại Việt Nam thông qua hình thức nào sau đây?","opts":{"A":"Mua, thuê mua nhà ở thương mại của chủ đầu tư dự án đầu tư xây dựng nhà ở.","B":"Nhận chuyển nhượng nhà ở riêng lẻ của cá nhân người Việt Nam đã sở hữu 20 năm.","C":"Mua, thuê mua nhà ở xã hội (trừ trường hợp đầu tư xây dựng nhà ở xã hội).","D":"Nhận tặng cho, nhận thừa kế nhà ở là biệt thự liền kề tại khu vực cần bảo đảm quốc phòng, an ninh."},"ans":["A"],"exp":"“Tổ chức, cá nhân quy định tại điểm b và điểm c khoản 1 điều này được sở hữu nhà ở thông qua mua, thuê mua nhà ở thương mại của chủ đầu tư dự án đầu tư xây dựng nhà ở, nhận tặng cho, nhận thừa kế nhà ở thương mại trong dự án đầu tư xây dựng nhà ở không thuộc khu vực cần bảo đảm quốc phòng, an ninh theo quy định tại điều 16 của Luật này” Căn cứ PL: đ 17","note":"","multi":false,"id":402,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, cá nhân nước ngoài được sở hữu nhà ở tại Việt Nam phải đáp ứng điều kiện nào sau đây?","opts":{"A":"Phải có giấy phép lao động còn hiệu lực tại Việt Nam.","B":"Phải được phép nhập cảnh vào Việt Nam và có tài khoản thanh toán tại ngân hàng Việt Nam.","C":"Phải không thuộc trường hợp được hưởng quyền ưu đãi, miễn trừ ngoại giao, lãnh sự theo quy định của pháp luật.","D":"Phải có cam kết sở hữu nhà ở không quá"},"ans":["C"],"exp":"“Đối với cá nhân nước ngoài quy định tại điểm c khoản 1 điều 17 của Luật này phải không thuộc trường hợp được hưởng quyền ưu đãi, miễn trừ ngoại giao, lãnh sự theo quy định của pháp luật” Căn cứ PL: k3 đ 18","note":"","multi":false,"id":403,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, tổ chức, cá nhân nước ngoài (trừ tổ chức đầu tư xây dựng dự án) được sở hữu tối đa bao nhiêu căn nhà ở riêng lẻ (nhà biệt thự, nhà ở liền kề) trên một khu vực có quy mô dân số tương đương một phường?","opts":{"A":"Không quá 100 căn nhà.","B":"Không quá 500 căn nhà.","C":"Không quá 30% tổng số lượng căn nhà riêng lẻ trong khu vực đó.","D":"Không quá 250 căn nhà."},"ans":["D"],"exp":"“Tổ chức, cá nhân nước ngoài quy định tại điểm b và điểm c khoản 1 điều 17 của Luật này chỉ được mua, thuê mua, nhận tặng cho, nhận thừa kế và sở hữu không quá 30% số lượng căn hộ trong một tòa nhà chung cư, nếu là nhà ở riêng lẻ bao gồm nhà biệt thự, nhà ở liền kề thì trên một khu vực có quy mô về dân số tương đương một phường chỉ được mua, thuê mua, nhận tặng cho, nhận thừa kế và sở hữu không quá 250 căn nhà” Căn cứ PL: k1 điều 19","note":"","multi":false,"id":404,"sets":{},"fix":false},{"topic":"cd2","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 27/2023/QH15- Luật nhà ở, đối tượng nào sau đây được Luật Nhà ở 2023 xác định là được sở hữu nhà ở tại Việt Nam?","opts":{"A":"Cá nhân nước ngoài nhập cảnh vào Việt Nam.","B":"Người Việt Nam định cư ở nước ngoài không được phép nhập cảnh vào Việt Nam.","C":"Tổ chức kinh tế có vốn đầu tư nước ngoài, chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam.","D":"Tổ chức nước ngoài hoạt động tại Việt Nam nhưng không có Giấy chứng nhận đầu tư."},"ans":["A"],"exp":"“Tổ chức, cá nhân nước ngoài được sở hữu nhà ở tại Việt Nam bao gồm: a) tổ chức kinh tế có vốn đầu tư nước ngoài đầu tư xây dựng nhà ở theo dự án tại Việt Nam theo quy định của Luật này và quy định khác của pháp luật có liên quan; b) tổ chức kinh tế có vốn đầu tư nước ngoài, chi nhánh, văn phòng đại diện của doanh nghiệp nước ngoài, quỹ đầu tư nước ngoài và chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam (sau đây gọi chung là tổ chức nước ngoài); c) cá nhân nước ngoài được phép nhập cảnh vào Việt Nam” Căn cứ PL: k1 đ 17","note":"","multi":false,"id":405,"sets":{},"fix":false},{"topic":"cd2","src":"Bộ đề CĐ2 câu 1","q":"Luật Nhà ở 2023 (Luật số 27/2023/QH15) định nghĩa \"Nhà ở\" như thế nào?","opts":{"A":"Mọi công trình xây dựng có mái che và tường bao.","B":"Công trình xây dựng với mục đích để ở và phục vụ nhu cầu sinh hoạt của gia đình, cá nhân.","C":"Chỉ bao gồm các căn hộ trong dự án nhà ở thương mại.","D":"Công trình được sử dụng cho cả mục đích ở và sản xuất công nghiệp."},"ans":["B"],"exp":"","note":"","multi":false,"id":559,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 2","q":"Khái niệm \"Nhà ở có mục đích sử dụng hỗn hợp\" theo Điều 3 Luật Nhà ở 2023 là gì?","opts":{"A":"Nhà ở được nhiều hộ gia đình cùng chung sống.","B":"Nhà ở được sử dụng vào mục đích để ở và mục đích khác không bị pháp luật cấm.","C":"Nhà ở chỉ dùng làm văn phòng kết hợp kho bãi.","D":"Nhà ở có thể chuyển đổi mục đích sử dụng theo mùa."},"ans":["B"],"exp":"","note":"","multi":false,"id":560,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 3","q":"\"Nhà ở thương mại\" theo Điều 3 Luật Nhà ở 2023 được hiểu là:","opts":{"A":"Nhà ở do Nhà nước xây dựng và phân phối theo chính sách.","B":"Nhà ở được đầu tư xây dựng để bán, cho thuê mua, cho thuê theo cơ chế thị trường","C":"Nhà ở thuộc sở hữu của các tập đoàn thương mại lớn.","D":"Nhà ở được xây trong các khu thương mại, dịch vụ."},"ans":["B"],"exp":"","note":"","multi":false,"id":561,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 4","q":"\"Nhà ở xã hội (NOXH)\" theo Điều 3 Luật Nhà ở 2023 có đặc điểm gì?","opts":{"A":"Là nhà ở cho thuê ngắn hạn dành cho khách du lịch","B":"Là nhà ở cao cấp có tiện ích xã hội đi kèm.","C":"Là nhà ở có sự hỗ trợ của Nhà nước dành cho các đối tượng hưởng chính sách hỗ trợ nhà ở.","D":"Là nhà ở bắt buộc phải có trong mọi dự án bất động sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":562,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 5","q":"Định nghĩa \"Nhà chung cư\" theo Điều 3 Luật Nhà ở 2023 bao gồm đặc điểm nào?","opts":{"A":"Phải có ít nhất 5 tầng và 100 căn hộ.","B":"Có từ 02 tầng trở lên, nhiều căn hộ, có lối đi, cầu thang chung, phần sở hữu riêng, phần sở hữu chung.","C":"Chỉ bao gồm các tòa nhà văn phòng cho thuê.","D":"Luôn thuộc sở hữu toàn dân do Nhà nước quản lý."},"ans":["B"],"exp":"","note":"","multi":false,"id":563,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 6","q":"Nhà ở nhiều tầng nhiều căn hộ của cá nhân (\"chung cư mini\") được quy định tại Điều 57 Luật Nhà ở 2023 là loại nhà ở:","opts":{"A":"Do doanh nghiệp nhà nước xây dựng.","B":"Do cá nhân xây dựng trên đất ở hợp pháp của mình, đáp ứng điều kiện về số tầng và số căn hộ/mục đích sử dụng.","C":"Chỉ được phép xây dựng ở nông
