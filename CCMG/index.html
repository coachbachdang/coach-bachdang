<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: ứng dụng di động một cột — thanh tiêu đề xanh rêu đậm cố định trên, thanh tab cố định dưới, nội dung ở giữa tối đa 760px; thẻ câu hỏi là vật thể chính có khung */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#13201D; --muted:#5A6B66; --line:#D3DFDA;
  --brand:#142E2A; --brand-2:#1D3F39; --brand-ink:#E9F2EF; --brand-muted:#9DB8B0;
  --primary:#1B4A42; --on-primary:#FFFFFF; --primary-soft:#DCEBE6;
  --gold:#A87C12; --gold-soft:#F5EACB; --gold-on-brand:#E3C15A;
  --ok:#1C7A4A; --ok-soft:#DEF1E6; --bad:#B22A32; --bad-soft:#F8E0E1; --warn:#946000; --warn-soft:#FAEFD5;
  --shadow:0 1px 2px rgba(20,46,42,.06),0 8px 24px rgba(20,46,42,.07);
  --f-display:"Lexend","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --appbar-h:58px; --tabbar-h:64px; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09120F; --surface:#111C19; --surface-2:#0D1714; --ink:#E1EBE7; --muted:#91A59F; --line:#21322D;
  --brand:#0E231F; --brand-2:#163530; --brand-ink:#E3EEEA; --brand-muted:#8FAAA2;
  --primary:#62B9A6; --on-primary:#06120F; --primary-soft:#163430;
  --gold:#E0BC52; --gold-soft:#372C11; --gold-on-brand:#E6C463;
  --ok:#5CC48B; --ok-soft:#12301F; --bad:#F27C82; --bad-soft:#3A191C; --warn:#E5B458; --warn-soft:#382A0F;
  --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09120F; --surface:#111C19; --surface-2:#0D1714; --ink:#E1EBE7; --muted:#91A59F; --line:#21322D;
  --brand:#0E231F; --brand-2:#163530; --brand-ink:#E3EEEA; --brand-muted:#8FAAA2;
  --primary:#62B9A6; --on-primary:#06120F; --primary-soft:#163430;
  --gold:#E0BC52; --gold-soft:#372C11; --gold-on-brand:#E6C463;
  --ok:#5CC48B; --ok-soft:#12301F; --bad:#F27C82; --bad-soft:#3A191C; --warn:#E5B458; --warn-soft:#382A0F;
  --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:760px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg{flex:none}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.appbar .in{height:var(--appbar-h);display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--brand-2);display:grid;place-items:center;border:1px solid rgba(255,255,255,.08)}
.brandtxt{min-width:0;flex:1;line-height:1.2}
.brandtxt b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt span{font-size:.74rem;color:var(--brand-muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--brand-ink);display:grid;place-items:center}
.iconbtn:hover{background:var(--brand-2)}

main{padding-block:16px calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 24px)}
.stack{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:1.12rem}
h3{font-size:.98rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num{font-variant-numeric:tabular-nums}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px}

/* hero */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px;display:grid;gap:16px}
.hero .eyebrow{color:var(--brand-muted)}
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ring{display:flex;align-items:center;gap:12px;background:var(--brand-2);border-radius:14px;padding:12px}
.ring svg{width:64px;height:64px}
.ring .t{min-width:0}
.ring .t b{font-family:var(--f-display);font-size:.95rem;font-weight:600;display:block}
.ring .t span{font-size:.78rem;color:var(--brand-muted);display:block}
.today{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.86rem}
.today .bar{flex:1;min-width:120px;height:8px;border-radius:5px;background:var(--brand-2);overflow:hidden}
.today .bar i{display:block;height:100%;background:var(--gold-on-brand);border-radius:5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.hero .pill.gold{background:rgba(227,193,90,.16);color:var(--gold-on-brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.soft{background:var(--primary-soft);color:var(--primary)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;min-height:96px}
.qa:hover{border-color:var(--primary)}
.qa b{font-family:var(--f-display);font-weight:600;font-size:.96rem;line-height:1.3}
.qa span{font-size:.8rem;color:var(--muted)}
.qa .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.qa.alt .ic{background:var(--gold-soft);color:var(--gold)}
.qa.warnc .ic{background:var(--bad-soft);color:var(--bad)}
.resume{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block;font-weight:600}
.resume .t span{font-size:.8rem;color:var(--muted)}

/* topic list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0}
.trow:first-child{border-top:0}
button.trow:hover{background:var(--surface-2)}
.code{font-size:.7rem;font-weight:700;letter-spacing:.03em;color:var(--primary);background:var(--primary-soft);border-radius:7px;padding:4px 0;text-align:center;font-variant-numeric:tabular-nums}
.code.gold{color:var(--gold);background:var(--gold-soft)}
.tname{font-weight:600;font-size:.94rem;line-height:1.35}
.tmeta{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.mbar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar .g1{background:var(--ok)} .mbar .r1{background:var(--bad)}
.acc{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.acc.hi{color:var(--ok)} .acc.lo{color:var(--bad)}
.rowbtns{display:flex;gap:6px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:11px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* controls */
.pctl{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){.pctl{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
select,input[type=search],input[type=number]{width:100%;padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);min-height:42px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* question card */
.progress{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--muted)}
.progress .bar{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--primary)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:flex-start;gap:8px}
.qhead .meta{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src{font-size:.74rem;color:var(--muted)}
.star{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.qtext{font-size:1.1rem;font-weight:600;line-height:1.55;margin:12px 0 14px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 12px;line-height:1.45}
.opt .k{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.84rem;background:var(--surface-2)}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .k{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.62}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:13px;padding:12px 14px;background:var(--ok-soft);border:1px solid transparent}
.fb.bad{background:var(--bad-soft)}
.fb h3{font-size:.95rem;color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p{margin:6px 0 0;font-size:.9rem}
.fb .note{color:var(--warn)}
.fixb{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}
.hint{font-size:.75rem;color:var(--muted)}

/* exam */
.exbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--appbar-h));z-index:15;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:8px}
.timer{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;font-size:1.05rem;padding:6px 12px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;gap:6px}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 0;font-size:.82rem;font-variant-numeric:tabular-nums;position:relative}
.cell.done{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.cell.cur{outline:2px solid var(--ink);outline-offset:-1px}
.cell.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:13px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flagbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left}
.choice button b{display:block;font-family:var(--f-display);font-weight:600}
.choice button span{font-size:.78rem;color:var(--muted)}
.choice button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}

/* result */
.score{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px;display:grid;gap:10px}
.score .big{font-family:var(--f-display);font-size:2.8rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:1.1rem;color:var(--brand-muted);font-weight:500}
.score .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--brand-muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-top:1px solid var(--line)}
.tbl th{font-size:.72rem;color:var(--muted);font-weight:700;border-top:0}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* review */
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item .q{font-weight:600;margin:6px 0}
.item .a{font-size:.9rem}
.item .a .yours{color:var(--bad)}
.item .a .ans{color:var(--ok);font-weight:600}
.item details{margin-top:6px;font-size:.88rem}
.item summary{cursor:pointer;color:var(--primary);font-weight:600}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}

/* footer + tabbar */
.copy{padding-block:18px 0;font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;text-align:center}
.copy b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;padding:2px 4px;font-size:.78rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabbar-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.tab .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:.62rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* settings overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,15,13,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto;display:grid;gap:16px}
@media (min-width:640px){.overlay{align-items:center}.panel{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;font-weight:600}
@media (max-width:420px){.rings{grid-template-columns:1fr}.qtext{font-size:1.04rem}.trow{grid-template-columns:46px minmax(0,1fr) auto;gap:10px;padding:11px 12px}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.cell,.qa,.tab{transition:background .15s,border-color .15s,color .15s}}
</style>

</head>

<script>
const BANK = {"topics":[{"id":"cd1","code":"CĐ1","name":"Pháp luật kinh doanh BĐS","part":"co_so","count":116},{"id":"cd2","code":"CĐ2","name":"Pháp luật nhà ở","part":"co_so","count":90},{"id":"cd3","code":"CĐ3","name":"Pháp luật đất đai","part":"co_so","count":82},{"id":"cd4","code":"CĐ4","name":"Pháp luật đầu tư","part":"co_so","count":73},{"id":"cd5","code":"CĐ5","name":"Pháp luật dân sự","part":"co_so","count":80},{"id":"cd6","code":"CĐ6","name":"Công chứng, chứng thực","part":"co_so","count":72},{"id":"cd7","code":"CĐ7","name":"Pháp luật doanh nghiệp","part":"co_so","count":77},{"id":"cd8","code":"CĐ8","name":"Thuế, phí, lệ phí","part":"co_so","count":89},{"id":"cd9","code":"CĐ9","name":"Phòng, chống rửa tiền","part":"co_so","count":83},{"id":"cd10","code":"CĐ10","name":"Xử lý vi phạm hành chính","part":"co_so","count":67},{"id":"cd11","code":"CĐ11","name":"Thị trường bất động sản","part":"co_so","count":67},{"id":"cd12","code":"CĐ12","name":"Nguyên lý hình thành giá, tư vấn giá","part":"co_so","count":63},{"id":"cm1","code":"CĐ13","name":"Tổng quan môi giới BĐS","part":"chuyen_mon","count":160},{"id":"cm3","code":"CĐ14","name":"Quy trình và kỹ năng môi giới","part":"chuyen_mon","count":190},{"id":"cm2","code":"TH","name":"Tình huống thực tế","part":"chuyen_mon","count":9}],"sets":[{"id":"1A","name":"Đề 1A","part":"co_so","count":50},{"id":"2A","name":"Đề 2A","part":"co_so","count":50},{"id":"1B","name":"Đề 1B","part":"chuyen_mon","count":50},{"id":"2B","name":"Đề 2B","part":"chuyen_mon","count":49}],"questions":[{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Anh chị hiểu như thế nào là tồn kho bất động sản?","opts":{"A":"Là số lượng bất động sản của dự án đủ điều kiện đưa vào giao dịch theo quy định của pháp luật nhưng chưa giao dịch trong kỳ báo cáo","B":"Là số lượng sản phẩm bất động sản được giao dịch trong kỳ giữa chủ đầu tư dự án và người mua bất động sản.","C":"Là chỉ số giá giao dịch của một số loại bất động sản","D":"Là chỉ tiêu và số lượng giao dịch bất động sản"},"ans":["A"],"exp":"Tồn kho (Inventory) là những sản phẩm đã sẵn sàng (đủ điều kiện pháp lý) để bán ra thị trường nhưng chưa tìm được người mua trong kỳ báo cáo đó. Căn cứ pháp lý: Khoản 9 Điều 3 Nghị định 44/2024/NĐ-CP (Quy định về việc xây dựng hệ thống thông tin về nhà ở và thị trường bất động sản).","note":"","multi":false,"id":1,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Kinh doanh dịch vụ môi giới bất động sản độc lập mà không có chứng chỉ hành nghề hoặc chứng chỉ hành nghề hết thời hạn sử dụng theo quy định của pháp luật thì sẽ bị phạt như thế nào?","opts":{"A":"Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng.","B":"Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng.","C":"Phạt tiền từ 120.000.000 đồng đến 160.000.000 đồng.","D":"Phạt tiền từ 200.000.000 đồng đến 250.000.000 đồng."},"ans":["B"],"exp":"Đây là mức phạt tiền áp dụng đối với cá nhân vi phạm. Theo Luật KDBĐS 2023 (Điều 61), cá nhân môi giới BĐS phải có chứng chỉ và phải làm việc trong doanh nghiệp KDDV BĐS hoặc sàn. Hành vi \"môi giới độc lập\" không còn được phép. Mức phạt này được quy định trong nghị định xử phạt vi phạm hành chính. Căn cứ pháp lý: Khoản 1 Điều 58 Nghị định 16/2022/NĐ-CP (Đây là mức phạt áp dụng cho cá nhân. Mặc dù nghị định này ban hành trước Luật 2023, nhưng các quy định về xử phạt liên quan đến CCHM vẫn được áp dụng cho đến khi có nghị định thay thế).","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":2,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng kinh doanh dịch vụ bất động sản gồm những loại nào?","opts":{"A":"Hợp đồng dịch vụ môi giới bất động sản, hợp đồng cho thuê nhà, công trình xây dựng.","B":"sản. Hợp đồng chuyển nhượng, cho thuê lại quyền sử dụng đất, hợp đồng dịch vụ tư vấn bất động","C":"Hợp đồng dịch vụ môi giới bất động sản; hợp đồng dịch vụ tư vấn bất động sản; hợp đồng dịch vụ quản lý bất động sản.","D":"Hợp đồng dịch vụ tư vấn và hợp đồng dịch vụ môi giới bất động sản."},"ans":["C"],"exp":"Luật KDBĐS 2023 quy định rõ các loại hình dịch vụ BĐS (môi giới, tư vấn, quản lý và sàn giao dịch). Đáp án C liệt kê chính xác 3 loại hợp đồng dịch vụ tương ứng. Các đáp án A và B nhầm lẫn với hợp đồng kinh doanh BĐS (mua bán, cho thuê). Căn cứ pháp lý: Khoản 3 Điều 46 Luật Kinh doanh Bất động sản 2023 (Số 29/2023/QH15).","note":"","multi":false,"id":3,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Nhà chung cư, tòa nhà hỗn hợp có mục đích để ở hình thành trong tương lai phải có điều kiện nào mới được đưa vào kinh doanh?","opts":{"A":"Phải có Giấy phép xây dựng.","B":"Phải có biên bản nghiệm thu đã hoàn thành xong phần móng của tòa nhà đó.","C":"Phải có giấy tờ về nghiệm thu việc hoàn thành xây dựng cơ sở hạ tầng kỹ thuật tương ứng theo tiến độ dự án.","D":"Phải có giấy tờ về quyền sử dụng đất."},"ans":["B"],"exp":"Đây là điều kiện \"cứng\" về mặt kỹ thuật xây dựng để CĐT được phép bắt đầu huy động vốn/bán hàng. Các điều kiện khác (GPXD, giấy tờ đất) là điều kiện cần có trước đó để triển khai dự án, nhưng \"xong móng\" là mốc pháp lý để bắt đầu kinh doanh. Căn cứ pháp lý: Điểm b Khoản 1 Điều 24 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":4,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Bên mua, bên thuê mua chưa được cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu nhà ở và tài sản khác gắn liền với đất thì bên bán, bên cho thuê mua không được thu quá bao nhiêu phần trăm giá trị hợp đồng?","opts":{"A":"80%","B":"85%","C":"90%","D":"95%"},"ans":["D"],"exp":"Luật quy định bên bán phải giữ lại 5% giá trị hợp đồng. Khoản tiền này chỉ được thanh toán sau khi bên mua đã được cơ quan nhà nước có thẩm quyền cấp Giấy chứng nhận (Sổ hồng). Căn cứ pháp lý: Điểm d Khoản 1 Điều 25 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":5,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Lượng giao dịch bất động sản theo quy định của pháp luật được hiểu là gì?","opts":{"A":"Là giá của sản phẩm bất động sản được giao dịch trong kỳ giữa chủ đầu tư dự án và người mua bất động sản.","B":"Là số lượng sản phẩm bất động sản được giao dịch trong kỳ giữa chủ đầu tư dự án và người mua bất động sản.","C":"Là số lượng bất động sản của dự án đủ điều kiện đưa vào giao dịch theo quy định của pháp luật nhưng chưa giao dịch trong kỳ báo cáo.","D":"Là cơ sở dữ liệu về nhà ở và thị trường bất động sản."},"ans":["B"],"exp":"\"Lượng\" (Volume) là số đếm, đối lập với \"Giá\" (Price). Đáp án B định nghĩa chính xác về số lượng giao dịch thành công. Đáp án C là định nghĩa \"Tồn kho\". Căn cứ pháp lý: Khoản 8 Điều 3 Nghị định 44/2024/NĐ-CP.","note":"","multi":false,"id":6,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"“Giá của sản phẩm bất động sản được giao dịch trong kỳ giữa chủ đầu tư dự án và người mua bất động sản” là định nghĩa cho cụm từ ngữ nào?","opts":{"A":"Tồn kho bất động sản","B":"Lượng giao dịch bất động sản","C":"Giá giao dịch bất động sản","D":"Chỉ số giá giao dịch một số loại bất động sản"},"ans":["C"],"exp":"Câu hỏi này định nghĩa rõ ràng về \"giá\" của một giao dịch đã diễn ra. Căn cứ pháp lý: Khoản 10 Điều 3 Nghị định 44/2024/NĐ-CP.","note":"","multi":false,"id":7,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Bất động sản nào không được phép đưa vào kinh doanh?","opts":{"A":"Nhà công trình xây dựng vào mục đích quốc phòng, an ninh không được nhà nước cho phép.","B":"Nhà, công trình xây dựng có sẵn của các tổ chức, cá nhân","C":"Nhà, công trình xây dựng hình thành trong tương lai của các tổ chức, cá nhân.","D":"Nhà, công trình xây dựng là tài sản công được cơ quan nhà nước có thẩm quyền cho phép đưa vào kinh doanh."},"ans":["A"],"exp":"BĐS phục vụ mục đích quốc phòng, an ninh là tài sản đặc thù, thuộc quản lý riêng và không được tự do kinh doanh trừ khi có quyết định đặc biệt của cơ quan có thẩm quyền. Các đáp án B, C, D (với điều kiện D là \"được cho phép\") là các loại BĐS được kinh doanh. Căn cứ pháp lý: Khoản 2 Điều 7 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":8,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu không phải là nội dung thông tin về bất động sản?","opts":{"A":"Loại bất động sản","B":"Thông tin về quy hoạch có liên quan đến bất động sản","C":"Quy mô của bất động sản","D":"Chính sách của Nhà nước đối với đầu tư kinh doanh bất động sản"},"ans":["D"],"exp":"Các đáp án A, B, C (Loại, quy hoạch, quy mô) là thông tin cố hữu, đặc thù của chính BĐS đó. Đáp án D là thông tin thị trường, mang tính vĩ mô, áp dụng chung chứ không phải thông tin của riêng một BĐS. Căn cứ pháp lý: Logic suy luận từ Điều 6 Luật Kinh doanh Bất động sản 2023 (về công khai thông tin BĐS).","note":"","multi":false,"id":9,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào thống nhất quản lý hệ thống thông tin về nhà ở và thị trường bất động sản?","opts":{"A":"Chính phủ","B":"Bộ Xây dựng","C":"Bộ Tài Chính","D":"Sở Xây dựng"},"ans":["B"],"exp":"Chính phủ thống nhất quản lý nhà nước, nhưng cơ quan chịu trách nhiệm chuyên ngành trong việc xây dựng, quản lý và vận hành hệ thống thông tin thị trường BĐS là Bộ Xây dựng. Căn cứ pháp lý: Khoản 4 Điều 44 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":10,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào thực hiện quản lý hệ thống thông tin về nhà ở và thị trường bất động sản tại địa phương?","opts":{"A":"Bộ Xây dựng","B":"Ủy ban nhân dân cấp tỉnh","C":"Sở Tài nguyên và Môi trường tại các địa phương","D":"Sở Xây dựng địa phương"},"ans":["B"],"exp":"UBND cấp tỉnh là cơ quan chịu trách nhiệm toàn diện về quản lý nhà nước tại địa phương, bao gồm cả việc \"Tổ chức xây dựng, quản lý, vận hành hệ thống thông tin... tại địa phương\". Sở Xây dựng (đáp án D) là cơ quan chuyên môn giúp việc cho UBND tỉnh thực hiện nhiệm vụ này. Căn cứ pháp lý: Khoản 6 Điều 78 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":11,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là thông tin, dữ liệu về dự án bất động sản?","opts":{"A":"Thông tin chung về dự án bất động sản","B":"Thông tin về loại dự án bất động sản","C":"Thông tin, dữ liệu về số lượng, diện tích các loại bất động sản","D":"Cả đáp án A, B và C đều đúng."},"ans":["D"],"exp":"Thông tin về một dự án BĐS bao gồm thông tin chung (tên, CĐT, vị trí...), loại dự án (KĐT, nhà ở...) và dữ liệu về sản phẩm (số lượng, diện tích...). Căn cứ pháp lý: Điều 5 Nghị định 44/2024/NĐ-CP (bao gồm cả 3 Khoản 1, 2, 3).","note":"","multi":false,"id":12,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là thông tin về loại dự án bất động sản?","opts":{"A":"Thông tin chung về dự án bất động sản?","B":"Dự án đầu tư xây dựng nhà ở, dự án đầu tư xây dựng khu đô thị","C":"Thông tin, dữ liệu về số lượng, diện tích các loại bất động sản","D":"Quy mô diện tích dự án; tổng mức đầu tư; quy hoạch chi tiết 1/500 hoặc quy hoạch tổng mặt bằng của dự án được cơ quan có thẩm quyền phê duyệt"},"ans":["B"],"exp":"Câu hỏi này yêu cầu xác định \"loại dự án\". Đáp án B liệt kê các loại dự án. Đáp án D (quy mô, 1/500) thuộc về \"Thông tin chung\". Căn cứ pháp lý: Khoản 2 Điều 5 Nghị định 44/2024/NĐ-CP.","note":"","multi":false,"id":13,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Thông tin về giá bán, cho thuê bình quân của bất động sản được giao dịch trong kỳ của dự án thuộc loại thông tin, dự án bất động sản nào?","opts":{"A":"Thông tin, dữ liệu về tình hình giao dịch bất động sản của dự án.","B":"Thông tin, dữ liệu về số lượng, diện tích các loại bất động sản.","C":"Thông tin về loại dự án bất động sản.","D":"Thông tin chung về dự án bất động sản."},"ans":["A"],"exp":"Giá bán/cho thuê là thông tin cốt lõi phản ánh \"tình hình giao dịch\" (transaction status) của dự án. Căn cứ pháp lý: Khoản 4 Điều 5 Nghị định 44/2024/NĐ-CP.","note":"","multi":false,"id":14,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Đất để xây dựng nhà ở (theo hình thức phân lô, bán nền) thuộc loại thông tin dữ liệu nào của bất động sản?","opts":{"A":"Thông tin, dữ liệu về tình hình giao dịch bất động sản của dự án.","B":"Thông tin, dữ liệu về số lượng, diện tích các loại bất động sản.","C":"Thông tin về loại dự án bất động sản.","D":"Thông tin chung về dự án bất động sản."},"ans":["B"],"exp":"\"Đất nền\" là một loại sản phẩm BĐS. Do đó, thông tin về nó (số lượng, diện tích) thuộc nhóm dữ liệu về các loại BĐS trong dự án. Căn cứ pháp lý: Điểm c Khoản 3 Điều 5 Nghị định 44/2024/NĐ-CP.","note":"","multi":false,"id":15,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là thông tin, dữ liệu về các loại bất động sản giao dịch chuyển nhượng, mua bán thông qua sàn giao dịch?","opts":{"A":"Thông tin về sàn giao dịch bất động sản","B":"Số lượng, diện tích bất động sản giao dịch chuyển nhượng, mua bán trong kỳ thông qua sàn giao dịch bất động sản","C":"sản. Giá bất động sản giao dịch chuyển nhượng, mua bán trong kỳ thông qua sàn giao dịch bất động","D":"Cả đáp án A, B và C đều đúng"},"ans":["D"],"exp":"Dữ liệu về giao dịch qua sàn bao gồm thông tin của chính cái sàn đó (A), số lượng giao dịch (B), và giá trị các giao dịch đó (C). Căn cứ pháp lý: Điều 6 Nghị định 44/2024/NĐ-CP (bao gồm cả 3 Khoản 1, 2, 3).","note":"","multi":false,"id":16,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Giá bất động sản giao dịch chuyển nhượng, mua bán trong kỳ thông qua sàn giao dịch bất động sản là loại thông tin, dữ liệu nào?","opts":{"A":"dịch. Thông tin, dữ liệu về các loại bất động sản giao dịch chuyển nhượng, mua bán thông qua sàn giao","B":"Thông tin, dữ liệu về thuế đối với hoạt động chuyển nhượng một số loại bất động sản.","C":"Thông tin, dữ liệu về tình hình giao dịch bất động sản của dự án.","D":"Thông tin về loại dự án bất động sản."},"ans":["A"],"exp":"Câu hỏi này gần như lặp lại tiêu đề của Điều 6. Giá giao dịch qua sàn là một tập con của dữ liệu về giao dịch qua sàn. Căn cứ pháp lý: Khoản 3 Điều 6 Nghị định 44/2024/NĐ-CP.","note":"","multi":false,"id":17,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là thông tin, dữ liệu về chứng chỉ môi giới bất động sản?","opts":{"A":"Số quyết định cấp chứng chỉ","B":"Số hiệu chứng chỉ","C":"Họ và tên, ngày tháng năm sinh, địa chỉ thường trú của người được cấp chứng chỉ môi giới bất động sản.","D":"Cả 3 loại thông tin, dữ liệu trên."},"ans":["D"],"exp":"Dữ liệu quản lý CCHM bao gồm thông tin định danh của chứng chỉ (Số QĐ, số hiệu) và thông tin nhân thân của người được cấp (Họ tên, NS...). Căn cứ pháp lý: Điều 10 Nghị định 44/2024/NĐ-CP.","note":"","multi":false,"id":18,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Khi nhà đầu tư được lựa chọn làm chủ đầu tư dự án bất động sản theo quy định của pháp luật thì nhà đầu tư đó phải đủ điều kiện nào sau đây?","opts":{"A":"Phải thành lập Hợp tác xã.","B":"Phải công khai trên trang thông tin điện tử của doanh nghiệp.","C":"Có vốn chủ sở hữu không thấp hơn 20% tổng vốn đầu tư đối với dự án có quy mô sử dụng đất dưới 20 ha.","D":"Phải xác định vốn chủ sở hữu theo vốn điều lệ thực tế đã góp theo quy định của pháp luật."},"ans":["C"],"exp":"Đây là điều kiện tiên quyết về năng lực tài chính của CĐT dự án. Mức 20% áp dụng cho dự án dưới 20 ha (và 15% cho dự án từ 20 ha trở lên). Căn cứ pháp lý: Khoản 2 Điều 9 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":19,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Khi thực hiện kinh doanh bất động sản thì chủ đầu tư dự án phải đáp ứng điều kiện nào sau đây?","opts":{"A":"Phải thành lập doanh nghiệp theo quy định của pháp luật về doanh nghiệp hoặc hợp tác xã theo quy định của pháp luật về hợp tác xã, có ngành nghề kinh doanh bất động sản.","B":"Phải có kết quả báo cáo tài chính đã được kiểm toán gần nhất hoặc kết quả báo cáo kiểm toán độc lập của doanh nghiệp đang hoạt động","C":"Có vốn chủ sở hữu không thấp hơn 20% tổng vốn đầu tư đối với dự án có quy mô sử dụng đất dưới 20 ha.","D":"Phải xác định vốn chủ sở hữu theo vốn điều lệ thực tế đã góp theo quy định của pháp luật."},"ans":["A"],"exp":"Đây là điều kiện \"cửa vào\" (entry condition) cơ bản nhất để được KDBĐS: phải có tư cách pháp nhân (doanh nghiệp hoặc HTX) và đăng ký ngành nghề KDBĐS. Các đáp án B, C, D là điều kiện cụ thể về năng lực tài chính cho CĐT dự án (như ở Câu 19). Căn cứ pháp lý: Khoản 1 Điều 9 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":20,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Việc chuyển nhượng hợp đồng mua bán, thuê mua nhà ở hình thành trong tương lai không được áp dụng đối với?","opts":{"A":"Hợp đồng mua bán, thuê mua nhà ở xã hội.","B":"Hợp đồng cho thuê, cho thuê lại quyền sử dụng đất","C":"Hợp đồng chuyển nhượng quyền sử dụng đất","D":"Hợp đồng thuê nhà ở, công trình xây dựng thương mại."},"ans":["A"],"exp":"Nhà ở xã hội (NOXH) là loại hình nhà ở có chính sách hỗ trợ đặc biệt của nhà nước, đi kèm các điều kiện mua bán, chuyển nhượng rất chặt chẽ, không cho phép chuyển nhượng hợp đồng (bán \"trên giấy\") tự do như nhà ở thương mại. Căn cứ pháp lý: Khoản 6 Điều 31 Luật Kinh doanh Bất động sản 2023 và các quy định tại Luật Nhà ở 2023 về NOXH.","note":"","multi":false,"id":21,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Việc chuyển nhượng hợp đồng mua bán, thuê mua nhà, công trình xây dựng phải đảm bảo các điều kiện nào sau đây?","opts":{"A":"Có hợp đồng mua bán, thuê mua được lập theo quy định của pháp luật.","B":"Thuộc diện chưa nộp hồ sơ đề nghị cơ quan nhà nước có thẩm quyền cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu nhà ở và tài sản khác gắn liền với đất.","C":"Hợp đồng mua bán, thuê mua nhà, công trình xây dựng phải thuộc diện không có tranh chấp, khiếu kiện.","D":"Phải đảm bảo cả 3 điều kiện trên."},"ans":["D"],"exp":"Để chuyển nhượng hợp đồng (thay đổi bên mua), cần 3 điều kiện: A (Hợp đồng gốc phải hợp lệ), B (Chưa đến giai đoạn làm sổ hồng, vì nếu đã nộp hồ sơ thì phải chờ ra sổ rồi mới chuyển nhượng GCN), và C (Không có tranh chấp). Căn cứ pháp lý: Khoản 1 Điều 32 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":22,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Trường hợp kinh doanh dịch vụ bất động sản mà không thành lập doanh nghiệp theo quy định hoặc không đủ số người có chứng chỉ hành nghề môi giới bất động sản theo quy định hoặc chứng chỉ hành nghề hết thời hạn sử dụng theo quy định thì ?","opts":{"A":"Phạt tiền từ 120.000.000 đồng đến 160.000.000 đồng","B":"Đình chỉ hoạt động kinh doanh dịch vụ sàn giao dịch bất động sản từ 06 tháng đến 09 tháng.","C":"Buộc thành lập doanh nghiệp theo quy định khi kinh doanh dịch vụ bất động sản hoặc buộc có đủ số người có chứng chỉ hành nghề môi giới bất động sản theo quy định","D":"Áp dụng cả 3 trường hợp nêu trên."},"ans":["D"],"exp":"Đối với vi phạm nghiêm trọng này (hoạt động \"chui\" hoặc không đủ điều kiện), tổ chức vi phạm sẽ bị: A (Phạt tiền, 120-160tr là mức phạt cho tổ chức), B (Phạt bổ sung: Đình chỉ hoạt động), và C (Biện pháp khắc phục: Buộc phải tuân thủ). Căn cứ pháp lý: Khoản 3 (mức phạt), Khoản 5 (đình chỉ), và Khoản 6 (biện pháp khắc phục) của Điều 58 Nghị định 16/2022/NĐ-CP.","note":"Theo NĐ 339/2026/NĐ-CP: doanh nghiệp môi giới không có tối thiểu 01 người có chứng chỉ hành nghề bị phạt 60 – 80 triệu đồng; kinh doanh môi giới không thành lập doanh nghiệp: 120 – 160 triệu đồng. Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":23,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Trường hợp cho mượn, cho thuê hoặc thuê, mượn chứng chỉ hành nghề môi giới bất động sản để thực hiện các hoạt động liên quan đến môi giới bất động sản thì sẽ bị?","opts":{"A":"Đình chỉ hoạt động kinh doanh dịch vụ sàn giao dịch bất động sản từ 06 tháng đến 09 tháng.","B":"Tước quyền sử dụng chứng chỉ hành nghề từ 03 tháng đến 06 tháng.","C":"Buộc cung cấp thông tin về bất động sản theo quy định.","D":"Buộc trả lại cho bên nộp tiền các loại phí kinh doanh dịch vụ bất động sản theo quy định."},"ans":["B"],"exp":"Đây là hình thức xử phạt bổ sung áp dụng cho cá nhân có hành vi cho thuê/mượn chứng chỉ. Ngoài ra, người này còn bị phạt tiền (mức 40-60 triệu đồng). Căn cứ pháp lý: Điểm b Khoản 5 Điều 58 Nghị định 16/2022/NĐ-CP.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":24,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Hành vi nào sau đây bị phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng?","opts":{"A":"Kinh doanh dịch vụ môi giới bất động sản độc lập mà không có chứng chỉ hành nghề hoặc chứng chỉ hành nghề hết thời hạn sử dụng theo quy định","B":"Tẩy xóa, sửa chữa chứng chỉ hành nghề môi giới bất động sản làm sai lệch nội dung chứng chỉ.","C":"Cho mượn, cho thuê hoặc thuê, mượn chứng chỉ hành nghề môi giới bất động sản để thực hiện các hoạt động liên quan đến môi giới bất động sản.","D":"Cả 3 hành vi trên."},"ans":["D"],"exp":"Đây đều là các vi phạm nghiêm trọng của cá nhân hành nghề môi giới, được quy định tại Khoản 1 và Khoản 2 Điều 58, và cùng chung một khung phạt (40-60 triệu) áp dụng cho cá nhân. Căn cứ pháp lý: Khoản 1 và Khoản 2 Điều 58 Nghị định 16/2022/NĐ-CP.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":25,"sets":{},"fix":false},{"topic":"cd1","src":"Tài liệu ôn thi cơ sở 01","q":"Anh chị hiểu như nào là tư vấn bất động sản?","opts":{"A":"Là nơi diễn ra các giao dịch về mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản.","B":"Là hoạt động trợ giúp về các vấn đề liên quan đến kinh doanh bất động sản theo yêu cầu của các bên.","C":"Là việc làm trung gian cho các bên trong mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản.","D":"Là nhà, công trình xây dựng đang trong quá trình xây dựng và chưa được nghiệm thu đưa vào sử dụng."},"ans":["B"],"exp":"Đây là định nghĩa chính xác về \"Tư vấn\" (Consulting) - cung cấp kiến thức chuyên môn để trợ giúp khách hàng. Đáp án C là Môi giới, A là Sàn, D là BĐS HTTTL. Căn cứ pháp lý: Khoản 13 Điều 3 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":26,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, nhận định nào sau đây đúng?","opts":{"A":"Tổ chức, cá nhân kinh doanh dịch vụ sàn giao dịch bất động sản phải thành lập doanh nghiệp kinh doanh dịch vụ bất động sản theo quy định của pháp luật","B":"Tổ chức, cá nhân kinh doanh dịch vụ sàn giao dịch bất động sản không phải thành lập doanh nghiệp","C":"Tổ chức, cá nhân kinh doanh dịch vụ sàn giao dịch bất động sản có thể thành lập doanh nghiệp hoặc không","D":"Tổ chức, cá nhân kinh doanh dịch vụ sàn giao dịch bất động sản có thể thành lập doanh nghiệp hoặc đăng ký hộ kinh doanh"},"ans":["A"],"exp":"“Tổ chức, cá nhân kinh doanh dịch vụ sàn giao dịch bất động sản phải thành lập doanh nghiệp kinh doanh dịch vụ bất động sản theo quy định tại khoản 5 điều 9 của Luật này” Căn cứ PL: khoản 1 điều 54 Luật KDBĐS","note":"","multi":false,"id":381,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, người đại diện theo pháp luật của sàn giao dịch bất động sản có thể đồng thời là người quản lý điều hành sàn giao dịch bất động sản không?","opts":{"A":"Không được đồng thời","B":"Luật không quy định","C":"Người đại diện theo pháp luật của sàn giao dịch bất động sản có thể đồng thời là người quản lý điều hành sàn giao dịch bất động sản","D":"Có thể đồng thời nếu được Sở xây dựng đồng ý"},"ans":["C"],"exp":"Căn cứ PL: khoản 2 điều 15 nghị định 96/2024/NĐ-CP quy định người đại diện theo pháp luật của sàn giao dịch bất động sản có thể đồng thời là người quản lý điều hành sàn giao dịch bất động sản.","note":"","multi":false,"id":382,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, Người quản lý, điều hành sàn giao dịch bất động sản phải có giấy chứng nhận hoàn thành khóa học nào?","opts":{"A":"Giấy chứng nhận hoàn thành khóa học về môi giới bất động sản","B":"Giấy chứng nhận hoàn thành khóa học về định giá bất động sản","C":"Hoàn thành khóa đào tạo về quản lý, điều hành sàn giao dịch bất động sản và được cơ sở đào tạo cấp giấy chứng nhận hoàn thành khóa học quản lý, điều hành sàn giao dịch bất động sản","D":"Không bắt buộc"},"ans":["C"],"exp":"Căn cứ PL: điểm b khoản 1 - điều 55 “Người quản lý, điều hành sàn giao dịch bất động sản phải đáp ứng các điều kiện sau đây: a) có quyền quản lý doanh nghiệp tại Việt Nam theo quy định của Luật Doanh nghiệp; b) hoàn thành khóa đào tạo về quản lý, điều hành sàn giao dịch bất động sản và được cơ sở đào tạo cấp giấy chứng nhận hoàn thành khóa học quản lý, điều hành sàn giao dịch bất động sản.”","note":"","multi":false,"id":383,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật Kinh doanh bất động sản, tổ chức, cá nhân muốn kinh doanh BĐS phải có điều kiện gì?","opts":{"A":"Thành lập doanh nghiệp/HTX, trừ trường hợp cá nhân kinh doanh nhỏ lẻ.","B":"Có vốn pháp định tối thiểu 50 tỷ đồng.","C":"Đăng ký hộ kinh doanh cá thể.","D":"Được Sở Xây dựng cấp phép hành nghề."},"ans":["A"],"exp":"“ Tổ chức, cá nhân khi kinh doanh bất động sản phải thành lập doanh nghiệp theo quy định của pháp luật về doanh nghiệp hoặc thành lập hợp tác xã, liên hiệp hợp tác xã theo quy định của pháp luật về hợp tác xã, có ngành, nghề kinh doanh bất động sản (gọi chung là doanh nghiệp kinh doanh bất động sản), trừ trường hợp quy định tại khoản 3 và khoản 4 điều này” Căn cứ PL: khoản 1- điều 9","note":"","multi":false,"id":384,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật Kinh doanh bất động sản, doanh nghiệp kinh doanh bất động sản phải đảm bảo tỷ lệ vốn chủ sở hữu bao nhiêu khi thực hiện dự án dưới 20 ha?","opts":{"A":"Tối thiểu 10%.","B":"Tối thiểu 15%.","C":"Tối thiểu 20%.","D":"Tối thiểu 25%."},"ans":["C"],"exp":"“Doanh nghiệp kinh doanh bất động sản thông qua dự án bất động sản phải có vốn chủ sở hữu không thấp hơn 20% tổng vốn đầu tư đối với dự án có quy mô sử dụng đất dưới 20 ha, không thấp hơn 15% tổng vốn đầu tư đối với dự án có quy mô sử dụng đất từ 20 ha trở lên và phải bảo đảm khả năng huy động vốn để thực hiện dự án đầu tư; trường hợp doanh nghiệp kinh doanh bất động sản đồng thời thực hiện nhiều dự án thì phải có vốn chủ sở hữu đủ phân bổ để bảo đảm tỷ lệ nêu trên của từng dự án để thực hiện toàn bộ các dự án” Căn cứ PL: điểm c k2-điều 9","note":"","multi":false,"id":385,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật Kinh doanh bất động sản, bất động sản nào dưới đây không thuộc loại được phép kinh doanh?","opts":{"A":"Nhà ở có sẵn.","B":"Công trình xây dựng hình thành trong tương lai.","C":"Quyền sử dụng đất chưa có hạ tầng kỹ thuật.","D":"Phần diện tích sàn trong công trình xây dựng"},"ans":["C"],"exp":"“ Dự án bất động sản khi có quyền sử dụng đất đã có hạ tầng kỹ thuật được đưa vào kinh doanh phải đáp ứng các yêu cầu sau đây: a) các yêu cầu quy định tại điều 11 của Luật này; b) đã hoàn thành việc đầu tư xây dựng các công trình hạ tầng kỹ thuật theo quy hoạch chi tiết được phê duyệt, tiến độ dự án được chấp thuận của cơ quan Nhà nước có thẩm quyền theo quy định của pháp luật về xây dựng, pháp luật về quy hoạch đô thị, pháp luật về đầu tư...” Căn cứ PL: k1 đ 29","note":"","multi":false,"id":386,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật Kinh doanh bất động sản, cơ quan nào có thẩm quyền chấp thuận chuyển nhượng toàn bộ dự án bất động sản có quy mô lớn, ảnh hưởng đến phát triển KT-XH cả nước?","opts":{"A":"UBND cấp huyện.","B":"UBND cấp tỉnh.","C":"Thủ tướng Chính phủ.","D":"Bộ Xây dựng."},"ans":["C"],"exp":"“Thủ tướng Chính phủ quyết định cho phép chuyển nhượng toàn bộ hoặc một phần dự án bất động sản đối với dự án bất động sản do thủ tướng Chính phủ quyết định chủ trương đầu tư, chấp thuận chủ trương đầu tư, chấp thuận đầu tư. Trường hợp thủ tướng Chính phủ ủy quyền cho Ủy ban nhân dân cấp tỉnh quyết định việc chuyển nhượng một phần dự án bất động sản thì Ủy ban nhân dân cấp tỉnh quyết định cho phép chuyển nhượng một phần dự án và thực hiện theo quy định tại khoản 2 điều 42 của Luật này;...” Căn cứ PL: điều 41","note":"","multi":false,"id":387,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật Kinh doanh bất động sản, hành vi nào sau đây BỊ CẤM trong kinh doanh bất động sản?","opts":{"A":"Thực hiện giao dịch mua bán thông qua sàn giao dịch bất động sản.","B":"Giả mạo tài liệu, cố ý làm sai lệch thông tin về bất động sản, dự án bất động sản đưa vào kinh doanh.","C":"Tổ chức, cá nhân thực hiện thanh toán không dùng tiền mặt trong giao dịch bất động sản.","D":"Thu, quản lý phí dịch vụ theo quy định của pháp luật."},"ans":["B"],"exp":"“Điều 8. Các hành vi bị nghiêm cấm trong kinh doanh bất động sản 1. Kinh doanh bất động sản không đủ điều kiện theo quy định của Luật này. 2. Giả mạo tài liệu, cố ý làm sai lệch thông tin về bất động sản, dự án bất động sản đưa vào kinh doanh. 3. Không công khai thông tin về bất động sản, dự án bất động sản đưa vào kinh doanh theo quy định của pháp luật về kinh doanh bất động sản. 4. Gian lận, lừa dối, lừa đảo trong kinh doanh bất động sản...” Căn cứ PL: điều 8","note":"","multi":false,"id":388,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật Kinh doanh bất động sản, khi chuyển nhượng quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án bất động sản, bên chuyển nhượng có trách nhiệm chính nào sau đây, trừ trường hợp có thỏa thuận khác?","opts":{"A":"Bàn giao Giấy chứng nhận quyền sử dụng đất hiện có cho bên nhận chuyển nhượng.","B":"Làm thủ tục để cơ quan nhà nước có thẩm quyền cấp giấy chứng nhận về quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất cho bên nhận chuyển nhượng.","C":"Kê khai và nộp tất cả các loại thuế, phí, lệ phí liên quan.","D":"Đảm bảo bên nhận chuyển nhượng tự xây dựng nhà ở theo đúng mẫu thiết kế."},"ans":["B"],"exp":"“Thực hiện thủ tục đăng ký đất đai theo quy định của pháp luật về đất đai và giao giấy chứng nhận về quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất theo quy định của pháp luật về đất đai cho bên nhận chuyển nhượng, trừ trường hợp bên nhận chuyển nhượng tự nguyện làm thủ tục cấp giấy chứng nhận” Căn cứ PL: điểm đ k1 điều 30","note":"","multi":false,"id":389,"sets":{},"fix":false},{"topic":"cd1","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, Kinh doanh dịch vụ bất động sản bao gồm kinh doanh dịch vụ nào sau đây?","opts":{"A":"Sàn giao dịch bất động sản, môi giới bất động sản, tư vấn bất động sản, quản lý bất động sản","B":"Mua–bán, chuyển nhượng bất động sản","C":"Cho thuê","D":"Cho thuê lại bất động sản"},"ans":["A"],"exp":"“Kinh doanh dịch vụ bất động sản bao gồm kinh doanh các dịch vụ: sàn giao dịch bất động sản, môi giới bất động sản, tư vấn bất động sản, quản lý bất động sản” Căn cứ PL: khoản 2 -điều 3","note":"","multi":false,"id":390,"sets":{},"fix":false},{"topic":"cd1","src":"Bộ đề CĐ1 câu 1 · Đề 1A câu 3","q":"Luật kinh doanh bất động sản 2023 có hiệu lực thi hành từ ngày nào?","opts":{"A":"01/01/2025","B":"01/08/2024","C":"28/11/2023","D":"01/01/2015"},"ans":["B"],"exp":"","note":"","multi":false,"id":479,"fix":false,"sets":{"1A":3}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 2 · Đề 1A câu 12","q":"Theo Luật kinh doanh bất động sản 2023, \"Kinh doanh bất động sản\" được hiểu là gì?","opts":{"A":"Chỉ bao gồm việc mua bán nhà ở.","B":"Chỉ bao gồm hoạt động môi giới và tư vấn bất động sản.","C":"Việc bỏ vốn đầu tư tạo lập, mua, nhận chuyển nhượng, thuê, thuê mua BĐS để bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua nhằm mục đích lợi nhuận.","D":"Chỉ việc xây dựng dự án bất động sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":480,"fix":false,"sets":{"1A":12}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 3","q":"Trường hợp nào sau đây KHÔNG thuộc phạm vi điều chỉnh của Luật kinh doanh bất động sản 2023?","opts":{"A":"Kinh doanh dịch vụ môi giới bất động sản.","B":"Bán nhà ở hình thành trong tương lai của chủ đầu tư dự án.","C":"Việc bán nhà ở của cơ quan nhà nước do phá sản, giải thể.","D":"Cho thuê văn phòng của doanh nghiệp kinh doanh BĐS."},"ans":["C"],"exp":"","note":"","multi":false,"id":481,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 4","q":"Hành vi nào sau đây bị nghiêm cấm theo Luật kinh doanh bất động sản 2023?","opts":{"A":"Kinh doanh bất động sản đủ điều kiện theo quy định.","B":"Công khai đầy đủ thông tin về dự án bất động sản","C":"Thu tiền đặt cọc mua nhà hình thành trong tương lai không quá 5% giá bán.","D":"Giả mạo tài liệu, cố ý làm sai lệch thông tin về bất động s":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 26","q":"Chủ đầu tư có trách nhiệm gì sau khi chuyển nhượng quyền sử dụng đất đã có hạ tầng kỹ thuật cho cá nhân tự xây nhà ở?","opts":{"A":"Không còn trách nhiệm gì.","B":"Hỗ trợ người mua vay vốn ngân hàng.","C":"Giám sát việc người mua xây dựng nhà ở theo đúng quy hoạch, thiết kế được duyệt.","D":"Xây dựng phần thô nhà ở cho người mua."},"ans":["C"],"exp":"","note":"","multi":false,"id":504,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 27 · Đề 1A câu 46","q":"Hành vi nào liên quan đến chứng chỉ hành nghề môi giới BĐS bị nghiêm cấm theo Luật kinh doanh bất động sản 2023?","opts":{"A":"Thi lấy chứng chỉ hành nghề môi giới BĐS.","B":"Sử dụng chứng chỉ hết hạn để hành nghề.","C":"Yêu cầu nhân viên môi giới phải có chứng chỉ.","D":"Cấp và sử dụng chứng chỉ hành nghề môi giới BĐS không đúng quy định."},"ans":["D"],"exp":"","note":"","multi":false,"id":505,"fix":false,"sets":{"1A":46}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 28","q":"Khi chuyển nhượng toàn bộ dự án BĐS, bên nhận chuyển nhượng có phải làm lại hồ sơ dự án, quy hoạch, giấy phép xây dựng không nếu không thay đổi nội dung dự án?","opts":{"A":"Có, phải làm lại toàn bộ thủ tục từ đầu.","B":"Chỉ cần làm lại giấy phép xây dựng.","C":"Không, không phải làm lại nếu không có thay đổi nội dung.","D":"Phải làm lại quy hoạch chi tiết 1/500."},"ans":["C"],"exp":"","note":"","multi":false,"id":506,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 29","q":"Theo Luật kinh doanh bất động sản 2023, tổ chức, cá nhân kinh doanh BĐS được phép kinh doanh BĐS ở đâu?","opts":{"A":"Chỉ trong phạm vi tỉnh/thành phố nơi đăng ký kinh doanh.","B":"Trên toàn lãnh thổ Việt Nam.","C":"Chỉ tại các khu đô thị đã được quy hoạch.","D":"Ngoài phạm vi khu vực bảo vệ theo quy định của pháp luật về quốc phòng, an ninh."},"ans":["D"],"exp":"","note":"","multi":false,"id":507,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 30","q":"Trường hợp nào chủ đầu tư dự án BĐS KHÔNG được thu tiền đặt cọc theo Luật kinh doanh bất động sản 2023?","opts":{"A":"Khi nhà ở, công trình xây dựng chưa đủ điều kiện đưa vào kinh doanh.","B":"Khi đã nhận đủ tiền đặt cọc từ 10 khách hàng đầu tiên.","C":"Khi dự án chưa hoàn thành giải phóng mặt bằng","D":"Khi giá trị đặt cọc dưới 1% giá bán."},"ans":["A"],"exp":"","note":"","multi":false,"id":508,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 31","q":"Mục tiêu chính của việc yêu cầu công khai thông tin BĐS, dự án BĐS theo Luật kinh doanh bất động sản 2023 là gì?","opts":{"A":"Giúp cơ quan thuế dễ dàng thu thuế hơn.","B":"Tăng doanh thu cho các công ty môi giới BĐS.","C":"Đảm bảo tính minh bạch thị trường, giảm bất cân xứng thông tin, bảo vệ người tiêu dùng","D":"Hạn chế số lượng dự án BĐS mới được triển khai."},"ans":["C"],"exp":"","note":"","multi":false,"id":509,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 32 · Đề 2A câu 4","q":"Điều kiện \"hoàn thành nghĩa vụ tài chính về đất đai\" đối với BĐS hình thành trong tương lai và quyền sử dụng đất có hạ tầng trước khi đưa vào kinh doanh nhằm mục đích chính là gì?","opts":{"A":"Đảm bảo chủ đầu tư có đủ lợi nhuận từ dự án.","B":"Đơn giản hóa thủ tục cấp Giấy chứng nhận cho người mua sau này.","C":"Đảm bảo Nhà nước thu đủ thuế, phí và quyền sử dụng đất của chủ đầu tư đối với dự án là hợp pháp trước khi bán cho khách hàng.","D":"Khuyến khích chủ đầu tư đẩy nhanh tiến độ xây dựng."},"ans":["C"],"exp":"","note":"","multi":false,"id":510,"fix":false,"sets":{"2A":4}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 33","q":"Tại sao Luật kinh doanh bất động sản 2023 lại mở rộng đáng kể các khu vực cấm \"phân lô, bán nền\"?","opts":{"A":"Để tăng giá đất nền tại các khu vực được phép.","B":"Để khuyến khích người dân mua căn hộ chung cư thay vì đất nền.","C":"Để kiểm soát chặt chẽ hơn sự phát triển đô thị, khuyến khích các dự án đồng bộ, cải thiện quy hoạch và cảnh quan tại các đô thị lớn và vừa.","D":"Để tạo điều kiện cho các chủ đầu tư lớn độc quyền thị trường đất nền."},"ans":["C"],"exp":"","note":"","multi":false,"id":511,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 34","q":"Hệ thống thông tin về nhà ở và thị trường BĐS theo Luật kinh doanh bất động sản 2023 có vai trò chính là gì?","opts":{"A":"Chỉ để lưu trữ hồ sơ dự án của Bộ Xây dựng.","B":"Là nơi duy nhất được phép đăng quảng cáo BĐS.","C":"Là kênh công khai, chính thống các thông tin về doanh nghiệp, dự án, BĐS đưa vào kinh doanh để các bên tra cứu, giám sát.","D":"Là nơi thực hiện các giao dịch BĐS trực tuyến."},"ans":["C"],"exp":"","note":"","multi":false,"id":512,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 35","q":"Việc cá nhân môi giới BĐS phải hoạt động trong một doanh nghiệp dịch vụ BĐS theo Luật kinh doanh bất động sản 2023 nhằm mục đích gì?","opts":{"A":"Giảm số lượng môi giới trên thị trường.","B":"Tăng doanh thu cho các sàn giao dịch BĐS.","C":"Chuyên nghiệp hóa hoạt động môi giới, tăng trách nhiệm giải trình, dễ quản lý và giám sát hơn.","D":"Buộc các môi giới phải chia sẻ hoa hồng với doanh nghiệp."},"ans":["C"],"exp":"","note":"","multi":false,"id":513,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 36","q":"Loại hình công trình xây dựng nào được Luật kinh doanh bất động sản 2023 bổ sung, làm rõ là đối tượng được phép kinh doanh?","opts":{"A":"Chỉ nhà ở và văn phòng.","B":"Bao gồm cả công trình có công năng phục vụ du lịch, lưu trú (như condotel, officetel), giáo dục, y tế, thể thao, văn hóa, thương mại, dịch vụ, công nghiệp, hỗn hợp.","C":"Chỉ các công trình xây dựng có sẵn, không bao gồm hình thành trong tương lai.","D":"Chỉ công trình do Nhà nước đầu tư."},"ans":["B"],"exp":"","note":"","multi":false,"id":514,"fix":false,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 37 · Đề 1A câu 45","q":"Nếu một dự án BĐS đang được thế chấp tại ngân hàng, chủ đầu tư có được phép chuyển nhượng dự án đó không?","opts":{"A":"Không, tuyệt đối cấm chuyển nhượng dự án đang thế chấp.","B":"Có, nhưng phải được ngân hàng nhận thế chấp đồng ý hoặc phải thực hiện giải chấp trước khi chuyển nhượng.","C":"Có, không cần sự đồng ý của ngân hàng.","D":"Chỉ được chuyển nhượng phần dự án không bị thế chấp."},"ans":["B"],"exp":"","note":"","multi":false,"id":515,"fix":false,"sets":{"1A":45}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 38","q":"Sự khác biệt về yêu cầu công chứng, chứng thực hợp đồng mua bán nhà ở giữa giao dịch có doanh nghiệp kinh doanh bất động sản tham gia và giao dịch chỉ giữa các cá nhân là gì theo Luật kinh doanh bất động sản 2023?","opts":{"A":"Mọi hợp đồng đều bắt buộc công chứng/chứng thực.","B":"Giao dịch có doanh nghiệp tham gia thì bắt buộc, giao dịch giữa cá nhân thì không.","C":"Giao dịch giữa các cá nhân với nhau thì bắt buộc công chứng/chứng thực, giao dịch có doanh nghiệp tham gia thì theo yêu cầu của các bên.","D":"Không có sự khác biệt, đều không bắt buộc."},"ans":["C"],"exp":"","note":"Hiệu đính: tài liệu gốc tô B. Luật KDBĐS 2023: hợp đồng giữa các cá nhân phải công chứng/chứng thực; có doanh nghiệp KDBĐS tham gia thì không bắt buộc (xem câu \"trường hợp nào bắt buộc công chứng\" cùng chuyên đề).","multi":false,"id":516,"fix":true,"sets":{}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 39 · Đề 2A câu 45","q":"Việc ghi đúng giá giao dịch thực tế trong hợp đồng nhằm mục đích chính nào sau đây?","opts":{"A":"Giúp người mua dễ dàng so sánh giá.","B":"Chống thất thu thuế và tăng tính minh bạch của dữ liệu thị trường.","C":"Đảm bảo chủ đầu tư không bán phá giá.","D":"Là cơ sở để tính phí môi giới."},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc không đánh dấu rõ; Đề 2A chọn B.","multi":false,"id":517,"fix":true,"sets":{"2A":45}},{"topic":"cd1","src":"Bộ đề CĐ1 câu 40","q":"Nếu hợp đồng kinh doanh BĐS có công chứng/chứng thực, thời điểm có hiệu lực của hợp đồng là khi nào?","opts":{"A":"Thời điểm bên sau cùng ký vào hợp đồng.","B":"Thời điểm các bên thỏa thuận trong hợp đồng.","C":"Thời điểm văn bản công chứng, chứng thực có hiệu lực theo quy định pháp luật về công chứng, chứng thực.
