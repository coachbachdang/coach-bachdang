 Luật Nhà ở 2023, bên mua/thuê mua nhà ở xã hội có sẵn không được bán lại nhà ở trong thời hạn tối thiểu là bao nhiêu năm?","opts":{"A":"1 năm kể từ ngày nhận nhà.","B":"3 năm kể từ ngày ký hợp đồng.","C":"5 năm kể từ ngày thanh toán đủ tiền.","D":"10 năm kể từ ngày cấp Giấy chứng nhận."},"ans":["C"],"exp":"","note":"","multi":false,"id":582,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 25","q":"Trong thời hạn 5 năm hạn chế chuyển nhượng nhà ở xã hội, nếu có nhu cầu bán, bên mua/thuê mua chỉ được bán lại cho ai và với giá nào theo Điều 89 Luật Nhà ở 2023?","opts":{"A":"Bán cho bất kỳ ai theo giá thị trường.","B":"Chỉ bán lại cho chủ đầu tư với giá bằng 70% giá gốc.","C":"Bán lại cho chủ đầu tư hoặc đối tượng thuộc diện được mua NOXH, với giá tối đa bằng giá bán nhà ở xã hội đó trong hợp đồng đã ký.","D":"Chỉ được bán cho cơ quan nhà nước có thẩm quyền."},"ans":["C"],"exp":"","note":"","multi":false,"id":583,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 26","q":"Các hình thức phát triển nhà ở xã hội được quy định trong Luật Nhà ở 2023 bao gồm:","opts":{"A":"Chỉ do Nhà nước đầu tư xây dựng.","B":"Nhà nước đầu tư; Doanh nghiệp, HTX đầu tư; Tổng Liên đoàn Lao động VN đầu tư nhà lưu trú công nhân; Tổ chức kinh tế có vốn đầu tư nước ngoài tham gia đầu tư.","C":"Chỉ do các tổ chức phi lợi nhuận thực hiện.","D":"Chỉ do cá nhân tự xây dựng và đăng ký."},"ans":["B"],"exp":"","note":"","multi":false,"id":584,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 27","q":"Một trong những ưu đãi dành cho chủ đầu tư dự án nhà ở xã hội theo Luật Nhà ở 2023 là:","opts":{"A":"Được phép bán 30% sản phẩm theo giá thương mại.","B":"Được miễn tiền sử dụng đất, tiền thuê đất đối với toàn bộ diện tích đất của dự án.","C":"Được miễn toàn bộ thuế trong suốt quá trình hoạt động.","D":"Không phải xin phép xây dựng."},"ans":["B"],"exp":"","note":"","multi":false,"id":585,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 28","q":"Theo Điều 76 Luật Nhà ở 2023, đối tượng nào được bổ sung vào danh sách hưởng chính sách hỗ trợ về nhà ở xã hội so với luật cũ?","opts":{"A":"Người cao tuổi neo đơn.","B":"Doanh nghiệp, hợp tác xã, liên hiệp hợp tác xã trong khu công nghiệp (mua, thuê nhà lưu trú công nhân).","C":"Sinh viên tốt nghiệp loại giỏi.","D":"Hộ gia đình có 3 thế hệ cùng chung sống."},"ans":["B"],"exp":"","note":"","multi":false,"id":586,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 29","q":"Điều kiện về nhà ở để được mua, thuê, thuê mua nhà ở xã hội theo Điều 77 Luật Nhà ở 2023 là gì?","opts":{"A":"Phải đang ở nhà cấp 4 tạm bợ.","B":"Chưa có nhà ở thuộc sở hữu của mình tại tỉnh/thành phố nơi có dự án nhà ở xã hội.","C":"Có nhà ở nhưng diện tích dưới 20 m²/người.","D":"Đã bán nhà duy nhất để lấy tiền mua nhà ở xã hội."},"ans":["B"],"exp":"","note":"","multi":false,"id":587,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 30","q":"Theo Luật Nhà ở 2023, nhà chung cư nào bắt buộc phải có đơn vị quản lý vận hành?","opts":{"A":"Nhà chung cư từ 10 tầng trở lên.","B":"Nhà chung cư có thang máy.","C":"Tất cả các nhà chung cư, kể cả nhà chỉ có 2 tầng.","D":"Chỉ nhà chung cư thuộc sở hữu nhà nước."},"ans":["B"],"exp":"","note":"","multi":false,"id":588,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 31","q":"Ai có trách nhiệm quản lý, sử dụng kinh phí bảo trì phần sở hữu chung sau khi Ban quản trị nhà chung cư được thành lập theo Luật Nhà ở 2023?","opts":{"A":"Chủ đầu tư tiếp tục quản lý.","B":"Ban quản trị quản lý thông qua tài khoản riêng và sử dụng theo kế hoạch được Hội nghị nhà chung cư thông qua.","C":"Đơn vị quản lý vận hành được toàn quyền sử dụng.","D":"UBND cấp xã nơi có nhà chung cư."},"ans":["B"],"exp":"","note":"","multi":false,"id":589,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 32","q":"Trường hợp nào sau đây nhà chung cư thuộc diện phải phá dỡ để cải tạo, xây dựng lại theo Chương V Luật Nhà ở 2023?","opts":{"A":"Nhà chung cư xuống cấp nhẹ, cần sơn sửa lại.","B":"Nhà chung cư hết niên hạn sử dụng theo thiết kế và có kết luận kiểm định không còn an toàn.","C":"Nhà chung cư có tỷ lệ trống trên 50%.","D":"Nhà chung cư được xây dựng trước năm 2000."},"ans":["B"],"exp":"","note":"","multi":false,"id":590,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 33","q":"Luật Nhà ở 2023 quy định về tiêu chuẩn diện tích căn hộ nhà ở thương mại như thế nào?","opts":{"A":"Quy định diện tích tối thiểu 45m², tối đa 150m².","B":"Đối với căn hộ chung cư thì phải thiết kế, xây dựng khép kín, có diện tích sàn căn hộ không thấp hơn diện tích theo quy chuẩn kỹ thuật quốc gia về nhà chung cư.","C":"Chỉ quy định diện tích tối thiểu 25m².","D":"Giao UBND cấp tỉnh tự quy định."},"ans":["B"],"exp":"","note":"","multi":false,"id":591,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 34 · Đề 1A câu 1","q":"Theo Luật Nhà ở 2023, việc phân biệt giữa \"nhà ở có sẵn\" và \"nhà ở hình thành trong tương lai\" có ý nghĩa pháp lý quan trọng như thế nào đối với hoạt động Kinh doanh bất động sản?","opts":{"A":"Chỉ ảnh hưởng đến việc cấp Giấy chứng nhận.","B":"Chi phối việc áp dụng các điều kiện bán, cho thuê mua khác nhau theo Luật kinh doanh bất động sản 2023 (ví dụ: điều kiện móng, bảo lãnh ngân hàng, lịch thanh toán).","C":"Chỉ liên quan đến thủ tục nghiệm thu công trình.","D":"Chỉ quyết định loại thuế áp dụng khi giao dịch."},"ans":["B"],"exp":"","note":"","multi":false,"id":592,"fix":false,"sets":{"1A":1}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 35","q":"Ngoài việc được phép nhập cảnh vào Việt Nam, cá nhân nước ngoài muốn mua nhà ở thương mại trong dự án cần đáp ứng thêm điều kiện nào theo quy định tại Nghị định 95/2024/NĐ-CP?","opts":{"A":"Phải có tài khoản ngân hàng tại Việt Nam.","B":"Phải cam kết không thuộc diện hưởng ưu đãi, miễn trừ ngoại giao, lãnh sự.","C":"Phải chứng minh có thu nhập ổn định tại Việt Nam.","D":"Phải có người Việt Nam bảo lãnh."},"ans":["B"],"exp":"","note":"","multi":false,"id":593,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 36","q":"Giới hạn sở hữu nhà ở riêng lẻ của tổ chức, cá nhân nước ngoài trong một dự án đầu tư xây dựng nhà ở được xác định như thế nào theo Nghị định 95/2024/NĐ-CP?","opts":{"A":"Không quá 50 căn trên toàn quốc.","B":"Tối đa 10% tổng số nhà ở riêng lẻ của dự án.","C":"Tùy thuộc quy mô dự án và quy định cụ thể (ví dụ: không quá 250 căn trên một đơn vị hành chính cấp phường).","D":"Không bị giới hạn số lượng, chỉ giới hạn về thời hạn."},"ans":["C"],"exp":"","note":"","multi":false,"id":594,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 37","q":"Việc xác định một dự án nhà ở thương mại có nằm trong khu vực hạn chế sở hữu đối với người nước ngoài vì lý do quốc phòng, an ninh thường phụ thuộc vào yếu tố nào ngoài quy định chung tại Nghị định 95/2024/NĐ-CP?","opts":{"A":"Ý kiến của đa số cư dân trong dự án.","B":"Quyết định của chủ đầu tư dự án.","C":"Các bản đồ quy hoạch chi tiết và văn bản xác định cụ thể của chính quyền cấp tỉnh.","D":"Giá bán của các căn hộ trong dự án."},"ans":["C"],"exp":"","note":"","multi":false,"id":595,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 38","q":"Trong trường hợp trưng mua, trưng dụng nhà ở vì lý do quốc phòng, an ninh, lợi ích quốc gia, Nhà nước có nghĩa vụ gì đối với chủ sở hữu theo Luật Nhà ở 2023?","opts":{"A":"Chỉ thông báo trước 30 ngày.","B":"Bồi thường theo giá thị trường tại thời điểm trưng mua/trưng dụng.","C":"Phải tuân thủ quy định về bồi thường, hỗ trợ, tái định cư.","D":"Không có nghĩa vụ bồi thường nếu vì lý do quốc phòng, an ninh."},"ans":["C"],"exp":"","note":"","multi":false,"id":596,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 39 · Đề 1A câu 13","q":"Theo Luật kinh doanh bất động sản 2023, ngoài điều kiện về đăng ký kinh doanh, doanh nghiệp kinh doanh BĐS phải đáp ứng điều kiện nào về năng lực tài chính?","opts":{"A":"Có lợi nhuận sau thuế dương trong 3 năm liên tiếp.","B":"Có vốn chủ sở hữu tối thiểu theo quy định (ví dụ: không thấp hơn 20% tổng vốn đầu tư đối với dự án quy mô dưới 20ha) và đảm bảo tỷ lệ dư nợ tín dụng/trái phiếu.","C":"Có tổng tài sản trên 1000 tỷ đồng.","D":"Được xếp hạng tín nhiệm AAA."},"ans":["B"],"exp":"","note":"","multi":false,"id":597,"fix":false,"sets":{"1A":13}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 40","q":"Yêu cầu về bảo lãnh ngân hàng khi bán, cho thuê mua nhà ở hình thành trong tương lai theo Luật kinh doanh bất động sản 2023 có thể ảnh hưởng tiêu cực đến chủ đầu tư như thế nào?","opts":{"A":"Tăng uy tín của chủ đầu tư trên thị trường.","B":"Tạo thêm gánh nặng chi phí (phí bảo lãnh) và thủ tục hành chính, có thể ảnh hưởng lợi nhuận hoặc giá bán.","C":"Giúp chủ đầu tư huy động vốn dễ dàng hơn.","D":"Giảm thiểu rủi ro pháp lý cho chủ đầu tư."},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc tô C. Câu hỏi về ảnh hưởng tiêu cực, đáp án là gánh nặng chi phí bảo lãnh và thủ tục.","multi":false,"id":598,"fix":true,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 41","q":"Nghĩa vụ công khai thông tin của chủ đầu tư, doanh nghiệp kinh doanh BĐS theo Điều 6 Luật kinh doanh bất động sản 2023 bao gồm những kênh nào?","opts":{"A":"Chỉ trên báo giấy địa phương.","B":"Chỉ tại trụ sở dự án.","C":"Trên hệ thống thông tin về nhà ở và thị trường BĐS, trang thông tin điện tử của doanh nghiệp và tại trụ sở dự án.","D":"Chỉ thông qua các sàn giao dịch bất động sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":599,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 42","q":"Hợp đồng mua bán, thuê mua nhà ở hình thành trong tương lai có bắt buộc phải tuân thủ hợp đồng mẫu không?","opts":{"A":"Không bắt buộc, các bên tự thỏa thuận.","B":"Chỉ bắt buộc đối với dự án Nhà ở xã hội.","C":"Có, phải tuân thủ hợp đồng mẫu do Chính phủ quy định (ví dụ: Phụ lục I Nghị định 96/2024/NĐ-CP).","D":"Chỉ bắt buộc nếu giá trị hợp đồng trên 5 tỷ đồng."},"ans":["C"],"exp":"","note":"","multi":false,"id":600,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 43","q":"Việc xác định tình trạng \"chưa có nhà ở thuộc sở hữu của mình\" để xét duyệt mua nhà ở xã hội (NOXH) theo Nghị định 100/2024/NĐ-CP dựa trên căn cứ nào?","opts":{"A":"Lời cam đoan của người nộp đơn.","B":"Xác nhận của tổ trưởng dân phố.","C":"Việc người đứng đơn và vợ/chồng (nếu có) không có tên trên Giấy chứng nhận nhà ở, đất ở nào tại tỉnh/thành phố đó.","D":"Kết quả kiểm tra trên hệ thống đăng ký kinh doanh."},"ans":["C"],"exp":"","note":"","multi":false,"id":601,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 44","q":"Đơn vị quản lý vận hành (ĐVQLVH) nhà chung cư phải đáp ứng điều kiện năng lực nào theo quy định?","opts":{"A":"Chỉ cần có đăng ký kinh doanh dịch vụ quản lý nhà.","B":"Phải có chức năng và đủ điều kiện năng lực (bộ máy chuyên môn, nghiệp vụ, được cơ quan có thẩm quyền xác nhận).","C":"Phải là doanh nghiệp có vốn nhà nước.","D":"Phải có kinh nghiệm quản lý ít nhất 5 tòa nhà."},"ans":["B"],"exp":"","note":"","multi":false,"id":602,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 45","q":"Giá dịch vụ quản lý vận hành nhà chung cư sau khi có Ban quản trị được quyết định như thế nào?","opts":{"A":"Do chủ đầu tư quyết định cố định.","B":"Do UBND cấp tỉnh ấn định hàng năm","C":"Do Hội nghị nhà chung cư quyết định trên cơ sở thỏa thuận với Đơn vị quản lý vận hành.","D":"Do Đơn vị quản lý vận hành tự đưa ra và thu của cư dân."},"ans":["C"],"exp":"","note":"","multi":false,"id":603,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 46","q":"Theo Điều 57 Luật Nhà ở 2023, cá nhân xây dựng \"chung cư mini\" để bán, cho thuê mua phải đáp ứng điều kiện gì?","opts":{"A":"Chỉ cần có Giấy chứng nhận quyền sử dụng đất ở.","B":"Phải đáp ứng các điều kiện của một chủ đầu tư dự án đầu tư xây dựng nhà ở và tuân thủ quy định pháp luật liên quan.","C":"Chỉ cần tuân thủ quy định về PCCC.","D":"Phải thành lập doanh nghiệp hoặc hợp tác xã."},"ans":["B"],"exp":"","note":"","multi":false,"id":604,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 47","q":"Cá nhân xây dựng \"chung cư mini\" có từ 02 tầng và quy mô dưới 20 căn hộ để cho thuê phải đáp ứng yêu cầu tối thiểu nào về PCCC và hạ tầng theo Điều 57 Luật Nhà ở 2023?","opts":{"A":"Không yêu cầu gì đặc biệt.","B":"Phải đáp ứng yêu cầu về PCCC theo quy định đối với nhà ở nhiều tầng nhiều căn hộ và đảm bảo đường giao thông cho xe chữa cháy tiếp cận.","C":"Chỉ cần trang bị bình chữa cháy mini cho mỗi căn hộ.","D":"Phải có hệ thống báo cháy tự động như nhà chung cư lớn."},"ans":["B"],"exp":"","note":"","multi":false,"id":605,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 48","q":"Việc quản lý vận hành nhà ở nhiều tầng nhiều căn hộ của cá nhân (\"chung cư mini\") phải tuân thủ theo quy định nào?","opts":{"A":"Do chủ nhà tự đặt ra quy định riêng.","B":"Theo thỏa thuận dân sự giữa chủ nhà và người thuê.","C":"Theo Quy chế quản lý, sử dụng nhà chung cư do Bộ Xây dựng ban hành (hiện hành là Thông tư 05/2024/TT-BXD).","D":"Theo quy định quản lý nhà trọ của địa phương."},"ans":["C"],"exp":"","note":"","multi":false,"id":606,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 49","q":"Xu hướng chính của khung pháp lý mới về nhà ở và Kinh doanh bất động sản (Luật Nhà ở 2023, Luật Kinh doanh BĐS 2023) là gì?","opts":{"A":"Nới lỏng các điều kiện kinh doanh để thúc đẩy thị trường.","B":"Tăng cường sự quản lý của nhà nước, nâng cao tính minh bạch và bảo vệ quyền lợi người mua nhà.","C":"Tập trung chủ yếu vào phát triển nhà ở thương mại cao cấp.","D":"Giảm bớt các quy định về nhà ở xã hội."},"ans":["B"],"exp":"","note":"","multi":false,"id":607,"fix":false,"sets":{}},{"topic":"cd2","src":"Bộ đề CĐ2 câu 50","q":"Thách thức lớn nhất trong việc thực thi chính sách cải tạo, xây dựng lại nhà chung cư cũ, kể cả với cơ chế \"quy gom\", là gì?","opts":{"A":"Thiếu nguồn vốn đầu tư từ ngân hàng","B":"Khó khăn trong việc thiết kế kiến trúc mới.","C":"Đạt được sự đồng thuận của các chủ sở hữu về phương án bồi thường, tái định cư; lựa chọn được nhà đầu tư đủ năng lực và thiện chí.","D":"Thiếu các quy chuẩn, tiêu chuẩn xây dựng cho nhà tái định cư."},"ans":["C"],"exp":"","note":"","multi":false,"id":608,"fix":false,"sets":{}},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào quy định việc cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu nhà ở và tài sản khác gắn liền với đất?","opts":{"A":"Ủy ban nhân dân cấp huyện","B":"Ủy ban nhân dân cấp tỉnh","C":"Sở Tài nguyên và Môi trường","D":"Bộ Tài nguyên và Môi trường"},"ans":["D"],"exp":"Câu hỏi này hỏi về cơ quan ban hành quy định (quy định chi tiết về mẫu GCN, hồ sơ, thủ tục), không phải cơ quan ký cấp GCN. Bộ Tài nguyên và Môi trường là cơ quan chịu trách nhiệm trước Chính phủ trong việc ban hành các thông tư, quy định chi tiết về việc này. Căn cứ pháp lý: Khoản 1, Điều 181, Luật Đất đai 2024.","note":"","multi":false,"id":52,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Đối với các địa phương đã thành lập văn phòng đăng ký đất đai thì cơ quan nào có thẩm quyền cấp giấy chứng nhận quyền sử dụng đất ở cho tổ chức, cơ sở tôn giáo ?","opts":{"A":"Ủy ban nhân dân cấp tỉnh.","B":"Sở Tài nguyên và Môi trường","C":"Ủy ban nhân dân cấp huyện.","D":"Văn phòng đăng ký đất đai."},"ans":["A"],"exp":"Thẩm quyền cấp GCN (ký tên, đóng dấu) được phân định rõ. UBND cấp tỉnh cấp GCN cho tổ chức, cơ sở tôn giáo, tổ chức kinh tế có vốn đầu tư nước ngoài. UBND cấp huyện cấp cho hộ gia đình, cá nhân. Căn cứ pháp lý: Điểm a, Khoản 1, Điều 136, Luật Đất đai 2024.","note":"","multi":false,"id":53,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Điều kiện để tổ chức, hộ gia đình, cá nhân tham gia đấu giá quyền sử dụng đất?","opts":{"A":"Đã được cơ quan nhà nước có thẩm quyền quyết định giá khởi điểm để đấu giá quyền sử dụng đất","B":"Đã có quy hoạch chi tiết 1/500 được cơ quan có thẩm quyền phê duyệt đối với đất thực hiện dự án đầu tư xây dựng nhà ở.","C":"Phải nộp tiền đặt trước bằng 20% tổng giá trị thửa đất, khu đất tính theo giá khởi điểm để đấu giá quyền sử dụng đất","D":"Việc đấu giá quyền sử dụng đất thực hiện đối với từng thửa đất"},"ans":["C"],"exp":"Các phương án A, B, D là điều kiện đối với khu đất hoặc tổ chức cuộc đấu giá. Phương án C là điều kiện đối với người tham gia đấu giá. Theo Luật Đấu giá tài sản, người tham gia phải nộp một khoản tiền đặt trước (tối đa 20% giá khởi điểm). Đây là nghĩa vụ tài chính bắt buộc để đảm bảo tư cách tham gia. Căn cứ pháp lý: Khoản 2, Điều 39, Luật Đấu giá tài sản 2016 (quy định khoản tiền đặt trước từ 5% đến 20% giá khởi điểm).","note":"","multi":false,"id":54,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Chuyển quyền sử dụng đất được anh chị hiểu như nào theo quy định của Luật đất đai?","opts":{"A":"Là việc chuyển giao quyền sử dụng đất từ người này sang người khác thông qua các hình thức chuyển đổi, chuyển nhượng, thừa kế, tặng cho quyền sử dụng đất và góp vốn bằng quyền sử dụng đất.","B":"Là việc Nhà nước trả lại giá trị quyền sử dụng đất đối với diện tích đất thu hồi cho người sử dụng đất.","C":"Là tập hợp các dữ liệu đất đai được sắp xếp, tổ chức để truy cập, khai thác, quản lý và cập nhật thông qua phương tiện điện tử.","D":"Là việc Nhà nước trợ giúp cho người có đất thu hồi để ổn định đời sống, sản xuất và phát triển."},"ans":["A"],"exp":"Đây là định nghĩa pháp lý chính xác và đầy đủ nhất về \"chuyển quyền sử dụng đất\". B là \"Bồi thường về đất\". C là \"Hệ thống thông tin đất đai\". D là \"Hỗ trợ khi Nhà nước thu hồi đất\". Căn cứ pháp lý: Khoản 16, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":55,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"“Việc phân chia quy hoạch sử dụng đất theo thời gian để thực hiện trong kỳ quy hoạch sử dụng đất” là định nghĩa cho cụm từ ngữ nào?","opts":{"A":"Nhà nước giao quyền sử dụng đất.","B":"Bản đồ hiện trạng sử dụng đất","C":"Kế hoạch sử dụng đất.","D":"Quy hoạch sử dụng đất."},"ans":["C"],"exp":"\"Quy hoạch\" (Planning) là tầm nhìn dài hạn (10 năm). \"Kế hoạch\" (Plan) là việc chia nhỏ quy hoạch đó ra để thực hiện theo từng giai đoạn (ví dụ: kế hoạch 5 năm, kế hoạch hàng năm). Căn cứ pháp lý: Khoản 23, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":56,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Thế nào là bản đồ quy hoạch sử dụng đất?","opts":{"A":"Là bản đồ thể hiện sự phân bố các loại đất tại một thời điểm xác định, được lập theo từng đơn vị hành chính.","B":"Là bản đồ được lập tại thời điểm đầu kỳ quy hoạch, thể hiện sự phân bổ các loại đất tại thời điểm cuối kỳ của quy hoạch đó.","C":"Là bản đồ thể hiện các thửa đất và các yếu tố địa lý có liên quan, lập theo đơn vị hành chính xã, phường, thị trấn, được cơ quan nhà nước có thẩm quyền xác nhận.","D":"Là việc phân chia quy hoạch sử dụng đất theo thời gian để thực hiện trong kỳ quy hoạch sử dụng đất."},"ans":["B"],"exp":"Đây là bản đồ thể hiện tầm nhìn tương lai (phân bổ đất ở cuối kỳ) dựa trên quyết định quy hoạch, khác với bản đồ hiện trạng (thể hiện thực tế tại một thời điểm). A là \"Bản đồ hiện trạng sử dụng đất\". C là \"Bản đồ địa chính\". Căn cứ pháp lý: Khoản 26, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":57,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Việc Nhà nước trả lại giá trị quyền sử dụng đất đối với diện tích đất thu hồi cho người sử dụng đất được gọi là gì?","opts":{"A":"Bồi thường về đất.","B":"Nhà nước thu hồi đất.","C":"Nhà nước giao quyền sử dụng đất.","D":"Hỗ trợ khi Nhà nước thu hồi đất."},"ans":["A"],"exp":"Đây là định nghĩa chính xác của \"bồi thường về đất\". Cần phân biệt rõ với \"hỗ trợ\" (phương án D), là khoản trợ giúp thêm ngoài bồi thường. Căn cứ pháp lý: Khoản 14, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":58,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Đăng ký đất đai, nhà ở, tài sản khác gắn liền với đất được hiểu như thế nào?","opts":{"A":"Là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu nhà ở, tài sản khác gắn liền với đất hợp pháp của người có quyền sử dụng đất, quyền sở hữu nhà ở và quyền sở hữu tài sản khác gắn liền với đất.","B":"Là việc Nhà nước quyết định trao quyền sử dụng đất cho đối tượng có nhu cầu sử dụng đất thông qua hợp đồng cho thuê quyền sử dụng đất.","C":"Là việc kê khai và ghi nhận tình trạng pháp lý về quyền sử dụng đất, quyền sở hữu nhà ở, tài sản khác gắn liền với đất và quyền quản lý đất đối với một thửa đất vào hồ sơ địa chính.","D":"Là việc Nhà nước ban hành quyết định giao đất để trao quyền sử dụng đất cho đối tượng có nhu cầu sử dụng đất"},"ans":["C"],"exp":"Đây là định nghĩa chính xác của \"đăng ký\". A là định nghĩa \"Giấy chứng nhận\". B là \"Nhà nước cho thuê đất\". D là \"Nhà nước giao đất\". Căn cứ pháp lý: Khoản 13, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":59,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"“Việc kê khai và ghi nhận tình trạng pháp lý về quyền sử dụng đất, quyền sở hữu nhà ở, tài sản khác gắn liền với đất và quyền quản lý đất đối với một thửa đất vào hồ sơ địa chính” thể hiện cho hoạt động nào?","opts":{"A":"Đăng ký đất đai, nhà ở, tài sản khác gắn liền với đất.","B":"Giấy chứng nhận quyền sử dụng đất, quyền sở hữu nhà ở và tài sản khác gắn liền với đất.","C":"Giá trị quyền sử dụng đất.","D":"Chuyển quyền sử dụng đất."},"ans":["A"],"exp":"Đây là câu hỏi ngược lại của Câu 8, hỏi về tên hoạt động dựa trên định nghĩa. Căn cứ pháp lý: Khoản 13, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":60,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Giấy chứng nhận quyền sử dụng đất, quyền sở hữu nhà ở và tài sản khác gắn liền với đất là gì?","opts":{"A":"Là việc Nhà nước quyết định trao quyền sử dụng đất cho đối tượng có nhu cầu sử dụng đất thông qua hợp đồng cho thuê quyền sử dụng đất.","B":"Là việc Nhà nước ban hành quyết định giao đất để trao quyền sử dụng đất cho đối tượng có nhu cầu sử dụng đất","C":"Là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu nhà ở, tài sản khác gắn liền với đất hợp pháp của người có quyền sử dụng đất, quyền sở hữu nhà ở và quyền sở hữu tài sản khác gắn liền với đất.","D":"Là việc kê khai và ghi nhận tình trạng pháp lý về quyền sử dụng đất, quyền sở hữu nhà ở, tài sản khác gắn liền với đất và quyền quản lý đất đối với một thửa đất vào hồ sơ địa chính."},"ans":["C"],"exp":"Đây là định nghĩa chính xác về GCN (sổ hồng/sổ đỏ). D là \"Đăng ký đất đai\". Căn cứ pháp lý: Khoản 21, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":61,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Như thế nào được gọi là giá đất?","opts":{"A":"Giá đất là giá trị của quyền sử dụng đất tính trên một đơn vị diện tích đất.","B":"Giá đất là giá trị bằng tiền của quyền sử dụng đất đối với một diện tích đất xác định trong thời hạn sử dụng đất xác định.","C":"Giá đất là số tiền mà người sử dụng đất phải trả cho Nhà nước khi được Nhà nước giao đất có thu tiền sử dụng đất, cho phép chuyển mục đích sử dụng đất, công nhận quyền sử dụng đất.","D":"Giá đất là giá trị quyền sử dụng đất được Nhà nước trả lại đối với diện tích đất thu hồi cho người sử dụng đất."},"ans":["A"],"exp":"\"Giá đất\" (Land price) được tính bằng tiền/m². B là \"Giá trị quyền sử dụng đất\" (Value of LUR), là tổng giá trị của cả khu đất trong một thời hạn. C là \"Tiền sử dụng đất\" (Land use levy). Căn cứ pháp lý: Khoản 18, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":62,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"“Giá trị của quyền sử dụng đất tính trên một đơn vị diện tích đất” là cách hiểu cho cụm từ ngữ nào?","opts":{"A":"Giá đất.","B":"Tiền sử dụng đất.","C":"Giá trị quyền sử dụng đất.","D":"Hệ thống thông tin đất đai"},"ans":["A"],"exp":"Đây là câu hỏi ngược của Câu 11. Căn cứ pháp lý: Khoản 18, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":63,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"“Việc Nhà nước trả lại giá trị quyền sử dụng đất đối với diện tích đất thu hồi cho người sử dụng đất” là định nghĩa giải thích cho cụm từ ngữ nào?","opts":{"A":"Giá đất.","B":"Hỗ trợ khi Nhà nước thu hồi đất.","C":"Giá trị quyền sử dụng đất.","D":"Bồi thường về đất"},"ans":["D"],"exp":"Đây là câu hỏi lặp lại nội dung của Câu 7. Căn cứ pháp lý: Khoản 14, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":64,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Giá trị quyền sử dụng đất được hiểu như thế nào?","opts":{"A":"Là giá trị của quyền sử dụng đất tính trên một đơn vị diện tích đất.","B":"Là giá trị bằng tiền của quyền sử dụng đất đối với một diện tích đất xác định trong thời hạn sử dụng đất xác định.","C":"Là số tiền mà người sử dụng đất phải trả cho Nhà nước khi được Nhà nước giao đất có thu tiền sử dụng đất, cho phép chuyển mục đích sử dụng đất, công nhận quyền sử dụng đất.","D":"Là việc Nhà nước trợ giúp cho người có đất thu hồi để ổn định đời sống, sản xuất và phát triển."},"ans":["B"],"exp":"Đây là định nghĩa về \"Giá trị QSDĐ\", là tổng giá trị của cả khu đất, khác với \"giá đất\" (tính trên 1m²). Căn cứ pháp lý: Khoản 19, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":65,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"“Giá trị bằng tiền của quyền sử dụng đất đối với một diện tích đất xác định trong thời hạn sử dụng đất xác định” là định nghĩa giải thích cho cụm từ ngữ nào?","opts":{"A":"Giá đất.","B":"Hỗ trợ khi Nhà nước thu hồi đất.","C":"Giá trị quyền sử dụng đất.","D":"Bồi thường về đất"},"ans":["C"],"exp":"Đây là câu hỏi ngược của Câu 14. Căn cứ pháp lý: Khoản 19, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":66,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Nhà nước trao quyền sử dụng đất cho người sử dụng đất thông qua các hình thức nào sau đây?","opts":{"A":"Quyết định giao đất không thu tiền sử dụng đất, giao đất có thu tiền sử dụng đất","B":"Quyết định chính sách thu, chi tài chính về đất đai.","C":"Trợ giúp cho người có đất thu hồi để ổn định đời sống, sản xuất và phát triển.","D":"Đấu giá quyền sử dụng đất thực hiện đối với từng thửa đất"},"ans":["A"],"exp":"Nhà nước trao QSDĐ thông qua 3 hình thức chính: Giao đất (có thu tiền và không thu tiền), Cho thuê đất (trả tiền 1 lần và trả hằng năm), và Công nhận QSDĐ. Phương án A nêu 2 hình thức con của \"Giao đất\", là một phần đúng của các hình thức trao quyền. Các phương án B, C, D không phải là hình thức trao quyền sử dụng đất. Căn cứ pháp lý: Khoản 15, 20, 22, Điều 3, Luật Đất đai 2024.","note":"","multi":false,"id":67,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào ban hành luật, nghị quyết về đất đai?","opts":{"A":"Chính phủ","B":"Quốc hội","C":"UBND cấp tỉnh","D":"Bộ Tài nguyên và Môi trường"},"ans":["B"],"exp":"Theo Hiến pháp, chỉ Quốc hội mới có thẩm quyền ban hành Luật và Nghị quyết (văn bản quy phạm pháp luật cao nhất). Chính phủ ban hành Nghị định. Các Bộ (như Bộ TNMT) ban hành Thông tư. UBND ban hành Quyết định. Căn cứ pháp lý: Điều 23, Luật Đất đai 2024.","note":"","multi":false,"id":68,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan quản lý nhà nước về đất đai ở trung ương?","opts":{"A":"Chính phủ","B":"Bộ Tài nguyên và Môi trường","C":"Ủy Ban nhân dân cấp tỉnh","D":"Sở Tài nguyên và Môi trường"},"ans":["B"],"exp":"Chính phủ (A) là cơ quan thống nhất quản lý nhà nước. Nhưng Bộ Tài nguyên và Môi trường là cơ quan chuyên ngành, là cơ quan đầu mối chịu trách nhiệm trước Chính phủ về quản lý nhà nước về đất đai trên cả nước. Căn cứ pháp lý: Khoản 2, Điều 24, Luật Đất đai 2024.","note":"","multi":false,"id":69,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Hệ thống quy hoạch, kế hoạch sử dụng đất ở Việt Nam có bao nhiêu hệ thống?","opts":{"A":"4","B":"5","C":"6","D":"7"},"ans":["A"],"exp":"Luật Đất đai 2024 quy định 4 hệ thống (cấp) quy hoạch: 1. Quy hoạch sử dụng đất quốc gia. 2. Quy hoạch sử dụng đất cấp tỉnh. 3. Quy hoạch sử dụng đất cấp huyện. 4. Quy hoạch sử dụng đất quốc phòng; Quy hoạch sử dụng đất an ninh. (Hai quy hoạch này được lập riêng biệt). Căn cứ pháp lý: Điều 60, Luật Đất đai 2024.","note":"","multi":false,"id":70,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Một kỳ quy hoạch sử dụng đất theo quy định của Pháp luật đất đai được tính trong thời gian bao lâu?","opts":{"A":"5 năm","B":"10 năm","C":"15 năm","D":"20 năm"},"ans":["B"],"exp":"Kỳ quy hoạch sử dụng đất (tầm nhìn) là 10 năm. Kỳ kế hoạch sử dụng đất (thực thi) là 5 năm (Phương án A). Căn cứ pháp lý: Khoản 3, Điều 60, Luật Đất đai 2024.","note":"","multi":false,"id":71,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là căn cứ lập quy hoạch sử dụng đất cấp huyện?","opts":{"A":"Định hướng sử dụng đất 10 năm.","B":"Xác định các khu vực sử dụng đất theo chức năng sử dụng đến từng đơn vị hành chính cấp xã.","C":"Quy hoạch sử dụng đất cấp tỉnh.","D":"Kế hoạch sử dụng đất cấp tỉnh."},"ans":["C"],"exp":"Quy hoạch cấp dưới phải được lập dựa trên quy hoạch cấp trên trực tiếp. Do đó, quy hoạch cấp huyện phải dựa trên quy hoạch cấp tỉnh đã được phê duyệt. Căn cứ pháp lý: Điểm a, Khoản 2, Điều 65, Luật Đất đai 2024.","note":"","multi":false,"id":72,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào quy định chi tiết việc tổ chức thực hiện quy hoạch, kế hoạch sử dụng đất?","opts":{"A":"Chính phủ","B":"Quốc hội","C":"UBND cấp tỉnh","D":"Bộ Tài nguyên và Môi trường"},"ans":["A"],"exp":"Luật (do Quốc hội ban hành) thường giao cho Chính phủ ban hành Nghị định để \"quy định chi tiết\" việc thi hành Luật. Căn cứ pháp lý: Khoản 7, Điều 76, Luật Đất đai 2024.","note":"","multi":false,"id":73,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Nhà nước giao đất có thu tiền sử dụng đất trong các trường hợp nào sau đây?","opts":{"A":"Tổ chức sử dụng đất để xây dựng nhà ở phục vụ tái định cư theo dự án của Nhà nước","B":"Tổ chức kinh tế được giao đất để thực hiện dự án đầu tư xây dựng nhà ở để bán hoặc để bán kết hợp cho thuê","C":"Hộ gia đình, cá nhân sử dụng đất để xây dựng công trình công cộng có mục đích kinh doanh","D":"Tổ chức sự nghiệp công lập chưa tự chủ tài chính sử dụng đất xây dựng công trình sự nghiệp"},"ans":["B"],"exp":"Đây là trường hợp kinh doanh bất động sản điển hình phải nộp tiền sử dụng đất. A (Tái định cư) và D (Sự nghiệp công) là giao đất không thu tiền (Điều 118). C (Công trình công cộng kinh doanh) là hình thức thuê đất (Điều 120). Căn cứ pháp lý: Điểm a, Khoản 1, Điều 119, Luật Đất đai 2024.","note":"","multi":false,"id":74,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Trường hợp nào sau đây không phải đấu giá quyền sử dụng đất khi Nhà nước giao đất, cho thuê đất?","opts":{"A":"Giao đất ở tại đô thị, nông thôn cho hộ gia đình, cá nhân","B":"Đầu tư xây dựng nhà ở để bán hoặc cho thuê hoặc cho thuê mua","C":"Sử dụng đất để thực hiện dự án đầu tư xây dựng nhà ở tái định cư, nhà ở xã hội và nhà ở công vụ","D":"Đầu tư xây dựng kết cấu hạ tầng để chuyển nhượng hoặc cho thuê."},"ans":["C"],"exp":"Đây là các dự án thuộc chính sách ưu đãi, an sinh xã hội của Nhà nước, do đó được giao/cho thuê đất trực tiếp (không qua đấu giá) để đảm bảo tiến độ và mục tiêu chính sách. Các phương án A, B, D là các trường hợp kinh doanh thương mại bắt buộc phải đấu giá. Căn cứ pháp lý: Khoản 2, Điều 124, Luật Đất đai 2024.","note":"","multi":false,"id":75,"sets":{},"fix":false},{"topic":"cd3","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào có trách nhiệm kiểm tra việc thực hiện các chỉ tiêu sử dụng đất trong quy hoạch, kế hoạch sử dụng đất quốc gia, cấp tỉnh và giám sát các địa phương, các bộ, ngành trong việc thực hiện quy hoạch, kế hoạch sử dụng đất?","opts":{"A":"Ủy ban nhân dân cấp tỉnh","B":"Bộ Xây dựng","C":"Bộ Tài nguyên và Môi trường","D":"Bộ Tài chính"},"ans":["C"],"exp":"Là cơ quan đầu mối ở trung ương về quản lý đất đai, Bộ TNMT có trách nhiệm tham mưu cho Chính phủ và trực tiếp thực hiện việc thanh tra, kiểm tra, giám sát việc thực hiện quy hoạch đất đai trên cả nước. Căn cứ pháp lý: Khoản 2, Điều 24, Luật Đất đai 2024.","note":"","multi":false,"id":76,"sets":{},"fix":false},{"topic":"cd3","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 31/2024/QH15- Luật Đất đai, Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất là gì?","opts":{"A":"Là văn bản của cơ quan có thẩm quyền cho phép người sử dụng đất thực hiện các quyền chuyển nhượng, tặng cho.","B":"Là văn bản hành chính do Ủy ban nhân dân cấp tỉnh ban hành để quản lý đất đai.","C":"Là tài liệu ghi nhận sự thỏa thuận về quyền sử dụng đất giữa Nhà nước và người sử dụng đất.","D":"Là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền."},"ans":["D"],"exp":"“Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất...” Căn cứ PL: k21 điều 3 luật đđ 2024","note":"","multi":false,"id":406,"sets":{},"fix":false},{"topic":"cd3","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 31/2024/QH15- Luật Đất đai, theo nguyên tắc cấp Giấy chứng nhận, trường hợp nào Giấy chứng nhận chỉ được cấp sau khi người sử dụng đất, chủ sở hữu tài sản gắn liền với đất hoàn thành nghĩa vụ tài chính?","opts":{"A":"Trường hợp người sử dụng đất thuê đất trả tiền thuê đất hằng năm.","B":"Trường hợp người sử dụng đất được miễn, được ghi nợ nghĩa vụ tài chính.","C":"Trường hợp người sử dụng đất, chủ sở hữu tài sản gắn liền với đất thuộc đối tượng phải thực hiện nghĩa vụ tài chính.","D":"Trường hợp người sử dụng đất tặng cho quyền sử dụng đất cho cộng đồng dân cư."},"ans":["C"],"exp":"Theo đó, giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất chỉ được cấp sau khi người sử dụng đất, chủ sở hữu tài sản gắn liền với đất hoàn thành nghĩa vụ tài chính theo quy định của pháp luật. Trường hợp người sử dụng đất, chủ sở hữu tài sản gắn liền với đất không thuộc đối tượng phải thực hiện nghĩa vụ tài chính hoặc được miễn, được ghi nợ nghĩa vụ tài chính thì giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất được cấp sau khi cơ quan có thẩm quyền xác định không phải thực hiện nghĩa vụ tài chính hoặc được miễn.... Căn cứ PL: khoản 3 điều 135 Luật Đất đai 2024","note":"","multi":false,"id":407,"sets":{},"fix":false},{"topic":"cd3","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 31/2024/QH15- Luật Đất đai, thẩm quyền cấp giấy chứng nhận lần đầu cho tổ chức trong nước thuộc về cơ quan nào?","opts":{"A":"Tổ chức đăng ký đất đai cùng cấp.","B":"Ủy ban nhân dân cấp tỉnh.","C":"Ủy ban nhân dân cấp huyện.","D":"Bộ Tài nguyên và Môi trường."},"ans":["B"],"exp":"Căn cứ PL: Khoản 1 Điều 136 Luật ĐĐ 2024","note":"","multi":false,"id":408,"sets":{},"fix":false},{"topic":"cd3","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 31/2024/QH15- Luật Đất đai, cơ quan nào có thẩm quyền cho thuê đất thuộc quỹ đất nông nghiệp sử dụng vào mục đích công ích của xã, phường, thị trấn?","opts":{"A":"Ủy ban nhân dân cấp huyện.","B":"Cơ quan quản lý đất đai cấp huyện.","C":"Ủy ban nhân dân cấp xã.","D":"Ủy ban nhân dân cấp tỉnh."},"ans":["C"],"exp":"“ Ủy ban nhân dân cấp xã cho thuê đất thuộc quỹ đất nông nghiệp sử dụng vào mục đích công ích của xã, phường, thị trấn” Căn cứ PL: đ 123","note":"","multi":false,"id":409,"sets":{},"fix":false},{"topic":"cd3","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 31/2024/QH15- Luật Đất đai, đối với dự án thuộc danh mục cần thu hồi đất do Thủ tướng Chính phủ chấp thuận chủ trương đầu tư, căn cứ để giao đất, cho thuê đất KHÔNG thông qua đấu giá/đấu thầu là gì?","opts":{"A":"Quyết định chấp thuận chủ trương đầu tư của Thủ tướng Chính phủ.","B":"Văn bản chấp thuận chủ trương đầu tư đồng thời với chấp thuận nhà đầu tư.","C":"Kế hoạch sử dụng đất hằng năm cấp huyện đã được phê duyệt và quyết định/chấp thuận đầu tư.","D":"Quy hoạch chi tiết đã được phê duyệt và quyết định đầu tư công."},"ans":["C"],"exp":"Căn cứ PL: 124","note":"","multi":false,"id":410,"sets":{},"fix":false},{"topic":"cd3","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 31/2024/QH15- Luật Đất đai, định nghĩa \"Tiền sử dụng đất\" là gì?","opts":{"A":"Số tiền mà người sử dụng đất phải trả cho Nhà nước khi được Nhà nước cho thuê đất.","B":"Khoản tiền bồi thường cho Nhà nước khi sử dụng đất không đúng mục đích.","C":"Số tiền mà người sử dụng đất phải trả cho Nhà nước khi được Nhà nước giao đất có thu tiền sử dụng đất hoặc cho phép chuyển mục đích sử dụng đất.","D":"Số tiền mà người sử dụng đất phải trả cho Nhà nước khi được Nhà nước giao đất có thu tiền sử dụng đất, cho phép chuyển mục đích sử dụng đất hoặc các trường hợp sử dụng đất mà phải nộp tiền sử dụng đất theo quy định của pháp luật"},"ans":["D"],"exp":"K44- Điều 3","note":"","multi":false,"id":411,"sets":{},"fix":false},{"topic":"cd3","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 31/2024/QH15- Luật Đất đai, thẩm quyền quyết định giao đất, cho thuê đất đối với người gốc Việt Nam định cư ở nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài thuộc về cơ quan nào?","opts":{"A":"Bộ Tài nguyên và Môi trường.","B":"Ủy ban nhân dân cấp tỉnh.","C":"Ban Quản lý các khu công nghiệp.","D":"Ủy ban nhân dân cấp huyện (sau khi có văn bản chấp thuận của cấp tỉnh)."},"ans":["B"],"exp":"Căn cứ PL: Đ 123","note":"","multi":false,"id":412,"sets":{},"fix":false},{"topic":"cd3","src":"Bộ đề CĐ3 câu 1","q":"Nguyên tắc cốt lõi nào chi phối pháp luật đất đai Việt Nam?","opts":{"A":"Đất đai thuộc sở hữu tư nhân.","B":"Đất gắn liền với đất theo Điều 151 Luật đất đai 2024?","opts":{"A":"Đất nông nghiệp sử dụng vào mục đích công ích của xã, phường, thị trấn.","B":"Đất do tổ chức được Nhà nước giao đất không thu tiền để sử dụng vào mục đích xây dựng công trình sự nghiệp.","C":"Đất ở do cá nhân nhận chuyển nhượng hợp pháp.","D":"Nhà ở thuộc sở hữu của cá nhân đã được cấp phép xây dựng trên đất ở hợp pháp."},"ans":["A"],"exp":"","note":"","multi":false,"id":654,"fix":false,"sets":{}},{"topic":"cd3","src":"Bộ đề CĐ3 câu 47","q":"Việc xây dựng Bảng giá đất hàng năm (thay vì 5 năm) đặt ra thách thức lớn nhất là gì cho các địa phương?","opts":{"A":"Khó khăn trong việc in ấn và phát hành bảng giá mới.","B":"Yêu cầu phải có nguồn lực, cơ sở dữ liệu giá đất thị trường đầy đủ, cập nhật và năng lực định giá tốt hơn.","C":"Gây khó khăn cho người dân trong việc tra cứu.","D":"Làm tăng chi phí hành chính không đáng kể."},"ans":["B"],"exp":"","note":"","multi":false,"id":655,"fix":false,"sets":{}},{"topic":"cd3","src":"Bộ đề CĐ3 câu 48","q":"Vai trò của Hội đồng thẩm định giá đất cụ thể là gì?","opts":{"A":"Trực tiếp đi khảo sát và đưa ra mức giá đất cụ thể.","B":"Quyết định cuối cùng về giá đất cụ thể.","C":"Thẩm định phương án giá đất cụ thể do cơ quan nông nghiệp & môi trường lập hoặc do tổ chức tư vấn định giá thực hiện trước khi trình UBND phê duyệt.","D":"Thu thập thông tin giá đất trên thị trường."},"ans":["C"],"exp":"","note":"","multi":false,"id":656,"fix":false,"sets":{}},{"topic":"cd3","src":"Bộ đề CĐ3 câu 49","q":"Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đất đai là bao lâu?","opts":{"A":"6 tháng.","B":"1 năm.","C":"2 năm.","D":"Không có thời hiệu."},"ans":["C"],"exp":"","note":"","multi":false,"id":657,"fix":false,"sets":{}},{"topic":"cd3","src":"Bộ đề CĐ3 câu 50","q":"Đối với người sử dụng đất là cá nhân, việc nắm rõ quy trình và quyền lợi khi Nhà nước thu hồi đất có ý nghĩa gì?","opts":{"A":"Giúp họ đòi hỏi mức bồi thường cao hơn quy định.","B":"Để chủ động bảo vệ quyền lợi hợp pháp của mình về bồi thường, hỗ trợ, tái định cư và thực hiện đúng các thủ tục khiếu nại nếu cần.","C":"Giúp họ trì hoãn việc bàn giao đất cho Nhà nước.","D":"Để có thể tự thỏa thuận giá bồi thường với chủ đầu tư dự án."},"ans":["B"],"exp":"","note":"","multi":false,"id":658,"fix":false,"sets":{}},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là khái niệm cho cụm từ ngữ “Đầu tư kinh doanh”?","opts":{"A":"Là việc nhà đầu tư bỏ vốn đầu tư để thực hiện hoạt động kinh doanh.","B":"Là dự án đầu tư thực hiện lần đầu hoặc dự án đầu tư độc lập với dự án đầu tư đang hoạt động.","C":"Là tập hợp đề xuất bỏ vốn trung hạn hoặc dài hạn để tiến hành các hoạt động đầu tư kinh doanh trên địa bàn cụ thể, trong khoảng thời gian xác định.","D":"Là tổ chức, cá nhân thực hiện hoạt động đầu tư kinh doanh, gồm nhà đầu tư trong nước, nhà đầu tư nước ngoài và tổ chức kinh tế có vốn đầu tư nước ngoài."},"ans":["A"],"exp":"Đây là định nghĩa chính xác được quy định tại Khoản 5, Điều 3, Luật Đầu tư 2020. Phương án B là định nghĩa về \"Dự án đầu tư mới\". Phương án C là định nghĩa về \"Dự án đầu tư\". Phương án D là định nghĩa về \"Nhà đầu tư\".","note":"","multi":false,"id":77,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Tổ chức, cá nhân kinh doanh bất động sản phải có các điều kiện nào sau đây?","opts":{"A":"Phải thành lập doanh nghiệp theo quy định của pháp luật về doanh nghiệp hoặc hợp tác xã theo quy định của pháp luật về hợp tác xã, có ngành nghề kinh doanh bất động sản.","B":"Phải có vốn pháp định không được thấp hơn 20 tỷ đồng.","C":"Không phải thành lập doanh nghiệp nhưng phải kê khai nộp thuế theo quy định của pháp luật."},"ans":["A"],"exp":"Điều 9, Luật Kinh doanh Bất động sản 2023 quy định rõ điều kiện chung là phải thành lập doanh nghiệp/hợp tác xã có ngành nghề KDBĐS. Phương án B (Vốn pháp định 20 tỷ) là quy định của Luật KDBĐS 2014 cũ, đã bị bãi bỏ. Phương án C chỉ áp dụng cho cá nhân kinh doanh BĐS quy mô nhỏ, không thường xuyên (theo Khoản 3, Điều 9), không phải là điều kiện chung.","note":"","multi":false,"id":78,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Dự án bất động sản là gì?","opts":{"A":"Là việc chủ đầu tư chuyển giao toàn bộ dự án bất động sản và các quyền, nghĩa vụ, lợi ích hợp pháp của chủ đầu tư, các bên có liên quan (nếu có) đối với dự án đó cho bên nhận chuyển nhượng thông qua hợp đồng được lập bằng văn bản theo quy định và được cơ quan Nhà nước có thẩm quyền chấp thuận.","B":"Là dự án đầu tư xây dựng công trình được lập, thẩm định, phê duyệt theo quy định của pháp luật về xây dựng. Dự án bất động sản bao gồm: dự án đầu tư xây dựng nhà và công trình xây dựng; dự án đầu tư xây dựng kết cấu hạ tầng để chuyển nhượng hoặc cho thuê quyền sử dụng đất, theo quy định của pháp luật.","C":"Là việc chủ đầu tư chuyển giao phần dự án bất động sản được phép kinh doanh và các quyền, nghĩa vụ, lợi ích hợp pháp của chủ đầu tư, các bên có liên quan (nếu có) đối với phần dự án chuyển nhượng cho bên nhận chuyển nhượng thông qua hợp đồng được lập bằng văn bản theo quy định và được cơ quan Nhà nước có thẩm quyền chấp thuận.","D":"Là việc bên mua, thuê mua chuyển giao toàn bộ quyền, trách nhiệm và nghĩa vụ theo hợp đồng mua bán, thuê mua nhà, công trình xây dựng cho tổ chức, cá nhân khác thông qua văn bản chuyển nhượng hợp đồng được lập theo quy định."},"ans":["B"],"exp":"Đây là định nghĩa chính xác và đầy đủ tại Khoản 4, Điều 3, Luật Kinh doanh Bất động sản 2023. Phương án A và C định nghĩa về \"Chuyển nhượng dự án\". Phương án D định nghĩa về \"Chuyển nhượng hợp đồng\".","note":"","multi":false,"id":79,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào quy định các loại hợp đồng mẫu kinh doanh bất động sản?","opts":{"A":"Chính phủ","B":"Bộ Xây dựng","C":"UBND cấp tỉnh","D":"Sở Xây dựng."},"ans":["A"],"exp":"Khoản 5, Điều 46, Luật Kinh doanh Bất động sản 2023 quy định: \"Chính phủ quy định chi tiết... các loại hợp đồng mẫu kinh doanh bất động sản.\"","note":"","multi":false,"id":80,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng chuyển nhượng một phần hoặc toàn bộ dự án bất động sản là mẫu hợp đồng nào?","opts":{"A":"Hợp đồng kinh doanh dịch vụ môi giới bất động sản.","B":"Hợp đồng kinh doanh bất động sản.","C":"Hợp đồng thi công xây dựng công trình.","D":"Hợp đồng thiết kế xây dựng."},"ans":["B"],"exp":"\"Kinh doanh bất động sản\" là việc đầu tư vốn để thực hiện hoạt động xây dựng, mua, nhận chuyển nhượng để bán, chuyển nhượng... (Khoản 1, Điều 3). Chuyển nhượng dự án là một hình thức KDBĐS. Điều 46, Luật KDBĐS 2023 phân biệt rõ giữa \"Hợp đồng kinh doanh bất động sản\" (Khoản 2) và \"Hợp đồng kinh doanh dịch vụ bất động sản\" (Khoản 3, như môi giới, tư vấn).","note":"","multi":false,"id":81,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào chủ trì, phối hợp với các cơ quan liên quan nghiên cứu, ban hành theo thẩm quyền hoặc trình cấp có thẩm quyền ban hành các văn bản quy phạm pháp luật về kinh doanh bất động sản?","opts":{"A":"Chính Phủ","B":"Bộ Xây dựng","C":"UBND cấp tỉnh","D":"Sở Xây dựng"},"ans":["B"],"exp":"Khoản 1, Điều 74, Luật Kinh doanh Bất động sản 2023 quy định rõ trách nhiệm của Bộ Xây dựng là \"Chủ trì, phối hợp với các cơ quan liên quan... ban hành theo thẩm quyền hoặc trình cấp có thẩm quyền ban hành các văn bản quy phạm pháp luật về kinh doanh bất động sản.\"","note":"","multi":false,"id":82,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Trước khi bán, cho thuê mua nhà ở hình thành trong tương lai thì chủ đầu tư dự án bất động sản phải có điệu kiện nào sau đây?","opts":{"A":"Phải có hợp đồng mua bán nhà","B":"Phải được ngân hàng thương mại có đủ năng lực thực hiện bảo lãnh nghĩa vụ tài chính.","C":"Phải công khai trên trang thông tin điện tử của doanh nghiệp.","D":"Phải thành lập doanh nghiệp theo quy định của pháp luật về doanh nghiệp."},"ans":["B"],"exp":"Đây là một trong những điều kiện bắt buộc và quan trọng nhất để bảo vệ người mua nhà, được quy định tại Khoản 2, Điều 24 (đối với công trình) và cụ thể hóa tại Khoản 1, Điều 26 (đối với nhà ở) của Luật Kinh doanh Bất động sản 2023. Nếu CĐT không bàn giao nhà, ngân hàng sẽ hoàn tiền cho người mua.","note":"","multi":false,"id":83,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Anh chị hiểu như nào là dự án đầu tư?","opts":{"A":"Là tập hợp đề xuất bỏ vốn trung hạn hoặc dài hạn để tiến hành các hoạt động đầu tư kinh doanh trên địa bàn cụ thể, trong khoảng thời gian xác định.","B":"Là dự án đầu tư phát triển dự án đầu tư đang hoạt động bằng cách mở rộng quy mô, nâng cao công suất, đổi mới công nghệ, giảm ô nhiễm hoặc cải thiện môi trường.","C":"Là việc nhà đầu tư bỏ vốn đầu tư để thực hiện hoạt động kinh doanh.","D":"Là dự án đầu tư thực hiện lần đầu hoặc dự án đầu tư độc lập với dự án đầu tư đang hoạt động."},"ans":["A"],"exp":"Đây là định nghĩa pháp lý chính xác về \"Dự án đầu tư\" tại Khoản 4, Điều 3, Luật Đầu tư 2020.","note":"","multi":false,"id":84,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Đối với dự án đầu tư thuộc diện chấp thuận chủ trương đầu tư, việc chấp thuận chủ trương đầu tư phải được thực hiện khi nào?","opts":{"A":"Thực hiện trước khi nhà đầu tư thực hiện dự án đầu tư.","B":"Thực hiện trước khi nhà đầu tư khởi công xây dựng.","C":"Thực hiện khi đã thiện xong phần móng.","D":"Thực hiện khi đã bàn giao công trình."},"ans":["A"],"exp":"\"Chấp thuận chủ trương đầu tư\" là thủ tục pháp lý đầu tiên để \"khai sinh\" dự án. Cơ quan nhà nước xem xét sự phù hợp của dự án với quy hoạch, kế hoạch... trước khi cho phép nhà đầu tư tiến hành các bước tiếp theo (như xin giao đất, lập quy hoạch 1/500...).","note":"","multi":false,"id":85,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào thống nhất quản lý nhà nước về đầu tư tại Việt Nam và đầu tư từ Việt Nam ra nước ngoài?","opts":{"A":"Quốc hội","B":"Chính phủ","C":"Bộ Xây dựng","D":"Bộ Kế hoạch và Đầu tư"},"ans":["B"],"exp":"Khoản 1, Điều 69, Luật Đầu tư 2020 quy định: \"Chính phủ thống nhất quản lý nhà nước về đầu tư...\". (Lưu ý: Bộ Kế hoạch và Đầu tư là cơ quan đầu mối giúp Chính phủ, nhưng Chính phủ mới là cơ quan thống nhất quản lý).","note":"","multi":false,"id":86,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là điều kiện làm chủ đầu tư dự án xây dựng nhà ở thương mại?","opts":{"A":"Đã đấu giá quyền sử dụng đất theo quy định của pháp luật về đất đai.","B":"Có vốn ký quỹ hoặc bảo lãnh ngân hàng về nghĩa vụ ký quỹ để thực hiện đối với từng dự án theo quy định của pháp luật về đầu tư.","C":"Không có chức năng kinh doanh bất động sản theo quy định của pháp luật.","D":"Đã đấu thầu dự án có sử dụng đất."},"ans":["B"],"exp":"Câu hỏi này đề cập đến một trong các nghĩa vụ pháp lý mà chủ đầu tư phải thực hiện. Theo Điều 43, Luật Đầu tư 2020, nhà đầu tư (chủ đầu tư) phải thực hiện biện pháp \"bảo đảm thực hiện dự án\" (thường là ký quỹ) đối với các dự án được Nhà nước giao đất, cho thuê đất. A và D là các hình thức lựa chọn chủ đầu tư, không phải điều kiện của CĐT. C là sai. Lưu ý: Điều kiện để làm CĐT (theo Luật Nhà ở 2023) còn bao gồm vốn chủ sở hữu (15-20%) và kinh nghiệm. Tuy nhiên, trong các lựa chọn đưa ra, B là một nghĩa vụ tài chính bắt buộc CĐT phải tuân thủ để thực hiện dự án.","note":"","multi":false,"id":87,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"“Việc nhà đầu tư bỏ vốn đầu tư để thực hiện hoạt động kinh doanh” là định nghĩa cho cụm từ ngữ nào?","opts":{"A":"Đầu tư kinh doanh","B":"Dự án đầu tư mới","C":"Dự án đầu tư mở rộng","D":"Dự án đầu tư"},"ans":["A"],"exp":"Đây là định nghĩa tại Khoản 5, Điều 3, Luật Đầu tư 2020 (lặp lại nội dung Câu 1).","note":"","multi":false,"id":88,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là Hợp đồng kinh doanh dịch vụ bất động sản?","opts":{"A":"Hợp đồng mua bán nhà, công trình xây dựng","B":"Hợp đồng dịch vụ môi giới bất động sản","C":"Hợp đồng chuyển nhượng, cho thuê, cho thuê lại quyền sử dụng đất","D":"Hợp đồng thuê mua nhà, công trình xây dựng"},"ans":["B"],"exp":"Khoản 3, Điều 46, Luật Kinh doanh Bất động sản 2023 phân loại rõ \"Hợp đồng kinh doanh dịch vụ bất động sản\" bao gồm: hợp đồng môi giới, tư vấn, quản lý... Các phương án A, C, D thuộc loại \"Hợp đồng kinh doanh bất động sản\" (Khoản 2, Điều 46).","note":"","multi":false,"id":89,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Đối với dự án đầu tư được chấp thuận chủ trương đầu tư, nhà đầu tư không được điều chỉnh tiến độ thực hiện dự án đầu tư không quá bao nhiêu tháng so với tiến độ thực hiện dự án đầu tư quy định tại văn bản chấp thuận chủ trương đầu tư lần đầu?","opts":{"A":"22 tháng","B":"23 tháng","C":"24 tháng","D":"25 tháng"},"ans":["C"],"exp":"Khoản 4, Điều 41, Luật Đầu tư 2020 quy định: \"Tổng thời gian điều chỉnh tiến độ thực hiện dự án đầu tư... không quá 24 tháng so với tiến độ thực hiện dự án đầu tư quy định tại văn bản chấp thuận chủ trương đầu tư lần đầu...\" (trừ các trường hợp bất khả kháng).","note":"","multi":false,"id":90,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Thời điểm có hiệu lực của hợp đồng kinh doanh bất động sản?","opts":{"A":"Khi có quyết định của cơ quan quản lý nhà nước","B":"Do các bên thỏa thuận và ghi trong hợp đồng","C":"Khi công chứng, chứng thực hợp đồng C. Khi các bên ký kết hợp đồng."},"ans":["B"],"exp":"Khoản 1, Điều 45, Luật Kinh doanh Bất động sản 2023 quy định rất rõ: \"Thời điểm có hiệu lực của hợp đồng... do các bên thỏa thuận và được ghi trong hợp đồng.\" Nếu không có thỏa thuận thì thời điểm có hiệu lực mới là thời điểm ký kết.","note":"","multi":false,"id":91,"sets":{},"fix":false},{"topic":"cd4","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu không phải là hợp đồng kinh doanh bất động sản?","opts":{"A":"Hợp đồng mua bán nhà, công trình xây dựng.","B":"Hợp đồng thuê mua nhà, công trình xây dựng.","C":"Hợp đồng dịch vụ tư vấn bất động sản.","D":"Hợp đồng chuyển nhượng cho thuê, cho thuê lại quyền sử dụng đất."},"ans":["C"],"exp":"Tương tự Câu 13, Luật KDBĐS 2023 phân biệt rõ: \"Kinh doanh bất động sản\" (mua/bán/chuyển nhượng/cho thuê) (Phương án A, B, D). \"Kinh doanh dịch vụ bất động sản\" (môi giới, tư vấn, quản lý) (Phương án C). Do đó, hợp đồng dịch vụ tư vấn không phải là hợp đồng kinh doanh bất động sản.","note":"","multi":false,"id":92,"sets":{},"fix":false},{"topic":"cd4","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, dự án bất động sản là dự án đầu tư xây dựng công trình để kinh doanh những loại tài sản nào sau đây?","opts":{"A":"Nhà ở, công trình xây dựng, máy móc thiết bị có giá trị cao.","B":"Nhà ở, công trình xây dựng, tài sản công trình gắn liền với đất.","C":"Nhà ở, công trình xây dựng, quyền sử dụng đất đã có hạ tầng kỹ thuật.","D":"Nhà ở, công trình xây dựng, khu đất chưa có hạ tầng kỹ thuật."},"ans":["C"],"exp":"“Dự án bất động sản là dự án đầu tư xây dựng công trình để kinh doanh nhà ở, công trình xây dựng, quyền sử dụng đất đã có hạ tầng kỹ thuật được cơ quan Nhà nước có thẩm quyền chấp thuận theo quy định của pháp luật, bao gồm: dự án đầu tư xây dựng nhà ở...” Căn cứ PL: điều 3","note":"","multi":false,"id":413,"sets":{},"fix":false},{"topic":"cd4","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, một dự án bất động sản phải đáp ứng yêu cầu nào về quy hoạch?","opts":{"A":"Phải phù hợp với quy hoạch chi tiết 1/500 đã được phê duyệt.","B":"Phải phù hợp với quy hoạch, kế hoạch sử dụng đất và quy hoạch được phê duyệt theo quy định của pháp luật về xây dựng, pháp luật về quy hoạch đô thị.","C":"Phải phù hợp với quy hoạch tỉnh và quy hoạch chung của khu vực.","D":"Chỉ cần phù hợp với quy hoạch sử dụng đất cấp huyện."},"ans":["B"],"exp":"Điều 11. Yêu cầu đối với dự án bất động sản","note":"","multi":false,"id":414,"sets":{},"fix":false},{"topic":"cd4","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, đối với dự án đầu tư xây dựng nhà ở, ngoài việc đáp ứng các yêu cầu chung của dự án bất động sản quy định tại Khoản 1 đến Khoản 5 Điều 11 Luật Kinh doanh Bất động sản 2023, còn phải đáp ứng thêm yêu cầu nào?","opts":{"A":"Phải có văn bản xác nhận hoàn thành 100% nghĩa vụ tài chính về đất đai của dự án.","B":"Phải được Bộ Xây dựng phê duyệt thiết kế cơ sở và thiết kế kỹ thuật.","C":"Phải đáp ứng các yêu cầu theo quy định của pháp luật về nhà ở.","D":"Phải có văn bản bảo lãnh của ngân hàng thương mại cho toàn bộ căn nhà ở được hình thành."},"ans":["C"],"exp":"Căn cứ PL: Khoản 6 Điều 11","note":"","multi":false,"id":415,"sets":{},"fix":false},{"topic":"cd4","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, trường hợp một nhà đầu tư đang thực hiện dự án đầu tư xây dựng nhà ở để kinh doanh. Ngoài việc tuân thủ các quy định chung về quy hoạch, tiến độ, thiết kế và giấy phép xây dựng, nhà đầu tư phải đặc biệt chú ý đến yêu cầu pháp lý nào sau đây, bởi nó có thể làm vô hiệu toàn bộ giao dịch mua bán nhà ở nếu vi phạm?","opts":{"A":"Dự án phải hoàn thành nghĩa vụ tài chính về đất đai trước khi ký hợp đồng chuyển nhượng cho thuê mua nhà ở.","B":"Dự án phải phù hợp với quy hoạch đô thị đã được phê duyệt và được Bộ Xây dựng kiểm tra chất lượng công trình.","C":"Trình tự, thủ tục đầu tư xây dựng dự án phải thực hiện theo pháp luật về quy hoạch, đầu tư, đất đai, xây dựng và pháp luật có liên quan.","D":"Ngoài việc đáp ứng các yêu cầu chung, dự án còn phải đáp ứng các yêu cầu theo quy định của pháp luật về nhà ở."},"ans":["D"],"exp":"Căn cứ PL: Điều 11","note":"","multi":false,"id":416,"sets":{},"fix":false},{"topic":"cd4","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, dự án đầu tư xây dựng kết cấu hạ tầng khu công nghệ cao được phân loại vào nhóm nào trong định nghĩa Dự án bất động sản?","opts":{"A":"Dự án xây dựng khu dân cư nông thôn.","B":"Dự án xây dựng nhà ở.","C":"Dự án đầu tư xây dựng kết cấu hạ tầng.","D":"Dự án công trình hỗn hợp."},"ans":["C"],"exp":"Căn cứ PL: K3 Điều 3","note":"","multi":false,"id":417,"sets":{},"fix":false},{"topic":"cd4","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, dự án bất động sản phải được đầu tư xây dựng trong thời hạn nào?","opts":{"A":"Trong thời hạn 05 năm kể từ ngày được giao đất.","B":"Trong thời hạn do chủ đầu tư tự xác định và cam kết.","C":"Trong thời hạn thực hiện dự án đầu tư được cơ quan nhà nước có thẩm quyền chấp thuận.","D":"Trong thời hạn tối đa 02 năm kể từ ngày khởi công"},"ans":["C"],"exp":"Căn cứ PL: K5 Điều 11","note":"","multi":false,"id":418,"sets":{},"fix":false},{"topic":"cd4","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 29/2023/QH15- Luật kinh doanh bất động sản, ngoài quy hoạch, kế hoạch sử dụng đất, dự án bất động sản còn phải phù hợp với quy hoạch nào?","opts":{"A":"Quy hoạch tài nguyên nước.","B":"Quy hoạch giao thông.","C":"Quy hoạch được phê duyệt theo pháp luật về xây dựng, pháp luật về quy hoạch đô thị.","D":"Quy hoạch du lịch, dịch vụ."},"ans":["C"],"exp":"Căn cứ PL: K2 Điều 11","note":"","multi":false,"id":419,"sets":{},"fix":false},{"topic":"cd4","src":"Bộ đề CĐ4 câu 1","q":"Nguyên tắc nào KHÔNG phải là nguyên tắc cơ bản của hoạt động Kinh doanh bất động sản theo Luật kinh doanh bất động sản 2023?","opts":{"A":"Công khai, minh bạch thông tin về bất động sản.","B":"Tự do thỏa thuận trên cơ sở tôn trọng pháp luật.","C":"Ưu tiên lợi nhuận tối đa cho chủ đầu tư.","D":"Tuân thủ điều kiện kinh doanh đối với bất động sản và dự án."},"ans":["C"],"exp":"","note":"","multi":false,"id":659,"fix":false,"sets":{}},{"topic":"
