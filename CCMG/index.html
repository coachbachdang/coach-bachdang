sử dụng phổ biến nhất trong thẩm định giá bất động sản?","opts":{"A":"Giá trị thanh lý","B":"Giá trị bảo hiểm","C":"Giá trị thị trường","D":"Giá trị tài sản bắt buộc phải bán"},"ans":["C"],"exp":"Giá trị thị trường là cơ sở giá trị quan trọng nhất và thường được sử dụng trong hầu hết các cuộc thẩm định giá bất động sản phục vụ giao dịch thông thường.","note":"","multi":false,"id":349,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 19 · Đề 1A câu 30","q":"Bước nào sau đây thường KHÔNG nằm trong quy trình thẩm định giá BĐS chuyên nghiệp?","opts":{"A":"Xác định nhiệm vụ định giá và cơ sở giá trị.","B":"Khảo sát hiện trường và thu thập thông tin.","C":"Quyết định giá bán cuối cùng cho khách hàng.","D":"Lựa chọn phương pháp và ước tính giá trị BĐS."},"ans":["C"],"exp":"Nhiệm vụ của thẩm định viên là ước tính giá trị (thường là giá trị thị trường), không phải là quyết định giá bán. Việc quyết định giá bán thuộc về người bán. Quy trình thẩm định giá bao gồm các bước từ xác định nhiệm vụ đến lập báo cáo.","note":"","multi":false,"id":350,"sets":{"1A":30},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 20","q":"Phương pháp chi phí thường được ưu tiên sử dụng cho loại bất động sản nào?","opts":{"A":"Bất động sản tạo thu nhập ổn định (văn phòng cho thuê).","B":"Đất trống có tiềm năng phát triển dự án.","C":"Bất động sản công cộng, chuyên dùng, ít có giao dịch (trường học, bệnh viện).","D":"Căn hộ chung cư trong dự án mới mở bán."},"ans":["C"],"exp":"Phương pháp chi phí thường phù hợp với các BĐS ít có giao dịch tương tự trên thị trường, các BĐS chuyên dùng hoặc công cộng như trường học, bệnh viện, thư viện.","note":"","multi":false,"id":351,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 21","q":"\"Giảm giá tích lũy\" trong phương pháp chi phí bao gồm những loại nào?","opts":{"A":"Chỉ hao mòn vật lý.","B":"Chỉ lỗi thời chức năng.","C":"Hao mòn vật lý, lỗi thời chức năng và lỗi thời kinh tế (bên ngoài).","D":"Chỉ lỗi thời kinh tế (bên ngoài)."},"ans":["C"],"exp":"Giảm giá tích lũy bao gồm sự mất mát giá trị do hao mòn vật lý (do sử dụng, xuống cấp tự nhiên), lỗi thời chức năng (do thiết kế, công nghệ lạc hậu) và lỗi thời kinh tế/bên ngoài (do tác động từ môi trường xung quanh).","note":"","multi":false,"id":352,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 22","q":"Theo Luật Đất đai 2024, thông tin về giá đất ghi trong hợp đồng chuyển nhượng được sử dụng làm căn cứ định giá đất phải được hình thành trong thời gian tối đa bao lâu tính đến thời điểm định giá?","opts":{"A":"6 tháng","B":"12 tháng","C":"24 tháng","D":"36 tháng"},"ans":["C"],"exp":"Khoản 4 Điều 158 Luật Đất đai 2024 quy định thông tin giá đất trong hợp đồng chuyển nhượng hoặc giá trúng đấu giá được sử dụng làm thông tin đầu vào phải được hình thành trong thời gian không quá 24 tháng tính đến thời điểm định giá.","note":"","multi":false,"id":353,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 23","q":"Để được cấp Giấy chứng nhận đủ điều kiện kinh doanh dịch vụ thẩm định giá, doanh nghiệp phải có tối thiểu bao nhiêu thẩm định viên về giá đăng ký hành nghề tại trụ sở chính?","opts":{"A":"1 người","B":"3 người","C":"5 người","D":"7 người"},"ans":["C"],"exp":"Điểm a Khoản 1 Điều 49 Luật Giá 2023 quy định doanh nghiệp phải có ít nhất 05 người có thẻ thẩm định viên về giá đủ điều kiện đăng ký hành nghề thẩm định giá tại doanh nghiệp.","note":"","multi":false,"id":354,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 24","q":"Mục đích chính của việc xác định \"Giá đất cụ thể\" là gì?","opts":{"A":"Làm cơ sở tính thuế sử dụng đất hàng năm cho mọi đối tượng.","B":"Phản ánh giá trị thị trường tại thời điểm cho các giao dịch/quyết định quan trọng (bồi thường, đấu giá, giao đất cho tổ chức...).","C":"Công bố công khai để người dân tham khảo khi giao dịch.","D":"Làm căn cứ tính phí trước bạ."},"ans":["B"],"exp":"Giá đất cụ thể được xác định cho từng trường hợp nhằm phản ánh đúng giá trị thị trường tại thời điểm, phục vụ các mục đích quan trọng như tính tiền sử dụng đất/thuê đất trả 1 lần cho tổ chức, bồi thường, giá khởi điểm đấu giá...","note":"","multi":false,"id":355,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 25","q":"Khi áp dụng phương pháp thặng dư, \"lợi nhuận của nhà đầu tư\" được tính vào đâu?","opts":{"A":"Tổng doanh thu phát triển","B":"Tổng chi phí phát triển","C":"Giá trị còn lại của đất (V)","D":"Chi phí tài chính"},"ans":["B"],"exp":"Lợi nhuận của nhà đầu tư là một cấu phần của Tổng chi phí phát triển (CP) và được trừ khỏi Tổng doanh thu phát triển (DT) để xác định giá trị còn lại của đất. Theo điểm e Khoản 2 Điều 6 Nghị định 71/2024/NĐ-CP (hướng dẫn Luật Đất đai 2024) và điểm e Khoản 2 Điều 9 Chuẩn mực Thẩm định giá Bất động sản (TT42/2024).","note":"","multi":false,"id":356,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 26","q":"Bước đầu tiên trong quy trình định giá đất bằng phương pháp so sánh theo Nghị định 71/2024/NĐ-CP là gì?","opts":{"A":"Lựa chọn các thửa đất so sánh.","B":"Điều chỉnh giá các thửa đất so sánh.","C":"Khảo sát, thu thập thông tin về thửa đất cần định giá và các thửa đất dự kiến so sánh.","D":"Ước tính giá trị thửa đất cần định giá."},"ans":["C"],"exp":"Khoản 3 Điều 4 Nghị định 71/2024/NĐ-CP quy định bước 1 là khảo sát, thu thập thông tin về đặc điểm pháp lý, kinh tế - kỹ thuật của thửa đất cần định giá và các thửa đất dự kiến dùng để so sánh.","note":"","multi":false,"id":357,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 27 · Đề 2A câu 32","q":"Cá nhân có Thẻ thẩm định viên về giá thì có cần Giấy chứng nhận hoàn thành khóa đào tạo nghiệp vụ về giá đất để hành nghề tư vấn xác định giá đất không?","opts":{"A":"Có, bắt buộc phải có cả hai.","B":"Không, chỉ cần Thẻ thẩm định viên về giá là đủ.","C":"Chỉ cần khi tư vấn cho dự án lớn.","D":"Tùy thuộc vào yêu cầu của từng tỉnh."},"ans":["B"],"exp":"Khoản 2 Điều 4 Thông tư 61/2022/TT-BTC (quy định về tư vấn xác định giá đất) nêu rõ trường hợp cá nhân đã được cấp Thẻ thẩm định viên về giá thì không cần đáp ứng điều kiện về Giấy chứng nhận đào tạo nghiệp vụ về giá đất. Điều này cũng được kế thừa trong mô tả về điều kiện hành nghề tư vấn xác định giá đất. Lưu ý: Văn bản gốc đề cập đến điều kiện hành nghề tư vấn xác định giá đất nói chung, có thể tham chiếu đến quy định cũ hơn, nhưng logic miễn trừ cho người có thẻ TĐV là phổ biến.","note":"","multi":false,"id":358,"sets":{"2A":32},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 28","q":"Trong các cách tiếp cận thẩm định giá BĐS theo Chuẩn mực Việt Nam, cách tiếp cận nào KHÔNG được liệt kê?","opts":{"A":"Cách tiếp cận từ thị trường","B":"Cách tiếp cận từ chi phí","C":"Cách tiếp cận từ thu nhập","D":"Cách tiếp cận từ lợi nhuận kỳ vọng"},"ans":["D"],"exp":"Chuẩn mực thẩm định giá Việt Nam (ví dụ Thông tư 32/2024/TT-BTC) quy định 3 cách tiếp cận chính là từ thị trường, từ chi phí và từ thu nhập.","note":"","multi":false,"id":359,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 29","q":"Việc lập \"Báo cáo kết quả thẩm định giá\" và phát hành \"Chứng thư thẩm định giá\" là bước nào trong quy trình thẩm định giá?","opts":{"A":"Bước đầu tiên","B":"Bước khảo sát hiện trường","C":"Bước phân tích thông tin","D":"Bước cuối cùng"},"ans":["D"],"exp":"Lập báo cáo và chứng thư thẩm định giá là bước cuối cùng, tổng kết toàn bộ quá trình và kết quả thẩm định giá để trình bày cho khách hàng.","note":"","multi":false,"id":360,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 30","q":"Nguyên tắc nào nhấn mạnh rằng giá trị BĐS được hình thành bởi sự kỳ vọng về những lợi ích trong tương lai?","opts":{"A":"Nguyên tắc Thay đổi","B":"Nguyên tắc Phù hợp","C":"Nguyên tắc Dự báo (Lường trước)","D":"Nguyên tắc Cạnh tranh"},"ans":["C"],"exp":"Nguyên tắc dự báo (Anticipation) cho rằng giá trị hiện tại của BĐS phản ánh lợi ích dự kiến mà nó sẽ mang lại trong tương lai.","note":"","multi":false,"id":361,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 31","q":"Phương pháp định giá đất nào phù hợp nhất để xác định giá đất nông nghiệp dựa trên thu nhập ổn định hàng năm?","opts":{"A":"Phương pháp so sánh","B":"Phương pháp thu nhập","C":"Phương pháp thặng dư","D":"Phương pháp hệ số điều chỉnh"},"ans":["B"],"exp":"Phương pháp thu nhập xác định giá trị dựa trên khả năng tạo thu nhập ròng ổn định, phù hợp với các loại đất có thể tạo ra dòng tiền đều đặn như đất nông nghiệp hoặc đất cho thuê thương mại.","note":"","multi":false,"id":362,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 33","q":"Hành vi nào sau đây bị nghiêm cấm trong lĩnh vực thẩm định giá theo Luật Giá 2023?","opts":{"A":"Thu thập thông tin thị trường để thẩm định giá.","B":"Áp dụng nhiều phương pháp thẩm định giá.","C":"Cạnh tranh không lành mạnh về giá dịch vụ thẩm định giá.","D":"Báo cáo kết quả thẩm định giá cho khách hàng."},"ans":["C"],"exp":"Điều 7 Luật Giá 2023 liệt kê các hành vi bị nghiêm cấm, trong đó có hành vi cạnh tranh không lành mạnh (như thông đồng, ép buộc, bán phá giá dịch vụ...). Lưu ý: Tài liệu chỉ đề cập chung là Luật quy định hành vi bị cấm, cần suy luận dựa trên các quy định chung về cạnh tranh.","note":"","multi":false,"id":363,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 34","q":"Khi định giá đất bằng phương pháp so sánh, việc điều chỉnh giá của thửa đất so sánh được thực hiện như thế nào nếu thửa đất so sánh tốt hơn thửa đất cần định giá về một yếu tố nào đó?","opts":{"A":"Cộng thêm một khoản tiền vào giá thửa đất so sánh.","B":"Trừ đi một khoản tiền khỏi giá thửa đất so sánh.","C":"Giữ nguyên giá thửa đất so sánh.","D":"Nhân giá thửa đất so sánh với một hệ số lớn hơn 1."},"ans":["B"],"exp":"Quy tắc điều chỉnh chung là lấy BĐS cần định giá làm chuẩn. Nếu BĐS so sánh tốt hơn (ví dụ: vị trí đẹp hơn), thì giá của nó phải được điều chỉnh giảm xuống để tương đương với BĐS cần định giá.","note":"","multi":false,"id":364,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 35","q":"Tổ chức nào chịu trách nhiệm chính trong việc ban hành hệ thống Chuẩn mực thẩm định giá Việt Nam?","opts":{"A":"Chính phủ","B":"Bộ Tài nguyên và Môi trường","C":"Bộ Xây dựng","D":"Bộ Tài chính"},"ans":["D"],"exp":"Bộ Tài chính là cơ quan nhà nước chịu trách nhiệm ban hành các Chuẩn mực thẩm định giá Việt Nam theo quy định của Luật Giá.","note":"","multi":false,"id":365,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 36","q":"Theo Luật Kinh doanh BĐS 2023, cá nhân hành nghề tư vấn bất động sản cần đáp ứng yêu cầu gì?","opts":{"A":"Phải có Thẻ thẩm định viên về giá.","B":"Phải có Chứng chỉ hành nghề môi giới BĐS.","C":"Phải có bằng cấp, chứng chỉ về lĩnh vực mình trực tiếp tư vấn.","D":"Không yêu cầu bằng cấp, chỉ cần kinh nghiệm."},"ans":["C"],"exp":"Khoản 2 Điều 61 Luật kinh doanh bất động sản 2023 quy định nội dung tư vấn phải phù hợp với nội dung kinh doanh và người thực hiện phải có bằng cấp, chứng chỉ về lĩnh vực trực tiếp tư vấn.","note":"","multi":false,"id":366,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 37 · Đề 2A câu 1","q":"Mục đích của việc phân tích \"sử dụng cao nhất và hiệu quả nhất\" trong thẩm định giá BĐS là gì?","opts":{"A":"Xác định chi phí xây dựng tối thiểu.","B":"Tìm ra phương án sử dụng mang lại giá trị cao nhất cho BĐS trong điều kiện cho phép.","C":"Đánh giá tuổi thọ còn lại của công trình.","D":"Xác định giá trị thanh lý của BĐS."},"ans":["B"],"exp":"Phân tích sử dụng cao nhất và hiệu quả nhất nhằm xác định phương án sử dụng hợp pháp, khả thi về kỹ thuật, tài chính và mang lại giá trị lớn nhất cho bất động sản, làm cơ sở cho việc ước tính giá trị thị trường.","note":"","multi":false,"id":367,"sets":{"2A":1},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 38","q":"Theo quy định tại Luật Đất đai 2024, phương thức xây dựng Bảng giá đất chi tiết đến từng thửa đất (dự kiến áp dụng từ 01/01/2026) sẽ dựa trên việc xác định các yếu tố nào?","opts":{"A":"Giá giao dịch thành công gần nhất của chính thửa đất đó.","B":"Giá đất trung bình của toàn tỉnh/thành phố.","C":"Vùng giá trị và các thửa đất chuẩn đại diện trong vùng.","D":"Đơn giá bồi thường do Nhà nước quy định."},"ans":["C"],"exp":"Khoản 3 Điều 159 Luật Đất đai 2024 quy định đối với khu vực có bản đồ địa chính số và cơ sở dữ liệu giá đất, Bảng giá đất đến từng thửa đất được xây dựng trên cơ sở vùng giá trị và thửa đất chuẩn.","note":"","multi":false,"id":368,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 39 · Đề 1A câu 35","q":"Thông tin nào sau đây KHÔNG được Luật Đất đai 2024 (Điều 158) liệt kê là căn cứ trực tiếp để định giá đất?","opts":{"A":"Mục đích sử dụng đất được giao, cho thuê, công nhận.","B":"Thời hạn sử dụng đất còn lại.","C":"Giá đất trong Bảng giá đất do UBND cấp tỉnh ban hành.","D":"Giá đất thị trường trúng đấu giá quyền sử dụng đất."},"ans":["C"],"exp":"Điều 158 Luật Đất đai 2024 quy định các căn cứ định giá đất bao gồm mục đích sử dụng, thời hạn sử dụng, thông tin đầu vào (giá CSDL, giá hợp đồng, giá đấu giá, giá khảo sát, thông tin thu nhập/chi phí) và các yếu tố khác ảnh hưởng. Bảng giá đất là một cơ chế xác định giá đất riêng (theo Điều 159), không phải là căn cứ trực tiếp để xác định giá đất cụ thể theo Điều 158 (trừ trường hợp dùng Bảng giá đất để áp dụng phương pháp hệ số điều chỉnh).","note":"","multi":false,"id":369,"sets":{"1A":35},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 40","q":"Nguyên tắc đạo đức \"Năng lực chuyên môn và Tính thận trọng\" đòi hỏi thẩm định viên về giá phải làm gì?","opts":{"A":"Luôn đưa ra mức giá trị cao nhất có thể.","B":"Chỉ nhận thực hiện công việc thuộc lĩnh vực mình có chuyên môn và kinh nghiệm.","C":"Duy trì kiến thức, kỹ năng chuyên môn cần thiết và hành động cẩn trọng, tuân thủ chuẩn mực.","D":"Bảo mật tuyệt đối mọi thông tin của khách hàng."},"ans":["C"],"exp":"Theo Chuẩn mực thẩm định giá Việt Nam về Quy tắc đạo đức nghề nghiệp (Thông tư 30/2024/TT-BTC), nguyên tắc này yêu cầu thẩm định viên phải duy trì năng lực chuyên môn thông qua học hỏi liên tục và thực hiện công việc một cách cẩn trọng, kỹ lưỡng, tuân thủ các chuẩn mực kỹ thuật và nghề nghiệp liên quan.","note":"","multi":false,"id":370,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 41","q":"Theo Luật Giá 2023, danh sách thẩm định viên về giá đủ điều kiện hành nghề được cơ quan nào thông báo công khai?","opts":{"A":"Doanh nghiệp thẩm định giá nơi thẩm định viên làm việc.","B":"Sở Tài chính cấp tỉnh.","C":"Bộ Tài chính.","D":"Hội Thẩm định giá Việt Nam."},"ans":["C"],"exp":"Điều 46 Luật Giá 2023 quy định Bộ Tài chính là cơ quan thông báo công khai danh sách thẩm định viên về giá đủ điều kiện hành nghề (hàng năm và điều chỉnh hàng tháng nếu có).","note":"","multi":false,"id":371,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 42 · Đề 1A câu 43","q":"Khi áp dụng phương pháp so sánh, tại sao các giao dịch giữa người thân trong gia đình hoặc bán tài sản trong tình trạng khẩn cấp thường không được coi là bằng chứng thị trường đáng tin cậy để xác định giá trị thị trường?","opts":{"A":"Vì giá trị giao dịch thường thấp hơn giá thị trường.","B":"Vì thông tin về các giao dịch này khó thu thập.","C":"Vì các bên tham gia có thể không hành động hoàn toàn khách quan, tự nguyện hoặc không có đủ thời gian tiếp thị.","D":"Vì pháp luật cấm sử dụng các giao dịch này."},"ans":["C"],"exp":"Giá trị thị trường đòi hỏi giao dịch diễn ra giữa các bên tự nguyện, không bị ép buộc, có đủ thông tin và thời gian tiếp thị. Giao dịch gia đình hoặc bán gấp thường thiếu các yếu tố này (có thể có nhượng bộ về giá, thiếu tự nguyện, thiếu thời gian tiếp thị), do đó giá cả hình thành có thể không phản ánh đúng giá trị thị trường khách quan.","note":"","multi":false,"id":372,"sets":{"1A":43},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 43","q":"Trường hợp nào sau đây bắt buộc phải sử dụng \"Giá đất cụ thể\" thay vì \"Bảng giá đất\" theo Luật Đất đai 2024?","opts":{"A":"Tính tiền thuê đất trả tiền hàng năm đối với hộ gia đình.","B":"Tính thuế sử dụng đất nông nghiệp.","C":"Tính tiền sử dụng đất khi Nhà nước giao đất có thu tiền sử dụng đất cho tổ chức kinh tế (không qua đấu giá).","D":"Tính lệ phí trước bạ nhà đất."},"ans":["C"],"exp":"Khoản 1 Điều 160 Luật Đất đai 2024 quy định các trường hợp áp dụng Giá đất cụ thể, bao gồm tính tiền sử dụng đất khi Nhà nước giao đất, cho phép chuyển mục đích, công nhận quyền sử dụng đất đối với tổ chức. Các trường hợp còn lại thường áp dụng Bảng giá đất.","note":"","multi":false,"id":373,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 44 · Đề 1A câu 18","q":"Khái niệm \"Giá cả\" (Price) khác với \"Giá trị thị trường\" (Market Value) ở điểm cơ bản nào?","opts":{"A":"Giá cả luôn thấp hơn giá trị thị trường.","B":"Giá cả là số tiền giao dịch thực tế trong một hoàn cảnh cụ thể, còn giá trị thị trường là mức giá ước tính theo điều kiện chuẩn.","C":"Giá cả do Nhà nước quy định, giá trị thị trường do doanh nghiệp thẩm định giá xác định.","D":"Giá cả chỉ áp dụng cho bất động sản mới, giá trị thị trường áp dụng cho bất động sản mới cũ."},"ans":["B"],"exp":"Giá cả là số tiền thực tế được trả trong một giao dịch cụ thể, có thể bị ảnh hưởng bởi các yếu tố đặc biệt của giao dịch đó. Giá trị thị trường là một khái niệm lý thuyết, là mức giá ước tính sẽ hình thành nếu giao dịch diễn ra trong các điều kiện thị trường lý tưởng (các bên sẵn lòng, hiểu biết, không ép buộc...). Giá cả chỉ phản ánh giá trị thị trường khi các điều kiện lý tưởng đó được đáp ứng.","note":"","multi":false,"id":374,"sets":{"1A":18},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 45","q":"Doanh nghiệp thẩm định giá vi phạm nghiêm trọng Chuẩn mực thẩm định giá Việt Nam hoặc quy tắc đạo đức nghề nghiệp có thể dẫn đến hậu quả pháp lý nào theo Luật Giá 2023?","opts":{"A":"Chỉ bị phạt tiền.","B":"Bị cảnh cáo và yêu cầu khắc phục.","C":"Có thể bị đình chỉ kinh doanh hoặc thu hồi Giấy chứng nhận đủ điều kiện kinh doanh dịch vụ thẩm định giá.","D":"Người đại diện pháp luật bị cấm hành nghề vĩnh viễn."},"ans":["C"],"exp":"Điều 54 Luật Giá 2023 và Điều 7, 8 Nghị định 78/2024/NĐ-CP quy định các trường hợp bị đình chỉ, thu hồi Giấy chứng nhận, bao gồm cả việc vi phạm nghiêm trọng quy định của pháp luật về giá, thẩm định giá hoặc Chuẩn mực thẩm định giá Việt Nam.","note":"","multi":false,"id":375,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 46","q":"Cơ quan nào chịu trách nhiệm chính trong việc kiểm tra, theo dõi việc chấp hành pháp luật về tư vấn xác định giá đất của các tổ chức, cá nhân trên địa bàn tỉnh?","opts":{"A":"Bộ Tài nguyên và Môi trường","B":"Thanh tra Chính phủ","C":"Cơ quan có chức năng quản lý đất đai cấp tỉnh (Sở Nông nghiệp và Môi trường)","D":"Công an tỉnh"},"ans":["C"],"exp":"Theo thông lệ quản lý và các quy định liên quan (như được đề cập gián tiếp trong tài liệu về điều kiện hành nghề tư vấn xác định giá đất), cơ quan quản lý nhà nước về đất đai tại địa phương (Sở TNMT, nay là Sở Nông nghiệp & Môi trường) có trách nhiệm quản lý, kiểm tra, theo dõi hoạt động của các tổ chức, cá nhân tư vấn xác định giá đất trên địa bàn..","note":"","multi":false,"id":376,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 47 · Đề 2A câu 2","q":"Rủi ro lớn nhất khi thẩm định viên quá tin tưởng vào các bằng chứng giao dịch trong quá khứ khi áp dụng phương pháp so sánh là gì?","opts":{"A":"Bỏ qua các yếu tố lỗi thời của BĐS mục tiêu.","B":"Không phản ánh đúng giá trị thị trường tại thời điểm thẩm định giá nếu thị trường đã có những thay đổi đáng kể.","C":"Ước tính sai chi phí xây dựng.","D":"Vi phạm nguyên tắc bảo mật thông tin."},"ans":["B"],"exp":"Phương pháp so sánh dựa vào dữ liệu quá khứ. Nếu thị trường thay đổi (về cung cầu, lãi suất, chính sách, tâm lý...) giữa thời điểm giao dịch quá khứ và thời điểm thẩm định giá, việc chỉ dựa vào các giao dịch cũ mà không phân tích và điều chỉnh cho những thay đổi này có thể dẫn đến kết quả không còn phù hợp với giá trị thị trường hiện tại.","note":"","multi":false,"id":377,"sets":{"2A":2},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 48","q":"Theo Luật Giá 2023, việc Nhà nước định giá đối với hàng hóa, dịch vụ cụ thể phải tuân theo nguyên tắc nào?","opts":{"A":"Đảm bảo lợi nhuận cao nhất cho nhà sản xuất.","B":"Phù hợp với giá thế giới.","C":"Bù đắp chi phí sản xuất, kinh doanh hợp lý, lợi nhuận phù hợp thị trường, cân đối cung cầu và chính sách Kinh tế - xã hội.","D":"Thấp hơn giá thị trường để hỗ trợ người tiêu dùng."},"ans":["C"],"exp":"Điều 21 Luật Giá 2023 quy định nguyên tắc định giá của Nhà nước phải bảo đảm bù đắp chi phí hợp lý, lợi nhuận (nếu có) phù hợp mặt bằng thị trường, phù hợp cung cầu, điều kiện thị trường và chủ trương, chính sách phát triển kinh tế - xã hội.","note":"","multi":false,"id":378,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 49","q":"Nếu phương pháp so sánh và phương pháp thu nhập cho cùng một BĐS đưa ra hai kết quả giá trị khác nhau đáng kể, thẩm định viên nên làm gì trong bước hòa hợp kết quả?","opts":{"A":"Lấy trung bình cộng của hai kết quả.","B":"Chọn kết quả cao hơn.","C":"Chọn kết quả thấp hơn.","D":"Xem xét lại toàn bộ dữ liệu, các bước phân tích, điều chỉnh của từng phương pháp, đánh giá độ tin cậy và sự phù hợp của từng phương pháp để đưa ra kết luận cuối cùng có giải trình hợp lý."},"ans":["D"],"exp":"Sự khác biệt lớn giữa các kết quả đòi hỏi thẩm định viên phải rà soát lại kỹ lưỡng quá trình thực hiện từng phương pháp, kiểm tra tính chính xác của dữ liệu, sự hợp lý của các điều chỉnh/giả định. Bước hòa hợp là cơ hội để phân tích nguyên nhân khác biệt và đưa ra kết luận cuối cùng dựa trên đánh giá về độ tin cậy và phù hợp nhất của các chỉ dẫn giá trị, chứ không phải là một phép tính cơ học.","note":"","multi":false,"id":379,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 50","q":"Việc Luật Đất đai 2024 yêu cầu Bảng giá đất phải được điều chỉnh, sửa đổi, bổ sung hàng năm (áp dụng từ 01/01/2026) nhằm mục đích gì?","opts":{"A":"Giảm khối lượng công việc cho cơ quan định giá.","B":"Tạo sự ổn định tuyệt đối cho thị trường.","C":"Giúp Bảng giá đất phản ánh kịp thời hơn những biến động của giá thị trường so với chu kỳ 5 năm trước đây.","D":"Tăng nguồn thu thuế đất đột biến hàng năm."},"ans":["C"],"exp":"Chu kỳ 5 năm của Bảng giá đất theo Luật Đất đai 2013 thường bị coi là quá dài, khiến giá trong Bảng giá đất trở nên lạc hậu so với thị trường. Việc rút ngắn chu kỳ cập nhật xuống hàng năm theo Luật Đất đai 2024 nhằm mục đích giúp Bảng giá đất bám sát hơn, phản ánh tốt hơn những biến động thực tế của thị trường bất động sản.","note":"","multi":false,"id":380,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Đâu là tác động tích cực của môi giới bất động sản đối với sự ổn định an ninh xã hội?","opts":{"A":"Môi giới cung cấp thông tin pháp lý minh bạch, giúp xóa bỏ sự hoài nghi của người dân về chính sách và hạn chế các tiêu cực phát sinh.","B":"Môi giới ổn định xã hội bằng cách kiểm soát không cho giá đất tăng quá cao.","C":"Môi giới giúp Nhà nước giải quyết các tranh chấp đất đai tại tòa án.","D":"Môi giới chịu trách nhiệm bảo đảm an ninh trật tự tại các khu vực có sốt đất."},"ans":["A"],"exp":"Vai trò của môi giới BĐS: cung cấp thông tin cho các chủ thể giao dịch; thúc đẩy thị trường phát triển; khai thác nguồn thu cho ngân sách; góp phần ổn định trật tự, an ninh xã hội (thông tin minh bạch, hạn chế tiêu cực); thúc đẩy đổi mới chính sách quản lý BĐS.","note":"","multi":false,"id":459,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Môi giới bất động sản là việc làm trung gian cho các bên trong các hoạt động nào sau đây? (CHỌN 2 ĐÁP ÁN)","opts":{"A":"Mua bán và chuyển nhượng bất động sản.","B":"Cho thuê và cho thuê lại bất động sản.","C":"Xây dựng công trình bất động sản","D":"Thiết kế công trình."},"ans":["A","B"],"exp":"Môi giới BĐS là việc làm trung gian cho các bên trong mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản. Xây dựng, thiết kế không thuộc môi giới.","note":"","multi":true,"id":460,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS) · Bộ đề CĐ13 câu 21","q":"Trong các yếu tố ảnh hưởng gián tiếp đến sự phát triển nghề môi giới bất động sản, yếu tố nào phản ánh khả năng chi trả và quyết định mua bất động sản của người dân rõ rệt nhất?","opts":{"A":"Số lượng dự án bất động sản mới được cấp phép.","B":"Sức mua, thu nhập bình quân và khả năng tiếp cận tín dụng.","C":"Chi phí xây dựng và quy hoạch các khu công nghiệp của Chính phủ.","D":"Chính sách quy hoạch đô thị."},"ans":["B"],"exp":"Yếu tố gián tiếp là các yếu tố tác động đến cung, cầu BĐS (dân số, thu nhập dân cư, kế hoạch phát triển kinh tế – xã hội, tài chính – ngân hàng). Sức mua, thu nhập và khả năng tiếp cận tín dụng phản ánh trực tiếp khả năng chi trả.","note":"","multi":false,"id":461,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Đâu là nội dung của môi giới bất động sản ? (Lựa chọn 2 đáp án)","opts":{"A":"Đại diện theo ủy quyền để thực hiện các công việc liên quan đến các thủ tục mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản.","B":"Tìm kiếm đối tác đáp ứng các điều kiện của khách hàng để tham gia đàm phán, ký kết hợp đồng.","C":"Cam kết lợi nhuận cho khách hàng khi giao dịch mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản","D":"Định giá bán bất động sản cho khách hàng khi giao dịch mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản"},"ans":["A","B"],"exp":"Nội dung môi giới BĐS: tìm kiếm đối tác đáp ứng điều kiện của khách hàng để đàm phán, ký kết hợp đồng; đại diện theo ủy quyền thực hiện thủ tục; cung cấp thông tin, hỗ trợ các bên. Môi giới không cam kết lợi nhuận và không định giá thay khách hàng.","note":"","multi":true,"id":462,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Đâu là yếu tố gián tiếp ảnh hưởng đến sự phát triển của nghề môi giới bất động sản? (CHỌN 2 ĐÁP ÁN)","opts":{"A":"Pháp luật liên quan đến bất động sản.","B":"Sự hội nhập quốc tế.","C":"Các yếu tố ảnh hưởng đến cung bất động sản như giá của vật liệu thấp và ổn định…","D":"Các yếu tố ảnh hưởng đến cầu bất động sản."},"ans":["C","D"],"exp":"Yếu tố trực tiếp: pháp luật – chính sách; quy hoạch – kế hoạch; hội nhập quốc tế, vốn đầu tư nước ngoài, công nghệ. Yếu tố gián tiếp: các yếu tố tác động đến cung và cầu BĐS.","note":"","multi":true,"id":463,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Đâu không phải là nghĩa vụ của doanh nghiệp kinh doanh dịch vụ môi giới bất động sản?","opts":{"A":"Thực hiện nghĩa vụ thuế đối với Nhà nước.","B":"Bồi thường thiệt hại do lỗi của mình gây ra;","C":"Tổ chức đào tạo, bồi dưỡng nâng cao kiến thức hành nghề môi giới bất động sản cho nhân viên môi giới bất động sản làm việc trong doanh nghiệp hằng năm;","D":"Thu phí dịch vụ của khách hàng theo thỏa thuận của các bên;"},"ans":["D"],"exp":"“Thu phí dịch vụ theo thỏa thuận” là quyền của doanh nghiệp môi giới, không phải nghĩa vụ. Nghĩa vụ gồm: thực hiện nghĩa vụ thuế, bồi thường thiệt hại do lỗi của mình gây ra, tổ chức đào tạo bồi dưỡng kiến thức hành nghề cho nhân viên môi giới hằng năm…","note":"","multi":false,"id":464,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS) · Bộ đề CĐ14 câu 183","q":"Là nhà môi giới bất động sản, công việc nào sau đây được thực hiện thường xuyên nhất?","opts":{"A":"Xác định chu kỳ phát triển của thị trường bất động sản để nắm vững thông tin thị trường bất động sản.","B":"Xác định chi phí, lợi nhuận, thủ tục pháp lý, hỗ trợ khách hàng thực hiện các giao dịch BĐS","C":"Xác định lượng cung bất động sản nói chung trên thị trường bất động sản.","D":"Không phải các công việc trên"},"ans":["B"],"exp":"Công việc thường xuyên của nhà môi giới là hỗ trợ khách hàng thực hiện giao dịch: xác định chi phí, lợi nhuận, thủ tục pháp lý. Phân tích chu kỳ hay tổng cung thị trường là việc của nhà nghiên cứu, hoạch định.","note":"","multi":false,"id":465,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Đâu là nghĩa vụ của doanh nghiệp kinh doanh dịch vụ môi giới bất động sản?","opts":{"A":"Từ chối môi giới bất động sản không đủ điều kiện đưa vào kinh doanh;","B":"Thu phí dịch vụ của khách hàng theo thỏa thuận của các bên;","C":"Thực hiện môi giới bất động sản theo quy định.","D":"Cung cấp đầy đủ, trung thực hồ sơ, thông tin về bất động sản do mình môi giới và chịu trách nhiệm về hồ sơ, thông tin do mình cung cấp;"},"ans":["D"],"exp":"Cung cấp đầy đủ, trung thực hồ sơ, thông tin về BĐS do mình môi giới và chịu trách nhiệm về thông tin đó là nghĩa vụ; thu phí dịch vụ theo thỏa thuận là quyền.","note":"","multi":false,"id":466,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Tiêu chí nào sau đây ảnh hưởng RẤT ÍT đến quyết định mua bất động sản?","opts":{"A":"Tiến trình đàm phán.","B":"Mối quan hệ trong gia đình.","C":"Giá cả của bất động sản.","D":"Vị trí của bất động sản."},"ans":["A"],"exp":"Giá cả, vị trí và quan hệ gia đình (người quyết định, người tham khảo) ảnh hưởng lớn; tiến trình đàm phán ảnh hưởng rất ít đến quyết định mua.","note":"","multi":false,"id":467,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Trong giao tiếp với khách hàng, nhà môi giới bất động sản CẦN TRÁNH những điều nào sau đây?","opts":{"A":"Đặt những câu hỏi mở để có thể thu thập được nhiều thông tin.","B":"Quan tâm đến nhu cầu thật sự của khách hàng.","C":"Nắm bắt được tâm lý khách hàng.","D":"Đặt những câu hỏi mang tính riêng tư."},"ans":["D"],"exp":"Nên đặt câu hỏi mở, quan tâm nhu cầu thật, nắm bắt tâm lý khách hàng; cần tránh câu hỏi mang tính riêng tư.","note":"","multi":false,"id":468,"sets":{},"fix":false},{"topic":"cm1","src":"Hướng dẫn thi CCHN (CTS)","q":"Hoạt động môi giới sẽ tìm ra hướng giải quyết tối ưu cho khách hàng thể hiện qua việc nào sau đây?","opts":{"A":"Trả lời được ngay câu hỏi “Ai, cái gì, khi nào, ở đâu”","B":"Làm lành mạnh hoá, minh bạch hoạt động và giúp thị trường phát triển.","C":"Tối ưu về tài chính, tối ưu về giá cả và bảo đảm mức độ an toàn","D":"Người môi giới làm các giao dịch bất động sản diễn ra nhanh chóng hơn"},"ans":["C"],"exp":"Giải pháp tối ưu cho khách hàng thể hiện ở ba mặt: tối ưu tài chính, tối ưu giá cả và bảo đảm an toàn giao dịch.","note":"","multi":false,"id":469,"sets":{},"fix":false},{"topic":"cm1","src":"Bộ đề CĐ13 câu 1 · Đề 2B câu 22","q":"Theo Luật kinh doanh bất động sản 2023 (hiệu lực 01/08/2024), điều kiện tiên quyết để một cá nhân được hành nghề môi giới bất động sản là gì?","opts":{"A":"Có ít nhất 5 năm kinh nghiệm.","B":"Phải là thành viên của Hiệp hội bất động sản Việt Nam.","C":"Có Chứng chỉ hành nghề môi giới bất động sản và phải làm việc trong một tổ chức kinh doanh dịch vụ bất động sản.","D":"Phải có bằng đại học chuyên ngành Luật hoặc Kinh tế."},"ans":["C"],"exp":"","note":"","multi":false,"id":980,"fix":false,"sets":{"2B":22}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 2 · Đề 1B câu 2","q":"Yếu tố \"Hội nhập quốc tế\" ảnh hưởng đến nghề môi giới bất động sản Việt Nam chủ yếu ở khía cạnh nào?","opts":{"A":"Làm giảm số lượng nhà môi giới bất động sản trong nước.","B":"Đòi hỏi nâng cao tính chuyên nghiệp, kỹ năng (ngoại ngữ, đàm phán quốc tế), hiểu biết luật pháp và thông lệ quốc tế để phục vụ khách hàng/đối tác nước ngoài.","C":"Khiến mức phí hoa hồng giảm xuống.","D":"Hạn chế vai trò của các sàn giao dịch bất động sản."},"ans":["B"],"exp":"","note":"","multi":false,"id":981,"fix":false,"sets":{"1B":2}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 3","q":"Nguyên tắc đạo đức \"Trung thành\" (Loyalty) của nhà môi giới bất động sản đối với khách hàng bị vi phạm trong trường hợp nào sau đây?","opts":{"A":"Môi giới tư vấn cho người bán nên sửa chữa lại nhà trước khi bán để được giá tốt hơn.","B":"Môi giới đại diện người mua nhưng lại cố tình giới thiệu bất động sản giá cao hơn thị trường để nhận hoa hồng cao hơn từ người bán (nếu có thỏa thuận ngầm).","C":"Môi giới từ chối tiết lộ thông tin tài chính cá nhân của người bán cho người mua.","D":"Môi giới nỗ lực đàm phán để đạt được các điều khoản có lợi nhất cho khách hàng của mình."},"ans":["B"],"exp":"","note":"","multi":false,"id":982,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 4","q":"Việc pháp luật yêu cầu nhà môi giới bất động sản phải có Chứng chỉ hành nghề nhằm mục đích chính là gì?","opts":{"A":"Tăng nguồn thu từ lệ phí thi và cấp chứng chỉ.","B":"Hạn chế số lượng người tham gia vào nghề môi giới bất động sản.","C":"Đảm bảo nhà môi giới bất động sản có kiến thức chuyên môn, pháp luật và đạo đức cơ bản, góp phần nâng cao chất lượng dịch vụ và bảo vệ người tiêu dùng.","D":"Giúp các trường đại học có thêm chương trình đào tạo."},"ans":["C"],"exp":"","note":"","multi":false,"id":983,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 5","q":"Một cá nhân có Chứng chỉ hành nghề môi giới bất động sản nhưng không làm việc cho công ty nào, tự đứng ra nhận tiền của khách để tìm nhà giúp họ từ ngày 01/08/2024. Hành vi này có phù hợp với quy định mới không?","opts":{"A":"Hoàn toàn phù hợp vì đã có chứng chỉ.","B":"Không phù hợp, cá nhân phải hành nghề thông qua một tổ chức kinh doanh dịch vụ bất động sản.","C":"Chỉ phù hợp nếu giao dịch giá trị thấp.","D":"Chỉ phù hợp nếu khách hàng đồng ý."},"ans":["B"],"exp":"","note":"","multi":false,"id":984,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 6","q":"Điều kiện về \"cơ sở vật chất, kỹ thuật\" đối với doanh nghiệp kinh doanh dịch vụ môi giới bất động sản nhằm đảm bảo điều gì?","opts":{"A":"Văn phòng phải thật sang trọng, hoành tráng.","B":"Doanh nghiệp có địa điểm hoạt động rõ ràng, có đủ trang thiết bị tối thiểu để phục vụ hoạt động nghiệp vụ và lưu trữ hồ sơ theo quy định.","C":"Doanh nghiệp phải có website riêng.","D":"Doanh nghiệp phải có ít nhất 10 máy tính."},"ans":["B"],"exp":"","note":"","multi":false,"id":985,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 7","q":"Yếu tố nào sau đây có ảnh hưởng GIÁN TIẾP nhưng lại mang tính quyết định đến sự sôi động hay trầm lắng của nghề môi giới bất động sản trong dài hạn?","opts":{"A":"Quy định về mẫu hợp đồng môi giới.","B":"Số lượng các khóa đào tạo môi giới được mở.","C":"Tình hình kinh tế vĩ mô và chu kỳ của thị trường bất động sản.","D":"Mức lệ phí cấp chứng chỉ hành nghề."},"ans":["C"],"exp":"","note":"","multi":false,"id":986,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 8 · Đề 1B câu 38","q":"Nguyên tắc \"Công bằng, minh bạch\" trong hoạt động môi giới đòi hỏi nhà môi giới bất động sản KHÔNG được làm điều gì?","opts":{"A":"Cung cấp thông tin về quy hoạch cho người mua.","B":"Che giấu thông tin về một khoản phí mà khách hàng phải trả không được báo trước.","C":"Giải thích rõ các điều khoản trong hợp đồng.","D":"Nỗ lực tìm kiếm Bất động sản phù hợp nhất với nhu cầu khách hàng."},"ans":["B"],"exp":"","note":"","multi":false,"id":987,"fix":false,"sets":{"1B":38}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 9","q":"Việc Luật kinh doanh bất động sản Việt Nam công nhận và quy định về nghề môi giới bất đống sản có ý nghĩa gì đối với sự phát triển của nghề?","opts":{"A":"Hạn chế sự phát triển của nghề.","B":"Tạo cơ sở pháp lý chính thức, khẳng định vai trò xã hội, thúc đẩy sự chuyên nghiệp hóa và tạo điều kiện cho nghề phát triển một cách bài bản, có quản lý.","C":"Khiến việc hành nghề trở nên khó khăn hơn không cần thiết.","D":"Không có ý nghĩa gì đáng kể."},"ans":["B"],"exp":"","note":"","multi":false,"id":988,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 10","q":"Tại sao nhà môi giới bất động sản cần có kiến thức về các yếu tố ảnh hưởng đến cung, cầu BĐS (kinh tế vĩ mô, tài chính, xã hội...)?","opts":{"A":"Chỉ để phục vụ việc thi lấy chứng chỉ.","B":"Để có thể phân tích, dự báo (ở mức độ nhất định) xu hướng thị trường, từ đó tư vấn chiến lược phù hợp cho khách hàng (thời điểm mua/bán, mức giá hợp lý, tiềm năng đầu tư...).","C":"Để có thể tự đầu tư Bất động sản hiệu quả hơn.","D":"Để có chuyện nói với khách hàng."},"ans":["B"],"exp":"","note":"","multi":false,"id":989,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 11","q":"Tình huống: Công ty môi giới bất động sản M chỉ có một người duy nhất sở hữu Chứng chỉ hành nghề môi giới bất động sản BĐS. Nếu người này nghỉ việc, công ty M có còn đủ điều kiện kinh doanh dịch vụ môi giới bất động sản theo Luật KDBĐS 2023 không?","opts":{"A":"Vẫn đủ điều kiện bình thường.","B":"Không còn đủ điều kiện và phải bổ sung người có chứng chỉ khác hoặc tạm dừng hoạt động.","C":"Chỉ cần giám đốc công ty có chứng chỉ là đủ.","D":"Vẫn đủ điều kiện nếu công ty có doanh thu cao."},"ans":["B"],"exp":"","note":"","multi":false,"id":990,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 12","q":"Việc nhà môi giới bất động sản từ chối tham gia vào một giao dịch có dấu hiệu rửa tiền, mặc dù có thể mang lại hoa hồng rất lớn, thể hiện việc tuân thủ nguyên tắc nào?","opts":{"A":"Nguyên tắc lấy lợi ích khách hàng làm định hướng.","B":"Nguyên tắc tuân thủ pháp luật và đạo đức nghề nghiệp.","C":"Nguyên tắc công khai, minh bạch.","D":"Nguyên tắc hoạt động dựa trên chuyên môn."},"ans":["B"],"exp":"","note":"","multi":false,"id":991,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 13 · Đề 1B câu 13","q":"Sự phát triển của các nền tảng công nghệ bất động sản (Proptech) tại Việt Nam ảnh hưởng đến vai trò của nhà môi giới bất động sản truyền thống như thế nào?","opts":{"A":"Hoàn toàn thay thế vai trò của nhà môi giới bất động sản.","B":"Không ảnh hưởng gì đáng kể.","C":"Tạo ra cả thách thức (yêu cầu môi giới phải nâng cao kỹ năng công nghệ, đối mặt cạnh tranh từ nền tảng) và cơ hội (công cụ tìm kiếm khách hàng, quản lý công việc, marketing hiệu quả hơn).","D":"Chỉ làm tăng chi phí hoạt động cho nhà môi giới bất động sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":992,"fix":false,"sets":{"1B":13}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 14 · Đề 2B câu 36","q":"Nguyên tắc \"Hoạt động dựa trên nền tảng kiến thức chuyên môn và kinh nghiệm\" đòi hỏi nhà môi giới bất động sản phải làm gì liên tục?","opts":{"A":"Chỉ dựa vào kinh nghiệm cá nhân đã có.","B":"Luôn học hỏi, cập nhật kiến thức mới về thị trường, pháp luật, công nghệ và trau dồi kỹ năng nghiệp vụ.","C":"Chỉ cần có chứng chỉ hành nghề là đủ.","D":"Thường xuyên thay đổi lĩnh vực hoạt động."},"ans":["B"],"exp":"","note":"","multi":false,"id":993,"fix":false,"sets":{"2B":36}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 15","q":"Việc thành lập Sàn giao dịch Bất động sản ở Việt Nam có yêu cầu gì khác biệt cơ bản so với thành lập một doanh nghiệp môi giới thông thường?","opts":{"A":"Không cần người có chứng chỉ môi giới.","B":"Phải đăng ký hoạt động với Sở Xây dựng, đáp ứng điều kiện khắt khe hơn về cơ sở vật chất và người quản lý/điều hành phải có chứng nhận đào tạo quản lý sàn, được cấp giấy phép thành lập sàn.","C":"Chỉ được phép giao dịch BĐS hình thành trong tương lai.","D":"Không được phép thu hoa hồng môi giới."},"ans":["B"],"exp":"","note":"","multi":false,"id":994,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 16","q":"Tại sao nguyên tắc đạo đức \"Không phân biệt đối xử\" lại quan trọng trong hoạt động môi giới bất động sản?","opts":{"A":"Giúp nhà môi giới bất động sản có nhiều khách hàng hơn.","B":"Đảm bảo sự công bằng trong việc cung cấp dịch vụ, tuân thủ pháp luật về chống phân biệt đối xử và xây dựng hình ảnh nhân văn, chuyên nghiệp cho nghề.","C":"Giúp nhà môi giới bất động sản dễ dàng định giá bất động sản hơn.","D":"Chỉ áp dụng khi làm việc với khách hàng nước ngoài."},"ans":["B"],"exp":"","note":"","multi":false,"id":995,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 17","q":"Yếu tố \"Lợi nhuận hấp dẫn\" ảnh hưởng đến sự phát triển nghề môi giới bất động sản như thế nào?","opts":{"A":"Chỉ có tác động tiêu cực, làm nhiều người thiếu năng lực tham gia.","B":"Là động lực thu hút nhân lực tham gia vào nghề, nhưng cũng đòi hỏi phải có cơ chế quản lý, đào tạo và đạo đức để đảm bảo sự phát triển bền vững, chuyên nghiệp.","C":"Không ảnh hưởng gì đến sự phát triển của nghề.","D":"Chỉ ảnh hưởng đến các nhà môi giới bất động sản làm việc độc lập."},"ans":["B"],"exp":"","note":"","multi":false,"id":996,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 18","q":"Nếu nhà môi giới bất động sản không có Chứng chỉ hành nghề mà vẫn thực hiện hoạt động môi giới và thu phí, họ có thể đối mặt với hậu quả pháp lý nào?","opts":{"A":"Chỉ bị khách hàng nhắc nhở.","B":"Bị xử phạt vi phạm hành chính theo quy định của pháp luật về kinh doanh Bất động sản và có thể không được pháp luật bảo vệ quyền lợi về hoa hồng.","C":"Được phép tiếp tục hành nghề nếu nộp phạt.","D":"Không có hậu quả gì nếu khách hàng không khiếu nại."},"ans":["B"],"exp":"","note":"","multi":false,"id":997,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 19 · Đề 1B câu 34","q":"Việc nhà môi giới bất động sản chủ động tham gia các khóa đào tạo liên tục mang lại lợi ích kép là gì?","opts":{"A":"Chỉ để đáp ứng yêu cầu gia hạn giấy phép/chứng chỉ.","B":"Vừa đáp ứng yêu cầu pháp lý/nghề nghiệp để duy trì quyền hành nghề, vừa giúp cập nhật kiến thức, nâng cao kỹ năng và năng lực cạnh tranh.","C":"Chỉ giúp mở rộng mối quan hệ.", {}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 24","q":"Yếu tố \"Sự chuyển đổi cơ cấu kinh tế - xã hội\" (ví dụ: từ nông nghiệp sang công nghiệp, dịch vụ) ảnh hưởng đến nhu cầu loại hình bất động sản nào nhiều nhất?","opts":{"A":"Chỉ ảnh hưởng đến nhu cầu đất nông nghiệp.","B":"Gần như không ảnh hưởng đến thị trường bất động sản.","C":"Tạo ra và thay đổi mạnh mẽ nhu cầu đối với các loại hình bất động sản khác nhau (nhà ở đô thị, bất động sản công nghiệp, văn phòng, thương mại, dịch vụ...).","D":"Chỉ ảnh hưởng đến bất động sản ở khu vực nông thôn."},"ans":["C"],"exp":"","note":"","multi":false,"id":1002,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 25 · Đề 1B câu 14","q":"Tình huống: Doanh nghiệp môi giới bất động sản B sử dụng Chứng chỉ hành nghề môi giới bất động sản của nhân viên C (đã nghỉ việc) để đăng ký hoạt động. Hành vi này có vi phạm pháp luật không?","opts":{"A":"Không vi phạm nếu nhân viên C đồng ý.","B":"Vi phạm nghiêm trọng quy định về điều kiện kinh doanh dịch vụ môi giới (sử dụng chứng chỉ không đúng người, không còn người đủ điều kiện làm việc).","C":"Chỉ vi phạm nếu bị cơ quan chức năng phát hiện.","D":"Không vi phạm nếu doanh nghiệp vẫn hoạt động tốt."},"ans":["B"],"exp":"","note":"","multi":false,"id":1003,"fix":false,"sets":{"1B":14}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 26 · Đề 1B câu 50","q":"Yếu tố nào sau đây KHÔNG phải là vai trò trực tiếp của nhà môi giới bất động sản chuyên nghiệp?","opts":{"A":"Cung cấp thông tin thị trường.","B":"Thúc đẩy giao dịch thành công","C":"Quyết định phê duyệt quy hoạch đô thị.","D":"Tư vấn về quy trình, thủ tục pháp lý cơ bản."},"ans":["C"],"exp":"","note":"","multi":false,"id":1004,"fix":false,"sets":{"1B":50}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 27","q":"Tình huống: Một sàn giao dịch BĐS bị khách hàng khiếu nại về việc nhân viên tư vấn sai thông tin pháp lý dẫn đến thiệt hại. Ai sẽ là người chịu trách nhiệm chính trước khách hàng và pháp luật?","opts":{"A":"Chỉ cá nhân nhân viên tư vấn đó.","B":"Sàn "Trong hợp đồng mua bán bất động sản, tại sao cần mô tả chi tiết bất động sản (địa chỉ, diện tích, số thửa...)?","opts":{"A":"Để làm tăng giá trị hợp đồng.","B":"Để xác định chính xác đối tượng của hợp đồng, tránh nhầm lẫn và tranh chấp.","C":"Để cơ quan thuế dễ tính thuế.","D":"Chỉ là thủ tục hình thức."},"ans":["B"],"exp":"","note":"","multi":false,"id":1071,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 94","q":"Rủi ro nào có thể phát sinh nếu mua bất động sản thông qua hợp đồng ủy quyền không hợp lệ?","opts":{"A":"Giao dịch có thể bị tuyên vô hiệu, người mua mất tiền và không có quyền sở hữu.","B":"Người mua phải trả thêm thuế.","C":"Bất động sản bị giảm giá trị.","D":"Không có rủi ro nào đáng kể."},"ans":["A"],"exp":"","note":"","multi":false,"id":1072,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 95","q":"Khi soạn thảo điều khoản về phí hoa hồng trong Hợp đồng Dịch vụ Môi giới, cần lưu ý điều gì nhất?","opts":{"A":"Ghi mức phí càng cao càng tốt.","B":"Ghi mức phí một cách rõ ràng (tỷ lệ % hoặc số tiền cố định) và quy định cụ thể thời điểm, điều kiện thanh toán phí.","C":"Chỉ cần ghi chung chung \"theo thỏa thuận\".","D":"Để trống phần phí hoa hồng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1073,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 96","q":"Đâu là biểu hiện của việc nhà môi giới \"tách biệt con người và vấn đề\" trong đàm phán?","opts":{"A":"Chỉ trích cá nhân người đối diện khi họ không đồng ý.","B":"Tập trung vào việc giải quyết các bất đồng về điều khoản, giá cả một cách khách quan, giữ thái độ tôn trọng đối tác.","C":"Luôn đồng ý với mọi yêu cầu của đối tác để tránh xung đột.","D":"Từ chối đàm phán nếu không thích người đối diện."},"ans":["B"],"exp":"","note":"","multi":false,"id":1074,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 97 · Đề 1B câu 19","q":"Việc phân tích chỉ số \"Lợi nhuận / Số lao động\" giúp nhà quản lý văn phòng môi giới điều gì?","opts":{"A":"Xác định quy mô giao dịc đối tác có sự nhượng bộ tương ứng khi mình nhượng bộ.","D":"Giải thích lý do cho sự nhượng bộ (nếu có thể)."},"ans":["B"],"exp":"","note":"","multi":false,"id":1083,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 106","q":"Khi soạn thảo Hợp đồng Dịch vụ Môi giới độc quyền, điều khoản nào cần được định nghĩa rõ ràng nhất để tránh tranh chấp về sau?","opts":{"A":"Màu sơn yêu thích của khách hàng.","B":"Phạm vi độc quyền (thời gian, loại hình giao dịch, BĐS cụ thể) và các trường hợp môi giới vẫn được hưởng phí ngay cả khi không trực tiếp tìm được khách.","C":"Số lần tối đa khách hàng được phép từ chối xem nhà.","D":"Tên các đối thủ cạnh tranh của nhà môi giới."},"ans":["B"],"exp":"","note":"","multi":false,"id":1084,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 107","q":"Nguyên tắc \"Điều gì không có trong hợp đồng thì nó không tồn tại\" đặc biệt quan trọng khi thỏa thuận về vấn đề gì?","opts":{"A":"Tình cảm cá nhân giữa các bên.","B":"Các trang thiết bị, nội thất người bán để lại cho người mua.","C":"Dự báo về giá bất động sản trong tương lai.","D":"Thời tiết vào ngày ký hợp đồng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1085,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 108","q":"Nhà môi giới có nên đưa ra lời khuyên pháp lý chuyên sâu (ví dụ: giải thích chi tiết về luật thừa kế) cho khách hàng không?","opts":{"A":"Nên làm để thể hiện sự hiểu biết rộng.","B":"Không nên, vì đó không phải chuyên môn chính và có thể gây rủi ro. Nên giới thiệu khách hàng tìm đến luật sư.","C":"Chỉ nên làm nếu khách hàng yêu cầu.","D":"Nên làm và thu thêm phí tư vấn pháp lý."},"ans":["B"],"exp":"","note":"","multi":false,"id":1086,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 109 · Đề 1B câu 42","q":"Trong hợp đồng mua bán nhà ở hình thành trong tương lai, điều khoản nào bảo vệ người mua tốt nhất nếu chủ đầu tư chậm bàn giao nhà?","opts":{"A":"Điều khoản về thiết kế chi tiết căn hộ.","B":"Điều khoản quy định rõ mức phạt vi phạm hợp đồng (lãi phạt chậm bàn giao) cho chủ đầu tư.","C":"Điều khoản về phí quản lý vận hành tòa nhà.","D":"Điều khoản về việc chủ đầu tư được phép thay đổi vật liệu xây dựng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1087,"fix":false,"sets":{"1B":42}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 110 · Đề 1B câu 3","q":"Tại sao việc xác định đúng \"người ra quyết định kinh tế\" trong một nhóm khách xem nhà lại quan trọng đối với chiến lược chào bán?","opts":{"A":"Để chỉ tập trung nói chuyện với người đó, phớt lờ những người khác.","B":"Để điều chỉnh nội dung và trọng tâm thuyết trình, tập trung vào các yếu tố mà người đó quan tâm nhất (ví dụ: giá cả, tiềm năng đầu tư, chi phí...).","C":"Để yêu cầu người đó ký hợp đồng ngay lập tức.","D":"Để biết nên tặng quà cho ai."},"ans":["B"],"exp":"","note":"","multi":false,"id":1088,"fix":false,"sets":{"1B":3}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 111","q":"Khi trình bày về bất động sản, việc sử dụng câu chuyện (storytelling) có tác dụng gì?","opts":{"A":"Làm mất thời gian của khách hàng.","B":"Giúp thông tin trở nên khô khan, khó nhớ.","C":"Tạo sự kết nối cảm xúc, làm bất động sản trở nên sinh động, đáng nhớ và dễ hình dung hơn về cuộc sống tương lai tại đó.","D":"Thay thế hoàn toàn cho việc cung cấp thông số kỹ thuật."},"ans":["C"],"exp":"","note":"","multi":false,"id":1089,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 112","q":"Đâu là ví dụ về việc áp dụng kỹ năng \"nâng cao giá trị cảm nhận\" cho một căn hộ cũ cần sửa chữa?","opts":{"A":"Che giấu các khuyết điểm cần sửa chữa.","B":"Nhấn mạnh vào giá bán rất rẻ so với thị trường.","C":"Phân tích tiềm năng cải tạo (\"chỉ cần sơn sửa lại là đẹp lung linh\"), vị trí tốt, giá trị đất tăng theo thời gian và so sánh với giá căn hộ mới cùng khu vực.","D":"Từ chối dẫn khách xem vì nhà quá cũ."},"ans":["C"],"exp":"","note":"","multi":false,"id":1090,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 113","q":"Nếu chỉ số \"Lợi nhuận / Tổng doanh thu\" của văn phòng môi giới giảm sút, nhà quản lý cần xem xét yếu tố nào đầu tiên?","opts":{"A":"Tăng số lượng nhân viên.","B":"Mở rộng thêm văn phòng mới.","C":"Phân tích cơ cấu chi phí (marketing, vận hành, lương...) và hiệu quả của các nguồn doanh thu.","D":"Giảm giờ làm việc của nhân viên."},"ans":["C"],"exp":"","note":"","multi":false,"id":1091,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 114","q":"Việc áp dụng nguyên tắc \"Tách biệt con người và vấn đề\" đặc biệt hữu ích trong tình huống nào?","opts":{"A":"Khi đàm phán với người thân hoặc bạn bè.","B":"Khi trình bày về ưu điểm của BĐS.","C":"Khi xây dựng kế hoạch marketing.","D":"Khi tính toán lợi nhuận của văn phòng."},"ans":["A"],"exp":"","note":"","multi":false,"id":1092,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 115 · Đề 1B câu 20","q":"Việc tham gia các hội thảo, khóa học về BĐS giúp nhà môi giới nâng cao điều gì nhất?","opts":{"A":"Khả năng định giá chính xác mọi loại BĐS.","B":"Cập nhật kiến thức mới về thị trường, pháp luật, công nghệ và mở rộng mạng lưới quan hệ.","C":"Kỹ năng đàm phán với mọi đối tượng khách hàng.","D":"Thu nhập hàng tháng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1093,"fix":false,"sets":{"1B":20}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 116 · Đề 2B câu 39","q":"Nhà môi giới đang đại diện cho người bán. Một người mua tiềm năng đề nghị một mức giá hợp lý nhưng kèm điều kiện \"thanh toán 95% giá trị khi ký hợp đồng công chứng, 5% còn lại sau khi nhận Sổ hồng (GCN) đã sang tên\". Nhà môi giới nên tư vấn cho người bán như thế nào?","opts":{"A":"Đồng ý ngay vì giá hợp lý.","B":"Từ chối vì điều kiện thanh toán rủi ro cho người bán","C":"Phân tích rủi ro cho người bán (việc giữ lại 5% có thể kéo dài, phức tạp nếu có trục trặc sang tên) và đề xuất phương án an toàn hơn (ví dụ: thanh toán đủ tại phòng công chứng, hoặc giữ lại một khoản nhỏ hơn và có thỏa thuận ràng buộc rõ ràng).","D":"Yêu cầu người mua phải đặt cọc thêm 5%."},"ans":["C"],"exp":"","note":"","multi":false,"id":1094,"fix":false,"sets":{"2B":39}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 117","q":"Đâu là điểm khác biệt cơ bản giữa \"Marketing\" và \"Bán hàng\" trong lĩnh vực BĐS?","opts":{"A":"Marketing chỉ làm online, bán hàng chỉ làm offline.","B":"Marketing tập trung vào việc tạo ra nhu cầu, thu hút khách hàng tiềm năng và xây dựng thương hiệu; Bán hàng tập trung vào việc chuyển đổi khách hàng tiềm năng thành giao dịch thực tế.","C":"Marketing do chủ đầu tư làm, bán hàng do môi giới làm.","D":"Marketing tốn nhiều chi phí hơn bán hàng."},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc tô D (phương án không đúng bản chất).","multi":false,"id":1095,"fix":true,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 118","q":"Khi thành lập công ty môi giới bất động sản, việc đăng ký ngành nghề kinh doanh cần tuân thủ theo quy định của luật nào là chính yếu?","opts":{"A":"Bộ luật Dân sự.","B":"Luật Nhà ở.","C":"Luật Đất đai.","D":"Luật Doanh nghiệp và Luật Kinh doanh Bất động sản."},"ans":["D"],"exp":"","note":"","multi":false,"id":1096,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 119","q":"Việc nhà quản lý giao phó công việc cụ thể kèm theo quyền hạn và trách nhiệm rõ ràng cho nhân viên môi giới thể hiện kỹ năng quản lý nào?","opts":{"A":"Kỹ năng lập kế hoạch.","B":"Kỹ năng tổ chức và phân công công việc.","C":"Kỹ năng kiểm tra, giám sát.","D":"Kỹ năng động viên, khích lệ."},"ans":["B"],"exp":"","note":"","multi":false,"id":1097,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 120","q":"Nếu một Hợp đồng Dịch vụ Môi giới không quy định rõ \"thời điểm phát sinh quyền hưởng hoa hồng\" của nhà môi giới, điều gì có thể xảy ra?","opts":{"A":"Nhà môi giới có quyền đòi hoa hồng ngay khi ký hợp đồng dịch vụ.","B":"Khách hàng có quyền từ chối trả hoa hồng.","C":"Dễ phát sinh tranh chấp về việc khi nào nhà môi giới được coi là đã hoàn thành công việc và được hưởng hoa hồng (ví dụ: khi tìm được khách đồng ý mua, khi ký HĐ đặt cọc, hay khi ký HĐ công chứng?).","D":"Hợp đồng dịch vụ đó bị vô hiệu."},"ans":["C"],"exp":"","note":"","multi":false,"id":1098,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 121 · Đề 2B câu 7","q":"Một bất động sản có vị trí đẹp nhưng thiết kế bên trong lỗi thời, khó bán. Nhà môi giới nên tư vấn cho người bán chiến lược nào hiệu quả nhất?","opts":{"A":"Giữ nguyên hiện trạng và chỉ tập trung giảm giá sâu.","B":"Đầu tư cải tạo, sửa chữa lớn toàn bộ căn nhà trước khi bán.","C":"Tập trung marketing vào tiềm năng cải tạo, cung cấp ý tưởng/bản vẽ thiết kế gợi ý và định giá hợp lý phản ánh cả hiện trạng lẫn tiềm năng.","D":"Chỉ quảng cáo các bất động sản khác đẹp hơn."},"ans":["C"],"exp":"","note":"","multi":false,"id":1099,"fix":false,"sets":{"2B":7}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 122 · Đề 2B câu 33","q":"Khi đàm phán, việc nhà môi giới sử dụng kỹ thuật \"im lặng chiến lược\" (strategic silence) sau khi đưa ra một đề nghị hoặc nghe một yêu cầu có tác dụng gì?","opts":{"A":"Thể hiện sự không đồng ý.","B":"Tạo áp lực tâm lý nhẹ nhàng, khuyến khích đối tác lên tiếng trước hoặc xem xét lại đề nghị.","C":"Cho thấy sự thiếu chuẩn bị.","D":"Làm mất thời gian đàm phán."},"ans":["B"],"exp":"","note":"","multi":false,"id":1100,"fix":false,"sets":{"2B":33}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 123","q":"Nếu phát hiện BĐS có dấu hiệu bị \"ô nhiễm tâm linh\" (theo niềm tin dân gian), nhà môi giới nên ứng xử thế nào với thông tin này?","opts":{"A":"Hoàn toàn phớt lờ vì cho là mê tín.","B":"Chủ động thông báo cho mọi khách hàng tiềm năng.","C":"Tùy thuộc vào khách hàng và mức độ ảnh hưởng tiềm tàng đến giá trị/quyết định mua; có thể cần trao đổi tế nhị với người bán và cân nhắc thông báo cho người mua nếu đó là yếu tố quan trọng đối với họ.","D":"Sử dụng thông tin này để ép giá người bán."},"ans":["C"],"exp":"","note":"","multi":false,"id":1101,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 124","q":"Khi tư vấn cho khách hàng về việc vay ngân hàng mua bất động sản, nhà môi giới KHÔNG nên làm điều gì?","opts":{"A":"Giới thiệu một số ngân hàng có chính sách tốt.","B":"Giải thích quy trình cơ bản của việc vay vốn.","C":"Đưa ra cam kết chắc chắn về việc khách hàng sẽ được duyệt vay với lãi suất cụ thể.","D":"Hỗ trợ khách hàng chuẩn bị một số giấy tờ cơ bản (nếu được yêu cầu)."},"ans":["C"],"exp":"","note":"","multi":false,"id":1102,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 125","q":"Đâu là thách thức chính khi áp dụng công nghệ Blockchain vào quản lý giao dịch BĐS tại Việt Nam hiện nay?","opts":{"A":"Công nghệ Blockchain quá đơn giản.","B":"Chi phí lưu trữ dữ liệu quá thấp.","C":"Hành lang pháp lý chưa hoàn thiện, sự chấp nhận và tích hợp với hệ thống quản lý đất đai hiện hành còn hạn chế.","D":"Thiếu chuyên gia công nghệ thông tin."},"ans":["C"],"exp":"","note":"","multi":false,"id":1103,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 126","q":"\"Chiến thuật đóng khung\" (Framing) trong đàm phán có thể được áp dụng như thế nào?","opts":{"A":"Đóng khung ảnh BĐS thật đẹp để trình bày.","B":"Trình bày một vấn đề hoặc một đề xuất theo cách nhấn mạnh vào lợi ích hoặc tránh né mất mát để tác động đến cách nhìn nhận của đối tác.","C":"Yêu cầu đối tác phải trả lời trong một khung thời gian nhất định.","D":"Sử dụng khung pháp lý để ép đối tác."},"ans":["B"],"exp":"","note":"","multi":false,"id":1104,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 127 · Đề 1B câu 21","q":"\"Đại diện kép\" trong môi giới bất động sản tiềm ẩn rủi ro lớn nhất là gì?","opts":{"A":"Môi giới không nhận được hoa hồng.","B":"Xung đột lợi ích, khó có thể bảo vệ tốt nhất quyền lợi của cả bên mua và bên bán cùng một lúc.","C":"Thủ tục pháp lý phức tạp hơn.","D":"Khách hàng không tin tưởng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1105,"fix":false,"sets":{"1B":21}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 128 · Đề 2B câu 21","q":"Trong hợp đồng, một điều khoản được viết quá mơ hồ, có thể hiểu theo nhiều nghĩa khác nhau, sẽ dẫn đến hậu quả gì?","opts":{"A":"Hợp đồng có giá trị pháp lý cao hơn.","B":"Dễ dàng thực hiện hơn.","C":"Có nguy cơ cao dẫn đến tranh chấp","D":"Giúp các bên linh hoạt hơn."},"ans":["C"],"exp":"","note":"Hiệu đính: tài liệu gốc tô B; Đề 2B chọn C.","multi":false,"id":1106,"fix":true,"sets":{"2B":21}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 129","q":"Nếu người mua phát hiện một lỗi tiềm ẩn nghiêm trọng của BĐS sau khi đã nhận nhà (ví dụ: thấm dột nặng vào mùa mưa), họ có quyền yêu cầu người bán chịu trách nhiệm không (theo Bộ luật Dân sự)?","opts":{"A":"Không, vì đã nhận nhà nghĩa là chấp nhận mọi rủi ro.","B":"Có, nếu chứng minh được lỗi đó đã tồn tại trước thời điểm bàn giao và người bán đã cố tình che giấu hoặc không thông báo (trừ khi hợp đồng có thỏa thuận miễn trừ rõ ràng).","C":"Chỉ có quyền yêu cầu nhà môi giới chịu trách nhiệm.","D":"Chỉ có quyền tự bỏ tiền ra sửa chữa."},"ans":["B"],"exp":"","note":"","multi":false,"id":1107,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 130","q":"Khi tư vấn cho khách hàng lựa chọn giữa việc mua căn hộ chung cư và nhà đất thổ cư, nhà môi giới cần tập trung phân tích dựa trên yếu tố nào là chính?","opts":{"A":"Chỉ dựa vào sở thích cá nhân của nhà môi giới.","B":"Phân tích ưu nhược điểm của từng loại hình dựa trên nhu cầu cụ thể, khả năng tài chính, lối sống và mục tiêu dài hạn của khách hàng.","C":"Chỉ dựa vào giá bán của hai loại hình.","D":"Chỉ tư vấn loại hình mà môi giới có nguồn hàng nhiều hơn."},"ans":["B"],"exp":"","note":"","multi":false,"id":1108,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 131","q":"Việc sử dụng \"ngôn ngữ tích cực\" trong giao tiếp với khách hàng có tác dụng gì?","opts":{"A":"Làm cho vấn đề trở nên nghiêm trọng hơn.","B":"Tạo cảm giác lạc quan, xây dựng, khuyến khích sự hợp tác và giảm thiểu xung đột.","C":"Che giấu sự thật về những điểm yếu của BĐS.","D":"Khiến nhà môi giới trông thiếu chuyên nghiệp."},"ans":["B"],"exp":"","note":"","multi":false,"id":1109,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 132","q":"Đâu là một ví dụ về việc áp dụng kỹ năng \"quản lý thời gian\" hiệu quả của nhà môi giới?","opts":{"A":"Dành cả ngày để lướt mạng xã hội.","B":"Lập kế hoạch làm việc hàng ngày/tuần.","C":"Luôn nhận lời mọi cuộc hẹn ngay cả khi trùng lịch.","D":"Chỉ làm việc khi có khách hàng gọi đến."},"ans":["B"],"exp":"","note":"","multi":false,"id":1110,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 133 · Đề 2B câu 24","q":"Trong hợp đồng mua bán nhà ở hình thành trong tương lai, điều khoản về \"bảo lãnh ngân hàng\" có ý nghĩa gì đối với người mua?","opts":{"A":"Đảm bảo người mua chắc chắn được vay vốn.","B":"Ngân hàng sẽ thay chủ đầu tư hoàn thiện căn hộ nếu cần.","C":"Ngân hàng sẽ hoàn lại tiền cho người mua nếu chủ đầu tư không bàn giao nhà đúng cam kết theo các điều kiện trong thư bảo lãnh.","D":"Đảm bảo giá bán căn hộ sẽ không tăng."},"ans":["C"],"exp":"","note":"","multi":false,"id":1111,"fix":false,"sets":{"2B":24}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 134 · Đề 2B câu 42","q":"Yếu tố nào thể hiện tầm nhìn chiến lược của một nhà quản lý văn phòng môi giới bất động sản?","opts":{"A":"Khả năng dự báo xu hướng thị trường, xác định cơ hội phát triển dài hạn,","B":"Xây dựng đội ngũ kế cận","C":"Đầu tư vào công nghệ, thương hiệu một cách bền vững.","D":"Cả A, B, C đều đúng."},"ans":["D"],"exp":"","note":"","multi":false,"id":1112,"fix":false,"sets":{"2B":42}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 135","q":"Tình huống: Nhà môi giới A đang dẫn khách xem một căn nhà. Khách hàng rất thích vị trí nhưng chê bai gay gắt về thiết kế nội thất đã lỗi thời và tuyên bố chỉ mua nếu chủ nhà giảm giá mạnh để họ sửa chữa. Nhà môi giới biết chủ nhà là người lớn tuổi, rất yêu quý căn nhà và không muốn giảm giá. Hướng xử lý nào thể hiện kỹ năng đàm phán và tâm lý tốt nhất?","opts":{"A":"Đồng ý ngay với khách hàng và hứa sẽ ép chủ nhà giảm giá mạnh.","B":"Bảo vệ quan điểm của chủ nhà, nói rằng thiết kế đó rất đẹp và khách hàng không có mắt thẩm mỹ.","C":"Ghi nhận ý kiến khách hàng, đồng cảm về nhu cầu sửa chữa, sau đó khéo léo chuyển hướng sang các ưu điểm khác (vị trí, kết cấu, tiềm năng) và đề xuất thương lượng một mức giá hợp lý hơn phản ánh cả ưu điểm lẫn nhược điểm.","D":"Từ chối làm việc tiếp với khách hàng vì cho rằng họ đòi hỏi quá đáng."},"ans":["C"],"exp":"","note":"","multi":false,"id":1113,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 136","q":"Tình huống: Khách hàng B (người mua) rất muốn mua căn hộ X nhưng còn thiếu khoảng 10% tài chính, đang chờ người thân gửi tiền về trong 1 tháng tới. Người bán cần bán gấp trong 2 tuần. Nhà môi giới nên tư vấn cho khách hàng B giải pháp nào khả thi và ít rủi ro nhất?","opts":{"A":"Khuyên khách hàng B vay nóng lãi suất cao để đủ tiền ngay.","B":"Đề nghị khách hàng B đặt cọc cao và cam kết thanh toán đủ trong 2 tuần, bất chấp rủi ro không nhận được tiền kịp.","C":"Trao đổi thẳng thắn với người bán về tình hình của người mua, đề xuất phương án thương lượng (ví dụ: đặt cọc trước một phần, ký hợp đồng mua bán nhưng thỏa thuận thời gian thanh toán kéo dài hơn 2 tuần và có biện pháp bảo đảm cho người bán).","D":"Tìm một căn hộ khác rẻ hơn cho khách hàng B."},"ans":["C"],"exp":"","note":"","multi":false,"id":1114,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 137","q":"Tình huống: Nhà môi giới C phát hiện Sổ hồng (GCN) của BĐS đang giới thiệu có ghi chú \"Thửa đất nằm trong quy hoạch mở rộng đường giao thông\" nhưng người bán lại khẳng định quy hoạch đó đã bị hủy bỏ và đưa ra một văn bản photocopy không rõ nguồn gốc. Hành động nào thể hiện sự cẩn trọng và đúng đắn nhất?","opts":{"A":"Tin lời người bán và thông tin trên văn bản photocopy.","B":"Thông báo cho người mua về ghi chú trên sổ và thông tin người bán cung cấp, để người mua tự quyết định.","C":"Yêu cầu người bán cung cấp văn bản gốc có dấu đỏ của cơ quan chức năng xác nhận hủy bỏ quy hoạch, hoặc tự mình/hướng dẫn người mua đến Phòng Quản lý Đô thị để kiểm tra thông tin quy hoạch mới nhất, chính xác nhất.","D":"Tư vấn người mua nên mua nhanh vì có thể quy hoạch bị hủy thật."},"ans":["C"],"exp":"","note":"","multi":false,"id":1115,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 138","q":"Tình huống: Hợp đồng đặt cọc đã ký, bên mua đã giao tiền cọc. Tuy nhiên, đến ngày ký hợp đồng công chứng, bên bán đột ngột đổi ý không bán nữa vì có người khác trả giá cao hơn. Nhà môi giới nên tư vấn cho bên mua (khách hàng của mình) như thế nào?","opts":{"A":"Khuyên bên mua chấp nhận mất cơ hội và tìm bất động sản khác.","B":"Tư vấn bên mua về quyền lợi của mình theo hợp đồng đặt cọc (thường là yêu cầu bên bán trả lại tiền cọc và bồi thường một khoản tương đương tiền cọc), hỗ trợ họ thực hiện các bước pháp lý cần thiết (nếu cần).","C":"Khuyên bên mua trả thêm tiền để cạnh tranh với người trả giá cao hơn.","D":"Đổ lỗi cho bên bán và không làm gì thêm."},"ans":["B"],"exp":"","note":"","multi":false,"id":1116,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 139","q":"Tình huống: Hợp đồng mua bán đã công chứng, bên mua đã thanh toán 95%. Khi chuẩn bị bàn giao nhà, phát hiện có một vụ cháy nhỏ xảy ra làm hư hỏng một phần nội thất. Trách nhiệm xử lý thuộc về ai nếu hợp đồng không quy định rõ về rủi ro này?","opts":{"A":"Bên mua phải chịu vì sắp nhận nhà.","B":"Bên bán vẫn phải chịu trách nhiệm sửa chữa hoặc bồi thường","C":"Nhà môi giới phải chịu trách nhiệm.","D":"Công ty bảo hiểm phải chịu (nếu có)."},"ans":["B"],"exp":"","note":"","multi":false,"id":1117,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 140 · Đề 2B câu 4","q":"Tình huống: Hợp đồng dịch vụ môi giới quy định hoa hồng là 2% trên giá bán. Giao dịch thành công ở mức 5 tỷ đồng. Tuy nhiên, để \"giúp\" người mua giảm lệ phí trước bạ, người bán và người mua thỏa thuận chỉ ghi giá trên hợp đồng công chứng là 3 tỷ đồng. Nhà môi giới nên tính hoa hồng dựa trên giá trị nào?","opts":{"A":"3 tỷ đồng (theo hợp đồng công chứng).","B":"5 tỷ đồng (giá trị giao dịch thực tế).","C":"Trung bình cộng của hai giá (4 tỷ đồng).","D":"Tùy theo sự hào phóng của khách hàng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1118,"fix":false,"sets":{"2B":4}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 141","q":"Tình huống: Trong hợp đồng đặt cọc, có điều khoản \"nếu bên mua không được ngân hàng duyệt cho vay đủ 70% giá trị BĐS thì hợp đồng này tự động hủy và bên bán hoàn trả lại toàn bộ tiền cọc\". Đây là loại điều khoản gì?","opts":{"A":"Điều khoản phạt vi phạm.","B":"Điều khoản về bất khả kháng.","C":"Điều khoản về điều kiện có hiệu lực hoặc hủy bỏ hợp đồng","D":"Điều khoản về bảo mật thông tin."},"ans":["C"],"exp":"","note":"","multi":false,"id":1119,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 142","q":"Tình huống: Là người quản lý, bạn muốn xây dựng một cơ chế đánh giá hiệu quả làm việc (KPIs) công bằng cho đội ngũ môi giới. Chỉ số nào sau đây KHÔNG nên là chỉ số duy nhất hoặc quan trọng nhất?","opts":{"A":"Doanh số bán hàng cá nhân.","B":"Số lượng khách hàng mới mang về.","C":"Mức độ hài lòng của khách hàng (thông qua khảo sát).","D":"Số giờ làm việc tại văn phòng."},"ans":["D"],"exp":"","note":"","multi":false,"id":1120,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 143","q":"Tình huống: Khách hàng G (người bán) rất bận rộn và đề nghị nhà môi giới H thay mặt toàn bộ trong việc đàm phán giá cả và ký kết hợp đồng đặt cọc. Nhà môi giới H nên:","opts":{"A":"Đồng ý ngay vì được khách hàng tin tưởng.","B":"Yêu cầu khách hàng lập Hợp đồng ủy quyền bằng văn bản, công chứng theo quy định pháp luật, trong đó ghi rõ phạm vi ủy quyền (được phép đàm phán giá trong khoảng nào, được ký hợp đồng đặt cọc...).","C":"Chỉ nhận ủy quyền bằng lời nói.","D":"Từ chối vì sợ trách nhiệm."},"ans":["B"],"exp":"","note":"","multi":false,"id":1121,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 144","q":"Tình huống: Nhà môi giới L đang làm việc với cả người mua và người bán (đại diện kép) cho cùng một BĐS. Để đảm bảo tính minh bạch và giảm thiểu xung đột lợi ích, việc nào là quan trọng nhất?","opts":{"A":"Chỉ tiết lộ thông tin có lợi cho người trả hoa hồng cao hơn.","B":"Giữ bí mật hoàn toàn thông tin của mỗi bên đối với bên kia.","C":"Thông báo rõ ràng cho cả hai bên về vai trò đại diện kép của mình, có được sự đồng ý bằng văn bản và cam kết hành động công bằng, trung thực, cung cấp thông tin khách quan như nhau cho cả hai bên.","D":"Đứng về phía người mua để giúp họ mua được giá rẻ."},"ans":["C"],"exp":"","note":"","multi":false,"id":1122,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 145 · Đề 1B câu 12","q":"Nguyên tắc kinh doanh bất động sản là:","opts":{"A":"Công khai, minh bạch;","B":"Tự do thỏa thuận trên cơ sở tôn trọng quyền và lợi ích hợp pháp của các bên thông qua hợp đồng,","C":"Không vi phạm điều cấm của luật","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"","note":"","multi":false,"id":1123,"fix":false,"sets":{"1B":12}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 146 · Đề 2B câu 13","q":"Người được cấp chứng chỉ hành nghề môi giới bất động sản cho người khác mượn, thuê chứng chỉ hành nghề môi giới Bất động sản để hành nghề thì sẽ:","opts":{"A":"Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng","B":"Tước quyền sử dụng chứng chỉ hành nghề từ 03 tháng đến 06 tháng","C":"Cả A và B đều sai","D":"Bao gồm cả A và B đều đúng"},"ans":["D"],"exp":"","note":"","multi":false,"id":1124,"fix":false,"sets":{"2B":13}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 147","q":"Tổ chức, cá nhân kinh doanh dịch vụ môi giới bất động sản đồng thời vừa là nhà môi giới vừa là một bên thực hiện hợp đồng trong một giao dịch kinh doanh bất động sản thì bị xử phạt bao nhiêu:","opts":{"A":"20.000.000 đồng đến 30 triệu đồng","B":"40.000.000 đồng đến 60.000.000 đồng","C":"80.000.000 đồng đến 120.000.000 đ","D":"Không bị phạt tiền"},"ans":["B"],"exp":"","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":1125,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 148 · Bộ đề CĐ14 câu 136","q":"Khoản hoa hồng nào sau đây là phạm luật?","opts":{"A":"Tiền giờ công","B":"Phần trăm trên giá mua","C":"Khoản phí mà khách hàng phải trả khi ký hợp đồng nhờ môi giới bán nhà","D":"Không có khoản nào kể trên được xem là \"hoa hồng\" trong môi giới bất động sản"},"ans":["D"],"exp":"","note":"","multi":false,"id":1126,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 149","q":"Doanh nghiệp kinh doanh dịch vụ môi giới bất động sản có các quyền nào:","opts":{"A":"Yêu cầu các tổ chức, cá nhân có liên quan cung cấp hồ sơ, thông tin bất động sản thực hiện giao dịch;","B":"Thu phí dịch vụ của khách hàng theo thỏa thuận của các bên;","C":"Từ chối môi giới bất động sản không đủ điều kiện đưa vào kinh doanh;","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"","note":"","multi":false,"id":1127,"fix":false,"sets":{}},{"topic":"cm1","src":"Bộ đề CĐ13 câu 150","q":"Cá nhân hành nghề môi giới bất động sản có các quyền hưởng thù lao, hoa hồng môi giới bất động sản từ đâu:","opts":{"A":"Doanh nghiệp kinh doanh dịch vụ sàn giao dịch bất động sản hoặc doanh nghiệp kinh doanh dịch vụ môi giới bất động sản","B":"Khách hàng","C":"Cả A và B"},"ans":["A"],"exp":"","note":"","multi":false,"id":1128,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 1","q":"\"Cung Bất động sản\" được định nghĩa là gì?","opts":{"A":"Tổng số lượng bất động sản đã được xây dựng trong một khu vực.","B":"Lượng bất động sản sẵn sàng bán/cho thuê tại một thời điểm và mức giá nhất định.","C":"Nhu cầu mua bất động sản của người dân tại một thời điểm.","D":"Số lượng dự án bất động sản đang được triển khai."},"ans":["B"],"exp":"","note":"","multi":false,"id":1129,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 2","q":"Để kiểm tra thông tin quy hoạch chi tiết của một thửa đất, nhà môi giới nên đến cơ quan nào?","opts":{"A":"Cơ quan Thuế.","B":"Văn phòng Đăng ký đất đai.","C":"UBND phường/xã.","D":"Công an phường/xã."},"ans":["C"],"exp":"","note":"","multi":false,"id":1130,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 3","q":"Thuế Thu nhập cá nhân (TNCN) khi chuyển nhượng bất động sản thường do ai chịu trách nhiệm nộp theo thông lệ (trừ khi có thỏa thuận khác)?","opts":{"A":"Người mua.","B":"Người bán.","C":"Nhà môi giới.","D":"Cơ quan công chứng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1131,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 4","q":"\"Năng lực hành vi dân sự đầy đủ\" của cá nhân được xác định khi nào?","opts":{"A":"Từ khi sinh ra.","B":"Khi đủ 15 tuổi.","C":"Khi đủ 18 tuổi và không bị Tòa án tuyên mất hoặc hạn chế năng lực hành vi.","D":"Khi có tài sản riêng."},"ans":["C"],"exp":"","note":"","multi":false,"id":1132,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 5 · Đề 1B câu 4","q":"Yếu tố nào sau đây ảnh hưởng trực tiếp đến NGUỒN CẦU bất động sản?","opts":{"A":"Chi phí xây dựng tăng cao.","B":"Khả năng vay vốn và lãi suất tín dụng bất động sản.","C":"Thủ tục cấp phép dự án kéo dài.","D":"Lượng hàng tồn kho bất động sản lớn."},"ans":["B"],"exp":"","note":"","multi":false,"id":1133,"fix":false,"sets":{"1B":4}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 6 · Đề 1B câu 22","q":"Khi phân loại khách hàng mua bất động sản, nhóm \"Mua để ở\" thường có đặc điểm gì?","opts":{"A":"Quan tâm chính đến tiện ích sống và không gian cho gia đình.","B":"Tìm kiếm bất động sản có tiềm năng tăng giá.","C":"Mục tiêu chính là bảo toàn vốn khỏi lạm phát.","D":"Tìm kiếm các bất động sản tạo dòng tiền cho thuê."},"ans":["A"],"exp":"","note":"","multi":false,"id":1134,"fix":false,"sets":{"1B":22}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 7","q":"\"Thế chấp\" bất động sản là gì?","opts":{"A":"Bán bất động sản trả góp.","B":"Cho thuê bất động sản dài hạn.","C":"Dùng bất động sản làm tài sản bảo đảm cho khoản vay mà không giao bất động sản.","D":"Chuyển nhượng quyền sử dụng bất động sản có thời hạn."},"ans":["C"],"exp":"","note":"","multi":false,"id":1135,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 8","q":"Hợp đồng đặt cọc trong giao dịch bất động sản có ý nghĩa gì?","opts":{"A":"Là hợp đồng mua bán chính thức.","B":"Là thỏa thuận ban đầu, ghi nhận việc bên mua giao tiền cọc để đảm bảo giao kết hợp đồng chính thức.","C":"Là hợp đồng thuê bất động sản ngắn hạn.","D":"Là hợp đồng dịch vụ môi giới."},"ans":["B"],"exp":"","note":"","multi":false,"id":1136,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 9","q":"Hoạt động nào KHÔNG thuộc Bước 4: Kết thúc thương vụ và Chăm sóc sau bán hàng?","opts":{"A":"Phối hợp bàn giao bất động sản.","B":"Nhận phí hoa hồng môi giới.","C":"Soạn thảo và đăng tin quảng cáo bất động sản.","D":"Hỗ trợ thủ tục sang tên sổ đỏ (nếu có thỏa thuận)."},"ans":["C"],"exp":"","note":"","multi":false,"id":1137,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 10","q":"Trong mô hình SOFTEN, chữ \"F\" (Forward Lean) thể hiện điều gì?","opts":{"A":"Nụ cười thân thiện.","B":"Tư thế cởi mở.","C":"Hơi nghiêng người về phía trước để thể hiện sự quan tâm.","D":"Giọng điệu tích cực."},"ans":["C"],"exp":"","note":"","multi":false,"id":1138,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 11","q":"Mô hình SOFTEN “Smile (mỉm cười), Open (cởi mở), Forward (nghiêng tới), Touch (bắt tay, chạm), Eyes (mắt nhìn mắt), và Nod (gật đầu)” được áp dụng trong giai đoạn nào của hoạt động môi giới?","opts":{"A":"Chỉ khi đàm phán giá.","B":"Chỉ khi ký hợp đồng.","C":"Trong suốt quá trình giao tiếp trực tiếp với khách hàng.","D":"Chỉ khi xử lý khiếu nại."},"ans":["C"],"exp":"","note":"","multi":false,"id":1139,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 12, 143 · Đề 2B câu 32","q":"Đâu là nguyên tắc có thể dẫn đến đàm phán trong kinh doanh thành công:","opts":{"A":"Nhà đàm phán ngồi vào bàn đàm phán chỉ với 1 phương án duy nhất mà không có phương án thay thế","B":"Nhà đàm phán phải xác định rõ mục tiêu đàm phán và luôn
