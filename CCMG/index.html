":"Chỉ bằng quyền sử dụng đất","D":"Chỉ bằng tài sản gắn liền với đất"},"ans":["B"],"exp":"","note":"","multi":false,"id":846,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 41","q":"Trong thời hạn bao lâu kể từ ngày đăng ký doanh nghiệp, các thành viên phải góp đủ phần vốn cam kết?","opts":{"A":"30 ngày","B":"60 ngày","C":"90 ngày","D":"180 ngày"},"ans":["C"],"exp":"","note":"","multi":false,"id":847,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 42 · Đề 2A câu 18","q":"Doanh nghiệp Kinh doanh bất động sản phải thực hiện bước nào sau đây để được hoạt động hợp pháp?","opts":{"A":"Đăng ký ngành nghề tại Sở Xây dựng","B":"Có chứng chỉ hành nghề bất động sản","C":"Đăng ký ngành nghề “Kinh doanh bất động sản”","D":"Xin giấy phép kinh doanh riêng về bất động sản"},"ans":["C"],"exp":"","note":"","multi":false,"id":848,"fix":false,"sets":{"2A":18}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 43","q":"Trường hợp nào sau đây là đúng theo trình tự thành lập doanh nghiệp Kinh doanh bất động sản?","opts":{"A":"Ký hợp đồng mua bán nhà → thành lập doanh nghiệp","B":"Nộp hồ sơ đăng ký doanh nghiệp → được cấp Giấy đăng ký doanh nghiệp → công bố nội dung đăng ký","C":"Nộp thuế trước → thành lập doanh nghiệp sau","D":"Ký hợp đồng thuê trụ sở → hoạt động kinh doanh ngay"},"ans":["B"],"exp":"","note":"","multi":false,"id":849,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 44","q":"Trong thời hạn bao lâu kể từ ngày nhận hồ sơ hợp lệ, Phòng Đăng ký kinh doanh phải cấp Giấy chứng nhận đăng ký doanh nghiệp?","opts":{"A":"01 ngày làm việc","B":"03 ngày làm việc","C":"05 ngày làm việc","D":"07 ngày làm việc"},"ans":["B"],"exp":"","note":"","multi":false,"id":850,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 45","q":"Doanh nghiệp tư nhân có được phép Kinh doanh bất động sản hay không?","opts":{"A":"Có, nếu đáp ứng điều kiện về ngành nghề","B":"Không, vì chỉ công ty cổ phần và TNHH mới được phép","C":"Có, nhưng phải có vốn pháp định 20 tỷ đồng trở lên","D":"Không, vì doanh nghiệp tư nhân không có tư cách pháp nhân"},"ans":["A"],"exp":"","note":"","multi":false,"id":851,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 46","q":"Chủ doanh nghiệp tư nhân có thể đồng thời là chủ của doanh nghiệp tư nhân khác không?","opts":{"A":"Có, nếu doanh nghiệp hoạt động ở ngành nghề khác","B":"Có, nếu doanh nghiệp thứ hai hoạt động ở địa bàn khác","C":"Không, theo quy định Luật Doanh nghiệp 2020","D":"Có, nếu ủy quyền điều hành cho người khác"},"ans":["C"],"exp":"","note":"","multi":false,"id":852,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 47 · Đề 2A câu 19","q":"Công ty TNHH 2 thành viên có tư cách pháp nhân kể từ khi nào?","opts":{"A":"Ngày nộp hồ sơ đăng ký","B":"Ngày nộp thuế môn bài","C":"Ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp","D":"Ngày bắt đầu hoạt động thực tế"},"ans":["C"],"exp":"","note":"","multi":false,"id":853,"fix":false,"sets":{"2A":19}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 48","q":"Khi thành lập công ty TNHH 2 thành viên trở lên để Kinh doanh bất động sản, phải có ít nhất bao nhiêu thành viên góp vốn?","opts":{"A":"1","B":"2","C":"3","D":"Không giới hạn"},"ans":["B"],"exp":"","note":"","multi":false,"id":854,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 49","q":"Cổ đông công ty cổ phần chịu trách nhiệm đối với các khoản nợ và nghĩa vụ tài sản của công ty như thế nào?","opts":{"A":"Bằng toàn bộ tài sản cá nhân","B":"Theo tỷ lệ chia cổ tức","C":"Trong phạm vi số cổ phần đã góp","D":"Theo thỏa thuận trong điều lệ"},"ans":["C"],"exp":"","note":"","multi":false,"id":855,"fix":false,"sets":{}},{"topic":"cd7","src":"Bộ đề CĐ7 câu 50","q":"Công ty cổ phần có thể huy động vốn bằng cách nào sau đây?","opts":{"A":"Vay từ ngân hàng","B":"Phát hành cổ phiếu","C":"Góp vốn liên doanh","D":"Tất cả các hình thức trên"},"ans":["D"],"exp":"","note":"","multi":false,"id":856,"fix":false,"sets":{}},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thu nhập từ chuyển nhượng nhà ở, quyền sử dụng đất ở và tài sản gắn liền với đất ở của cá nhân trong trường hợp cá nhân chỉ có một nhà ở, đất ở duy nhất thuộc loại thu nhập gì?","opts":{"A":"Thu nhập chịu thuế","B":"Thu nhập được miễn thuế","C":"Thu nhập từ đầu tư vốn.","D":"Thu nhập từ việc trúng thưởng."},"ans":["B"],"exp":"Theo quy định của Luật Thuế thu nhập cá nhân (TNCN), đây là một trong các trường hợp được miễn thuế TNCN. Căn cứ pháp lý: Điểm b, Khoản 1, Điều 3 Thông tư 111/2013/TT-BTC (hướng dẫn Luật Thuế TNCN) quy định miễn thuế đối với \"Thu nhập từ chuyển nhượng nhà ở, quyền sử dụng đất ở và tài sản gắn liền với đất ở của cá nhân trong trường hợp cá nhân chỉ có một nhà ở, đất ở duy nhất tại Việt Nam.\" Điều kiện (tính đến 11/2025): Cá nhân phải đáp ứng đủ 3 điều kiện: 1. Chỉ có duy nhất quyền sở hữu một nhà ở hoặc quyền sử dụng một thửa đất ở (bao gồm cả trường hợp có nhà ở hoặc công trình xây dựng gắn liền với thửa đất đó) tại thời điểm chuyển nhượng. 2. Có quyền sở hữu nhà ở, quyền sử dụng đất ở tính đến thời điểm chuyển nhượng tối thiểu là 183 ngày. 3. Chuyển nhượng toàn bộ nhà ở, đất ở đó.","note":"","multi":false,"id":157,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Giá chuyển nhượng từng lần và thuế suất có phải là căn cứ tính thuế đối với thu nhập từ chuyển nhượng bất động sản không?","opts":{"A":"Do các bên quy định cách tính thuế","B":"Là hai căn cứ quan trọng để tính thuế thu nhập từ chuyển nhượng bất động sản.","C":"Không phải là căn cứ để tính thuế thu nhập từ chuyển nhượng bất động sản.","D":"Luật không quy đinh phải tính thuế."},"ans":["B"],"exp":"Đối với cá nhân, thuế TNCN từ chuyển nhượng BĐS được xác định bằng cách lấy giá chuyển nhượng nhân với thuế suất. Căn cứ pháp lý: Điều 17 Thông tư 92/2015/TT-BTC (sửa đổi Điều 12 Thông tư 111/2013/TTBTC) quy định công thức: Thuế TNCN phải nộp = Giá chuyển nhượng x Thuế suất 2% Do đó, giá chuyển nhượng và thuế suất (2%) là hai căn cứ bắt buộc để tính thuế.","note":"","multi":false,"id":158,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thu nhập từ chuyển nhượng quyền sở hữu hoặc sử dụng nhà ở thuộc loại thu nhập gì?","opts":{"A":"Thu nhập chịu thuế.","B":"Thu nhập được miễn thuế.","C":"Thu nhập trúng thưởng.","D":"Thu nhập từ đầu tư vốn."},"ans":["A"],"exp":"Đây là một trong 10 loại thu nhập chịu thuế TNCN theo quy định. Căn cứ pháp lý: Khoản 5, Điều 2 Thông tư 111/2013/TT-BTC (hướng dẫn Điều 3 Luật Thuế TNCN 2007) quy định \"Thu nhập từ chuyển nhượng bất động sản\" là thu nhập chịu thuế. Điều này bao gồm thu nhập từ chuyển nhượng quyền sử dụng đất; quyền sử dụng đất có tài sản gắn liền với đất; quyền sở hữu nhà ở...","note":"","multi":false,"id":159,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Mức thuế suất đối với hoạt động chuyển nhượng bất động sản của doanh nghiệp là bao nhiêu?","opts":{"A":"10%","B":"15%","C":"20% (Lợi nhuận = doanh thu – chi phí)","D":"25%"},"ans":["C"],"exp":"Thu nhập từ hoạt động chuyển nhượng BĐS của doanh nghiệp phải hạch toán riêng và chịu thuế suất Thuế thu nhập doanh nghiệp (TNDN) phổ thông. Căn cứ pháp lý: Điều 11 Thông tư 78/2014/TT-BTC (hướng dẫn Luật Thuế TNDN) quy định, kể từ ngày 01/01/2016, thuế suất thuế TNDN phổ thông là 20%. Thu nhập từ chuyển nhượng BĐS cũng áp dụng mức thuế suất này (trừ các trường hợp ưu đãi đặc biệt).","note":"","multi":false,"id":160,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Khi chuyển nhượng bất động sản thì doanh nghiệp phải chịu thuế nào sau đây?","opts":{"A":"Thuế tiêu thụ đặc biệt.","B":"Thuế chuyển nhượng bất động sản.","C":"Thuế thu nhập doanh nghiệp.","D":"Thuế thu nhập cá nhân."},"ans":["C"],"exp":"Khi doanh nghiệp phát sinh thu nhập (lợi nhuận) từ hoạt động chuyển nhượng BĐS, khoản thu nhập này sẽ phải chịu thuế TNDN. \"Thuế chuyển nhượng bất động sản\" không phải là tên một sắc thuế riêng biệt, mà là cách gọi của hoạt động chịu thuế TNCN (đối với cá nhân) hoặc TNDN (đối với doanh nghiệp). Căn cứ pháp lý: Điều 1 và Điều 17 Thông tư 78/2014/TT-BTC.","note":"","multi":false,"id":161,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Trong trường hợp cá nhân đã có nhà ở, đất ở khi chuyển nhượng nhà ở, quyền sử dụng đất ở và tài sản gắn liền với đất ở thì phải nộp loại thuế gì?","opts":{"A":"Thuế thu nhập doanh nghiệp.","B":"Thuế chuyển nhượng bất động sản.","C":"Thuế thu nhập cá nhân.","D":"Thuế tiêu thụ đặc biệt."},"ans":["C"],"exp":"Khi cá nhân không đáp ứng điều kiện \"chỉ có một nhà ở, đất ở duy nhất\" (như Câu 1), thì thu nhập từ việc chuyển nhượng BĐS (thứ hai trở đi) sẽ là thu nhập chịu thuế TNCN. Căn cứ pháp lý: Khoản 5, Điều 2 Thông tư 111/2013/TT-BTC.","note":"","multi":false,"id":162,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Cơ quan nào quy định lệ phí cấp chứng chỉ hành nghề môi giới bất động sản?","opts":{"A":"Chính phủ","B":"Bộ Xây dựng","C":"Bộ Tài Chính B. UBND cấp tỉnh"},"ans":["C"],"exp":"Theo Luật Phí và Lệ phí, Bộ Tài chính là cơ quan có thẩm quyền ban hành văn bản quy định mức thu các loại phí, lệ phí thuộc thẩm quyền trung ương. Mặc dù Bộ Xây dựng (và Sở Xây dựng theo Luật Kinh doanh BĐS 2023) tổ chức thi sát hạch và cấp chứng chỉ, nhưng Bộ Tài chính là cơ quan quy định mức thu lệ phí (hoặc phí sát hạch). Căn cứ pháp lý: Điều 21 Luật Phí và Lệ phí 2015. Ví dụ cụ thể là các Thông tư do Bộ Tài chính ban hành quy định mức thu phí trong lĩnh vực xây dựng và kinh doanh BĐS (như Thông tư 10/2023/TT-BTC).","note":"","multi":false,"id":163,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Cá nhân có thu nhập từ hoạt động chuyển nhượng bất động sản thì mức thuế thu nhập cá nhân được tính như thế nào?","opts":{"A":"Bằng giá chuyển nhượng x 2%.","B":"Bằng giá chuyển nhượng x 5%.","C":"Bằng giá chuyển nhượng x 10%.","D":"Bằng giá chuyển nhượng x 15%."},"ans":["A"],"exp":"Đây là thuế suất cố định áp dụng trên tổng giá trị chuyển nhượng từng lần, bất kể người nộp thuế lời hay lỗ. Căn cứ pháp lý: Điều 17 Thông tư 92/2015/TT-BTC.","note":"","multi":false,"id":164,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thời điểm tính thuế khi hợp đồng chuyển nhượng có thỏa thuận bên mua là người nộp thuế thay cho bên bán?","opts":{"A":"Là thời điểm hợp đồng chuyển nhượng có hiệu lực theo quy định của pháp luật.","B":"Là thời điểm làm thủ tục đăng ký quyền sở hữu, quyền sử dụng bất động sản.","C":"Là thời điểm cá nhân nộp hồ sơ khai thuế với cơ quan thuế."},"ans":["B"],"exp":"Đây là thời điểm cá nhân (hoặc người được ủy quyền/người nộp thay) nộp hồ sơ tại cơ quan đăng ký đất đai (Văn phòng Đăng ký đất đai) để làm thủ tục sang tên. Căn cứ pháp lý: Điểm b, Khoản 5, Điều 12 Thông tư 111/2013/TT-BTC.","note":"","multi":false,"id":165,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Anh chị cho biết, mức thu lệ phí trước bạ của nhà và đất ở Việt Nam là bao nhiêu phần trăm?","opts":{"A":"0,2%","B":"0,5%","C":"1,0%","D":"1,5%"},"ans":["B"],"exp":"Mức thu lệ phí trước bạ (LPTB) đối với nhà, đất là 0,5% trên giá tính LPTB. Giá tính LPTB là giá tại Bảng giá đất do UBND cấp tỉnh ban hành (theo Luật Đất đai 2024) hoặc giá trong hợp đồng chuyển nhượng, tùy theo giá nào cao hơn. Căn cứ pháp lý: Khoản 1, Điều 8 Nghị định 10/2022/NĐ-CP.","note":"","multi":false,"id":166,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Cơ quan nào có trách nhiệm giúp Chính phủ thực hiện thống nhất quản lý nhà nước về phí, lệ phí?","opts":{"A":"Ủy ban Thường vụ Quốc Hội","B":"Chính Phủ","C":"Bộ Tài chính","D":"Bộ Xây dựng"},"ans":["C"],"exp":"Bộ Tài chính là cơ quan đầu ngành, chịu trách nhiệm trước Chính phủ về quản lý nhà nước đối với lĩnh vực phí và lệ phí trên toàn quốc. Căn cứ pháp lý: Điều 27 Luật Phí và Lệ phí 2015.","note":"","multi":false,"id":167,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thu nhập chịu thuế từ chuyển nhượng BĐS được xác định như thế nào?","opts":{"A":"Bằng doanh thu thu được từ hoạt động chuyển nhượng BĐS trừ giá vốn của BĐS và các khoản chi phí được trừ liên quan đến hoạt động chuyển nhượng BĐS.","B":"Bằng doanh thu thu được từ hoạt động chuyển nhượng BĐS trừ giá vốn của BĐS.","C":"Bằng doanh thu thu được từ hoạt động chuyển nhượng BĐS trừ các khoản chi phí được trừ liên quan đến hoạt động chuyển nhượng BĐS.","D":"Bằng doanh thu thu được từ hoạt động chuyển nhượng BĐS cộng giá vốn của BĐS và các khoản chi phí được trừ liên quan đến hoạt động chuyển nhượng BĐS."},"ans":["A"],"exp":"Đây là công thức xác định thu nhập chịu thuế (lợi nhuận) của doanh nghiệp. Thu nhập chịu thuế = Doanh thu - Chi phí được trừ. Trong đó, chi phí được trừ bao gồm giá vốn (giá mua, chi phí đền bù, tiền sử dụng đất...) và các chi phí liên quan khác (chi phí xây dựng, sửa chữa, môi giới, lãi vay...). Căn cứ pháp lý: Điều 17 Thông tư 78/2014/TT-BTC (được sửa đổi bởi Điều 9 Thông tư 96/2015/TT-BTC).","note":"","multi":false,"id":168,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thời điểm tính thuế khi làm thủ tục đăng ký quyền sở hữu, quyền sử dụng bất động sản được áp dụng trong trường hợp nào?","opts":{"A":"Khi hợp đồng chuyển nhượng không có thỏa thuận bên mua là người nộp thuế thay cho bên bán","B":"Khi hợp đồng chuyển nhượng có thỏa thuận bên mua là người nộp thuế thay cho bên bán","C":"Khi cá nhân nhận chuyển nhượng nhà ở hình thành trong tương lai, quyền sử dụng đất gắn với công trình xây dựng tương lai"},"ans":["B"],"exp":"Căn cứ pháp lý:.","note":"","multi":false,"id":169,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thời điểm tính thuế khi cá nhân nộp hồ sơ khai thuế với cơ quan thuế được áp dụng trong trường hợp nào?","opts":{"A":"Khi hợp đồng chuyển nhượng không có thỏa thuận bên mua là người nộp thuế thay cho bên bán","B":"Khi hợp đồng chuyển nhượng có thỏa thuận bên mua là người nộp thuế thay cho bên bán","C":"Khi cá nhân nhận chuyển nhượng nhà ở hình thành trong tương lai, quyền sử dụng đất gắn với công trình xây dựng tương lai"},"ans":["C"],"exp":"Đối với nhà ở, công trình hình thành trong tương lai, cá nhân có thể khai và nộp thuế tại cơ quan thuế mà chưa cần làm thủ tục đăng ký sang tên (vì sổ đỏ/sổ hồng có thể chưa có). Căn cứ pháp lý: Điểm c, Khoản 5, Điều 12 Thông tư 111/2013/TT-BTC (được bổ sung tại Khoản 17, Điều 2 Thông tư 92/2015/TT-BTC).","note":"","multi":false,"id":170,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thời điểm tính thuế khi hợp đồng chuyển nhượng có hiệu lực theo quy định của pháp luật được áp dụng trong trường hợp nào?","opts":{"A":"Khi hợp đồng chuyển nhượng không có thỏa thuận bên mua là người nộp thuế thay cho bên bán","B":"Khi hợp đồng chuyển nhượng có thỏa thuận bên mua là người nộp thuế thay cho bên bán","C":"Khi cá nhân nhận chuyển nhượng nhà ở hình thành trong tương lai, quyền sử dụng đất gắn với công trình xây dựng tương lai"},"ans":["C"],"exp":"Câu hỏi này có sự giao thoa với Câu 14. \"Thời điểm hợp đồng có hiệu lực\" không phải là thời điểm tính thuế TNCN điển hình (thời điểm tính thuế là \"thời điểm nộp hồ sơ\" hoặc \"thời điểm đăng ký\"). Tuy nhiên, trong 3 lựa chọn, trường hợp (C) là gần nhất, vì khi nộp hồ sơ (như Câu 14), cá nhân nộp hồ sơ dựa trên hợp đồng đã có hiệu lực, ngay cả khi chưa làm thủ tục đăng ký. Lưu ý: \"Thời điểm HĐ có hiệu lực\" thường là thời điểm xác định doanh thu đối với doanh nghiệp nộp tiền theo tiến độ, không phải cá nhân. Nhưng trong bối cảnh các câu hỏi này, (C) là lựa chọn hợp lý nhất.","note":"","multi":false,"id":171,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thu nhập từ chuyển nhượng quyền sở hữu hoặc quyền sử dụng nhà ở là loại thu nhập nào?","opts":{"A":"Thu nhập miễn thuế","B":"Thu nhập từ hoạt động chuyển nhượng bất động sản","C":"Thu nhập từ cho thuê lại đất của doanh nghiệp kinh doanh bất động sản","D":"Thu nhập của doanh nghiệp."},"ans":["B"],"exp":"Đây là tên gọi chung của nhóm thu nhập chịu thuế TNCN (nếu là cá nhân) hoặc TNDN (nếu là doanh nghiệp) khi chuyển nhượng nhà hoặc đất. Căn cứ pháp lý: Khoản 5, Điều 2 Thông tư 111/2013/TT-BTC (đối với cá nhân) và Điều 17 Thông tư 78/2014/TT-BTC (đối với doanh nghiệp).","note":"","multi":false,"id":172,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Đâu là các khoản thu nhập chịu thuế thu nhập doanh nghiệp từ chuyển nhượng bất động sản?","opts":{"A":"Thu nhập từ chuyển quyền sử dụng đất","B":"Thu nhập từ chuyển nhượng quyền thuê đất","C":"Thu nhập từ chuyển nhượng các tài sản khác gắn liền với đất đai","D":"Cả ba khoản thu nhập trên"},"ans":["D"],"exp":"Thu nhập từ chuyển nhượng BĐS của doanh nghiệp bao gồm tất cả các hình thức: chuyển quyền sử dụng đất; chuyển quyền thuê đất; và chuyển nhượng tài sản (nhà, công trình) gắn liền với đất. Căn cứ pháp lý: Khoản 1, Điều 17 Thông tư 78/2014/TT-BTC.","note":"","multi":false,"id":173,"sets":{},"fix":false},{"topic":"cd8","src":"Tài liệu ôn thi cơ sở 02","q":"Thời điểm xác định doanh thu để tính thu nhập chịu thuế từ hoạt động chuyển nhượng bất động sản là khi nào?","opts":{"A":"Thời điểm nộp thuế chuyển nhượng bất động sản","B":"Thời điểm bàn giao bất động sản.","C":"Thời điểm doanh nghiệp thu tiền","D":"Thời điểm đăng ký quyền sử dụng bất động sản"},"ans":["B"],"exp":"Đối với doanh nghiệp, thời điểm ghi nhận doanh thu tính thuế TNDN (trừ trường hợp thu tiền theo tiến độ) là thời điểm bàn giao BĐS cho người mua, không phụ thuộc vào thời điểm người mua đã đăng ký quyền sở hữu hay chưa. Căn cứ pháp lý: Khoản 2, Điều 17 Thông tư 78/2014/TT-BTC (được sửa đổi tại Khoản 3, Điều 9 Thông tư 96/2015/TT-BTC). CÁC CÂU HỎI ÔN TẬP THÊM I. THUẾ GIÁ TRỊ GIA TĂNG (GTGT)","note":"","multi":false,"id":174,"sets":{},"fix":false},{"topic":"cd8","src":"Bộ đề CĐ8 câu 1","q":"Trong giao dịch mua bán nhà đất giữa vợ và chồng (quan hệ hôn nhân), loại thuế nào được miễn theo quy định?","opts":{"A":"Thuế thu nhập cá nhân","B":"Thuế giá trị gia tăng","C":"Thuế sử dụng đất phi nông nghiệp","D":"Thuế môn bài"},"ans":["A"],"exp":"","note":"","multi":false,"id":857,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 2 · Đề 1A câu 24","q":"Một hợp đồng chuyển nhượng bất động sản được ghi nhận sai giá (không phản ánh đúng giá giao dịch thực tế). Hậu quả của việc kê khai sai giá này là:","opts":{"A":"Doanh nghiệp được giảm thuế phải nộp hợp pháp","B":"Dễ dẫn đến sai tính số thuế phải nộp và bị xử phạt","C":"Không ảnh hưởng vì chỉ là lỗi về hình thức","D":"Chỉ cần điều chỉnh hồ sơ trong lần kê khai sau"},"ans":["B"],"exp":"","note":"","multi":false,"id":858,"fix":false,"sets":{"1A":24}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 3","q":"Đối với hoạt động kinh doanh bất động sản, thuế giá trị gia tăng thường áp dụng mức thuế suất nào?","opts":{"A":"5%","B":"10%","C":"15%","D":"20%"},"ans":["B"],"exp":"","note":"","multi":false,"id":859,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 4","q":"Thuế sử dụng đất phi nông nghiệp đối với đất ở theo quy định hiện hành được tính theo mức nào sau đây?","opts":{"A":"Từ 0,01% đến 0,03%","B":"Từ 0,03% đến 0,15%","C":"Từ 0,2% đến 0,5%","D":"Từ 1% đến 2%"},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc tô A. Thuế SDĐ phi nông nghiệp đối với đất ở theo biểu lũy tiến 0,03% – 0,07% – 0,15%.","multi":false,"id":860,"fix":true,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 5","q":"Một doanh nghiệp bất động sản phải nộp Thuế Giá Trị Gia Tăng (VAT) với mức thuế suất 10%. Cách tính VAT trong hoạt động Kinh doanh bất động sản là:","opts":{"A":"Tính trên tổng doanh thu trước trừ chi phí","B":"Tính trên giá trị tăng thêm (chênh lệch giữa giá bán và giá mua hoặc chi phí)","C":"Tính trên lợi nhuận sau thuế","D":"Tính trên giá trị tài sản cố định"},"ans":["B"],"exp":"","note":"","multi":false,"id":861,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 6","q":"Thuế sử dụng đất phi nông nghiệp áp dụng mức thuế từ 0,03% đến 0,15%. Cơ sở tính thuế này thường được xác định dựa trên:","opts":{"A":"Diện tích đất và giá trị đất theo bảng giá đất của UBND tỉnh","B":"Tổng doanh thu của doanh nghiệp sử dụng đất","C":"Giá trị của công trình xây dựng trên đất","D":"Số năm sử dụng đất"},"ans":["A"],"exp":"","note":"","multi":false,"id":862,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 7 · Đề 2A câu 20","q":"Trong giao dịch chuyển nhượng bất động sản, bên bán phải đóng Thuế Thu Nhập Cá Nhân (TNCN) là 2% trên giá chuyển nhượng ghi trên hợp đồng. Tuy nhiên, trường hợp nào bên bán có thể được miễn thuế TNCN?","opts":{"A":"Nếu bên bán đã sở hữu nhiều bất động sản","B":"Nếu bên bán là tổ chức kinh doanh","C":"Nếu bất động sản chuyển nhượng là duy nhất và đã sở hữu trên 183 ngày","D":"Nếu bên mua chịu toàn bộ chi phí thuế"},"ans":["C"],"exp":"","note":"","multi":false,"id":863,"fix":false,"sets":{"2A":20}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 8","q":"Khi giao dịch mua bán nhà đất, bên mua phải đóng lệ phí trước bạ với mức 0,5% trên giá đất theo bảng giá đất. Lỗi thường gặp khi tính lệ phí trước bạ là:","opts":{"A":"Nhầm lẫn giữa diện tích đất và diện tích xây dựng","B":"Tính theo giá thị trường thay vì theo bảng giá đất do UBND cấp tỉnh quy định","C":"Áp dụng sai mức thuế suất VAT","D":"Sử dụng sai tỉ lệ phần trăm của Thuế Môn Bài"},"ans":["B"],"exp":"","note":"","multi":false,"id":864,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 9","q":"Trong một giao dịch mua bán bất động sản, hai bên sử dụng “vi bằng” thay cho hợp đồng công chứng. Hệ quả của việc này là:","opts":{"A":"Vi bằng có giá trị pháp lý như hợp đồng công chứng","B":"Người mua có thể không được đảm bảo quyền sử dụng tài sản do không có căn cứ pháp lý cao","C":"Vi bằng giúp giảm chi phí giao dịch mà không có rủi ro pháp lý","D":"Vi bằng chỉ áp dụng đối với giao dịch thương mại, không phải bất động sản"},"ans":["B"],"exp":"","note":"","multi":false,"id":865,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 10","q":"Ai là đối tượng phải nộp phí thẩm định hồ sơ cấp giấy chứng nhận quyền sử dụng đất?","opts":{"A":"Người xin cấp giấy chứng nhận lần đầu hoặc khi có nhu cầu cấp đổi, cấp lại giấy chứng nhận quyền sử dụng đất","B":"Tất cả hộ gia đình đang sử dụng đất","C":"Người thuê đất trả tiền thuê hàng năm","D":"Chỉ doanh nghiệp xin cấp giấy chứng nhận"},"ans":["A"],"exp":"","note":"","multi":false,"id":866,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 11","q":"Mức lệ phí môn bài tối đa mà doanh nghiệp kinh doanh bất động sản phải nộp hàng năm là bao nhiêu?","opts":{"A":"1.000.000 đồng","B":"2.000.000 đồng","C":"3.000.000 đồng","D":"5.000.000 đồng"},"ans":["C"],"exp":"","note":"","multi":false,"id":867,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 12 · Đề 1A câu 25","q":"Thuế bảo vệ môi trường được áp dụng đối với nhiều lĩnh vực, chẳng hạn như chất thải rắn sinh hoạt, túi ni lông, xăng dầu,… Mục đích chính của loại thuế này là:","opts":{"A":"Tăng doanh thu cho ngân sách nhà nước","B":"Hạn chế các hành vi gây ô nhiễm và khuyến khích bảo vệ môi trường","C":"Giảm chi phí sản xuất cho doanh nghiệp","D":"Hỗ trợ phát triển ngành công nghiệp ô tô"},"ans":["B"],"exp":"","note":"","multi":false,"id":868,"fix":false,"sets":{"1A":25}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 13","q":"Khi chuyển nhượng nhà đất, mức thuế thu nhập cá nhân thường được áp dụng theo cách tính phổ biến nào?","opts":{"A":"10% trên thu nhập chịu thuế","B":"2% trên giá trị chuyển nhượng","C":"0,5% trên giá trị chuyển nhượng","D":"25% trên giá trị lợi nhuận"},"ans":["B"],"exp":"","note":"","multi":false,"id":869,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 14","q":"Một doanh nghiệp bất động sản nộp hồ sơ khai thuế quá thời hạn quy định. Hành vi này có thể dẫn đến:","opts":{"A":"Không bị xử phạt nếu số thuế nộp đúng","B":"Bị xử phạt hành chính về thuế do vi phạm kê khai và nộp thuế đúng hạn","C":"Được miễn phạt nếu lý do khách quan","D":"Chỉ bị cảnh cáo mà không có hình thức phạt nào khác"},"ans":["B"],"exp":"","note":"","multi":false,"id":870,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 15","q":"Mức thu lệ phí trước bạ đối với nhà, đất là bao nhiêu phần trăm?","opts":{"A":"1%","B":"0,5%","C":"2%","D":"5%"},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc tô cả 1% và 0,5%. Lệ phí trước bạ nhà, đất là 0,5%.","multi":false,"id":871,"fix":true,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 16","q":"Khi chuyển đổi mục đích sử dụng đất, hộ gia đình cần thực hiện các bước cơ bản nào sau đây?","opts":{"A":"Nộp hồ sơ chuyển mục đích sử dụng đất, chờ phê duyệt, thực hiện nghĩa vụ tài chính và nhận kết quả","B":"Chỉ cần nộp hồ sơ và tự cập nhật thông tin trên GCN","C":"Thực hiện đo đạc và tự điều chỉnh giá đất","D":"Liên hệ trực tiếp với UBND cấp tỉnh để được miễn phí chuyển đổi"},"ans":["A"],"exp":"","note":"","multi":false,"id":872,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 17 · Đề 2A câu 21","q":"Mức thu phí đối với việc công chứng hợp đồng giao dịch bất động sản trị giá từ 100 triệu đến 1 tỷ đồng là bao nhiêu %","opts":{"A":"0,1% giá trị tài sản","B":"0,2% giá trị tài sản","C":"0,5% giá trị tài sản","D":"1% giá trị tài sản"},"ans":["A"],"exp":"","note":"","multi":false,"id":873,"fix":false,"sets":{"2A":21}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 18","q":"Mức thu phí đối với việc công chứng hợp đồng giao dịch tài sản trị giá từ 50 triệu đến dưới 100 triệu đồng là bao nhiêu?","opts":{"A":"50.000 đ","B":"100.000 đ","C":"0,1% giá trị tài sản","D":"0,2% giá trị tài sản"},"ans":["B"],"exp":"","note":"","multi":false,"id":874,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 19","q":"Những ai được miễn thuế thu nhập cá nhân khi chuyển nhượng nhà đất?","opts":{"A":"Người có nhiều nhà, đất","B":"Người không có mã số thuế","C":"Người có quan hệ hôn nhân, huyết thống, nuôi dưỡng","D":"Mọi trường hợp nếu giao dịch dưới 500 triệu đồng"},"ans":["C"],"exp":"","note":"","multi":false,"id":875,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 20","q":"Trong giao dịch chuyển nhượng bất động sản, bên bán phải nộp Thuế Thu Nhập Cá Nhân (TNCN) theo mức 2% trên giá chuyển nhượng ghi trên hợp đồng. Trường hợp nào bên bán có thể được miễn nộp thuế này?","opts":{"A":"Khi bất động sản chuyển nhượng có giá trị thấp","B":"Khi bất động sản chuyển nhượng là duy nhất và đã sở hữu trên 183 ngày","C":"Khi bên mua chịu toàn bộ chi phí thuế","D":"Khi bất động sản chuyển nhượng là của doanh nghiệp"},"ans":["B"],"exp":"","note":"","multi":false,"id":876,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 21","q":"Trong một giao dịch mua bán nhà giữa anh H và chị L (quan hệ hôn nhân), bên bán có bị tính Thuế thu nhập cá nhân theo mức 2% không?","opts":{"A":"Có, vì thuế TNCN áp dụng cho mọi giao dịch chuyển nhượng","B":"Không, vì giao dịch giữa người có quan hệ hôn nhân được miễn thuế TNCN","C":"Có, nhưng thuế TNCN được tính theo biểu lũy tiến"},"ans":["B"],"exp":"","note":"","multi":false,"id":877,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 22 · Đề 1A câu 26","q":"Khi giao dịch mua bán bất động sản, bên mua và bên bán sử dụng “vi bằng” thay cho hợp đồng công chứng. Hậu quả pháp lý của việc sử dụng vi bằng là:","opts":{"A":"Vi bằng có giá trị pháp lý tương đương hợp đồng công chứng","B":"Người mua không được bảo đảm quyền sở hữu tài sản, gây tranh chấp sau này","C":"Vi bằng giúp tiết kiệm chi phí mà vẫn đảm bảo quyền lợi","D":"Cơ quan công chứng sẽ tự động chuyển đổi vi bằng thành hợp đồng công chứng"},"ans":["B"],"exp":"","note":"","multi":false,"id":878,"fix":false,"sets":{"1A":26}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 23","q":"Trong giao dịch chuyển nhượng bất động sản, nếu hợp đồng chuyển nhượng ghi sai giá so với giá thực tế, hậu quả có thể bao gồm:","opts":{"A":"Hợp đồng được cơ quan công chứng điều chỉnh tự động","B":"Sai sót dẫn đến tính sai số thuế (TNCN, lệ phí trước bạ) và nguy cơ bị xử phạt","C":"Không ảnh hưởng vì chỉ là lỗi về hình thức","D":"Bên mua và bên bán có thể tự thỏa thuận điều chỉnh sau này"},"ans":["B"], y đổi?","opts":{"A":"Không có trường hợp nào.","B":"Có thể thay đổi nếu giá trị bất động sản lớn.","C":"Có thể thay đổi theo quy định của Hội đồng nhân dân cấp tỉnh đối với một số khu vực đặc thù.","D":"Tùy thuộc vào mục đích sử dụng đất."},"ans":["C"],"exp":"","note":"","multi":false,"id":916,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 61","q":"Chi phí nào sau đây được trừ khi tính thu nhập chịu thuế thu nhập doanh nghiệp từ hoạt động chuyển nhượng bất động sản?","opts":{"A":"Chi phí bồi thường, giải phóng mặt bằng.","B":"Chi phí đầu tư cơ sở hạ tầng.","C":"Chi phí quảng cáo, tiếp thị.","D":"Tất cả các chi phí trên nếu có đủ hóa đơn, chứng từ hợp lệ."},"ans":["D"],"exp":"","note":"","multi":false,"id":917,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 62 · Đề 1A câu 10","q":"Một cá nhân bán một căn hộ đã sở hữu được 5 năm nhưng đó là căn hộ thứ hai của họ. Thuế Thu nhập cá nhân phải nộp là bao nhiêu?","opts":{"A":"Miễn thuế.","B":"2% trên giá chuyển nhượng.","C":"5% trên giá chuyển nhượng.","D":"10% trên thu nhập tính thuế."},"ans":["B"],"exp":"","note":"","multi":false,"id":918,"fix":false,"sets":{"1A":10}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 63","q":"Chi phí bồi thường, giải phóng mặt bằng được tính vào giá vốn khi chuyển nhượng bất động sản có bao gồm cả các khoản chi phí liên quan đến việc hỗ trợ người bị thu hồi đất không?","opts":{"A":"Có, nếu có đầy đủ chứng từ hợp lệ.","B":"Không, các chi phí này là chi phí riêng.","C":"Tùy thuộc vào loại bất động sản.","D":"Chỉ bao gồm chi phí trực tiếp bồi thường đất."},"ans":["A"],"exp":"","note":"","multi":false,"id":919,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 64 · Đề 1A câu 28","q":"Mức phạt chậm nộp thuế được tính trên cơ sở nào?","opts":{"A":"Số ngày chậm nộp và số tiền thuế chậm nộp.","B":"Số tiền thuế chậm nộp và mức lãi suất ngân hàng.","C":"Số tiền thuế chậm nộp và mức phạt cố định.","D":"Tùy thuộc vào cơ quan thuế."},"ans":["A"],"exp":"","note":"","multi":false,"id":920,"fix":false,"sets":{"1A":28}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 65","q":"Lệ phí địa chính có thể được miễn hoặc giảm trong một số trường hợp không?","opts":{"A":"Không, lệ phí này là bắt buộc.","B":"Có, tùy thuộc vào chính sách của từng địa phương.","C":"Chỉ miễn giảm cho hộ nghèo.","D":"Chỉ miễn giảm cho các dự án của nhà nước."},"ans":["B"],"exp":"","note":"","multi":false,"id":921,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 66","q":"Tiền sử dụng đất được coi là một khoản thuế hay một khoản thu ngân sách nhà nước?","opts":{"A":"Một loại thuế trực thu.","B":"Một loại lệ phí.","C":"Một khoản thu ngân sách nhà nước.","D":"Cả A và B đều đúng."},"ans":["C"],"exp":"","note":"","multi":false,"id":922,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 67 · Đề 2A câu 26","q":"Cá nhân có thể tự kê khai và nộp thuế Thu nhập cá nhân từ chuyển nhượng bất động sản ở đâu?","opts":{"A":"Tại cơ quan công chứng.","B":"Tại cơ quan thuế.","C":"Tại kho bạc nhà nước.","D":"Cả A và B đều đúng."},"ans":["B"],"exp":"","note":"","multi":false,"id":923,"fix":false,"sets":{"2A":26}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 68","q":"Các khoản tiền phạt vi phạm hành chính về thuế có được tính vào chi phí được trừ khi tính thuế Thu nhập doanh nghiệp không?","opts":{"A":"Có.","B":"Không.","C":"Tùy thuộc vào mức phạt.","D":"Tùy thuộc vào loại vi phạm."},"ans":["B"],"exp":"","note":"","multi":false,"id":924,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 69","q":"Đâu là một trong những loại phí, lệ phí bắt buộc khi thực hiện công chứng hợp đồng mua bán bất động sản?","opts":{"A":"Phí công chứng.","B":"Lệ phí địa chính.","C":"Phí thẩm định hồ sơ.","D":"Lệ phí trước bạ."},"ans":["A"],"exp":"","note":"","multi":false,"id":925,"fix":false,"sets":{}},{"topic":"cd8","src":"Bộ đề CĐ8 câu 70","q":"Các chi phí nào sau đây không được tính vào chi phí được trừ khi tính thuế Thu nhập doanh nghiệp từ chuyển nhượng bất động sản của doanh nghiệp?","opts":{"A":"Chi phí lãi vay.","B":"Chi phí quảng cáo, tiếp thị.","C":"Chi phí khấu hao tài sản cố định.","D":"Chi phí không có hóa đơn, chứng từ hợp lệ."},"ans":["D"],"exp":"","note":"","multi":false,"id":926,"fix":false,"sets":{}},{"topic":"cd8","src":"Đề 1A câu 7","q":"Đâu là những loại thuế chính mà các doanh nghiệp kinh doanh bất động sản phải nộp?","opts":{"A":"Thuế Thu nhập cá nhân (TNCN)","B":"Thuế sử dụng đất phi nông nghiệp","C":"Thuế Môn bài","D":"Cả B và C đều đúng"},"ans":["D"],"exp":"","note":"","multi":false,"id":927,"fix":false,"sets":{"1A":7}},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Cụm từ ngữ: “Khách hàng không cung cấp được các thông tin liên quan đến bất động sản hoặc không muốn cung cấp bổ sung thông tin về nhân thân” là dấu hiệu đáng ngờ trong lĩnh vực nào?","opts":{"A":"Chứng khoán","B":"Ngân hàng","C":"Kinh doanh bất động sản","D":"Kinh doanh bảo hiểm nhân thọ"},"ans":["C"],"exp":"Đây là một trong 10 dấu hiệu đáng ngờ cơ bản trong lĩnh vực kinh doanh bất động sản được quy định rõ. Khi khách hàng cố tình che giấu thông tin hoặc thông tin không rõ ràng, đó là một \"cờ đỏ\" (red flag) mà đối tượng báo cáo (sàn giao dịch, nhà môi giới) phải đặc biệt lưu ý. Căn cứ pháp lý: Mục 5, Phụ lục I (Các dấu hiệu đáng ngờ trong lĩnh vực kinh doanh bất động sản) ban hành kèm theo Thông tư 09/2023/TT-BXD ngày 13/10/2023 của Bộ Xây dựng.","note":"","multi":false,"id":175,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Cơ quan nào chủ trì, phối hợp các cơ quan có liên quan để triển khai các biện pháp phòng, chống rửa tiền trong lĩnh vực kinh doanh BĐS?","opts":{"A":"Cục Phòng, chống rửa tiền- Ngân hàng nhà nước.","B":"Bộ Tài chính.","C":"Bộ Xây dựng.","D":"Bộ Công an."},"ans":["C"],"exp":"Ngân hàng Nhà nước là cơ quan đầu mối chịu trách nhiệm chung về AML, nhưng mỗi Bộ/ngành phải chịu trách nhiệm AML trong lĩnh vực mình quản lý. Đối với hoạt động kinh doanh BĐS, Bộ Xây dựng là cơ quan chủ trì. Căn cứ pháp lý: Khoản 5, Điều 49 Luật Phòng, chống rửa tiền (PCRT) số 14/2022/QH15 quy định trách nhiệm của Bộ Xây dựng.","note":"","multi":false,"id":176,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Cơ quan nào thống nhất quản lý nhà nước về phòng, chống rửa tiền?","opts":{"A":"Quốc hội","B":"Chính phủ","C":"Bộ Tài chính","D":"Ngân hàng Nhà nước Việt Nam"},"ans":["B"],"exp":"Chính phủ là cơ quan thực hiện việc thống nhất quản lý nhà nước. Ngân hàng Nhà nước Việt Nam (Câu D) là cơ quan chịu trách nhiệm trước Chính phủ chủ trì, phối hợp thực hiện việc quản lý này, nhưng cơ quan thống nhất quản lý cao nhất là Chính phủ. Căn cứ pháp lý: Điều 47 Luật PCRT 2022.","note":"","multi":false,"id":177,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Hành vi “Rửa tiền” trong Luật phòng, chống rửa tiền được hiểu là gì?","opts":{"A":"Là giao dịch bằng tiền mặt hoặc ngoại tệ tiền mặt được thực hiện một hoặc nhiều lần trong một ngày, có tổng giá trị bằng hoặc vượt mức quy định.","B":"Là tài sản có được trực tiếp hoặc gián tiếp từ hành vi phạm tội; phần thu nhập, hoa lợi, lợi tức, lợi nhuận sinh ra từ tài sản có được từ hành vi phạm tội.","C":"Là hành vi của tổ chức, cá nhân nhằm hợp pháp hóa nguồn gốc của tài sản do phạm tội mà có.","D":"Là danh sách tổ chức, cá nhân do Ngân hàng Nhà nước Việt Nam lập nhằm cảnh báo về tổ chức, cá nhân có rủi ro cao về rửa tiền."},"ans":["C"],"exp":"Đây là định nghĩa cốt lõi. Rửa tiền là quá trình biến \"tiền bẩn\" (tài sản có từ phạm tội) thành \"tiền sạch\" (tài sản có vẻ hợp pháp). Căn cứ pháp lý: Khoản 1, Điều 3 Luật PCRT 2022.","note":"","multi":false,"id":178,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Đâu không phải là dấu hiệu đáng ngờ trong lĩnh vực kinh doanh bất động sản ?","opts":{"A":"Giá thỏa thuận giữa các bên giao dịch không phù hợp giá thị trường.","B":"Khách hàng không cung cấp được các thông tin liên quan tới bất động sản hoặc không muốn cung cấp bổ sung thông tin về nhân thân.","C":"Khách hàng thực hiện chuyển nhượng chứng khoán ngoài hệ thống mà không có lý do hợp lý.","D":"Các giao dịch bất động sản là giao dịch ủy quyền nhưng không có cơ sở pháp lý."},"ans":["C"],"exp":"Dấu hiệu (C) là dấu hiệu đáng ngờ trong lĩnh vực chứng khoán (do Bộ Tài chính quy định). Các dấu hiệu A, B, D đều là các dấu hiệu đáng ngờ trong lĩnh vực BĐS. Căn cứ pháp lý: Phụ lục I Thông tư 09/2023/TT-BXD (đối với BĐS) và Phụ lục II Thông tư 57/2023/TT-BTC (đối với chứng khoán).","note":"","multi":false,"id":179,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Các anh chị hiểu như nào là đối tượng báo cáo trong hoạt động kinh doanh bất động sản?","opts":{"A":"Là tổ chức tài chính được cấp giấy phép thực hiện một hoặc một số hoạt động trong lĩnh vực bất động sản.","B":"Là danh sách tổ chức, cá nhân do Ngân hàng Nhà nước Việt Nam lập nhằm cảnh báo về tổ chức, cá nhân có rủi ro cao về rửa tiền.","C":"Là tổ chức, cá nhân đang sử dụng hoặc có ý định sử dụng dịch vụ, sản phẩm do tổ chức tài chính, tổ chức, cá nhân kinh doanh ngành, nghề phi tài chính có liên quan cung cấp.","D":"Là tổ chức, cá nhân kinh doanh ngành, nghề phi tài chính có liên quan theo quy định của pháp luật thực hiện một hoặc một số hoạt động trong lĩnh vực bất động sản trừ hoạt động cho thuê, cho thuê lại bất động sản và dịch vụ tư vấn bất động sản."},"ans":["D"],"exp":"Đây là định nghĩa chính xác về đối tượng báo cáo trong ngành BĐS. Cần lưu ý, Luật PCRT 2022 đã loại trừ 3 hoạt động: cho thuê/cho thuê lại, dịch vụ tư vấn BĐS, và dịch vụ quản lý BĐS ra khỏi phạm vi \"đối tượng báo cáo\". Căn cứ pháp lý: Khoản 4, Điều 4 Luật PCRT 2022 và Điều 3 Nghị định 19/2023/NĐCP.","note":"","multi":false,"id":180,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Trong trường hợp phát hiện giao dịch đáng ngờ do khách hàng yêu cầu có dấu hiệu liên quan đến tội phạm thì đối tượng báo cáo phải báo cáo trong thời gian bao lâu kể từ thời điểm phát hiện?","opts":{"A":"12 giờ","B":"24 giờ","C":"36 giờ","D":"48 giờ"},"ans":["B"],"exp":"Đây là trường hợp báo cáo khẩn cấp. Khi có nghi ngờ giao dịch liên quan đến tội phạm (khác với giao dịch đáng ngờ thông thường), thời hạn báo cáo được rút ngắn tối đa. Căn cứ pháp lý: Khoản 3, Điều 30 Luật PCRT 2022.","note":"","multi":false,"id":181,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Giao dịch có giá trị lớn phải báo cáo là những loại giao dịch nào?","opts":{"A":"Là giao dịch mà chủ tài khoản hoặc người yêu cầu tổ chức tài chính thực hiện chuyển tiền điện tử trong trường hợp không qua tài khoản.","B":"Là giao dịch bằng tiền mặt hoặc ngoại tệ tiền mặt được thực hiện một hoặc nhiều lần trong một ngày, có tổng giá trị bằng hoặc vượt mức quy định.","C":"Là hành vi của tổ chức, cá nhân nhằm hợp pháp hóa nguồn gốc của tài sản do phạm tội mà có.","D":"Là giao dịch tổ chức, cá nhân đang sử dụng hoặc có ý định sử dụng dịch vụ, sản phẩm do tổ chức tài chính, tổ chức, cá nhân kinh doanh ngành, nghề phi tài chính có liên quan cung cấp."},"ans":["B"],"exp":"Đây là định nghĩa về giao dịch có giá trị lớn. Mức quy định hiện hành (từ 01/12/2023) là từ 400 triệu đồng trở lên. Căn cứ pháp lý: Khoản 3, Điều 3 Luật PCRT 2022 và Quyết định 11/2023/QĐ-TTg.","note":"","multi":false,"id":182,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Đối tượng báo cáo có trách nhiệm báo cáo với đơn vị nào khi nghi ngờ hoặc có cơ sở hợp lý để nghi ngờ tài sản trong giao dịch có nguồn gốc do phạm tội mà có hoặc liên quan tới rửa tiền?","opts":{"A":"Chính phủ","B":"Bộ Xây dựng","C":"Ngân hàng nhà nước Việt Nam","D":"Bộ Công an."},"ans":["C"],"exp":"Cụ thể là Cục Phòng, chống rửa tiền trực thuộc Ngân hàng Nhà nước Việt Nam. Đây là cơ quan đầu mối tiếp nhận tất cả các báo cáo giao dịch đáng ngờ (Suspicious Transaction Report - STR). Căn cứ pháp lý: Khoản 1, Điều 26 Luật PCRT 2022.","note":"","multi":false,"id":183,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"“Các giao dịch bất động sản là giao dịch ủy quyền nhưng không có cơ sở pháp lý” là dấu hiệu đáng ngờ của lĩnh vực nào sau đây?","opts":{"A":"Lĩnh vực kinh doanh trò chơi có thưởng","B":"Lĩnh vực chứng khoán","C":"Lĩnh vực kinh doanh bảo hiểm nhân thọ","D":"Lĩnh vực kinh doanh bất động sản"},"ans":["D"],"exp":"Việc sử dụng ủy quyền không rõ ràng, không có cơ sở pháp lý (ví dụ: ủy quyền cho người không có quan hệ rõ ràng, hoặc nội dung ủy quyền mập mờ) là một kỹ thuật phổ biến để che giấu chủ sở hữu hưởng lợi cuối cùng. Căn cứ pháp lý: Mục 6, Phụ lục I Thông tư 09/2023/TT-BXD.","note":"","multi":false,"id":184,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Khi có căn cứ để nghi ngờ hoặc phát hiện các bên liên quan đến giao dịch thuộc Danh sách đen thì đối tượng báo cáo phải áp dụng ngay biện pháp nào?","opts":{"A":"Nhận biết khách hàng","B":"Tố cáo tội phạm","C":"Trì hoãn giao dịch","D":"Phong tỏa tài khoản"},"ans":["C"],"exp":"\"Danh sách đen\" (Blacklist) là danh sách tổ chức, cá nhân liên quan đến khủng bố, tài trợ khủng bố. Khi phát hiện, đối tượng báo cáo phải ngay lập tức áp dụng biện pháp trì hoãn giao dịch và báo cáo ngay cho cơ quan nhà nước có thẩm quyền. Căn cứ pháp lý: Khoản 1, Điều 33 Luật PCRT 2022.","note":"","multi":false,"id":185,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Theo pháp luật phòng chống rửa tiền thì Tài sản do phạm tội mà có được định nghĩa như thế nào?","opts":{"A":"Là giao dịch bằng tiền mặt hoặc ngoại tệ tiền mặt được thực hiện một hoặc nhiều lần trong một ngày, có tổng giá trị bằng hoặc vượt mức quy định.","B":"Là tài sản có được trực tiếp hoặc gián tiếp từ hành vi phạm tội; phần thu nhập, hoa lợi, lợi tức, lợi nhuận sinh ra từ tài sản có được từ hành vi phạm tội.","C":"Là tổ chức, cá nhân đang sử dụng hoặc có ý định sử dụng dịch vụ, sản phẩm do tổ chức tài chính, tổ chức, cá nhân kinh doanh ngành, nghề phi tài chính có liên quan cung cấp.","D":"Là danh sách tổ chức, cá nhân do Ngân hàng Nhà nước Việt Nam lập nhằm cảnh báo về tổ chức, cá nhân có rủi ro cao về rửa tiền."},"ans":["B"],"exp":"Đây là định nghĩa về \"tiền bẩn\", bao gồm cả tài sản gốc và các lợi ích phát sinh từ tài sản gốc đó. Căn cứ pháp lý: Khoản 2, Điều 3 Luật PCRT 2022.","note":"","multi":false,"id":186,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Giao dịch có giá trị lớn phải báo cáo được định nghĩa là gì?","opts":{"A":"Là giao dịch bằng tiền mặt hoặc ngoại tệ tiền mặt được thực hiện một hoặc nhiều lần trong một ngày, có tổng giá trị bằng hoặc vượt mức quy định.","B":"Là tài sản có được trực tiếp hoặc gián tiếp từ hành vi phạm tội; phần thu nhập, hoa lợi, lợi tức, lợi nhuận sinh ra từ tài sản có được từ hành vi phạm tội.","C":"Là tổ chức, cá nhân đang sử dụng hoặc có ý định sử dụng dịch vụ, sản phẩm do tổ chức tài chính, tổ chức, cá nhân kinh doanh ngành, nghề phi tài chính có liên quan cung cấp.","D":"Là danh sách tổ chức, cá nhân do Ngân hàng Nhà nước Việt Nam lập nhằm cảnh báo về tổ chức, cá nhân có rủi ro cao về rửa tiền."},"ans":["A"],"exp":"Tương tự Câu 8, đây là định nghĩa về giao dịch tiền mặt có giá trị lớn phải báo cáo. Căn cứ pháp lý: Khoản 3, Điều 3 Luật PCRT 2022.","note":"","multi":false,"id":187,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Khách hàng là gì?","opts":{"A":"Là giao dịch bằng tiền mặt hoặc ngoại tệ tiền mặt được thực hiện một hoặc nhiều lần trong một ngày, có tổng giá trị bằng hoặc vượt mức quy định.","B":"Là tài sản có được trực tiếp hoặc gián tiếp từ hành vi phạm tội; phần thu nhập, hoa lợi, lợi tức, lợi nhuận sinh ra từ tài sản có được từ hành vi phạm tội.","C":"Là tổ chức, cá nhân đang sử dụng hoặc có ý định sử dụng dịch vụ, sản phẩm do tổ chức tài chính, tổ chức, cá nhân kinh doanh ngành, nghề phi tài chính có liên quan cung cấp.","D":"Là danh sách tổ chức, cá nhân do Ngân hàng Nhà nước Việt Nam lập nhằm cảnh báo về tổ chức, cá nhân có rủi ro cao về rửa tiền."},"ans":["C"],"exp":"Đây là định nghĩa chuẩn về \"khách hàng\" trong bối cảnh AML, bao gồm cả khách hàng tiềm năng (\"có ý định sử dụng\"). Căn cứ pháp lý: Khoản 7, Điều 3 Luật PCRT 2022.","note":"","multi":false,"id":188,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Cơ quan nào Xây dựng và trình cấp có thẩm quyền ban hành hoặc ban hành theo thẩm quyền các văn bản quy phạm pháp luật, kế hoạch về phòng, chống rửa tiền?","opts":{"A":"Ngân hàng Nhà nước Việt Nam","B":"Bộ Công an","C":"Bộ Xây dựng","D":"Bộ Tài chính."},"ans":["A"],"exp":"Với vai trò là cơ quan đầu mối, chịu trách nhiệm trước Chính phủ, Ngân hàng Nhà nước có nhiệm vụ chủ trì xây dựng các văn bản pháp luật, chiến lược, kế hoạch quốc gia về AML. Căn cứ pháp lý: Khoản 1, Điều 48 Luật PCRT 2022.","note":"","multi":false,"id":189,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Cơ quan nào thu thập, tiếp nhận, xử lý thông tin đấu tranh phòng, chống tội phạm rửa tiền?","opts":{"A":"Ngân hàng Nhà nước Việt Nam","B":"Bộ Công an","C":"Bộ Xây dựng","D":"Bộ Tài chính."},"ans":["B"],"exp":"Cần phân biệt: Ngân hàng Nhà nước (Cục PCRT) tiếp nhận thông tin báo cáo giao dịch đáng ngờ từ đối tượng báo cáo. Nhưng Bộ Công an mới là cơ quan chủ trì đấu tranh phòng, chống tội phạm (tội phạm rửa tiền, tội phạm nguồn). Căn cứ pháp lý: Khoản 1, Điều 49 Luật PCRT 2022.","note":"","multi":false,"id":190,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Khi có căn cứ để nghi ngờ hoặc phát hiện các bên liên quan đến giao dịch thuộc Danh sách đen thì đối tượng báo cáo phải áp dụng ngay biện pháp nào?","opts":{"A":"Biện pháp trì hoãn giao dịch","B":"Phong tỏa tài khoản, niêm phong, phong tỏa","C":"Tạm giữ tài sản","D":"Xử lý vi phạm"},"ans":["A"],"exp":"Đây là câu hỏi lặp lại với Câu 11, chỉ thay đổi thứ tự đáp án. Biện pháp tức thời và bắt buộc là trì hoãn giao dịch. Căn cứ pháp lý: Khoản 1, Điều 33 Luật PCRT 2022.","note":"","multi":false,"id":191,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Đâu là các hành vi bị nghiêm cấm trong phòng, chống rửa tiền?","opts":{"A":"Thiết lập, duy trì tài khoản vô danh hoặc tài khoản sử dụng tên giả.","B":"Tổ chức, tham gia hoặc tạo điều kiện, trợ giúp thực hiện hành vi rửa tiền","C":"Thiết lập, duy trì quan hệ kinh doanh với ngân hàng vỏ bọc","D":"Cả hành vi A, B và C đều bị nghiêm cấm."},"ans":["D"],"exp":"Cả 3 hành vi (tổ chức rửa tiền; mở tài khoản vô danh/tên giả; duy trì quan hệ với ngân hàng vỏ bọc) đều là các hành vi bị nghiêm cấm cốt lõi trong AML. Căn cứ pháp lý: Điều 8 Luật PCRT 2022.","note":"","multi":false,"id":192,"sets":{},"fix":false},{"topic":"cd9","src":"Tài liệu ôn thi cơ sở 02","q":"Đâu là những dấu hiệu đáng ngờ trong lĩnh vực kinh doanh bất động sản?","opts":{"A":"Khách hàng yêu cầu chuyển tiền thắng cược, trúng thưởng cho bên thứ ba không có mối quan hệ rõ ràng với khách hàng","B":"Khách hàng không quan tâm đến giá bất động sản, phí giao dịch phải trả.","C":"Giao dịch mua, bán chứng khoán có dấu hiệu bất thường trong một ngày hoặc một số ngày do một tổ chức hoặc một cá nhân thực hiện.","D":"Có sự thay đổi đột biến trong doanh số giao dịch trên ví điện tử; tiền nạp vào và rút ra nhanh khỏi ví điện tử; doanh số giao dịch lớn trong ngày nhưng số dư ví điện tử rất nhỏ hoặc bằng không."},"ans":["B"],"exp":"Khi mục đích chính là \"rửa tiền\" chứ không phải đầu tư, kẻ rửa tiền thường ít quan tâm đến giá cả hoặc các chi phí liên quan, họ chỉ cần hoàn thành giao dịch thật nhanh để hợp pháp hóa dòng tiền. Các đáp án A, C, D thuộc về các lĩnh vực khác (trò chơi có thưởng, chứng khoán, trung gian thanh toán). Căn cứ pháp lý: Mục 1, Phụ lục I Thông tư 09/2023/TT-BXD.","note":"","multi":false,"id":193,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, thế nào là“rửa tiền” ?","opts":{"A":"Việc làm sạch các tờ tiền bị bẩn để tiếp tục đưa vào sử dụng","B":"Bị cấm do vi phạm qui định về quản lý tiền tệ","C":"Hành vi của cá nhân, tổ chức tìm cách hợp pháp hóa tài sản do phạm tội mà có","D":"Tất cả đáp án đều đúng"},"ans":["C"],"exp":"Căn cứ PL: Khoản 1-Điều 3","note":"","multi":false,"id":437,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, “Tài sản do phạm tội mà có” là tài sản như thế nào?","opts":{"A":"Là tài sản có được trực tiếp hoặc gián tiếp từ hành vi phạm tội; phần thu nhập, hoa lợi, lợi tức, lợi nhuận sinh ra từ tài sản có được từ hành vi phạm tội.","B":"Là tài sản không phải do mình làm ra.","C":"Là những khoản lợi nhuận sinh ra từ hoạt động kinh doanh","D":"Tất cả đáp án trên đều sai"},"ans":["A"],"exp":"Căn cứ PL: Khoản 2- Điều 3","note":"","multi":false,"id":438,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Đâu là Đối tượng báo cáo theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền?","opts":{"A":"Kinh doanh trò chơi có thưởng, bao gồm: trò chơi điện tử có thưởng; trò chơi trên mạng viễn thông, mạng Internet; casino; xổ số; đặt cược.","B":"Kinh doanh bất động sản, trừ hoạt động cho thuê, cho thuê lại bất động sản và dịch vụ tư vấn bất động sản.","C":"Kinh doanh kim khí quý, đá quý","D":"Tất cả đều đúng."},"ans":["D"],"exp":"Căn cứ PL: Điều 4","note":"Hiệu đính: tài liệu gốc tô A. Điều 4 Luật PCRT 2022 liệt kê cả kinh doanh trò chơi có thưởng; kinh doanh BĐS (trừ cho thuê, cho thuê lại, tư vấn BĐS); kinh doanh kim khí quý, đá quý là đối tượng báo cáo, nên chọn \"Tất cả đều đúng\".","multi":false,"id":439,"fix":true,"sets":{}},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Đâu là các hành vi bị nghiêm cấm trong phòng, chống rửa tiền theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền?","opts":{"A":"Tổ chức, tham gia hoặc tạo điều kiện, trợ giúp thực hiện hành vi rửa tiền.","B":"Thiết lập, duy trì tài khoản vô danh hoặc tài khoản sử dụng tên giả.","C":"Thiết lập, duy trì quan hệ kinh doanh với ngân hàng vỏ bọc.","D":"Tất cả đáp án trên đều đúng."},"ans":["D"],"exp":"Căn cứ PL: Điều 8","note":"","multi":false,"id":440,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, các dấu hiệu đáng ngờ cơ bản bao gồm những dấu hiệu nào dưới đây?","opts":{"A":"Khách hàng từ chối cung cấp thông tin hoặc cung cấp thông tin nhận biết khách hàng không chính xác, không đầy đủ, không nhất quán.","B":"Khách hàng thuyết phục đối tượng báo cáo không báo cáo giao dịch cho cơ quan nhà nước có thẩm quyền.","C":"Không thể xác định được khách hàng theo thông tin khách hàng cung cấp hoặc giao dịch liên quan đến một bên không xác định được danh tính.","D":"Tất cả a, b, c đều đúng."},"ans":["D"],"exp":"Căn cứ PL: Điểu 27","note":"","multi":false,"id":441,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, các dấu hiệu đáng ngờ trong kinh doanh bất động sản bao gồm những dấu hiệu nào dưới đây?","opts":{"A":"Các giao dịch bất động sản là giao dịch ủy quyền nhưng không có cơ sở pháp lý.","B":"Khách hàng không cung cấp được các thông tin liên quan đến bất động sản","C":"Những giao dịch có giá trị lớn.","D":"Các giao dịch bất động sản là giao dịch ủy quyền nhưng không có cơ sở pháp lý; Khách hàng không quan tâm đến giá bất động sản, phí giao dịch phải trả; Khách hàng không cung cấp được các thông tin liên quan đến bất động sản hoặc không muốn cung cấp bổ sung thông tin về nhân thân; Giá giao dịch giữa các bên không phù hợp giá thị trường."},"ans":["D"],"exp":"Căn cứ PL: Điều 27","note":"","multi":false,"id":442,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, Trường hợp phát hiện giao dịch đáng n ai"},"ans":["D"],"exp":"Căn cứ PL: Điều 46","note":"","multi":false,"id":446,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, áp dụng các biện pháp tạm thời và xử lý vi phạm","opts":{"A":"Trì hoãn giao dịch","B":"Phong tỏa tài khoản, niêm phong, phong tỏa hoặc tạm giữ tài sản","C":"Cấm di chuyển","D":"Trì hoãn giao dịch; Phong tỏa tài khoản, niêm phong, phong tỏa hoặc tạm giữ tài sản"},"ans":["D"],"exp":"Căn cứ PL: Điều 44, 45","note":"","multi":false,"id":447,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, ngưỡng giá trị giao dịch tiền mặt phải báo cáo trong kinh doanh bất động sản là:","opts":{"A":"100 triệu đồng","B":"200 triệu đồng","C":"300 triệu đồng","D":"400 triệu đồng"},"ans":["D"],"exp":"Căn cứ PL: Điều 3 Quyết định 11/2023/QĐ-TTg","note":"","multi":false,"id":448,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, trường hợp nào sau đây được coi là giao dịch đáng ngờ?","opts":{"A":"Khách hàng từ chối cung cấp thông tin hoặc cung cấp thông tin nhận biết khách hàng không chính xác, không đầy đủ, không nhất quán.","B":"Khách hàng thuyết phục đối tượng báo cáo không báo cáo giao dịch cho cơ quan nhà nước có thẩm quyền.","C":"Khách hàng yêu cầu đối tượng báo cáo thực hiện giao dịch không đúng trình tự, thủ tục theo quy định của pháp luật.","D":"Tất cả các đáp án trên"},"ans":["D"],"exp":"Căn cứ PL: Điêu 27","note":"","multi":false,"id":449,"sets":{},"fix":false},{"topic":"cd9","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 14/2022/QH15 – Luật Phòng, chống rửa tiền, khi biết giao dịch được thực hiện theo yêu cầu của bị can, bị cáo, người bị kết án và có cơ sở hợp lý để nghi ngờ tài sản trong giao dịch là tài sản thuộ ấn có thể trực tiếp nhận tiền mặt lớn mà không cần báo cáo.","B":"Các đối tượng có thể lợi dụng danh nghĩa \"tư vấn\" để cấu trúc các giao dịch mua bán nhằm lách luật phòng, chống rửa tiền.","C":"Các công ty tư vấn không cần thực hiện KYC đối với khách hàng của mình.","D":"Không tạo ra kẽ hở nào vì hoạt động tư vấn không liên quan đến dòng tiền."},"ans":["B"],"exp":"","note":"","multi":false,"id":958,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 32 · Đề 1A câu 39","q":"Tại sao việc quy định mẫu báo cáo giao dịch đáng ngờ (STR) riêng cho lĩnh vực bất động sản (Mẫu 05/Phụ lục II TT09) lại hữu ích?","opts":{"A":"Để giảm số lượng trường thông tin cần điền.","B":"Để thu thập các thông tin đặc thù của giao dịch bất động sản (loại BĐS, số hợp đồng, hình thức thanh toán), giúp cơ quan chức năng phân tích hiệu quả hơn.","C":"Để phân biệt báo cáo của ngành bất động sản với ngành ngân hàng.","D":"Để tăng thời hạn báo cáo cho ngành bất động sản."},"ans":["B"],"exp":"","note":"","multi":false,"id":959,"fix":false,"sets":{"1A":39}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 33","q":"Một khách hàng mua bất động sản giá trị lớn, cung cấp đầy đủ giấy tờ tùy thân nhưng tỏ ra thờ ơ với giá cả và các khoản phí, đồng thời nguồn tiền thanh toán không rõ ràng. Đây là dấu hiệu cần xem xét để báo cáo theo loại nào?","opts":{"A":"Chỉ báo cáo giao dịch có giá trị lớn (LCTR) nếu giá trị vượt 400 triệu VNĐ.","B":"Báo cáo báo cáo giao dịch đáng ngờ (STR) do có dấu hiệu đáng ngờ (không quan tâm giá/phí, nguồn tiền không rõ).","C":"Không cần báo cáo vì khách hàng đã cung cấp đủ giấy tờ KYC.","D":"Chỉ cần lưu hồ sơ nội bộ để theo dõi thêm."},"ans":["B"],"exp":"","note":"","multi":false,"id":960,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 34","q":"Một người sử dụng tiền do tham ô mà có để mua một bất động sản đứng tên con cái. Ai là người có thể bị truy cứu trách nhiệm hình sự về Tội rửa tiền?","opts":{"A":"Chỉ người thực hiện hành vi tham ô (nếu họ trực tiếp mua).","B":"Chỉ người con đứng tên bất động sản.","C":"Cả người tham ô (nếu họ thực hiện hành vi mua bán/che giấu) và người con (nếu biết hoặc có cơ sở để biết nguồn tiền và cố ý đứng tên nhằm hợp pháp hóa).","D":"Không ai cả, vì đây là giao dịch trong gia đình."},"ans":["C"],"exp":"","note":"","multi":false,"id":961,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 35","q":"Nếu tài sản do phạm tội mà có đã được chuyển đổi qua nhiều hình thức (ví dụ: tiền mặt -> vàng -> bất động sản -> cổ phiếu), thì tài sản ở dạng cuối cùng (cổ phiếu) có còn được coi là đối tượng của Tội rửa tiền không?","opts":{"A":"Không, chỉ tài sản ở dạng ban đầu (tiền mặt) mới là đối tượng.","B":"Có, khái niệm \"tài sản do phạm tội mà có\" bao gồm cả tài sản có được trực tiếp hoặc gián tiếp từ hành vi phạm tội.","C":"Chỉ khi giá trị cổ phiếu tương đương giá trị tiền mặt ban đầu.","D":"Tùy thuộc vào việc chuyển đổi có hợp pháp hay không."},"ans":["B"],"exp":"","note":"","multi":false,"id":962,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 36","q":"Mối quan hệ giữa công tác phòng, chống rửa tiền và phòng, chống tham nhũng là gì?","opts":{"A":"Hai lĩnh vực hoàn toàn tách biệt.","B":"Rửa tiền thường là bước tiếp theo sau tham nhũng để hợp pháp hóa tài sản tham nhũng; do đó, chống rửa tiền hiệu quả sẽ góp phần chống tham nhũng.","C":"Chống tham nhũng là điều kiện tiên quyết để chống rửa tiền.","D":"Chỉ cần chống tham nhũng thì sẽ không còn rửa tiền."},"ans":["B"],"exp":"","note":"","multi":false,"id":963,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 37","q":"Tại sao việc giám sát các giao dịch bất động sản bằng tiền mặt lại được đặc biệt chú trọng trong công tác phòng, chống rửa tiên (PCRT)?","opts":{"A":"Vì giao dịch tiền mặt dễ thực hiện hơn chuyển khoản.","B":"Vì tiền mặt khó truy vết nguồn gốc và dễ dàng che giấu danh tính hơn so với giao dịch qua hệ thống ngân hàng.","C":"Vì giao dịch tiền mặt thường có giá trị thấp hơn.","D":"Vì pháp luật chỉ cho phép giao dịch BĐS bằng tiền mặt."},"ans":["B"],"exp":"","note":"","multi":false,"id":964,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 38","q":"Nếu một doanh nghiệp bất động sản bị xử phạt hành chính nhiều lần vì vi phạm quy định PCRT (ví dụ: không báo cáo giao dịch đáng ngờ STR, KYC hời hợt), điều này có thể ảnh hưởng đến việc xem xét trách nhiệm hình sự theo Điều 324 Bộ luật hình sự không?","opts":{"A":"Không, xử phạt hành chính và trách nhiệm hình sự là độc lập.","B":"Có, việc tái phạm nhiều lần, có hệ thống các vi phạm hành chính có thể được xem là tình tiết tăng nặng hoặc củng cố bằng chứng về lỗi cố ý \"biết hoặc có cơ sở để biết\" nếu hành vi đó liên quan đến việc hợp pháp hóa tài sản phạm tội.","C":"Chỉ ảnh hưởng nếu tổng số tiền phạt hành chính vượt quá một mức nhất định.","D":"Chỉ ảnh hưởng nếu có đơn tố cáo từ khách hàng."},"ans":["B"],"exp":"","note":"","multi":false,"id":965,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 39","q":"Hiệu quả của việc phân tích báo cáo giao dịch đáng ngờ (STR) và giao dịch có giá trị lớn (LCTR) tại Cục phòng, chống rửa tiền (PCRT) phụ thuộc chủ yếu vào yếu tố nào?","opts":{"A":"Số lượng báo cáo nhận được.","B":"Chất lượng thông tin trong báo cáo và năng lực phân tích, liên kết dữ liệu, sử dụng công nghệ của cán bộ Cục phòng, chống rửa tiền (PCRT).","C":"Mức độ hợp tác của các đối tượng báo cáo.","D":"Tốc độ gửi báo cáo của đối tượng báo cáo."},"ans":["B"],"exp":"","note":"","multi":false,"id":966,"fix":false,"sets":{}},{"topic":"cd9","src":"Bộ đề CĐ9 câu 40","q":"Việc pháp luật hình sự quy định hình phạt tịch thu một phần hoặc toàn bộ tài sản đối với tội rửa tiền có ý nghĩa gì?","opts":{"A":"Chỉ nhằm mục đích thu hồi tài sản cho Nhà nước.","B":"Nhằm tước bỏ công cụ, phương tiện và kết quả của hành vi phạm tội, làm mất đi động cơ kinh tế của việc rửa tiền.","C":"Chỉ áp dụng khi không thể áp dụng hình phạt tù.","D":"Chỉ áp dụng đối với pháp nhân thương mại."},"ans":["B"],"exp":"","note":"","multi":false,"id":967,"fix":false,"sets"  hình thức, thủ tục, thẩm quyền xử phạt chung, là cơ sở cho các Nghị định chuyên ngành.","note":"","multi":false,"id":207,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 2","q":"Theo quy định chung, mức phạt tiền đối với tổ chức vi phạm hành chính trong lĩnh vực đất đai và kinh doanh BĐS thường như thế nào so với cá nhân có cùng hành vi?","opts":{"A":"Bằng cá nhân","B":"Gấp đôi cá nhân","C":"Bằng một nửa cá nhân","D":"Gấp ba lần cá nhân"},"ans":["B"],"exp":"Một đặc điểm của cấu trúc xử phạt tại Việt Nam là nguyên tắc phạt tiền gấp đôi đối với tổ chức so với cá nhân cho cùng hành vi vi phạm.","note":"","multi":false,"id":208,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 3","q":"Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đất đai theo Nghị định 123/2024/NĐCP là bao lâu?","opts":{"A":"1 năm","B":"2 năm","C":"3 năm","D":"5 năm"},"ans":["B"],"exp":"Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đất đai được giữ nguyên là 02 năm.","note":"","multi":false,"id":209,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 4 · Đề 1A câu 29","q":"Đối tượng nào sau đây KHÔNG thuộc phạm vi áp dụng của Nghị định 123/2024/NĐ-CP?","opts":{"A":"Tổ chức, cá nhân trong nước","B":"Tổ chức, cá nhân nước ngoài","C":"Hộ gia đình, cộng đồng dân cư","D":"Cơ quan nhà nước có thẩm quyền xử phạt"},"ans":["D"],"exp":"Nghị định áp dụng cho các chủ thể có hành vi vi phạm (tổ chức, cá nhân, hộ gia đình, cộng đồng dân cư). Cơ quan nhà nước là chủ thể thi hành việc xử phạt.","note":"","multi":false,"id":210,"sets":{"1A":29},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 5","q":"Hành vi nào sau đây KHÔNG phải là vi phạm về chuyển mục đích sử dụng đất theo Điều 8 - Điều 12 Nghị định 123/2024/NĐ-CP?","opts":{"A":"Tự ý chuyển đất trồng lúa sang đất trồng cây lâu năm","B":"Chuyển đất ở sang đất nông nghiệp không được phép","C":"Chuyển đất nông nghiệp sang đất phi nông nghiệp không được phép","D":"Xây dựng nhà trên đất nông nghiệp khi chưa được phép"},"ans":["B"],"exp":"Các điều khoản này quy định việc chuyển từ đất nông nghiệp sang phi nông nghiệp, hoặc giữa các loại đất nông nghiệp/phi nông nghiệp với nhau mà không được phép. Việc chuyển từ đất ở sang nông nghiệp thường không bị cấm đoán gay gắt như chiều ngược lại.","note":"","multi":false,"id":211,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 6","q":"Mức phạt tiền đối với hành vi chuyển mục đích sử dụng đất trái phép KHÔNG phụ thuộc vào yếu tố nào sau đây?","opts":{"A":"Loại đất ban đầu và loại đất chuyển đến","B":"Diện tích đất vi phạm","C":"Vị trí đất (nông thôn/đô thị)","D":"Thời điểm thực hiện hành vi vi phạm"},"ans":["D"],"exp":"Mức phạt tiền được xác định dựa trên loại đất ban đầu, loại đất chuyển đến, diện tích vi phạm và vị trí đất (nông thôn hay đô thị). Thời điểm vi phạm chủ yếu liên quan đến thời hiệu xử phạt.","note":"","multi":false,"id":212,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 7","q":"Biện pháp khắc phục hậu quả chính đối với hành vi chuyển mục đích sử dụng đất trái phép là gì?","opts":{"A":"Buộc nộp tiền sử dụng đất","B":"Buộc khôi phục lại tình trạng ban đầu của đất","C":"Tịch thu toàn bộ diện tích đất vi phạm","D":"Phạt tù người vi phạm"},"ans":["B"],"exp":"Biện pháp khắc phục hậu quả chính là buộc khôi phục lại tình trạng ban đầu của đất trước khi vi phạm, trừ một số ngoại lệ.","note":"","multi":false,"id":213,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 8","q":"Mức phạt tiền tối đa đối với cá nhân có hành vi lấn, chiếm đất theo Nghị định 123/2024/NĐCP là bao nhiêu?","opts":{"A":"200.000.000 đồng","B":"400.000.000 đồng","C":"500.000.000 đồng","D":"1.000.000.000 đồng"},"ans":["C"],"exp":"Mức phạt tiền tối đa đối với cá nhân vi phạm hành vi lấn, chiếm đất là 500.000.000 đồng. Mức tối đa đối với tổ chức là 1.000.000.000 đồng.","note":"","multi":false,"id":214,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 9","q":"Biện pháp khắc phục hậu quả đối với hành vi không đăng ký đất đai là gì?","opts":{"A":"Buộc khôi phục tình trạng ban đầu","B":"Buộc nộp lại số lợi bất hợp pháp","C":"Buộc thực hiện thủ tục đăng ký đất đai theo quy định","D":"Tịch thu giấy tờ liên quan"},"ans":["C"],"exp":"Biện pháp khắc phục hậu quả là buộc người vi phạm phải thực hiện thủ tục đăng ký đất đai theo quy định.","note":"","multi":false,"id":215,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 10","q":"Hình thức xử phạt bổ sung nào được áp dụng đối với hành vi sử dụng giấy tờ giả trong thủ tục hành chính về đất đai?","opts":{"A":"Tước quyền sử dụng đất","B":"Đình chỉ hoạt động","C":"Tịch thu giấy tờ giả đã sử dụng","D":"Cảnh cáo"},"ans":["C"],"exp":"Đối với hành vi sử dụng giấy tờ giả, hình thức xử phạt bổ sung là tịch thu các giấy tờ giả đã sử dụng.","note":"","multi":false,"id":216,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 11","q":"Hành vi không sử dụng đất trồng cây lâu năm liên tục trong bao lâu thì bị coi là vi phạm (bỏ hoang đất)?","opts":{"A":"6 tháng","B":"12 tháng","C":"18 tháng","D":"24 tháng"},"ans":["C"],"exp":"Không sử dụng đất trồng cây lâu năm liên tục 18 tháng bị coi là vi phạm quy định về không sử dụng đất. (12 tháng đối với cây hàng năm/thủy sản, 24 tháng đối với đất rừng).","note":"","multi":false,"id":217,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 12","q":"Biện pháp khắc phục hậu quả đối với hành vi bỏ hoang đất trồng cây lâu năm là gì?","opts":{"A":"Buộc trả lại đất cho Nhà nước","B":"Buộc đưa đất vào sử dụng trong thời hạn 60 ngày","C":"Buộc nộp phạt gấp đôi","D":"Buộc chuyển sang loại đất khác"},"ans":["B"],"exp":"Biện pháp khắc phục là buộc đưa đất vào sử dụng trong thời hạn 60 ngày (đối với cây hàng năm, thủy sản, cây lâu năm) hoặc 90 ngày (đối với đất rừng).","note":"","multi":false,"id":218,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 13","q":"Hình thức xử phạt bổ sung nào có thể áp dụng đối với tổ chức vi phạm điều kiện hoạt động dịch vụ tư vấn đất đai?","opts":{"A":"Phạt tiền gấp 3 lần","B":"Tịch thu phương tiện hành nghề","C":"Tước quyền sử dụng giấy phép/chứng chỉ hành nghề hoặc Đình chỉ hoạt động","D":"Buộc giải thể tổ chức"},"ans":["C"],"exp":"Tùy theo vi phạm, tổ chức có thể bị tước quyền sử dụng giấy phép, chứng chỉ hành nghề (6-9 tháng) hoặc đình chỉ hoạt động dịch vụ tư vấn (3-12 tháng).","note":"","multi":false,"id":219,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 14","q":"Hành vi nào sau đây KHÔNG phải là vi phạm quy định về Kinh doanh bất động sản theo Điều 58 Nghị định 16/2022/NĐ-CP?","opts":{"A":"Kinh doanh BĐS không thành lập doanh nghiệp/HTX khi bắt buộc","B":"Công khai thông tin dự án BĐS đầy đủ, kịp thời","C":"Thu tiền mua BĐS hình thành trong tương lai vượt tỷ lệ quy định","D":"Bàn giao nhà khi chưa hoàn thành nghiệm thu theo quy định"},"ans":["B"],"exp":"Công khai thông tin đầy đủ là tuân thủ quy định, không phải vi phạm. Các hành vi còn lại là vi phạm theo Điều 58.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":220,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 15","q":"Mức phạt tiền cao nhất đối với tổ chức có hành vi vi phạm trong Kinh doanh bất động sản theo Điều 58 Nghị định 16/2022/NĐ-CP là bao nhiêu?","opts":{"A":"500.000.000 đồng","B":"800.000.000 đồng","C":"1.000.000.000 đồng","D":"2.000.000.000 đồng"},"ans":["C"],"exp":"Mức phạt tiền cao nhất đối với tổ chức vi phạm theo Điều 58 là 1 tỷ đồng, áp dụng cho các hành vi nghiêm trọng như chuyển nhượng dự án trái phép, bàn giao nhà chưa đủ điều kiện, huy động/sử dụng vốn sai quy định.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":221,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 16","q":"Hình thức xử phạt bổ sung nào có thể áp dụng cho hành vi kinh doanh BĐS không đủ điều kiện theo Điều 58 Nghị định 16/2022/NĐ-CP?","opts":{"A":"Tịch thu BĐS","B":"Đình chỉ hoạt động kinh doanh BĐS từ 03 đến 06 tháng","C":"Phạt tiền gấp đôi","D":"Buộc phá dỡ công trình"},"ans":["B"],"exp":"Hành vi kinh doanh BĐS không đủ điều kiện có thể bị đình chỉ hoạt động kinh doanh BĐS từ 03 đến 06 tháng.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":222,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 17","q":"Biện pháp khắc phục hậu quả nào áp dụng cho hành vi thu tiền mua BĐS hình thành trong tương lai vượt tỷ lệ quy định?","opts":{"A":"Buộc hoàn trả phần tiền thu vượt","B":"Buộc giảm giá bán BĐS","C":"Buộc công khai thông tin","D":"Buộc dừng thi công dự án"},"ans":["A"],"exp":"Biện pháp khắc phục hậu quả là buộc chủ đầu tư hoàn trả lại phần tiền đã thu vượt tỷ lệ cho khách hàng.","note":"","multi":false,"id":223,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 18","q":"Mức phạt tiền đối với cá nhân môi giới độc lập không có chứng chỉ hành nghề là bao nhiêu?","opts":{"A":"20 - 30 triệu đồng","B":"40 - 60 triệu đồng","C":"60 - 80 triệu đồng","D":"100 - 120 triệu đồng"},"ans":["B"],"exp":"Theo Điều 59 Nghị định 16/2022/NĐ-CP Mức phạt tiền đối với cá nhân môi giới độc lập không có chứng chỉ hành nghề hoặc chứng chỉ hết hạn là từ 40.000.000 đồng đến 60.000.000 đồng.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":224,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 19","q":"Hành vi nào sau đây của sàn giao dịch BĐS bị phạt tiền từ 200 - 250 triệu đồng theo Điều 59 Khoản 3 Nghị định 16/2022/NĐ-CP?","opts":{"A":"Hoạt động không có quy chế","B":"Không thực hiện chế độ báo cáo","C":"Đưa BĐS không đủ điều kiện lên sàn giao dịch","D":"Thu phí dịch vụ sai quy định"},"ans":["C"],"exp":"Hành vi đưa BĐS không đủ điều kiện lên sàn giao dịch hoặc cung cấp thông tin sai lệch bị phạt tiền từ 200 đến 250 triệu đồng.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":225,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 20","q":"Hình thức xử phạt bổ sung nào áp dụng cho sàn giao dịch BĐS đưa BĐS không đủ điều kiện lên sàn?","opts":{"A":"Tước chứng chỉ hành nghề môi giới","B":"Đình chỉ hoạt động kinh doanh dịch vụ sàn giao dịch BĐS (6-9 tháng)","C":"Phạt tiền gấp đôi","D":"Buộc đóng cửa vĩnh viễn"},"ans":["B"],"exp":"Theo Điều 59 Nghị định 16/2022/NĐ-CP Hành vi này có thể bị áp dụng hình thức xử phạt bổ sung là đình chỉ hoạt động kinh doanh dịch vụ sàn giao dịch BĐS từ 6 đến 9 tháng.","note":"Theo NĐ 339/2026/NĐ-CP: đình chỉ hoạt động kinh doanh dịch vụ sàn giao dịch BĐS từ 03 đến 06 tháng. Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":226,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 21","q":"Mức phạt tiền đối với tổ chức có hành vi làm sai lệch, hư hỏng thông tin về nhà ở và thị trường BĐS là bao nhiêu?","opts":{"A":"40 - 60 triệu đồng","B":"60 - 80 triệu đồng","C":"80 - 100 triệu đồng","D":"100 - 120 triệu đồng"},"ans":["B"],"exp":"Theo Điều 59 Nghị định 16/2022/NĐ-CP Mức phạt tiền đối với tổ chức vi phạm quy định về quản lý, sử dụng thông tin (bao gồm làm sai lệch, hư hỏng) là từ 60.000.000 đồng đến","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":227,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 22","q":"Mục tiêu chính của các quy định xử phạt trong Kinh doanh bất động sản theo Nghị định 16/2022/NĐ-CP là gì?","opts":{"A":"Tăng nguồn thu ngân sách","B":"Hạn chế số lượng doanh nghiệp BĐS","C":"Bảo vệ quyền lợi người tiêu dùng và đảm bảo tính minh bạch thị trường","D":"Khuyến khích đầu cơ bất động sản"},"ans":["C"],"exp":"Nghị định thể hiện sự tập trung vào việc bảo vệ người tiêu dùng (đặc biệt người mua nhà hình thành trong tương lai) và đảm bảo tính minh bạch, ổn định của thị trường BĐS.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":228,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 23","q":"Ngoài phạt tiền, hình thức xử phạt bổ sung nào KHÔNG được đề cập là phổ biến trên thế giới trong lĩnh vực này?","opts":{"A":"Cảnh cáo","B":"Buộc lao động công ích","C":"Đình chỉ hoặc thu hồi giấy phép hoạt động","D":"Buộc chấm dứt hành vi vi phạm"},"ans":["B"],"exp":"Tài liệu liệt kê các hình thức xử phạt phổ biến quốc tế như cảnh cáo, phạt tiền, đình chỉ/thu hồi giấy phép, buộc chấm dứt hành vi, buộc khắc phục hậu quả. Buộc lao động công ích không được đề cập trong ngữ cảnh này.","note":"","multi":false,"id":229,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 24","q":"Việc Bộ luật Dân sự 2015 quy định về hiệu lực của hợp đồng có ý nghĩa gì đối với việc xử phạt hành chính trong kinh doanh BĐS?","opts":{"A":"Thay thế hoàn toàn việc xử phạt hành chính.","B":"Không liên quan đến xử phạt hành chính.","C":"Một hành vi vi phạm có thể vừa bị xử phạt hành chính, vừa dẫn đến hậu quả dân sự (ví dụ hợp đồng vô hiệu).","D":"Chỉ áp dụng nếu không có Nghị định xử phạt chuyên ngành."},"ans":["C"],"exp":"Tài liệu chỉ ra rằng một hợp đồng kinh doanh BĐS vi phạm quy định có thể bị tuyên vô hiệu theo Bộ luật Dân sự, đồng thời hành vi đó cũng có thể bị xử phạt hành chính theo Nghị định chuyên ngành.","note":"","multi":false,"id":230,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 25","q":"Trường hợp nào hành vi chuyển mục đích sử dụng đất trái phép có thể KHÔNG bị áp dụng biện pháp khắc phục hậu quả là buộc khôi phục tình trạng ban đầu?","opts":{"A":"Khi người vi phạm tự nguyện nộp phạt gấp đôi.","B":"Khi việc chuyển mục đích phù hợp quy hoạch và người sử dụng đất đủ điều kiện được chuyển mục đích.","C":"Khi diện tích vi phạm dưới 10m2.","D":"Khi hành vi vi phạm xảy ra ở khu vực nông thôn."},"ans":["B"],"exp":"Có ngoại lệ không buộc khôi phục tình trạng ban đầu nếu việc chuyển mục đích phù hợp quy hoạch đã duyệt và người sử dụng đất đủ điều kiện được chuyển mục đích theo Khoản 3 Điều 139 Luật Đất đai.","note":"","multi":false,"id":231,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 26","q":"Mức phạt đối với hành vi chuyển đất trồng lúa sang đất ở tại khu vực đô thị (phường, thị trấn) so với cùng hành vi tại khu vực nông thôn (xã) là như thế nào?","opts":{"A":"Bằng nhau","B":"Gấp đôi","C":"Bằng một nửa","D":"Gấp ba lần"},"ans":["B"],"exp":"Mức phạt đối với các hành vi chuyển mục đích, lấn chiếm đất tại khu vực đô thị (phường, thị trấn) bằng hai lần mức phạt đối với cùng hành vi tại khu vực nông thôn (xã).","note":"","multi":false,"id":232,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 27","q":"Hành vi hủy hoại đất nào sau đây có khung phạt tiền cao hơn theo Điều 14 Nghị định 123/2024/NĐ-CP?","opts":{"A":"Làm suy giảm chất lượng đất (mất tầng canh tác, ô nhiễm...)","B":"Làm biến dạng địa hình (thay đổi độ dốc, san lấp trái phép...)","C":"Cả hai hành vi có khung phạt như nhau.","D":"Chỉ hành vi gây ô nhiễm mới bị phạt."},"ans":["B"],"exp":"Khung phạt đối với hành vi làm biến dạng địa hình (5tr - 200tr cho cá nhân) cao hơn so với làm suy giảm chất lượng đất (2tr - 100tr cho cá nhân).","note":"","multi":false,"id":233,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 28","q":"Trường hợp hủy hoại đất mà không thể khôi phục lại tình trạng ban đầu thì mức phạt tiền sẽ như thế nào?","opts":{"A":"Giảm một nửa","B":"Giữ nguyên","C":"Tăng gấp đôi (nhưng không vượt mức tối đa)","D":"Miễn phạt tiền, chỉ áp dụng biện pháp khác"},"ans":["C"],"exp":"Nếu không thể khôi phục tình trạng ban đầu, mức phạt tiền đối với hành vi hủy hoại đất tăng gấp đôi so với mức phạt tương ứng, nhưng không quá mức tối đa cho phép.","note":"","multi":false,"id":234,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 29 · Đề 1A câu 17","q":"Hành vi cản trở việc sử dụng đất của người khác bằng cách đào bới, xây tường, làm hàng rào có mức phạt tiền như thế nào so với việc chỉ đặt vật liệu gây cản trở?","opts":{"A":"Thấp hơn","B":"Bằng nhau","C":"Cao hơn","D":"Tùy thuộc vào loại vật liệu"},"ans":["C"],"exp":"Điều 14 Nghị định 123/2024/NĐ-CP, Mức phạt cho hành vi đào bới, xây dựng (5tr 10tr cho cá nhân) cao hơn so với hành vi đặt vật liệu (1tr - 3tr cho cá nhân).","note":"","multi":false,"id":235,"sets":{"1A":17},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 30","q":"Hành vi không đăng ký biến động đất đai khi có thay đổi (ví dụ: chuyển quyền, thế chấp) có mức phạt tiền như thế nào so với không đăng ký đất đai lần đầu?","opts":{"A":"Thấp hơn","B":"Bằng nhau","C":"Cao hơn","D":"Tùy thuộc vào giá trị thửa đất"},"ans":["C"],"exp":"Theo Nghị định 123/2024/NĐ-CP, Mức phạt cho việc không đăng ký biến động (2tr 3tr cho cá nhân) cao hơn so với không đăng ký lần đầu (1tr - 2tr cho cá nhân).","note":"","multi":false,"id":236,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 31","q":"Cá nhân nhận chuyển nhượng đất trồng lúa vượt hạn mức mà không thành lập tổ chức kinh tế để tiếp tục sử dụng thì bị xử phạt như thế nào?","opts":{"A":"Cảnh cáo","B":"Phạt tiền từ 50 triệu đến 100 triệu đồng","C":"Buộc trả lại đất ngay lập tức","D":"Buộc chuyển sang trồng cây khác"},"ans":["B"],"exp":"Điều 19 Nghị định 123/2024/NĐ-CP quy định phạt tiền từ 50.000.000 đồng đến","note":"","multi":false,"id":237,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 32","q":"Hành vi khai báo không trung thực dẫn đến sai lệch trong việc cấp Giấy chứng nhận quyền sử dụng đất bị phạt tiền ở mức nào đối với cá nhân?","opts":{"A":"2 - 5 triệu đồng","B":"5 - 10 triệu đồng","C":"10 - 20 triệu đồng","D":"Cảnh cáo"},"ans":["B"],"exp":"Theo Điều 27 Nghị định 123/2024/NĐ-CP Mức phạt tiền đối với cá nhân có hành vi khai báo không trung thực dẫn đến sai lệch trong cấp GCN là từ 5.000.000 đồng đến 10.000.000 đồng.","note":"","multi":false,"id":238,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 33","q":"Biện pháp khắc phục hậu quả nào áp dụng cho trường hợp sử dụng giấy tờ giả trong thủ tục hành chính về đất đai?","opts":{"A":"Buộc làm lại giấy tờ thật","B":"Buộc nộp lại số lợi bất hợp pháp","C":"Hủy bỏ kết quả thực hiện thủ tục hành chính đã thực hiện","D":"Buộc xin lỗi công khai"},"ans":["C"],"exp":"Theo Điều 27 Nghị định 123/2024/NĐ-CP, ngoài việc tịch thu giấy tờ giả, biện pháp khắc phục hậu quả là hủy bỏ kết quả thực hiện thủ tục hành chính về đất đai đã thực hiện đối với trường hợp sử dụng giấy tờ
