lse,"id":1147,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 21","q":"Trong tình huống đàm phán căng thẳng, một bên đưa ra lời chỉ trích cá nhân đối với bên kia. Nhà môi giới nên phản ứng thế nào là tốt nhất?","opts":{"A":"Hùa theo lời chỉ trích để làm hài lòng một bên.","B":"Ngắt lời và yêu cầu hai bên dừng đàm phán ngay lập tức.","C":"Giữ bình tĩnh, khéo léo lái cuộc thảo luận quay trở lại vấn đề chính, nhắc nhở về mục tiêu chung và giữ thái độ tôn trọng đối với cả hai bên.","D":"Rời khỏi cuộc đàm phán vì cho rằng không thể tiếp tục."},"ans":["C"],"exp":"","note":"","multi":false,"id":1148,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 22","q":"Trong quản trị nhân sự, chính sách \"lương cứng + lương mềm (hoa hồng)\" nhằm mục đích gì?","opts":{"A":"Chỉ để giảm chi phí lương cho công ty","B":"Đảm bảo thu nhập cơ bản cho nhân viên, đồng thời tạo động lực mạnh mẽ để họ nỗ lực đạt kết quả kinh doanh tốt hơn thông qua hoa hồng.","C":"Gây khó khăn cho việc tính lương.","D":"Chỉ áp dụng cho nhân viên mới."},"ans":["B"],"exp":"","note":"","multi":false,"id":1149,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 23","q":"Khi thuyết phục khách hàng sử dụng dịch vụ môi giới của mình, yếu tố nào thường có sức nặng nhất?","opts":{"A":"Sự am hiểu thị trường.","B":"Mạng lưới khách hàng và cam kết mang lại giá trị thực sự cho khách hàng.","C":"Năng lực chuyên môn,","D":"Cả A, B, C đều đúng."},"ans":["D"],"exp":"","note":"","multi":false,"id":1150,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 24 · Đề 1B câu 36","q":"Nhà môi giới có nên từ chối làm việc với một khách hàng có yêu cầu phi thực tế hoặc không rõ ràng sau khi đã cố gắng tư vấn không?","opts":{"A":"Không bao giờ, phải cố gắng đáp ứng mọi yêu cầu.","B":"Nên từ chối một cách lịch sự và chuyên nghiệp.","C":"Nên tiếp tục làm việc nhưng không cần nỗ lực nhiều.","D":"Nên báo cáo khách hàng này với hiệp hội BĐS."},"ans":["B"],"exp":"","note":"","multi":false,"id":1151,"fix":false,"sets":{"1B":36}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 25","q":"Yếu tố nào thể hiện rõ nhất đạo đức nghề nghiệp của nhà môi giới trong giao dịch?","opts":{"A":"Luôn đạt được mức hoa hồng cao nhất.","B":"Luôn đặt lợi ích hợp pháp của khách hàng lên hàng đầu, trung thực, minh bạch và bảo mật thông tin.","C":"Luôn nói tốt về mọi bất động sản mình giới thiệu.","D":"Chỉ làm việc với những khách hàng giàu có."},"ans":["B"],"exp":"","note":"","multi":false,"id":1152,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 26","q":"Trong trường hợp nào thì việc sử dụng \"Hợp đồng Ủy quyền\" để mua bán bất động sản là hợp lệ và ít rủi ro nhất?","opts":{"A":"Người ủy quyền đang ở nước ngoài không thể về ký bán.","B":"Người ủy quyền và người được ủy quyền là vợ chồng/cha mẹ con cái ruột, nội dung ủy quyền rõ ràng, hợp pháp và còn hiệu lực.","C":"Người mua muốn nhờ người khác đứng tên hộ.","D":"Hợp đồng ủy quyền được lập bằng giấy viết tay."},"ans":["B"],"exp":"","note":"","multi":false,"id":1153,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 27","q":"Đâu là hạn chế chính của việc chỉ dựa vào các mối quan hệ cá nhân để tìm kiếm khách hàng trong môi giới bất động sản?","opts":{"A":"Khách hàng từ mối quan hệ thường khó tính hơn.","B":"Nguồn khách hàng bị giới hạn trong phạm vi mạng lưới quen biết, khó mở rộng quy mô kinh doanh.","C":"Phí hoa hồng thường thấp hơn.","D":"Khó xây dựng lòng tin với khách hàng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1154,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 28","q":"Hợp đồng mua bán bất động sản được công chứng có giá trị pháp lý như thế nào so với hợp đồng không công chứng (viết tay)?","opts":{"A":"Giá trị pháp lý như nhau.","B":"Hợp đồng công chứng có giá trị chứng cứ cao hơn.","C":"Hợp đồng viết tay có giá trị hơn vì thể hiện đúng ý chí các bên.","D":"Chỉ hợp đồng công chứng mới phải nộp thuế."},"ans":["B"],"exp":"","note":"","multi":false,"id":1155,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 29 · Đề 1B câu 10","q":"Việc sử dụng các công cụ phân tích dữ liệu website (ví dụ: Google Analytics) giúp nhà môi giới bất động sản làm gì?","opts":{"A":"Tự động đăng tin BĐS.","B":"Hiểu rõ hành vi của người truy cập website (họ xem tin nào nhiều, đến từ đâu, ở lại bao lâu...), từ đó tối ưu nội dung và chiến lược marketing online.","C":"Thiết kế lại giao diện website","D":"Tăng tốc độ tải trang web."},"ans":["B"],"exp":"","note":"","multi":false,"id":1156,"fix":false,"sets":{"1B":10}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 30 · Đề 1B câu 24","q":"Thái độ nào là KHÔNG phù hợp khi nhà môi giới nhận được một lời phàn nàn gay gắt từ khách hàng?","opts":{"A":"Lắng nghe chăm chú để hiểu rõ vấn đề.","B":"Đổ lỗi ngược lại cho khách hàng hoặc bên thứ ba.","C":"Xin lỗi về trải nghiệm không tốt của khách hàng (ngay cả khi lỗi không hoàn toàn do mình).","D":"Đề xuất hướng giải quyết hoặc khắc phục (nếu có thể)."},"ans":["B"],"exp":"","note":"","multi":false,"id":1157,"fix":false,"sets":{"1B":24}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 31","q":"Điều gì tạo nên sự khác biệt cốt lõi giữa một nhà môi giới bất động sản đơn thuần và một nhà tư vấn bất động sản chuyên nghiệp?","opts":{"A":"Số lượng giao dịch thành công.","B":"Mức phí hoa hồng cao hơn.","C":"Khả năng cung cấp giải pháp toàn diện, dựa trên sự thấu hiểu sâu sắc nhu cầu khách hàng, kiến thức thị trường và phân tích chuyên môn, thay vì chỉ kết nối mua bán.","D":"Thời gian hoạt động trong nghề lâu hơn."},"ans":["C"],"exp":"","note":"","multi":false,"id":1158,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 32","q":"Khi thị trường bất động sản có dấu hiệu trầm lắng, người bán không muốn giảm giá, nhà môi giới nên tập trung vào chiến lược nào?","opts":{"A":"Tạm dừng mọi hoạt động marketing.","B":"Chuyển sang chỉ làm việc với người mua.","C":"Tăng cường marketing sáng tạo, nhấn mạnh các giá trị độc đáo của bất động sản","D":"Yêu cầu người bán phải giảm giá bằng mọi cách."},"ans":["C"],"exp":"","note":"","multi":false,"id":1159,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 33","q":"Đâu là rủi ro khi nhà môi giới quá tập trung vào việc \"chốt sale\" nhanh chóng mà bỏ qua bước thẩm định thông tin kỹ lưỡng?","opts":{"A":"Nhận được hoa hồng nhanh hơn.","B":"Có thể dẫn đến giao dịch thất bại giữa chừng, tranh chấp pháp lý, mất uy tín và gây thiệt hại cho khách hàng.","C":"Được khách hàng đánh giá cao vì sự nhanh nhẹn.","D":"Tiết kiệm được chi phí hoạt động."},"ans":["B"],"exp":"","note":"","multi":false,"id":1160,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 34","q":"Trong hợp đồng mua bán, điều khoản Bất khả kháng thường đề cập đến vấn đề gì?","opts":{"A":"Quyền đơn phương chấm dứt hợp đồng của người mua.","B":"Các sự kiện khách quan, không lường trước được (thiên tai, dịch bệnh, chiến tranh...) làm ảnh hưởng đến việc thực hiện hợp đồng và miễn trừ trách nhiệm cho các bên.","C":"Nghĩa vụ nộp thuế của các bên.","D":"Mức phạt vi phạm hợp đồng."},"ans":["B"],"exp":"","note":"","multi":false,"id":1161,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 35 · Đề 1B câu 45","q":"Việc sử dụng \"bằng chứng xã hội\" trong marketing BĐS có thể là hình thức nào?","opts":{"A":"Đưa ra mức giá cao nhất thị trường.","B":"Sử dụng lời chứng thực của khách hàng cũ hài lòng, hiển thị các giải thưởng, chứng nhận uy tín.","C":"Che giấu thông tin về các giao dịch thất bại.","D":"Quảng cáo sai sự thật về tiện ích dự án."},"ans":["B"],"exp":"","note":"","multi":false,"id":1162,"fix":false,"sets":{"1B":45}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 36 · Đề 2B câu 6","q":"Trong trường hợp thị trường bất động sản biến động mạnh (tăng hoặc giảm giá nhanh), kỹ năng nào của nhà môi giới trở nên đặc biệt quan trọng?","opts":{"A":"Kỹ năng thiết kế nội thất.","B":"Kỹ năng phân tích thị trường, dự báo (ở mức độ nhất định) và tư vấn chiến lược kịp thời, linh hoạt cho khách hàng.","C":"Kỹ năng chụp ảnh BĐS.","D":"Kỹ năng soạn thảo văn bản hành chính."},"ans":["B"],"exp":"","note":"","multi":false,"id":1163,"fix":false,"sets":{"2B":6}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 37","q":"Việc từ chối cung cấp thông tin sai lệch theo yêu cầu của khách hàng (ví dụ: yêu cầu nói dối về tình trạng BĐS) thể hiện điều gì ở nhà môi giới?","opts":{"A":"Sự thiếu linh hoạt.","B":"Sự cứng nhắc, không biết chiều khách.","C":"Tính chính trực và tuân thủ đạo đức nghề nghiệp.","D":"Sự thiếu tự tin vào khả năng bán hàng."},"ans":["C"],"exp":"","note":"","multi":false,"id":1164,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 38","q":"Khi quản lý một đội ngũ nhân viên môi giới, việc xây dựng cơ chế chia sẻ thông tin và hợp tác (co-broke) nội bộ hiệu quả mang lại lợi ích gì?","opts":{"A":"Tăng sự cạnh tranh gay gắt giữa các nhân viên.","B":"Giảm tổng doanh thu của công ty.","C":"Tăng khả năng chốt giao dịch nhờ tận dụng được nguồn hàng và nguồn khách của nhau, tạo môi trường làm việc hợp tác.","D":"Làm lộ thông tin khách hàng ra ngoài."},"ans":["C"],"exp":"","note":"","multi":false,"id":1165,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 39","q":"Đâu là hạn chế của việc thẩm định giá bất động sản chỉ dựa vào phương pháp so sánh thị trường?","opts":{"A":"Phương pháp này quá phức tạp.","B":"Có thể không chính xác nếu thị trường có ít giao dịch tương đồng hoặc bất động sản có tính độc đáo cao.","C":"Chỉ áp dụng được cho bất động sản thương mại.","D":"Luôn cho ra kết quả thấp hơn giá trị thực."},"ans":["B"],"exp":"","note":"","multi":false,"id":1166,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 40","q":"Kỹ năng \"quản lý kỳ vọng\" của khách hàng có nghĩa là gì?","opts":{"A":"Luôn hứa hẹn những điều vượt quá khả năng để làm khách hàng hài lòng ban đầu.","B":"Đặt ra những kỳ vọng thực tế, rõ ràng cho khách hàng về quy trình, thời gian, kết quả có thể đạt được ngay từ đầu, tránh gây thất vọng về sau.","C":"Yêu cầu khách hàng không nên có kỳ vọng gì.","D":"Bỏ qua những kỳ vọng của khách hàng."},"ans":["B"],"exp":"","note":"","multi":fal  thấp hơn 3% so với diện tích ghi trong hợp đồng này thì hai bên không phải điều chỉnh lại gía bán căn hộ. Nếu diện tích thực tế chênh lệch vượt quá 3% so với diện tích ghi trong hợp đồng này thì giá bán của căn hộ sẽ được điều chỉnh lại theo diện tích đo đạc thực tế khi bàn giao căn hộ. Khi bàn giao cho khách hàng căn hộ F có diện tích là 57,7 m2, khách hàng được quyền:","opts":{"A":"Nhận căn hộ và thanh toán theo diện tích thực tế","B":"Từ chối nhận căn hộ và không bị coi là vi phạm các điều kiện bàn giao căn hộ","C":"Nhận căn hộ và thanh toán theo giá bán căn hộ như hợp đồng đã ký","D":"Cả A, B và C đều đúng"},"ans":["A"],"exp":"","note":"","multi":false,"id":1231,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 105","q":"Chiến lược “Đẩy” áp dụng trong kinh doanh BĐS được hiểu như thế nào?","opts":{"A":"Tìm cách thu phục khách hàng mua sản phẩm","B":"Tìm cách đưa sản phẩm đến các nhà phân phối và khách hàng bằng các chương trình khuyến mãi, quà tặng, chiết khấu hoa hồng.","C":"Tìm ra sự nhận biết về thương hiệu và sự hấp dẫn khách hàng bằng sản phẩm khác","D":"Cả A, B, C đều đúng"},"ans":["B"],"exp":"","note":"","multi":false,"id":1232,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 106","q":"Điểm nào đặc biệt quan trọng đối với việc hoạch định chiến lược Marketing trong kinh doanh BĐS?","opts":{"A":"Chính sách nhà nước","B":"Nhu cầu khách hàng","C":"Lợi thế cạnh tranh","D":"Nguồn vốn"},"ans":["B"],"exp":"","note":"","multi":false,"id":1233,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 107","q":"Nguyên tắc của người môi giới muốn phát triển dài hạn là?","opts":{"A":"Hướng đến khách hàng","B":"Làm đến đâu hay đến đó","C":"Bằng mọi giá hướng đến thu nhập của bản thân","D":"Cả A, B và C đều sai"},"ans":["A"],"exp":"","note":"","multi":false,"id":1234,"fix":false,"sets":{}},{"topic":"cm3","src":"Bộ đề CĐ14 câu 108 · Đề 2B câu 3","q":"Tiếp nhận sản phẩm từ Ban Giám đốc Công ty, việc đầu tiên người môi giới cần thực hiện?","opts":{"   const k = todayKey(); DAY[k] = (DAY[k] || 0) + 1; saveP(); updBadge();
}
const isWrong = q => P[q.id] && P[q.id][2] === 0;

}

// ---------- nhóm câu hỏi
function poolFor(sel) {
  if (sel === 'all') return Q;
  if (sel === 'co_so' || sel === 'chuyen_mon') return Q.filter(q => tBy[q.topic].part === sel);
  if (sel.startsWith('set:')) { const s = sel.slice(4); return Q.filter(q => q.sets && q.sets[s]).sort((a, b) => a.sets[s] - b.sets[s]); }
  if (sel === 'wrong') return wrongList();
  if (sel === 'bm') return Q.filter(q => BM.has(q.id));
  return Q.filter(q => q.topic === sel);
}
function selName(sel) {
  if (sel === 'all') return 'Toàn bộ ngân hàng';
  if (PART[sel]) return 'Toàn bộ ' + PART[sel].toLowerCase();
  if (sel.startsWith('set:')) return 'Đề ' + sel.slice(4);
  if (sel === 'wrong') return 'Câu làm sai';
  if (sel === 'bm') return 'Câu đánh dấu';

}
function stats(qs) { let d = 0, r = 0; for (const q of qs) { if (P[q.id]) { d++; if (P[q.id][2] === 1) r++; } } return {n: qs.length, d, r}; }

    h += '</optgroup>';
  }
  h += `<optgroup label="Đề tổng hợp">` + SETS.map(s => `<option value="set:${s.id}"${cur === 'set:' + s.id ? ' selected' : ''}>Đề ${s.id} · ${PSHORT[s.part]} (${s.count})</option>`).join('') + '</optgroup>';
  h += `<optgroup label="Ôn lại"><option value="wrong"${cur === 'wrong' ? ' selected' : ''}>Câu làm sai (${wrongList().length})</option><option value="bm"${cur === 'bm' ? ' selected' : ''}>Câu đánh dấu (${BM.size})</option></optgroup>`;

}

}

}

function qCard(q, pick, checked, mode) {

}

function startExam() {
  const part = exCfg.part, pool = poolFor(part);
  let list;
  if (part.startsWith('set:')) list = pool.map(q => q.id);
  else {
    const groups = {}; for (const q of shuffle(pool)) (groups[q.topic] = groups[q.topic] || []).push(q.id);
    const keys = shuffle(Object.keys(groups)); list = []; const n = Math.min(exCfg.n, pool.length);
    while (list.length < n) { let add = false; for (const k of keys) if (groups[k].length && list.length < n) { list.push(groups[k].shift()); add = true; } if (!add) break; }
    list = shuffle(list);
  }
  store.set('excfg', exCfg);
  EX = {label: partLabel(part), part, list, ans: {}, flag: {}, i: 0, start: Date.now(), end: Date.now() + exCfg.min * 60000, min: exCfg.min, done: false, confirm: false, grid: false};
  saveEx(); renderExamRun();
}
function saveEx() { store.set('exam', EX); }
function tick() {
  if (!EX || EX.done) { clearInterval(exTimer); exTimer = null; return; }
  const left = EX.end - Date.now(); const el = $('#timer');
  if (el) { el.lastChild.textContent = fmt(left); el.classList.toggle('low', left < 5 * 60000); }
  if (left <= 0) submitExam();
}
function renderExamRun() {
  if (!exTimer) exTimer = setInterval(tick, 1000);
  const q = byId.get(EX.list[EX.i]); const pick = EX.ans[q.id] || [];
  const answered = EX.list.filter(id => (EX.ans[id] || []).length).length, nflag = EX.list.filter(id => EX.flag[id]).length;
  let h = `<div class="exbar"><span class="timer ${EX.end - Date.now() < 300000 ? 'low' : ''}" id="timer">${IC.timer}<span>${fmt(EX.end - Date.now())}</span></span>
    <span class="muted small num grow">Đã làm <b style="color:var(--ink)">${answered}/${EX.list.length}</b>${nflag ? ` · ${nflag} cần xem lại` : ''}</span>
    <button class="btn sm" id="eGrid">${EX.grid ? 'Ẩn danh sách' : 'Danh sách câu'}</button></div><div class="stack">`;
  if (EX.grid) h += `<div class="sheet"><div class="grid" aria-label="Danh sách câu">${EX.list.map((id, k) => `<button class="cell ${(EX.ans[id] || []).length ? 'done' : ''} ${EX.flag[id] ? 'flag' : ''} ${k === EX.i ? 'cur' : ''}" data-jump="${k}">${k + 1}</button>`).join('')}</div><p class="hint" style="margin:10px 0 0">Ô xanh là câu đã chọn đáp án, chấm vàng là câu bạn muốn xem lại.</p></div>`;
  h += `<div class="progress"><span class="num">${esc(EX.label)} · câu ${EX.i + 1}/${EX.list.length}</span></div>`;
  h += qCard(q, pick, false, 'exam');
  h += `<div class="actions"><button class="btn" id="eprev" ${EX.i === 0 ? 'disabled' : ''}>← Trước</button>
    <button class="btn flagbtn" id="eflag" aria-pressed="${!!EX.flag[q.id]}">${IC.flag}Xem lại sau</button>
    ${EX.i < EX.list.length - 1 ? `<button class="btn primary grow" id="enext">Câu tiếp →</button>` : `<button class="btn primary grow" id="esubmit">Nộp bài</button>`}</div>`;
  if (EX.i < EX.list.length - 1) h += `<button class="btn ghost" id="esubmit" style="align-self:flex-end">Nộp bài sớm</button>`;
  if (EX.confirm) h += `<div class="confirm"><span class="grow">${answered < EX.list.length ? `Còn <b>${EX.list.length - answered}</b> câu chưa trả lời. ` : ''}Nộp bài và chấm điểm?</span><button class="btn danger" id="eyes">Nộp bài</button><button class="btn" id="eno">Làm tiếp</button></div>`;
  $('#view').innerHTML = h + `</div>`;
}
function submitExam() {
  clearInterval(exTimer); exTimer = null;
  if (!EX || EX.done) return;
  EX.done = true; EX.show = true; EX.used = Math.min(Date.now(), EX.end) - EX.start;
  let ok = 0; for (const id of EX.list) { const r = sameSet(EX.ans[id] || [], byId.get(id).ans); if (r) ok++; record(id, r); }
  EX.ok = ok;
  HIST.unshift({ts: Date.now(), label: EX.label, n: EX.list.length, ok, dur: EX.used, target: SETG.target}); HIST = HIST.slice(0, 30); store.set('hist', HIST);
  saveEx();
  if (view === 'thi-thu') { renderResult(); window.scrollTo({top: 0}); } else toast('Đã hết giờ, bài thi được nộp tự động');
}
function renderResult(onlyWrong) {
  const N = EX.list.length, ok = EX.list.filter(id => sameSet(EX.ans[id] || [], byId.get(id).ans)), p = pct(ok.length, N), pass = p >= SETG.target;
  const per = {}; for (const id of EX.list) { const t = byId.get(id).topic; per[t] = per[t] || [0, 0]; per[t][1]++; if (ok.includes(id)) per[t][0]++; }
  const wrong = EX.list.filter(id => !ok.includes(id));
  let h = `<div class="stack"><section class="score"><div class="eyebrow" style="color:var(--brand-muted)">Kết quả · ${esc(EX.label)}</div>
    <div class="big num">${ok.length}<small>/${N} câu đúng</small></div>
    <div class="meta"><span class="pill ${pass ? 'ok' : 'bad'}">${p}% · ${pass ? 'Đạt mục tiêu ' + SETG.target + '%' : 'Chưa đạt mục tiêu ' + SETG.target + '%'}</span><span class="num">Thời gian làm ${fmt(EX.used)}</span></div></section>
    <div class="row">${wrong.length ? `<button class="btn primary" id="rWrong">Luyện lại ${wrong.length} câu sai</button>` : ''}<button class="btn" id="rAgain">Thi đề mới</button></div>
    <div class="tw"><table class="tbl"><thead><tr><th>Chuyên đề</th><th style="text-align:right">Đúng</th><th style="text-align:right">Tỷ lệ</th></tr></thead><tbody>
    ${Object.entries(per).sort((a, b) => TOPICS.findIndex(t => t.id === a[0]) - TOPICS.findIndex(t => t.id === b[0])).map(([t, v]) => `<tr><td>${tBy[t].code} · ${esc(tBy[t].name)}</td><td class="n">${v[0]}/${v[1]}</td><td class="n" style="color:${pct(v[0], v[1]) >= SETG.target ? 'var(--ok)' : 'var(--bad)'}">${pct(v[0], v[1])}%</td></tr>`).join('')}
    </tbody></table></div>
    <div class="sechead"><h2>Xem lại bài làm</h2>${segBtns('rFilter', onlyWrong ? 'w' : 'a', [['a', 'Tất cả câu'], ['w', 'Chỉ câu sai']])}</div>
    <div class="stack">${(onlyWrong ? wrong : EX.list).map((id, k) => reviewItem(byId.get(id), EX.ans[id] || [], onlyWrong ? null : EX.list.indexOf(id) + 1)).join('') || '<div class="empty">Bạn trả lời đúng toàn bộ đề.</div>'}</div></div>`;
  $('#view').innerHTML = h;
  const rw = $('#rWrong'); if (rw) rw.onclick = () => go('luyen-tap', {sel: 'all', ids: wrong});
  $('#rAgain').onclick = () => { EX = null; store.del('exam'); renderExam(); };
  $('#rFilter').onclick = e => { const b = e.target.closest('[data-v]'); if (b) renderResult(b.dataset.v === 'w'); };
}
function reviewItem(q, pick, num) {
  const t = tBy[q.topic], ok = pick && sameSet(pick, q.ans);
  return `<div class="item"><div class="row" style="gap:6px">${num ? `<span class="pill ${ok ? 'ok' : 'bad'} num">Câu ${num}</span>` : ''}<span class="code" style="padding:3px 7px">${t.code}</span>${q.fix ? '<span class="pill fixb">Đã hiệu đính</span>' : ''}</div>
    <div class="q">${esc(q.q)}</div>
    <div class="a">${pick ? (pick.length ? `<div class="${ok ? '' : 'yours'}">Bạn chọn: ${pick.map(k => k + '. ' + esc(q.opts[k] || '')).join('; ')}</div>` : '<div class="yours">Chưa trả lời</div>') : ''}<div class="ans">Đáp án: ${q.ans.map(k => k + '. ' + esc(q.opts[k])).join('; ')}</div></div>
    ${q.exp || q.note ? `<details><summary>Giải thích</summary>${q.exp ? `<p>${esc(q.exp)}</p>` : ''}${q.note ? `<p style="color:var(--warn)">${esc(q.note)}</p>` : ''}</details>` : ''}
    <div class="src" style="margin-top:6px">${esc(q.src)}</div></div>`;
}

// ---------- ÔN LẠI
let rvTab = 'wrong';
function renderReview(arg) {
  if (arg && arg.tab) rvTab = arg.tab;
  const W = wrongList(), B = Q.filter(q => BM.has(q.id));
  let h = `<div class="stack"><div><div class="eyebrow">Ôn lại</div><h2>Câu sai, câu đánh dấu và lịch sử thi</h2></div>${segBtns('rvTab', rvTab, [['wrong', `Câu sai (${W.length})`], ['bm', `Đánh dấu (${B.length})`], ['hist', `Lịch sử (${HIST.length})`]])}`;
  if (rvTab === 'hist') {
    h += HIST.length ? `<div class="list">${HIST.map(histRow).join('')}</div>` : `<div class="empty">Chưa có bài thi thử nào. Vào tab Thi thử để làm đề đầu tiên.</div>`;
  } else {
    const L = rvTab === 'wrong' ? W : B;
    if (!L.length) h += `<div class="empty">${rvTab === 'wrong' ? 'Chưa có câu sai. Câu nào bạn trả lời sai ở lần gần nhất sẽ nằm ở đây cho đến khi bạn làm đúng lại.' : 'Chưa đánh dấu câu nào. Bấm ngôi sao trên thẻ câu hỏi để lưu câu muốn xem lại.'}</div>`;
    else h += `<button class="btn primary" data-practice="${rvTab}">Luyện lại ${L.length} câu này</button><div class="stack">${L.slice(0, 80).map(q => reviewItem(q, null, null)).join('')}</div>${L.length > 80 ? '<p class="muted small">Hiển thị 80 câu đầu. Bấm "Luyện lại" để làm toàn bộ.</p>' : ''}`;
  }
  $('#view').innerHTML = h + `</div>`;
}

// ---------- TRA CỨU
const QF = Q.map(q => fold(q.q + ' ' + Object.values(q.opts).join(' ') + ' ' + (q.exp || '') + ' ' + (q.note || '') + ' ' + q.src));
let sq = '';
function renderSearch() {
  $('#view').innerHTML = `<div class="stack"><div class="field"><label for="sq">Tìm câu hỏi theo từ khóa (gõ không dấu cũng được)</label><input type="search" id="sq" placeholder="ví dụ: dat coc 5%, 400 trieu, thoi hieu" value="${esc(sq)}" autocomplete="off"></div><div id="sres"></div></div>`;
  const inp = $('#sq'); inp.oninput = () => { sq = inp.value; doSearch(); }; doSearch(); inp.focus({preventScroll: true});
}
function doSearch() {
  const terms = fold(sq).split(/\s+/).filter(w => w.length > 1), box = $('#sres');
  if (!terms.length) { box.innerHTML = `<div class="empty">Gõ từ khóa để tra nhanh câu hỏi, đáp án và căn cứ pháp lý trong ${Q.length} câu.</div>`; return; }
  const res = []; QF.forEach((f, i) => { if (terms.every(t => f.includes(t))) res.push(Q[i]); });
  box.innerHTML = `<p class="muted small" style="margin:0 0 10px">${res.length} câu khớp</p><div class="stack">${res.slice(0, 50).map(q => reviewItem(q, null, null)).join('')}</div>${res.length > 50 ? '<p class="muted small">Hiển thị 50 câu đầu. Thêm từ khóa để thu hẹp.</p>' : ''}`;
}

// ---------- CÀI ĐẶT
function openSettings(confirmReset) {
  $('#overlay').innerHTML = `<div class="overlay" id="ovl"><div class="panel" role="dialog" aria-modal="true" aria-label="Cài đặt">
    <div class="row" style="justify-content:space-between"><h2>Cài đặt</h2><button class="btn sm" id="sClose">Đóng</button></div>
    <div class="field"><span class="flabel">Cỡ chữ</span>${segBtns('sFont', String(SETG.font), [['0.92', 'Nhỏ'], ['1', 'Vừa'], ['1.1', 'Lớn'], ['1.2', 'Rất lớn']])}</div>
    <div class="field"><span class="flabel">Giao diện</span>${segBtns('sTheme', SETG.theme, [['system', 'Theo máy'], ['light', 'Sáng'], ['dark', 'Tối']])}</div>
    <div class="controls">
      <div class="field"><label for="sTarget">Mục tiêu đạt khi thi thử (%)</label><select id="sTarget">${[50, 60, 70, 75, 80, 85, 90].map(n => `<option${n === SETG.target ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label for="sGoal">Số câu mỗi ngày</label><select id="sGoal">${[10, 20, 30, 50, 80, 100].map(n => `<option${n === SETG.goal ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
    </div>
    <p class="muted small" style="margin:0">Mục tiêu đạt là ngưỡng bạn tự đặt để luyện, không phải thang điểm chính thức của kỳ thi. Tiến độ chỉ lưu trên trình duyệt này.</p>
    ${confirmReset ? `<div class="confirm"><span class="grow">Xóa toàn bộ tiến độ, câu đánh dấu và lịch sử thi trên trình duyệt này?</span><button class="btn danger" id="sResetYes">Xóa</button><button class="btn" id="sResetNo">Giữ lại</button></div>` : `<button class="btn ghost" id="sReset" style="justify-self:start;color:var(--bad)">Xóa tiến độ luyện tập</button>`}
    <p class="small" style="margin:0;border-top:1px solid var(--line);padding-top:12px">Ngân hàng ${Q.length} câu từ tài liệu ôn thi CTS (bộ đề CĐ1–CĐ14, đề tổng hợp 1A, 2A, 1B, 2B và tài liệu ôn thi cơ sở). Câu trùng đã gộp; câu có đáp án tài liệu gốc đánh dấu nhầm được hiệu đính kèm ghi chú. NĐ 16/2022/NĐ-CP đã được thay bằng NĐ 339/2026/NĐ-CP từ 26/8/2026; các câu liên quan có ghi chú.<br><b>Bản quyền © 2026 Bạch Đằng · 0794 313 668</b></p>
  </div></div>`;
}
function closeSettings() { $('#overlay').innerHTML = ''; }
$('#btnSettings').onclick = () => openSettings();
$('#overlay').addEventListener('click', e => {
  if (e.target.id === 'ovl' || e.target.id === 'sClose') return closeSettings();
  const f = e.target.closest('#sFont [data-v]'); if (f) { SETG.font = +f.dataset.v; store.set('settings', SETG); applySettings(); return openSettings(); }
  const th = e.target.closest('#sTheme [data-v]'); if (th) { SETG.theme = th.dataset.v; store.set('settings', SETG); applySettings(); return openSettings(); }
  if (e.target.id === 'sReset') return openSettings(true);
  if (e.target.id === 'sResetNo') return openSettings();
  if (e.target.id === 'sResetYes') { P = {}; BM = new Set(); HIST = []; DAY = {}; LAST = null; EX = null; ['p', 'bm', 'hist', 'day', 'last', 'exam'].forEach(k => store.del(k)); updBadge(); closeSettings(); toast('Đã xóa tiến độ'); go(view); }
});
$('#overlay').addEventListener('change', e => {
  if (e.target.id === 'sTarget') { SETG.target = +e.target.value; store.set('settings', SETG); }
  if (e.target.id === 'sGoal') { SETG.goal = +e.target.value; store.set('settings', SETG); }
});

// ---------- sự kiện chung
$('#view').addEventListener('click', e => {
  const t = e.target;
  const bm = t.closest('[data-bm]');
  if (bm) { const id = +bm.dataset.bm; if (BM.has(id)) BM.delete(id); else BM.add(id); store.set('bm', [...BM]); bm.setAttribute('aria-pressed', BM.has(id)); bm.innerHTML = BM.has(id) ? IC.starFill : IC.star; toast(BM.has(id) ? 'Đã đánh dấu câu này' : 'Đã bỏ đánh dấu'); return; }
  const o = t.closest('.opt');
  if (o && !o.disabled) {
    if (view === 'luyen-tap' && !pr.checked) { const q = byId.get(pr.list[pr.i]); pr.pick = q.multi ? (pr.pick.includes(o.dataset.k) ? pr.pick.filter(x => x !== o.dataset.k) : [...pr.pick, o.dataset.k].sort()) : [o.dataset.k]; if (SETG.instant && !q.multi) return practiceCheck(); renderPractice(); }
    else if (view === 'thi-thu' && EX && !EX.done) { const id = EX.list[EX.i]; EX.ans[id] = [o.dataset.k]; saveEx(); renderExamRun(); }
    return;
  }
  const p = t.closest('[data-practice]'); if (p) return go('luyen-tap', {sel: p.dataset.practice});
  const qe = t.closest('[data-quickexam]'); if (qe) { exCfg.part = qe.dataset.quickexam; if (!EX || EX.done) { EX = null; return go('thi-thu', {part: qe.dataset.quickexam, start: true}); } return go('thi-thu'); }
  const se = t.closest('[data-setexam]'); if (se) { if (EX && !EX.done) return go('thi-thu'); EX = null; return go('thi-thu', {part: 'set:' + se.dataset.setexam}); }
  if (t.closest('[data-resume]')) return go('luyen-tap', {resume: true});
  if (t.closest('[data-resumeexam]')) return go('thi-thu');
  const rt = t.closest('[data-reviewtab]'); if (rt) return go('on-tap', {tab: rt.dataset.reviewtab});
  // luyện tập
  if (view === 'luyen-tap') {
    const fb = t.closest('#pFilter [data-v]'); if (fb) { pr.filter = fb.dataset.v; return buildPractice(); }
    const ob = t.closest('#pOrder [data-v]'); if (ob) { pr.order = ob.dataset.v; return buildPractice(); }
    if (t.id === 'check') return practiceCheck();
    if (t.id === 'next' || t.id === 'skip') return practiceMove(1);
    if (t.id === 'prev') return practiceMove(-1);
  }
  // thi thử
  if (view === 'thi-thu') {
    const pb = t.closest('#ePart [data-v]'); if (pb) { exCfg.part = pb.dataset.v; return renderExam(); }
    if (t.id === 'eStart') { EX = null; return startExam(); }
    if (!EX || EX.done) return;
    if (t.closest('#eGrid')) { EX.grid = !EX.grid; return renderExamRun(); }
    if (t.closest('#eflag')) { const id = EX.list[EX.i]; EX.flag[id] = !EX.flag[id]; saveEx(); return renderExamRun(); }
    if (t.id === 'eprev') { EX.i--; EX.confirm = false; saveEx(); return renderExamRun(); }
    if (t.id === 'enext') { EX.i++; EX.confirm = false; saveEx(); renderExamRun(); return window.scrollTo({top: 0}); }
    if (t.id === 'esubmit') { EX.confirm = true; renderExamRun(); return $('.confirm').scrollIntoView({block: 'center'}); }
    if (t.id === 'eyes') return submitExam();
    if (t.id === 'eno') { EX.confirm = false; return renderExamRun(); }
    const j = t.closest('[data-jump]'); if (j) { EX.i = +j.dataset.jump; EX.confirm = false; saveEx(); return renderExamRun(); }
  }
  if (view === 'on-tap') { const rb = t.closest('#rvTab [data-v]'); if (rb) return renderReview({tab: rb.dataset.v}); }
});
$('#view').addEventListener('change', e => {
  if (e.target.id === 'pSel') { pr.sel = e.target.value; pr.filter = 'all'; return buildPractice(); }
  if (e.target.id === 'pInstant') { SETG.instant = e.target.checked; store.set('settings', SETG); }
  if (e.target.id === 'eN') exCfg.n = +e.target.value;
  if (e.target.id === 'eMin') exCfg.min = +e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey || $('#ovl')) return;
  const map = {'1': 'A', '2': 'B', '3': 'C', '4': 'D', a: 'A', b: 'B', c: 'C', d: 'D'}; const k = map[e.key.toLowerCase()];
  if (view === 'luyen-tap' && pr.list.length) {
    const q = byId.get(pr.list[pr.i]);
    if (k && q.opts[k] && !pr.checked) { pr.pick = [k]; if (SETG.instant) return practiceCheck(); renderPractice(); }
    else if (e.key === 'Enter') { e.preventDefault(); pr.checked ? practiceMove(1) : practiceCheck(); }
    else if (e.key === 'ArrowRight') practiceMove(1); else if (e.key === 'ArrowLeft') practiceMove(-1);
  } else if (view === 'thi-thu' && EX && !EX.done && EX.end > Date.now()) {
    const id = EX.list[EX.i], q = byId.get(id);
    if (k && q.opts[k]) { EX.ans[id] = [k]; saveEx(); renderExamRun(); }
    else if (e.key === 'ArrowRight' && EX.i < EX.list.length - 1) { EX.i++; renderExamRun(); }
    else if (e.key === 'ArrowLeft' && EX.i > 0) { EX.i--; renderExamRun(); }
  }
});
// vuốt ngang để chuyển câu
let tx = null, ty = null;
$('#view').addEventListener('touchstart', e => { if (!e.target.closest('.qcard')) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
$('#view').addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
  if (view === 'luyen-tap') practiceMove(dx < 0 ? 1 : -1);
  else if (view === 'thi-thu' && EX && !EX.done) { const n = EX.i + (dx < 0 ? 1 : -1); if (n >= 0 && n < EX.list.length) { EX.i = n; saveEx(); renderExamRun(); } }
}, {passive: true});
document.addEventListener('click', e => {
  if (!e.target.closest('[data-copyphone]')) return;
  const num = '0794313668';
  const done = () => toast('Đã sao chép số 0794 313 668');
  try { navigator.clipboard.writeText(num).then(done, () => { selectPhone(); toast('Số đã được bôi đen, nhấn giữ để sao chép'); }); } catch (err) { selectPhone(); }
});
function selectPhone() { const r = document.createRange(); r.selectNodeContents($('#phone')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

applySettings();
updBadge();
go(VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'tong-quan');
</script>
