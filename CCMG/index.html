giả.","note":"","multi":false,"id":239,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 34","q":"Hành vi chậm cung cấp thông tin đất đai theo yêu cầu của cơ quan có thẩm quyền bị xử phạt như thế nào đối với cá nhân?","opts":{"A":"Phạt tiền 2 - 5 triệu đồng","B":"Phạt tiền 5 - 10 triệu đồng","C":"Phạt cảnh cáo","D":"Không bị xử phạt nếu sau đó cung cấp đủ"},"ans":["C"],"exp":"Đối với hành vi chậm cung cấp thông tin, hình thức xử phạt đối với cá nhân là cảnh cáo.","note":"","multi":false,"id":240,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 35","q":"Thời hạn buộc đưa đất vào sử dụng đối với hành vi bỏ hoang đất trồng rừng là bao lâu?","opts":{"A":"30 ngày","B":"60 ngày","C":"90 ngày","D":"120 ngày"},"ans":["C"],"exp":"Điều 24 Nghị định 123/2024/NĐ-CP thời hạn buộc đưa đất vào sử dụng là 60 ngày đối với đất trồng cây hàng năm, nuôi trồng thủy sản, cây lâu năm và 90 ngày đối với đất trồng rừng.","note":"","multi":false,"id":241,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 36","q":"Mức phạt tối đa đối với tổ chức có hành vi vi phạm về điều kiện hoạt động dịch vụ trong lĩnh vực đất đai (Điều 29 Nghị định 123/2024/NĐ-CP) là bao nhiêu?","opts":{"A":"100 triệu đồng","B":"120 triệu đồng","C":"200 triệu đồng","D":"400 triệu đồng"},"ans":["B"],"exp":"Khung phạt tiền đối với tổ chức vi phạm điều kiện hoạt động dịch vụ đất đai theo Điều 29 có mức cao nhất là 120 triệu đồng (ví dụ: không đủ điều kiện về cơ sở vật chất, nhân lực đối với một số dịch vụ).","note":"","multi":false,"id":242,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 37","q":"Hành vi nào của chủ đầu tư bị phạt tiền ở mức cao nhất (800 triệu - 1 tỷ đồng) theo Điều 58 Nghị định 16/2022/NĐ-CP?","opts":{"A":"Không công khai thông tin dự án","B":"Ký hợp đồng mua bán không gắn quyền sử dụng đất","C":"Sử dụng vốn huy động sai mục đích","D":"Thu tiền mua nhà hình thành trong tương lai vượt tỷ lệ 70% trước bàn giao"},"ans":["C"],"exp":"Các hành vi như chuyển nhượng dự án sai, bàn giao nhà chưa đủ điều kiện, huy động vốn sai quy định và sử dụng vốn huy động sai mục đích thuộc nhóm bị phạt cao nhất (800 triệu 1 tỷ đồng).","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":243,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 38","q":"Hành vi nào của cá nhân môi giới BĐS bị áp dụng hình thức xử phạt bổ sung là tước chứng chỉ hành nghề (3-6 tháng)?","opts":{"A":"Không có chứng chỉ hành nghề","B":"Chứng chỉ hành nghề hết hạn","C":"Cho người khác mượn/thuê chứng chỉ hành nghề","D":"Môi giới đồng thời là một bên trong hợp đồng"},"ans":["C"],"exp":"Theo Điều 59 Nghị định 16/2022/NĐ-CP Hành vi tẩy xóa, sửa chữa hoặc cho mượn/thuê chứng chỉ hành nghề môi giới bị tước quyền sử dụng chứng chỉ từ 3-6 tháng.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":244,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 39","q":"Doanh nghiệp kinh doanh dịch vụ BĐS không đủ số người có chứng chỉ môi giới theo quy định bị xử phạt ở mức nào?","opts":{"A":"40 - 60 triệu đồng","B":"120 - 160 triệu đồng","C":"200 - 250 triệu đồng","D":"400 - 600 triệu đồng"},"ans":["B"],"exp":"Theo Điều 59 Nghị định 16/2022/NĐ-CP, Vi phạm về điều kiện kinh doanh như không thành lập doanh nghiệp hoặc không đủ số người có chứng chỉ bị phạt tiền từ 120 đến 160 triệu đồng đối với tổ chức.","note":"Theo NĐ 339/2026/NĐ-CP: doanh nghiệp môi giới không có tối thiểu 01 người có chứng chỉ hành nghề bị phạt 60 – 80 triệu đồng; kinh doanh môi giới không thành lập doanh nghiệp: 120 – 160 triệu đồng. Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":245,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 40","q":"Mức phạt tiền đối với tổ chức có hành vi chia sẻ thông tin về nhà ở và thị trường BĐS trái phép là bao nhiêu?","opts":{"A":"40 - 60 triệu đồng","B":"60 - 80 triệu đồng","C":"80 - 100 triệu đồng","D":"100 - 120 triệu đồng"},"ans":["B"],"exp":"Theo Điều 60 Nghị định 16/2022/NĐ-CP, Các hành vi vi phạm về quản lý, sử dụng thông tin nhà ở và thị trường BĐS (bao gồm chia sẻ trái phép) bị phạt tiền từ 60 đến 80 triệu đồng đối với tổ chức.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":246,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 41","q":"Hành vi ủy quyền hoặc giao cho bên thứ ba (không phải đơn vị phân phối) ký hợp đồng mua bán/thuê mua BĐS thay mặt chủ đầu tư bị xử phạt như thế nào?","opts":{"A":"Phạt tiền 100 - 120 triệu đồng","B":"Phạt tiền 120 - 160 triệu đồng","C":"Phạt tiền 400 - 600 triệu đồng và có thể bị đình chỉ hoạt động KD BĐS (3-6 tháng)","D":"Chỉ bị cảnh cáo"},"ans":["C"],"exp":"Theo Điều 58 Nghị định 16/2022/NĐ-CP Hành vi ủy quyền ký hợp đồng sai quy định thuộc nhóm bị phạt tiền từ 400 - 600 triệu đồng và có thể bị đình chỉ hoạt động kinh doanh BĐS từ 3-6 tháng.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":247,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 42","q":"Chủ đầu tư dự án BĐS không công khai thông tin về BĐS đưa vào kinh doanh theo quy định sẽ bị xử phạt ở mức nào theo Điều 58 Nghị định 16/2022?","opts":{"A":"400 - 600 triệu đồng.","B":"800 triệu - 1 tỷ đồng.","C":"100 - 120 triệu đồng.","D":"120 - 160 triệu đồng."},"ans":["C"],"exp":"Điều 58 Nghị định 16/2022Hành vi không công khai hoặc công khai sai thông tin dự án thuộc Khoản 1 Điều 58, với mức phạt tiền từ 100 triệu đến 120 triệu đồng đối với tổ chức.","note":"Theo NĐ 339/2026/NĐ-CP: không công khai hoặc công khai không đầy đủ, không trung thực thông tin BĐS bị phạt 300 – 400 triệu đồng. Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":248,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 43","q":"Việc chủ đầu tư ký hợp đồng mua bán nhà ở hình thành trong tương lai mà không có bảo lãnh hợp lệ của ngân hàng thương mại bị xử phạt ở khung nào?","opts":{"A":"100 - 120 triệu đồng.","B":"120 - 160 triệu đồng.","C":"400 - 600 triệu đồng.","D":"800 triệu - 1 tỷ đồng."},"ans":["C"],"exp":"Hành vi bán/cho thuê mua nhà ở hình thành trong tương lai không có bảo lãnh ngân hàng hoặc bảo lãnh không hợp lệ thuộc Khoản 3 Điều 58, với mức phạt tiền từ 400 triệu đến 600 triệu đồng đối với tổ chức.","note":"","multi":false,"id":249,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 44 · Đề 1A câu 34","q":"Hành vi nào sau đây của chủ đầu tư KHÔNG bị phạt tiền ở mức cao nhất (800 triệu - 1 tỷ đồng) theo Điều 58 Nghị định 16/2022?","opts":{"A":"Chuyển nhượng toàn bộ dự án không đủ điều kiện.","B":"Bàn giao nhà ở khi chưa hoàn thành việc nghiệm thu đưa công trình vào sử dụng.","C":"Huy động vốn không đúng quy định.","D":"Ký hợp đồng mua bán nhà ở không gắn với quyền sử dụng đất."},"ans":["D"],"exp":"Hành vi ký hợp đồng không gắn quyền sử dụng đất bị phạt ở mức 120 - 160 triệu đồng (Khoản 2 Điều 58). Các hành vi còn lại thuộc Khoản 4 Điều 58 và bị phạt ở mức cao nhất 800 triệu - 1 tỷ đồng.","note":"Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":250,"sets":{"1A":34},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 45","q":"Tổ chức kinh doanh dịch vụ sàn giao dịch BĐS không có quy chế hoạt động theo quy định bị xử phạt ở mức nào?","opts":{"A":"40 - 60 triệu đồng.","B":"120 - 160 triệu đồng.","C":"200 - 250 triệu đồng.","D":"Không bị xử phạt, chỉ bị nhắc nhở."},"ans":["B"],"exp":"Hành vi sàn giao dịch hoạt động không có quy chế hoặc sai quy chế thuộc Khoản 2 Điều 59, bị phạt tiền từ 120 triệu đến 160 triệu đồng.","note":"","multi":false,"id":251,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 46","q":"Cá nhân môi giới BĐS có hành vi cho người khác mượn chứng chỉ hành nghề của mình sẽ bị áp dụng hình thức xử phạt nào?","opts":{"A":"Chỉ phạt tiền 40 - 60 triệu đồng.","B":"Phạt tiền 40 - 60 triệu đồng và bị tước quyền sử dụng chứng chỉ hành nghề từ 3-6 tháng.","C":"Chỉ bị tước quyền sử dụng chứng chỉ hành nghề vĩnh viễn.","D":"Cảnh cáo."},"ans":["B"],"exp":"Hành vi cho mượn/thuê chứng chỉ hành nghề (điểm c Khoản 1 Điều 59) vừa bị phạt tiền từ 40-60 triệu đồng, vừa bị áp dụng hình thức xử phạt bổ sung là tước quyền sử dụng chứng chỉ hành nghề từ 3 đến 6 tháng.","note":"","multi":false,"id":252,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 47 · Đề 2A câu 30","q":"Việc không tuân thủ thủ tục \"đăng ký biến động đất đai\" khi có thay đổi về người sử dụng đất có thể dẫn đến hậu quả trực tiếp nào theo Nghị định 123/2024?","opts":{"A":"Bị thu hồi đất ngay lập tức.","B":"Bị phạt tiền từ 2 - 3 triệu đồng (cá nhân) và buộc thực hiện thủ tục đăng ký.","C":"Bị truy cứu trách nhiệm hình sự.","D":"Hợp đồng chuyển nhượng bị vô hiệu đương nhiên."},"ans":["B"],"exp":"Điều 16 Nghị định 123/2024 quy định phạt tiền từ 2-3 triệu đồng (cá nhân) cho hành vi không đăng ký biến động và biện pháp khắc phục là buộc thực hiện thủ tục đăng ký.","note":"","multi":false,"id":253,"sets":{"2A":30},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 48","q":"Việc kết hợp giữa phạt tiền và các biện pháp khắc phục hậu quả cụ thể (buộc khôi phục, buộc thực hiện thủ tục...) trong hệ thống xử phạt Việt Nam phản ánh mục tiêu gì?","opts":{"A":"Chỉ nhằm tối đa hóa nguồn thu từ tiền phạt.","B":"Vừa răn đe, trừng phạt, vừa khắc phục hậu quả và lập lại trật tự quản lý.","C":"Tạo thêm công việc cho các cơ quan hành chính.","D":"Giảm gánh nặng cho hệ thống tòa án."},"ans":["B"],"exp":"Đặc điểm này phản ánh mục tiêu kép: vừa răn đe bằng chế tài tài chính, vừa nỗ lực khắc phục triệt để hậu quả của vi phạm, khôi phục tình trạng pháp lý ban đầu và buộc tuân thủ đúng quy định.","note":"","multi":false,"id":254,"sets":{},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 49 · Đề 2A câu 37","q":"Hành vi xây dựng hàng rào kiên cố lấn sang phần đất lưu không hành lang an toàn giao thông đường bộ có thể bị xử phạt theo quy định nào?","opts":{"A":"Chỉ theo pháp luật về giao thông đường bộ.","B":"Chỉ theo pháp luật về xây dựng.","C":"Có thể bị xử phạt về hành vi lấn chiếm đất (đất công do Nhà nước quản lý.","D":"Chỉ bị yêu cầu tháo dỡ."},"ans":["C"],"exp":"Đất hành lang an toàn giao thông là đất công. Việc xây dựng lấn chiếm lên phần đất này vừa là hành vi lấn chiếm đất theo NĐ 123/2024, vừa là hành vi vi phạm trật tự xây dựng (nếu không có phép hoặc sai phép).","note":"","multi":false,"id":255,"sets":{"2A":37},"fix":false},{"topic":"cd10","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ10 câu 50","q":"Việc một sàn giao dịch BĐS cung cấp thông tin không trung thực về một dự án có thể dẫn đến hậu quả nào theo Nghị định 16/2022?","opts":{"A":"Chỉ bị phạt tiền mức thấp nhất.","B":"Bị phạt tiền từ 200-250 triệu đồng và có thể bị đình chỉ hoạt động sàn (6-9 tháng).","C":"Chỉ bị yêu cầu cải chính thông tin","D":"Được miễn trừ trách nhiệm nếu thông tin do chủ đầu tư cung cấp."},"ans":["B"],"exp":"Cung cấp thông tin BĐS không đầy đủ, không trung thực là hành vi vi phạm nghiêm trọng của sàn giao dịch, bị phạt tiền ở mức cao (200-250 triệu) và có thể bị đình chỉ hoạt động","note":"Theo NĐ 339/2026/NĐ-CP: đình chỉ hoạt động sàn giao dịch BĐS từ 03 đến 06 tháng. Cập nhật: NĐ 16/2022/NĐ-CP đã hết hiệu lực từ 26/8/2026, thay bằng NĐ 339/2026/NĐ-CP. Đáp án giữ theo tài liệu ôn thi; khi đề hỏi theo quy định hiện hành, đối chiếu mức mới.","multi":false,"id":256,"sets":{},"fix":false},{"topic":"cd10","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Nguyên tắc xử phạt vi phạm hành chính theo Luật xử lý vi phạm hành chính là:","opts":{"A":"Một hành vi vi phạm hành chính chỉ bị xử phạt 1 lần","B":"Một hành vi vi phạm hành chính có thể xử phạt nhiều lần","C":"Chỉ cảnh cáo, không xử phạt tiền","D":"Doanh nghiệp tự thỏa thuận với cơ quan quản lý"},"ans":["A"],"exp":"Căn cứ PL: K1-Đ3","note":"","multi":false,"id":451,"sets":{},"fix":false},{"topic":"cd10","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Nhân định nào sau đây đúng?","opts":{"A":"Đối với cùng một hành vi vi phạm hành chính thì mức phạt tiền đối với tổ chức và cá nhân là bằng nhau.","B":"Đối với cùng một hành vi vi phạm hành chính thì mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân.","C":"Đối với cùng một hành vi vi phạm hành chính thì mức phạt tiền đối với tổ chức bằng 03 lần mức phạt tiền đối với cá nhân.","D":"Đối với cùng một hành vi vi phạm hành chính thì mức phạt tiền đối với tổ chức bằng 1,5 lần mức phạt tiền đối với cá nhân."},"ans":["B"],"exp":"Căn cứ PL: K1-Đ3","note":"","multi":false,"id":452,"sets":{},"fix":false},{"topic":"cd10","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Mức phạt tiền vi phạm hành chính tối đa đối với cá nhân trong lĩnh vực đất đai, kinh doanh bất động sản là bao nhiêu?","opts":{"A":"Phạt tiền đến 100.000.000 đồng","B":"Phạt tiền đến 250.000.000 đồng","C":"Phạt tiền đến 500.000.000 đồng","D":"Phạt tiền đến 1.000.000.000 đồng"},"ans":["C"],"exp":"Căn cứ PL: K1 Đ 24","note":"","multi":false,"id":453,"sets":{},"fix":false},{"topic":"cd10","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Cơ quan nào có thẩm quyền xử phạt vi phạm hành chính trong hoạt động kinh doanh bất động sản?","opts":{"A":"UBND các cấp xã","B":"Thanh tra Bộ Xây dựng, Sở Xây dựng","C":"Công an nhân dân","D":"UBND các cấp xã; Thanh tra Bộ Xây dựng, Sở Xây dựng"},"ans":["D"],"exp":"Căn cứ PL: K30 Đ 1","note":"","multi":false,"id":454,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Thị trường bất động sản là ………..","opts":{"A":"Trung gian.","B":"Trung tâm.","C":"Cầu nối.","D":"Trung điểm. giữa sản xuất và tiêu dùng?"},"ans":["C"],"exp":"Về mặt kinh tế học, thị trường (market) là cơ chế hoặc nơi gặp gỡ giữa người mua (tiêu dùng) và người bán (sản xuất). Do đó, thị trường bất động sản đóng vai trò là \"cầu nối\" giúp hàng hóa bất động sản (được tạo ra bởi nhà phát triển) được chuyển giao đến người sử dụng cuối cùng (người tiêu dùng). Căn cứ học thuật: Lý thuyết Kinh tế học cơ bản (Principles of Economics).","note":"","multi":false,"id":257,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Thị trường bất động sản góp phần …… quá trình đổi mới về hoạt động quản lý đất đai, nhà ở, các công trình xây dựng đặc biệt là các công trình công cộng và các cơ sở kinh doanh khác?","opts":{"A":"Mở rộng","B":"Thu hẹp","C":"Nâng cao","D":"Thúc đẩy"},"ans":["D"],"exp":"Một thị trường BĐS phát triển minh bạch và hiệu quả sẽ tạo ra áp lực, \"thúc đẩy\" nhà nước phải cải cách và hoàn thiện hệ thống quản lý (như quy hoạch sử dụng đất, hệ thống đăng ký đất đai, chính sách tài chính, thuế) để đáp ứng yêu cầu của thị trường. Căn cứ học thuật: Lý thuyết Quản lý Đô thị và Thị trường Bất động sản.","note":"","multi":false,"id":258,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Tính khan hiếm: Sự khan hiếm của bất động sản chủ yếu là do diện tích đất đai tự nhiên là có giới hạn và bất động sản có tính khác biệt, cố định về vị trí từ đó đặt ra vấn đề. Quan hệ cung cầu, bất động sản thường xuyên mất cân đối dẫn đến tình trạng đầu cơ bất động sản. Nhà nước phải dùng chính sách nào chống đầu cơ bất động sản?","opts":{"A":"Cung = Cầu","B":"Cung > Cầu","C":"Cung < Cầu","D":"Cung không xác định"},"ans":["C"],"exp":"Câu hỏi này mô tả một đặc tính (khan hiếm) và một hệ quả (đầu cơ). Tình trạng đầu cơ xảy ra khi nhu cầu (Cầu) vượt xa nguồn cung (Cung), tức là \"Cung < Cầu\". Đây chính là sự mất cân đối mà Nhà nước cần can thiệp (bằng các chính sách như tăng nguồn cung, đánh thuế chống đầu cơ...) để bình ổn thị trường. Căn cứ học thuật: Lý thuyết Kinh tế Bất động sản về Cung - Cầu.","note":"","multi":false,"id":259,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Xây dựng, ban hành chiến lược phát triển thị trường bất động sản, kế hoạch thực hiện các dự án bất động sản thể hiện vai trò của?","opts":{"A":"Quản lý nhà nước đối với thị trường bất động sản","B":"Các nhà quản trị maketing bất động sản.","C":"Chủ đầu tư xây dựng dự án bất động","D":"Cơ quan thuế."},"ans":["A"],"exp":"Đây là một trong những nội dung quản lý nhà nước về kinh doanh BĐS. Nhà nước (thông qua Chính phủ, Bộ Xây dựng, UBND cấp tỉnh) có vai trò định hướng sự phát triển của thị trường thông qua các chiến lược, quy hoạch và kế hoạch. Căn cứ pháp lý: Điều 76 Luật Kinh doanh Bất động sản 2023 (Nội dung quản lý nhà nước về kinh doanh bất động sản).","note":"","multi":false,"id":260,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Đâu là khái niệm về cầu bất động sản?","opts":{"A":"Là các hoạt động quản lý nhà nước đối với thị trường bất động sản.","B":"Là khối lượng hàng hóa bất động sản mà người tiêu dùng sẵn sàng chấp nhận và có khả năng thanh toán với một mức giá nhất định để nhận được bất động sản đó trên thị trường tại những thời điểm nhất định.","C":"Là các bất động sản được phép tham gia vào trao đổi.","D":"Là toàn bộ khối lượng hàng hóa bất động sản sẵn sàng đưa ra thị trường để trao đổi tại một thời điểm nào đó"},"ans":["B"],"exp":"Đây là định nghĩa chuẩn về \"cầu\" (Demand) trong kinh tế học, cụ thể là \"cầu có khả năng thanh toán\" (Effective Demand), bao gồm hai yếu tố: sự sẵn sàng mua (willingness) và khả năng thanh toán (ability to pay). Đáp án D là định nghĩa về \"cung\" (Supply). Căn cứ học thuật: Lý thuyết Kinh tế học cơ bản.","note":"","multi":false,"id":261,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Doanh nghiệp kinh doanh bất động sản lựa chọn thị trường mục tiêu để làm gì?","opts":{"A":"Lựa chọn các dự án bất động sản.","B":"Hạn chế sự cạnh tranh","C":"Thực hiện theo nhu cầu khách hàng.","D":"Phân khúc thị trường có lợi hơn."},"ans":["D"],"exp":"Đây là một khái niệm trong Marketing (STP: Segmentation Targeting - Positioning). Doanh nghiệp không thể phục vụ toàn bộ thị trường. Họ phải \"phân khúc\" (Segment) thị trường thành các nhóm nhỏ, sau đó \"lựa chọn thị trường mục tiêu\" (Target) là một hoặc vài phân khúc mà họ đánh giá là có lợi nhất/phù hợp nhất để tập trung nguồn lực. Căn cứ học thuật: Lý thuyết Marketing Bất động sản.","note":"","multi":false,"id":262,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Phương pháp đầu tư được xây dựng dựa trên việc tuân thủ nguyên tắc như thế nào?","opts":{"A":"Sử dụng tốt nhất, hiệu quả nhất","B":"Thay thế","C":"Lợi ích tương lai","D":"Nguyên tắc đóng góp"},"ans":["C"],"exp":"\"Phương pháp đầu tư\" (Investment Method), hay còn gọi là \"Phương pháp thu nhập\" (Income Approach) trong định giá, xác định giá trị của BĐS dựa trên khả năng sinh lời của nó. Nguyên tắc cơ bản là \"Nguyên tắc dự kiến lợi ích tương lai\" (Principle of Anticipation), cho rằng giá trị của tài sản hôm nay bằng tổng giá trị hiện tại của tất cả các khoản thu nhập (lợi ích) mà nó có thể mang lại trong tương lai. Căn cứ học thuật: Tiêu chuẩn Thẩm định giá Việt Nam (TCTĐGVN) - Phương pháp Thu nhập.","note":"","multi":false,"id":263,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Thế nào là cung bất động sản?","opts":{"A":"Là khối lượng hàng hóa bất động sản mà người tiêu dùng sẵn sàng chấp nhận và có khả năng thanh toán với một mức giá nhất định để nhận được bất động sản đó trên thị trường tại những thời điểm nhất định.","B":"Là toàn bộ khối lượng hàng hóa bất động sản sẵn sàng đưa ra thị trường để trao đổi tại một thời điểm nào đó.","C":"Là các bất động sản được phép tham gia vào trao đổi.","D":"Là các hoạt động quản lý nhà nước đối với thị trường bất động sản."},"ans":["B"],"exp":"Đây là định nghĩa về \"cung\" (Supply). Nó thể hiện lượng hàng hóa mà người bán/nhà sản xuất sẵn lòng và có khả năng bán ra thị trường ở các mức giá khác nhau. Đáp án A là định nghĩa về \"cầu\". Căn cứ học thuật: Lý thuyết Kinh tế học cơ bản.","note":"","multi":false,"id":264,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Theo anh chị, Giá trị thị trường trong định giá được hiểu là gì?","opts":{"A":"Là số tiền trao đổi ước tính về một tài sản vào thời điểm thẩm định giá giữa một bên là người bán sẵn sàng bán với một bên là người mua sẵn sàng mua.","B":"Là số tiền ước tính của một tài sản dựa trên đánh giá yếu tố chủ quan của giá trị nhiều hơn là dựa vào khả năng có thể mua bán tài sản trên thị trường.","C":"Là các bất động sản được phép tham gia vào trao đổi.","D":"Là các hoạt động quản lý nhà nước đối với thị trường bất động sản."},"ans":["A"],"exp":"Đây là định nghĩa chuẩn về \"Giá trị thị trường\" (Market Value). Nó là một mức giá ước tính (không phải giá thực tế đã giao dịch), tại một thời điểm cụ thể, trong một giao dịch khách quan, công bằng (người bán và người mua đều sẵn lòng, có hiểu biết và không bị ép buộc). Căn cứ pháp lý: Tiêu chuẩn Thẩm định giá Việt Nam số 01 (TCTĐGVN 01) - Những khái niệm cơ bản.","note":"","multi":false,"id":265,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Giá thị trường là ………. trao đổi ước tính về tài sản vào thời điểm thẩm định giá, giữa một bên là người bán sẵn sàng bán với một bên là người mua sẵn sàng mua sau một quá trình tiếp thị công khai?","opts":{"A":"Chi phí","B":"Giá cả","C":"Số tiền","D":"Mức giá"},"ans":["C"],"exp":"Đây là câu hỏi điền vào chỗ trống dựa trên định nghĩa ở Câu 9. \"Giá trị thị trường\" được biểu hiện bằng một \"số tiền\" (an amount of money) ước tính. Căn cứ pháp lý: Tiêu chuẩn Thẩm định giá Việt Nam số 01 (TCTĐGVN 01).","note":"","multi":false,"id":266,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Vai trò quản lý của nhà nước có tác động .... hoạt động kinh doanh trên thị trường bất động sản?","opts":{"A":"Quyết định đến sự thúc đẩy và phát triển","B":"Kìm hãm sự phát triển","C":"Không hiệu quả đến sự phát triển","D":"Ít đến sự phát triển"},"ans":["A"],"exp":"Thị trường BĐS chịu ảnh hưởng rất lớn từ các chính sách của nhà nước (đất đai, quy hoạch, tín dụng, thuế). Một hệ thống pháp lý ổn định, minh bạch sẽ \"thúc đẩy\" thị trường phát triển. Ngược lại, chính sách không nhất quán, phức tạp sẽ \"kìm hãm\". Do đó, vai trò này mang tính \"quyết định\". Căn cứ học thuật: Lý thuyết Quản lý Nhà nước về Kinh tế.","note":"","multi":false,"id":267,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Tính không đồng nhất của bất động sản có nghĩa là gì?","opts":{"A":"Không có hai bất động sản nào có cùng chi phí tạo lập","B":"Không có hai bất động sản nào có cùng giá trị","C":"Không có hai bất động sản nào có cùng vị trí","D":"Không có hai bất động sản nào có cùng thu nhập"},"ans":["C"],"exp":"\"Tính không đồng nhất\" (Heterogeneity) là đặc điểm cốt lõi của BĐS. Ngay cả hai căn nhà có thiết kế giống hệt nhau, nhưng chúng không bao giờ đồng nhất vì chúng nằm ở hai \"vị trí\" (Location) khác nhau. Vị trí là yếu tố độc nhất và không thể thay thế, tạo nên sự khác biệt cho mỗi BĐS. Căn cứ học thuật: Lý thuyết Kinh tế Bất động sản.","note":"","multi":false,"id":268,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Bất động sản được hiểu là gì?","opts":{"A":"Là hàng hóa đặc biệt nên phải có phương thức mua bán, chuyển nhượng đặc biệt. khi mua bán phải thỏa mãn các yêu cầu pháp luật.","B":"Là các tài sản không thể di dời được, bao gồm đất đai, nhà ở, công trình xây dựng gắn liền với đất đai, kể các tài sản gắn liền với nhà ở, công trình xây dựng đó; các tài sản khác gắn liền với đất đai; các tài sản khác do pháp luật quy đinh.","C":"Là nơi diễn ra hoạt động của người mua và người bán bất động sản giao kết với nhau.","D":"Là những tài sản không phải là bất động sản."},"ans":["B"],"exp":"Đây là định nghĩa pháp lý chuẩn về Bất động sản (Immovable Property) theo quy định của pháp luật Việt Nam. Căn cứ pháp lý: Điều 107 Bộ luật Dân sự 2015 và Khoản 1, Điều 3 Luật Kinh doanh Bất động sản 2023.","note":"","multi":false,"id":269,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 1","q":"Tính bất động của bất động sản có thể hiểu là:","opts":{"A":"Bất động sản dù được đem chuyển nhượng, bán nhưng chỉ được quyền sử dụng và khai thác","B":"Bất động sản dù được đem chuyển nhượng, bán nhưng chỉ được quyền sử dụng và khai thác, không thể chuyển Bất động sản đến nơi khác","C":"Bất động sản dù được đem chuyển nhượng, bán nhưng chỉ được quyền sử dụng và khai thác, không thể mua bán được","D":"Cả A, B, C đều sai"},"ans":["B"],"exp":"Khái niệm tính bất động (immobility) là một đặc điểm cơ bản và quan trọng nhất của bất động sản. Nó có thể được hiểu là (1) Vị trí cố định và vĩnh viễn: Bất động sản (nhà, đất) gắn liền với một vị trí địa lý cụ thể và không thể di dời. Đặc điểm này khác biệt hoàn toàn với động sản (như ô tô, máy móc), có thể di chuyển từ nơi này đến nơi khác. (2) Không thể chuyển đến nơi khác: Dù quyền sở hữu có thể được chuyển giao (mua bán, thừa kế, tặng cho), bản thân tài sản đó (mảnh đất, ngôi nhà) vẫn đứng yên tại vị trí ban đầu.(3) Chỉ chuyển quyền sử dụng và khai thác: Khi giao dịch, người ta không \"chuyển\" bất động sản mà chỉ chuyển quyền sử dụng, quyền sở hữu đối với nó. Người chủ mới sẽ được quyền khai thác, sử dụng tài sản đó tại vị trí của nó.","note":"","multi":false,"id":270,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 2","q":"Định nghĩa: “Bất động sản là các tài sản bao gồm: Đất đai; Nhà, công trình xây dựng gắn liền với đất đai, kể các tài sản gắn kiền với nhà, công trình xây dựng đó; Các tài sản khác gắn liền với đất đai; Các tài sản khác do pháp luật quy định”, là theo:","opts":{"A":"Luật kinh doanh bất động sản 2023","B":"Bộ luật dân sự 2005 và Bộ luật dân sự 2015","C":"Luật Nhà ở 2023","D":"Luật đất đai 2024"},"ans":["B"],"exp":"Căn cứ điều 107 Bộ luật dân sự 2015 và Điều 174 Bộ luật dân sự 2005","note":"","multi":false,"id":271,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 3","q":"Thị trường bất động sản mang tính vùng, tính khu vực sâu sắc vì:","opts":{"A":"Thị trường bất động sản mang tính không tập trung, trải rộng mọi vùng trên đất nước","B":"Bất động sản là một hàng hóa cố định và không thể di dời về mặt vị trí và nó chịu ảnh hưởng của các yếu tố tập quán, thị hiếu, tâm lý từng vùng, từng khu vực","C":"Mỗi thị trường mang tính chất địa phương với quy mô và trình độ khác nhau do có sự phát triển không đồng đều giữa các vùng, các miền","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Đặc điểm bất động sản (tính cố định, tính địa phương) và tính chất của thị trường bất động sản được nêu trong Giáo trình Thị trường bất động sản, các tài liệu bồi dưỡng kiến thức môi giới BĐS","note":"","multi":false,"id":272,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 4 · Đề 1A câu 5","q":"Các chủ thể chính tham gia vào hoạt động trên thị trường bất động sản:","opts":{"A":"Người mua và người bán","B":"Người mua, người bán và người môi giới","C":"Người mua, người bán và người môi giới và cơ quan quản lý Nhà nước liên quan","D":"Cả A, B, C đều sai"},"ans":["C"],"exp":"Căn cứ giáo trình “Thị trường bất động sản” và Tài liệu bồi dưỡng kiến thức môi giới bất động sản","note":"","multi":false,"id":273,"sets":{"1A":5},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 5","q":"Cạnh tranh trong thị trường bất động sản là:","opts":{"A":"Cạnh tranh tự do","B":"Cạnh tranh độc quyền","C":"Cạnh tranh hoàn hảo","D":"Cạnh tranh không hoàn hảo"},"ans":["D"],"exp":"Cạnh tranh hoàn hảo khi có nhiều người bán và nhiều người mua trên cùng 1 thị trường với nhiều sản phẩm cạnh tranh tương tự, thông tin được chia sẻ rõ ràng, minh bạch. Trong khi bđs mang tính dị biệt, đặc biệt, duy nhất theo vị trí, thông tin có độ lệch pha tùy theo mức độ tiếp cận thị trường","note":"","multi":false,"id":274,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 6","q":"Thị trường bất động sản sẽ là kênh đầu tư kém hấp dẫn đối với các nhà đầu tư nước ngoài khi:","opts":{"A":"Môi trường pháp lý để phát triển thị trường bất động sản chưa đầy đủ","B":"Nền kinh tế phát triển không bền vững, hiện tượng đầu cơ tràn lan khiến giá nhà đất tăng cao","C":"Tình hình chính trị không ổn định","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Thị trường bất động sản (BĐS) là một kênh đầu tư phức tạp, chịu tác động bởi nhiều yếu tố vĩ mô. Khi bất kỳ yếu tố nào trong số này có dấu hiệu tiêu cực, niềm tin của các nhà đầu tư, đặc biệt là nhà đầu tư nước ngoài, sẽ bị suy giảm, khiến thị trường trở nên kém hấp dẫn","note":"","multi":false,"id":275,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 7","q":"Cung về bất động sản trong thị trường bất động sản được xác định bằng:","opts":{"A":"Toàn bộ bất động sản có sẵn","B":"Toàn bộ bất động sản có sẵn và bất động sản hình thành trong tương lai","C":"Toàn bộ bất động sản có thể và sẵn sàng tham gia giao dịch tại một thời điểm nào đó với một giá cả nào đó","D":"Cả A, B và C đều sai"},"ans":["D"],"exp":"Cung bất động sản trên thị trường được xác định bởi tổng lượng bất động sản sẵn có, bao gồm đất đai, nhà ở, văn phòng, khu công nghiệp và các loại bất động sản khác, tại một thời điểm cụ thể và với một mức giá nhất định. Nguồn cung này bao gồm cả nguồn cung từ khu vực nhà nước và khu vực tư nhân.","note":"","multi":false,"id":276,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 8","q":"Đặc trưng của giai đoạn sơ khởi trong thị trường bất động sản là:","opts":{"A":"Là giai đoạn thị trường phát triển mang tính tự phát.","B":"Là giai đoạn của có sự tham gia của doanh nghiệp Kinh doanh bất động sản.","C":"Là giai đoạn bất động sản được chứng khoán hóa.","D":"Tất cả đều sai."},"ans":["A"],"exp":"Giai đoạn chỉ bao gồm các cá nhân tự phát giao dịch thường xem là giai đoạn sơ khởi. Sau đó thị trường phát triển tập trung khi có sự tham gia quản lý của nhà nước, xây dựng phát triển bđs của các doanh nghiệp, và trung gian (môi giới, sàn). Giai đoạn thứ 3 là tài chính hóa (cấp vốn, chứng khoán). Giai đoạn 4 là quốc tế hóa.","note":"","multi":false,"id":277,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 9","q":"Bất động sản có thuộc tính:","opts":{"A":"Bất động","B":"Không đồng nhất","C":"Khan hiếm, bền vững, đời sống kinh tế lâu dài","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Bất động sản có nhiều thuộc tính đặc trưng, bao gồm cả ba đặc điểm được nêu trong các phương án.","note":"","multi":false,"id":278,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 10","q":"Đặc trưng nào sau đây không phải là đặc trưng của bất động sản:","opts":{"A":"Khả năng co giãn của bất động sản kém","B":"Thời gian mua bán, giao dịch ngắn, chi phí mua bán giao dịch thấp","C":"Có tính thích ứng và chịu sự ảnh hưởng lẫn nhau","D":"Khả năng chuyển hóa thành tiền mặt kém linh hoạt, chịu sự can thiệp và quản lý chặt chẽ của nhà nước"},"ans":["B"],"exp":"Thời gian mua bán và giao dịch bđs gồm nhiều bước, thường phức tạp, kéo dài, chi phí giao dịch và thuế phí cao. (Câu A nên hiểu là mức độ co giãn của cung cầu bất động sản kém, cung rất chậm co giãn, trong khi độ co giãn của cầu rất nhạy)","note":"","multi":false,"id":279,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 11, 44","q":"Thị trường bất động sản được hình thành và phát triển chịu tác động của yếu tố nào sau đây:","opts":{"A":"Kinh tế, pháp luật","B":"Chính trị, xã hội","C":"Tốc độ phát triển của dân cư","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Thị trường bất động sản là một thị trường phức tạp và chịu tác động của nhiều yếu tố vĩ mô và vi mô. Sự hình thành và phát triển của thị trường bất động sản là kết quả của sự tác động tổng hợp từ nhiều yếu tố, trong đó kinh tế, chính trị, pháp luật, và các yếu tố xã hội, dân cư đóng vai trò quan trọng.","note":"","multi":false,"id":280,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 12","q":"Các yếu tố nào sau đây không phải là yếu tố pháp lý liên quan đến bất động sản:","opts":{"A":"Tình trạng pháp lý của bất động sản","B":"Các quy định về xây dựng và kiến trúc gắn với bất động sản","C":"Vị trí bất động sản","D":"Tình trạng tranh chấp bất động sản"},"ans":["C"],"exp":"Vị trí bất động sản không phải là một yếu tố pháp lý, mà là một yếu tố kinh tế tự nhiên có ảnh hưởng trực tiếp đến giá trị và tiềm năng của bất động sản. Vị trí được đánh giá dựa trên các tiêu chí như: khoảng cách đến các tiện ích (trường học, bệnh viện, chợ), kết nối giao thông, quy hoạch khu vực, và môi trường sống. Những yếu tố này quyết định giá trị thực tế của bất động sản trên thị trường.","note":"","multi":false,"id":281,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 13","q":"Theo bạn hàng hóa nào sau đây có khả năng chuyển hóa thành tiền mặt kém linh hoạt nhất?","opts":{"A":"Vàng","B":"Kim cương","C":"Bất động sản","D":"Cổ phiếu"},"ans":["C"],"exp":"Dựa trên khả năng chuyển hóa thành tiền mặt, bất động sản là loại hàng hóa kém linh hoạt nhất trong số các lựa chọn. Quá trình mua bán bất động sản thường rất phức tạp, đòi hỏi nhiều thủ tục pháp lý (công chứng, đăng ký, kê khai thuế), tìm kiếm khách hàng tiềm năng, và có thể kéo dài hàng tháng, thậm chí hàng năm. Do đó, tính thanh khoản của bất động sản rất thấp","note":"","multi":false,"id":282,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 14","q":"Vì sao bất động sản là tài sản đặc biệt?","opts":{"A":"Vì bất động sản có tính bền vững theo thời gian, có vị trí cố định; có tính khan hiếm và đa chức năng sử dụng","B":"Vì bất động sản tăng giá theo thời gian","C":"Vì bất động sản khác biệt ở các vùng miền khác nhau","D":"Vì cung bất động sản có mức độ co giãn thấp, cầu bất động sản có mức độ co giãn cao (nhạy)"},"ans":["A"],"exp":"Bất động sản được coi là tài sản đặc biệt bởi nó hội tụ nhiều đặc điểm độc nhất vô nhị mà các loại tài sản khác không có: (1) Tính bền vững theo thời gian: Đất đai tồn tại vĩnh viễn, các công trình xây dựng có tuổi thọ kinh tế rất dài. Điều này giúp bất động sản có giá trị sử dụng và giá trị đầu tư lâu dài. (2) Vị trí cố định (tính bất động): Bất động sản gắn liền với một vị trí địa lý cụ thể và không thể di dời. Do đó, giá trị của nó phụ thuộc rất lớn vào các yếu tố xung quanh như cơ sở hạ tầng, quy hoạch, và môi trường sống. (3) Tính khan hiếm: Nguồn cung đất đai là có hạn, trong khi nhu cầu sử dụng cho nhiều mục đích (nhà ở, kinh doanh, sản xuất) ngày càng tăng. Điều này làm cho đất đai trở nên quý giá và có khả năng tăng giá theo thời gian. (4) Đa chức năng sử dụng: Bất động sản có thể được sử dụng cho nhiều mục đích khác nhau như nhà ở, văn phòng, thương mại, du lịch, nông nghiệp, và công nghiệp. Sự đa dạng này mang lại nhiều tiềm năng khai thác và đầu tư.","note":"","multi":false,"id":283,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 15","q":"Nếu số lượng “cung” nhà ở cố định và “cầu” nhà ở giảm, giá nhà sẽ thay đổi như thế nào?","opts":{"A":"Tăng","B":"Giảm","C":"Không đổi","D":"Tăng xong giảm"},"ans":["B"],"exp":"Theo quy luật cung cầu, cung tăng cầu giảm giá sẽ giảm, và ngược lại","note":"","multi":false,"id":284,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 16","q":"Yếu tố nào không phải là yếu tố tác động đến “cầu” thị trường nhà ở?","opts":{"A":"Chi phí nguyên vật liệu; chi phí nhân công","B":"Chi phí giao dịch","C":"Chi phí môi giới"},"ans":["A"],"exp":"Chi phí nguyên vật liệu và chi phí nhân công (A): Hai yếu tố này tác động trực tiếp đến cung (supply) của thị trường nhà ở, không phải cầu. Chúng là các chi phí đầu vào của quá trình xây dựng, ảnh hưởng đến giá thành sản phẩm và do đó quyết định số lượng nhà ở mà các nhà phát triển sẵn sàng cung cấp ra thị trường.","note":"","multi":false,"id":285,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Thị trường bất động sản là:","opts":{"A":"Một môi trường trong đó giữa người mua và người bán tác động qua lại lẫn nhau để thực hiện việc mua bán bất động sản thông qua cơ chế giá.","B":"Một hệ thống các quan hệ, thông qua đó các giao dịch về bất động sản của bên tham gia được thực hiện","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"ans":["C"],"exp":"Thị trường là nơi cung và cầu gặp nhau để xác lập giá cả và số lượng giao dịch. Trong thị trường bất động sản, người mua và người bán tương tác để thương lượng và đi đến thỏa thuận về giá, hình thành nên cơ chế giá cả. Thị trường không chỉ là nơi mua bán mà còn bao gồm các mối quan hệ phức tạp giữa các bên tham gia (nhà đầu tư, người mua, người bán, môi giới, ngân hàng, cơ quan nhà nước,...) và các yếu tố liên quan (pháp luật, quy hoạch, chính sách...). Các giao dịch được thực hiện trong khuôn khổ của những mối quan hệ và quy định này.","note":"","multi":false,"id":286,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 18","q":"Tính bất động của bất động sản được hiểu là:","opts":{"A":"Bất động sản dù được đem chuyển nhượng, bán nhưng chỉ được quyền sử dụng và khai thác","B":"Bất động sản dù được đem chuyển nhượng, bán nhưng chỉ được quyền sử dụng và khai thác, không thể chuyển Bất động sản đến nơi khác.","C":"Bất động sản dù được đem chuyển nhượng, bán nhưng chỉ được quyền sử dụng và khai thác, không thể mua bán được.","D":"Cả A, B, C đều sai."},"ans":["B"],"exp":"Thuộc tính bất động (immobility) là một đặc điểm cơ bản và quan trọng nhất của bất động sản. Nó có nghĩa là bất động sản gắn liền với một vị trí cố định và vĩnh viễn trên mặt đất.","note":"","multi":false,"id":287,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 19","q":"Đặc trưng quan trọng nhất của thị trường bất động sản","opts":{"A":"Khả năng chuyển hoá thành tiền mặt kém linh hoạt","B":"Sự can thịệp và quản lý của Nhà nước chặt chẽ","C":"Không có thị trường trung tâm","D":"Khả năng co giãn của cung bất động sản kém"},"ans":["D"],"exp":"Thị trường bất động sản được đặc trưng bởi nhiều yếu tố, bao gồm tính không di dời, tính khu vực, tính thanh khoản thấp, và sự can thiệp của nhà nước. Ngoài ra, thị trường này còn chịu ảnh hưởng bởi nhiều yếu tố kinh tế, xã hội, và pháp lý. Nhưng đặc trưng cơ bản của bđs là Tính khan hiếm và cố định của bất động sản dẫn đến khả năng co giãn của cung kém. Bất động sản có tính chất cố định về vị trí và số lượng có hạn, đặc biệt là đất đai. Việc gia tăng nguồn cung bất động sản không thể diễn ra một cách nhanh chóng vì nó đòi hỏi thời gian dài để xây dựng, quy hoạch và hoàn thiện. Do đó, khi nhu cầu tăng lên, cung bất động sản không thể tăng theo kịp, dẫn đến khả năng co giãn của cung kém. A. Khả năng chuyển hoá thành tiền mặt kém linh hoạt: Đây là một đặc điểm của bất động sản, nhưng chưa phải là đặc trưng nổi bật nhất so với các thị trường khác. Mặc dù thanh khoản thấp hơn tiền mặt, nhưng bất động sản vẫn có thể chuyển nhượng thông qua các giao dịch mua bán, thế chấp. B. Sự can thiệp và quản lý của Nhà nước chặt chẽ: Đây cũng là một đặc trưng quan trọng của thị trường bất động sản. Tuy nhiên, mức độ chặt chẽ có thể khác nhau tùy theo luật pháp của từng quốc gia và từng giai đoạn. Đáp án này chưa thể hiện được bản chất vật lý của bất động sản như đáp án D. C. Không có thị trường trung tâm: Đây là một đặc điểm đúng. Bất động sản thường được giao dịch phân tán, không có một sàn giao dịch tập trung như thị trường chứng khoán. Tuy nhiên, đặc điểm này không mang tính bản chất như khả năng co giãn của cung, vốn xuất phát từ tính cố định và khan hiếm của bất động sản.","note":"","multi":false,"id":288,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 20","q":"Sự thay đổi chính sách của Chính phủ, sự thay đổi dự báo tương lai ảnh hưởng đến","opts":{"A":"Cung bất động sản","B":"Cầu bất động sản","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"ans":["C"],"exp":"Sự thay đổi chính sách của Chính phủ và các dự báo về tương lai có tác động đến cả cung và cầu của thị trường bất động sản. Ảnh hưởng đến Cầu bất động sản Chính sách của Chính phủ: Các chính sách như lãi suất vay mua nhà, thuế, hoặc quy định về sở hữu bất động sản có thể trực tiếp ảnh hưởng đến quyết định mua của người tiêu dùng. Ví dụ, khi lãi suất giảm, chi phí vay mua nhà thấp hơn, kích thích nhu cầu mua. Dự báo tương lai: Khi các dự báo kinh tế tích cực, người dân có xu hướng tin tưởng vào sự tăng trưởng của tài sản và đầu tư nhiều hơn vào bất động sản, làm tăng cầu. Ngược lại, dự báo kinh tế xấu có thể khiến người dân ngần ngại đầu tư, làm giảm cầu. Ảnh hưởng đến Cung bất động sản Chính sách của Chính phủ: Các chính sách về quy hoạch, cấp phép xây dựng, và các quy định về môi trường có thể tác động trực tiếp đến khả năng và chi phí của các nhà phát triển bất động sản trong việc xây dựng và đưa sản phẩm ra thị trường. Chính sách siết chặt có thể làm giảm nguồn cung, trong khi các chính sách khuyến khích có thể làm tăng cung. Dự báo tương lai: Các nhà phát triển bất động sản thường dựa vào các dự báo về nhu cầu và giá cả trong tương lai để đưa ra quyết định về dự án mới. Khi dự báo tốt, họ sẽ đầu tư nhiều hơn vào các dự án mới, làm tăng nguồn cung. Ngược lại, dự báo xấu có thể khiến họ tạm dừng hoặc hủy bỏ các dự án, làm giảm nguồn cung.","note":"","multi":false,"id":289,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 21","q":"Cung bất động sản phụ thuộc vào.","opts":{"A":"Chính sách xã hội","B":"Sự bùng phát trong xây dựng","C":"Tính năng động của thị trường tài chính","D":"Tất cả A, B, C đều đúng"},"ans":["D"],"exp":"A. Chính sách xã hội: Chính sách xã hội của nhà nước có ảnh hưởng lớn đến cung bất động sản. Ví dụ, các chính sách hỗ trợ nhà ở cho người có thu nhập thấp hoặc chính sách phát triển khu đô thị mới sẽ khuyến khích các nhà đầu tư và doanh nghiệp xây dựng thêm các dự án, từ đó làm tăng nguồn cung bất động sản. Ngược lại, các chính sách siết chặt có thể làm giảm nguồn cung. B. Sự bùng phát trong xây dựng: Sự bùng phát trong xây dựng phản ánh sự phát triển của thị trường bất động sản và khả năng của các nhà đầu tư. Khi có nhiều dự án xây dựng được triển khai cùng lúc, nguồn cung bất động sản sẽ tăng lên. Điều này thường xảy ra khi các dự báo về kinh tế và thị trường tích cực, thu hút nhiều vốn đầu tư vào lĩnh vực xây dựng. C. Tính năng động của thị trường tài chính: Thị trường tài chính đóng vai trò quan trọng trong việc cung cấp nguồn vốn cho các dự án bất động sản. Một thị trường tài chính năng động, với các chính sách tín dụng linh hoạt và lãi suất ưu đãi, sẽ giúp các nhà đầu tư và doanh nghiệp dễ dàng tiếp cận nguồn vốn để xây dựng và phát triển dự án. Điều này thúc đẩy sự gia tăng nguồn cung bất động sản. Ngược lại, một thị trường tài chính trì trệ có thể làm giảm cung","note":"","multi":false,"id":290,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 22","q":"Lạm phát có tác động ________ lên thị trường bất động sản.","opts":{"A":"Tích cực","B":"Tiêu cực","C":"Vừa tích cực vừa tiêu cực","D":"Không tác động"},"ans":["C"],"exp":"Lạm phát có thể có tác động tích cực và tiêu cực lên thị trường bất động sản, tùy thuộc vào mức độ và bối cảnh cụ thể của lạm phát. Do đó, không thể chọn một đáp án duy nhất, tích cực hay tiêu cực tùy vào hoàn cảnh.","note":"","multi":false,"id":291,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 23","q":"Lãi suất tăng sẽ tác động _______ lên thị trường bất động sản.","opts":{"A":"Tích cực","B":"Tiêu cực","C":"Vừa tích cực vừa tiêu cực","D":"Không tác động"},"ans":["C"],"exp":"Lãi suất là một trong những công cụ chính sách tiền tệ quan trọng, có tác động mạnh mẽ và đa chiều đến thị trường bất động sản. Mức độ tác động phụ thuộc vào bối cảnh kinh tế vĩ mô và đối tượng bị ảnh hưởng.","note":"Hiệu đính: tài liệu ôn cũ chọn \"Tiêu cực\"; bộ đề CĐ11 (9/2026) chọn \"Vừa tích cực vừa tiêu cực\", khớp với phần giải thích về tác động đa chiều của lãi suất.","multi":false,"id":292,"fix":true,"sets":{}},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 24 · Đề 2A câu 43","q":"Vì sao giá đất lại khác nhau dù ở vị trí kế cận:","opts":{"A":"Vì quyền sử dụng đất khác nhau","B":"Điều kiện sinh thái, kinh thế xã hội của đất khác nhau","C":"Phương thức sử dụng khác nhau","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Giá đất phụ thuộc vào nhiều yếu tố, ngay cả khi các lô đất nằm sát cạnh nhau. Các yếu tố này bao gồm: A. Quyền sử dụng đất khác nhau: Mỗi lô đất có thể có mục đích sử dụng khác nhau được quy định trong giấy chứng nhận quyền sử dụng đất. Ví dụ, một lô đất được quy hoạch là đất ở có giá trị cao hơn so với một lô đất nông nghiệp hoặc đất thương mại dịch vụ, dù chúng nằm liền kề. B. Điều kiện sinh thái, kinh tế xã hội của đất khác nhau: Ngay cả trong một khu vực nhỏ, điều kiện sinh thái và xã hội có thể khác nhau đáng kể. Một lô đất có địa hình đẹp, không ngập úng, gần công viên, trường học, bệnh viện... sẽ có giá cao hơn lô đất cùng khu vực nhưng ở vị trí kém thuận lợi hơn. C. Phương thức sử dụng khác nhau: Cách thức một lô đất được sử dụng cũng ảnh hưởng đến giá trị của nó. Ví dụ, một lô đất được cấp phép xây dựng chung cư cao tầng sẽ có giá cao hơn so với lô đất chỉ được phép xây dựng nhà ở riêng lẻ, vì khả năng sinh lợi từ việc khai thác lô đất đó là khác nhau","note":"","multi":false,"id":293,"sets":{"2A":43},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 25","q":"Vai trò của nhà nước đối với thị trường bất động sản","opts":{"A":"Định hướng phát triển, điều tiết thị trường, tạo môi trường pháp lý, cơ chế, chính sách thuận lợi, hỗ trợ phát triển, kết cấu hạ tầng, an sinh xã hội","B":"Ổn định kinh tế vĩ mô.","C":"Kiểm tra, giám sát","D":"Cả A, B và C đều đúng"},"ans":["D"],"exp":"Nhà nước đóng một vai trò vô cùng quan trọng và toàn diện đối với thị trường bất động sản. Vai trò này bao gồm nhiều khía cạnh từ định hướng, điều tiết đến kiểm tra, giám sát.","note":"","multi":false,"id":294,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 26","q":"Tính chất nào không phải là tính chất của bất động sản","opts":{"A":"Tính bền vững","B":"Có giá trị lớn","C":"Tính khác biệt","D":"Tính không cố định về vị trí"},"ans":["D"],"exp":"Tính không cố định về vị trí (D): Đây là một đặc tính sai. Bất động sản có đặc tính cố định về vị trí (hay còn gọi là tính bất động). Nó gắn liền với một vị trí địa lý cụ thể và không thể di dời. Do đó, đây là câu trả lời không phải là tính chất của bất động sản.","note":"","multi":false,"id":295,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 27 · Đề 1A câu 40","q":"Việc nghiên cứu thị trường nhằm để:","opts":{"A":"Dự báo thị trường mục tiêu","B":"Dự báo triển vọng phát triển của từng loại dịch vụ","C":"Dự báo các rủi ro có thể xảy ra trên thị trường:","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Việc nghiên cứu thị trường không chỉ giúp tìm kiếm cơ hội mà còn giúp đánh giá rủi ro, từ đó đưa ra những quyết định đầu tư và kinh doanh sáng suốt.","note":"","multi":false,"id":296,"sets":{"1A":40},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 28","q":"Thị trường bất động sản cư trú bao gồm:","opts":{"A":"Nhà biệt thự, nhà vườn, nhà phố riêng biệt và phố liên kết, căn hộ chung cư cao tầng.","B":"Nhà máy, xí nghiệp, các sàn giao dịch bất động sản, văn phòng công ty.","C":"Đường xá, cầu cống, các cửa hàng kinh doanh thương mại.","D":"Không có đáp án nào đúng"},"ans":["A"],"exp":"Thị trường bất động sản (BĐS) được phân loại thành nhiều phân khúc khác nhau dựa trên mục đích sử dụng. BĐS cư trú (hay còn gọi là BĐS nhà ở) là loại hình BĐS được dùng để ở, sinh sống và phục vụ các nhu cầu cơ bản của cá nhân, hộ gia đình.","note":"","multi":false,"id":297,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 29 · Đề 2A câu 50","q":"Một bất động sản để có giá trị cần thiết phải có các đặc tính sau:","opts":{"A":"Có tính hữu ích","B":"Có tính khan hiếm","C":"Có tính yêu cầu và có thể chuyển giao được","D":"Bao gồm cả A, B, C."},"ans":["D"],"exp":"Một bất động sản để có giá trị kinh tế cần phải hội tụ đủ bốn đặc tính cơ bản, được gọi là các yếu tố của giá trị (4 yếu tố của giá trị theo lý thuyết thẩm định giá). A. Có tính hữu ích (Utility): Bất động sản phải có khả năng đáp ứng một nhu cầu nào đó của con người, ví dụ như nhu cầu về nhà ở, kinh doanh, sản xuất, hoặc giải trí. Nếu một tài sản không có công dụng gì, nó sẽ không có giá trị. B. Có tính khan hiếm (Scarcity): Nguồn cung của bất động sản là có hạn, đặc biệt là đất đai. Sự khan hiếm làm cho tài sản trở nên quý giá và có khả năng tăng giá, vì cầu vượt cung. C. Có tính yêu cầu và có thể chuyển giao được (Demand & Transferability): D. Tính yêu cầu (Demand): Phải có người sẵn sàng và có khả năng chi trả để mua bất động sản đó. Nhu cầu phải được hỗ trợ bởi sức mua. E. Có thể chuyển giao được (Transferability): Quyền sở hữu đối với bất động sản phải có khả năng được chuyển giao một cách hợp pháp từ người này sang người khác. Nếu không thể mua bán, thừa kế, hoặc cho tặng, bất động sản đó sẽ không có giá trị giao dịch. Tóm lại, giá trị của một bất động sản không chỉ phụ thuộc vào công dụng của nó mà còn vào tính khan hiếm, nhu cầu của thị trường và khả năng chuyển nhượng quyền sở hữu. Nguyên nhân thị trường bất động sản mang tính vùng miền sâu sắc A. Do hàng hoá bất động sản có đăc tính này và điều kiện tự nhiên và trình độ phát triển kinh tế xã hội của các vùng là khác nhau. B. Do thị trường bất động sản có mối liên hệ mật thiết với thị trường vốn, tài chính C. Do thị trường bất động sản ngày càng chịu sự chi phối chặt chẽ của pháp luật. D. Tất cả sai. Giải thích: Thị trường bất động sản mang tính vùng miền sâu sắc là một trong những đặc điểm nổi bật nhất. Nguyên nhân chính xuất phát từ bản chất của hàng hóa bất động sản và các yếu tố ngoại cảnh đặc thù của từng địa phương","note":"Hiệu đính: tài liệu ôn cũ chọn A; bộ đề CĐ11 (9/2026) chọn D. Giá trị BĐS cần đủ các đặc tính: hữu ích, khan hiếm, có cầu và chuyển giao được.","multi":false,"id":298,"fix":true,"sets":{"2A":50}},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 31","q":"Giá thành bất động sản bao gồm:","opts":{"A":"Chi phí đất đai, chi phí chuẩn bị xây dựng, chi phí xây dựng","B":"Chi phí đất đai, chi phí chuẩn bị xây dựng, chi phí xây dựng, chi phí quản lý doanh nghiệp, chi phí tiêu thụ","C":"Chi phí đất đai, chi phí chuẩn bị xây dựng, chi phí xây dựng, chi phí quản lý doanh nghiệp, chi phí tiêu thụ, thuế phí và chi phí dự phòng","D":"Tất cả đều sai"},"ans":["C"],"exp":"Giá thành bất động sản là tổng hợp tất cả các khoản chi phí mà chủ đầu tư phải bỏ ra để hoàn thành và đưa sản phẩm bất động sản ra thị trường. Nó không chỉ bao gồm các chi phí trực tiếp mà còn cả các chi phí gián tiếp khác. Phân tích các thành phần của giá thành bất động sản: (1) Chi phí đất đai: Đây là chi phí để có được quyền sử dụng đất, bao gồm tiền thuê đất, tiền sử dụng đất, hoặc chi phí giải phóng mặt bằng, bồi thường. (2) Chi phí chuẩn bị xây dựng: Bao gồm các chi phí liên quan đến thiết kế, xin giấy phép, khảo sát địa chất, và các công việc chuẩn bị ban đầu khác. (3) Chi phí xây dựng: Là chi phí chính để tạo ra sản phẩm bất động sản, bao gồm chi phí vật liệu xây dựng, nhân công, máy móc thiết bị... (4) Chi phí quản lý doanh nghiệp: Chi phí phát sinh trong quá trình điều hành dự án, chẳng hạn như lương nhân viên, chi phí văn phòng, và các chi phí quản lý khác. (5) Chi phí tiêu thụ (chi phí bán hàng): Đây là các chi phí để đưa sản phẩm đến tay khách hàng, bao gồm chi phí quảng cáo, marketing, hoa hồng môi giới... (6) Thuế phí: Các loại thuế và phí phải nộp cho nhà nước, như thuế giá trị gia tăng (VAT), thuế thu nhập doanh nghiệp, lệ phí trước bạ... Chi phí dự phòng: Đây là một khoản chi phí cần thiết để dự trù cho những rủi ro và chi phí phát sinh ngoài dự kiến trong quá trình thực hiện dự án.","note":"","multi":false,"id":299,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 32","q":"Hàng hóa bất động sản có những đặc điểm riêng sau:","opts":{"A":"Khả năng co giãn của cung bất động sản kém; thời gian mua bán, giao dịch dài chi phí mua bán giao dịch cao","B":"Có tính thích ứng và chịu sự ảnh hưởng lẫn nhau","C":"Khả năng chuyển hóa thành tiền mặt kém linh hoạt, sự can thiệp và quản lý của nhà nước chặt chẽ","D":"Cả A, B, C đều đúng."},"ans":["D"],"exp":"Hàng hóa bất động sản sở hữu những đặc điểm độc đáo khiến nó khác biệt so với các loại hàng hóa thông thường: 1. Khả năng co giãn của cung kém và chi phí cao Co giãn kém (Low Elasticity), Thời gian và chi phí giao dịch cao. 2. Tính thích ứng và chịu ảnh hưởng lẫn nhau. 3. Tính thanh khoản kém và sự quản lý chặt chẽ của nhà nước Khả năng chuyển hóa thành tiền mặt kém (Low Liquidity), Sự can thiệp của nhà nước.","note":"","multi":false,"id":300,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 33","q":"Khi phân tích thông tin về bất động sản cần phải phân tích những thông tin gì?","opts":{"A":"Thông tin về đặc trưng của thị trường bất động sản cần định giá","B":"Thông tin về khách hàng (đặc điểm, sở thích, nhu cầu của khách hàng)","C":"Thông tin khảo sát từ thị trường bất động sản","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Khi phân tích thông tin về bất động sản, việc thu thập và đánh giá đầy đủ các yếu tố là rất quan trọng để đưa ra một quyết định chính xác và hiệu quả. Các thông tin cần phân tích bao gồm phần trình bày ở mục A, B, C","note":"","multi":false,"id":301,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 34 · Đề 2A câu 8","q":"Trong thị trường bất động sản, vai trò của môi giới bất động sản là:","opts":{"A":"Trợ giúp người đầu tư phát triển từ lúc lập kế hoạch phát triển các hạng mục cho đến lúc hoàn thành việc tiêu thụ, thực hiện được mục tiêu thu lợi nhuận","B":"Thông qua điều tra thị trường mà tìm hiểu các yêu cầu tiềm năng của thị trường, dự báo hành vi, sở thích, phong trào và thị hiếu của khách hàng tiềm năng để giúp các nhà đầu tư định vị thị trường đúng đắn.","C":"Thông qua các hoạt động quảng cáo, tuyên truyền để thu hút các nhà đầu tư kinh doanh (cho thuê)","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Theo Luật Kinh doanh bất động sản Việt Nam 2024, môi giới bất động sản là việc làm trung gian cho các bên trong mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản. Tuy nhiên, trong thực tế và về mặt học thuật, vai trò của môi giới không chỉ giới hạn ở việc \"làm trung gian\", mà còn bao gồm các hoạt động tư vấn, nghiên cứu thị trường và tiếp thị, nhằm hỗ trợ tối đa cho cả người bán và người mua.","note":"","multi":false,"id":302,"sets":{"2A":8},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 35","q":"Chức năng cơ bản của nhà nước đối với thị trường bất động sản được thể hiện trên các phương diện sau:","opts":{"A":"Tạo khung pháp lý.","B":"Xây dựng hệ thống quản lý.","C":"Thực hiện điều tiết thị trường.","D":"Tất cả đều đúng"},"ans":["D"],"exp":"Nhà nước có vai trò đặc biệt quan trọng trong việc quản lý và điều tiết thị trường bất động sản. Do tính chất đặc thù của bất động sản (tính không di dời, giá trị lớn, chịu tác động của quy hoạch, chính sách), thị trường này không thể vận hành một cách hoàn toàn tự do. Chức năng của Nhà nước được thể hiện trên ba phương diện chính sau: (1) Tạo khung pháp lý, (2) Xây dựng hệ thống quản lý, (3) Thực hiện điều tiết thị trường.","note":"","multi":false,"id":303,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 36","q":"Thông thường khi cầu bất động sản tăng mà cung bất động sản giữ ổn định thì trong ngắn hạn:","opts":{"A":"Giá của bất động sản có xu hướng tăng.","B":"Giá của bất động sản có xu hướng giảm xuống.","C":"Giá của bất động sản có xu hướng ổn định","D":"Giá của bất động sản có xu hướng giảm rồi tăng"},"ans":["A"],"exp":"Khi cầu bất động sản tăng lên (ví dụ, nhiều người có nhu cầu mua nhà hơn) trong khi cung không thay đổi kịp, sẽ xảy ra tình trạng cung không đủ cầu. Theo quy luật thị trường, khi lượng hàng hóa khan hiếm mà nhu cầu lại cao, người mua sẽ sẵn sàng trả giá cao hơn để sở hữu sản phẩm. Điều này dẫn đến việc giá bất động sản có xu hướng tăng trong ngắn hạn.","note":"","multi":false,"id":304,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 37","q":"Nguồn cầu bất động sản có thể là những đối tượng nào sau đây?","opts":{"A":"Tổ chức, doanh nghiệp kinh doanh bất động sản.","B":"Các cá nhân có nhu cầu thuê, mua bất động sản.","C":"Các nhà đầu tư bất động sản.","D":"Cả A, B, C đều đúng."},"ans":["D"],"exp":"Nguồn cầu bất động sản rất đa dạng, bao gồm tất cả các chủ thể có nhu cầu sở hữu, sử dụng hoặc kinh doanh bất động sản. Ba nhóm đối tượng được liệt kê trong các lựa chọn đều là những thành phần chính tạo nên nguồn cầu trên thị trường bất động sản","note":"","multi":false,"id":305,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 38","q":"Giá thành khai phá bất động sản ảnh hưởng đến","opts":{"A":"Cung bất động sản","B":"Cầu bất động sản","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"ans":["A"],"exp":"Theo nguyên lý kinh tế học, giá thành sản xuất là một trong những yếu tố cốt lõi quyết định đến nguồn cung của một loại hàng hóa, dịch vụ trên thị trường. Trong trường hợp này, bất động sản được xem là một loại hàng hóa đặc biệt.","note":"","multi":false,"id":306,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 39","q":"Sự thay đổi thu nhập ảnh hưởng đến","opts":{"A":"Cung bất động sản","B":"Cầu bất động sản","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"ans":["B"],"exp":"Trong kinh tế học, thu nhập của người tiêu dùng là một trong những yếu-tố-then-chốt quyết định đến cầu đối với một loại hàng hóa hoặc dịch vụ. Bất động sản cũng không ngoại lệ.","note":"","multi":false,"id":307,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 40","q":"Theo quan điểm thị trường Cầu bất động sản là gì?","opts":{"A":"Là số người có nhu cầu mua bất động sản.","B":"Là khối lượng hàng hóa bất động sản mà người tiêu dùng sẵn sàng chi trả để có được và có khả năng thanh toán với mức giá nhất định để nhận khối lượng hang hóa đó trên thị trường.","C":"Là số lượng người có nhu cầu bán bất động sản.","D":"Tất cả đều sai."},"ans":["B"],"exp":"Theo quan điểm kinh tế học thị trường, \"cầu\" không chỉ đơn thuần là mong muốn hay nhu cầu, mà phải hội tụ đủ hai yếu tố cốt lõi: sự sẵn sàng chi trả (willingness to pay) và khả năng thanh toán (ability to pay)","note":"","multi":false,"id":308,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 41","q":"Theo quan điểm thị trường Cung bất động sản trên thị trường là gì?","opts":{"A":"Là số lượng hàng hóa người có nhu cầu mua bất động sản","B":"Là toàn bộ khối lượng hàng hóa bất động sản được đưa ra thị trường tại một thời điểm nhất định với mức giá nhất định.","C":"Là số lượng hàng hóa người có nhu cầu bán bất động sản.","D":"Tất cả đều sai."},"ans":["B"],"exp":"Theo quan điểm kinh tế học thị trường, \"cung\" (supply) là lượng hàng hóa hoặc dịch vụ mà người bán sẵn lòng và có khả năng bán ra thị trường tại các mức giá khác nhau trong một khoảng thời gian nhất định.","note":"","multi":false,"id":309,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 42","q":"Cầu bất động sản chịu ảnh hưởng bởi yếu tố nào?","opts":{"A":"Cung, cầu bất động sản thay thế.","B":"Tâm lý và kỳ vọng trên thị trường.","C":"Cung tiền trên thị trường tài chính; sự thay đổi ở thị trường chứng khoán.","D":"Cả A, B, C đều đúng."},"ans":["D"],"exp":"Cầu bất động sản là một khái niệm phức tạp, chịu sự tác động của nhiều yếu tố đa dạng và liên kết chặt chẽ với nhau. Tất cả các yếu tố nêu trên đều có ảnh hưởng trực tiếp hoặc gián tiếp đến quyết định mua của người tiêu dùng và nhà đầu tư.","note":"","multi":false,"id":310,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02","q":"Đâu là chủ thể tham gia trên thị trường bất động sản?","opts":{"A":"Chủ thể Cung","B":"Chủ thể Cầu.","C":"Các trung gian, dịch vụ","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Một thị trường bất động sản hoàn chỉnh và vận hành hiệu quả cần có sự tham gia của cả ba nhóm chủ thể. Mỗi nhóm đóng một vai trò thiết yếu, không thể thiếu để tạo nên các giao dịch và sự phát triển của thị trường.","note":"","multi":false,"id":311,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 45","q":"Thị trường bất động sản tư liệu sản xuất bao gồm:","opts":{"A":"Thị trường đất đai","B":"Thị trường bất động sản mặt bằng và nhà xưởng công nghiệp.","C":"Cả A và B đều sai.","D":"Cả A và B đều đúng"},"ans":["D"],"exp":"Bất động sản tư liệu sản xuất là một bộ phận của thị trường bất động sản, bao gồm các loại tài sản gắn liền với đất đai được sử dụng làm yếu tố đầu vào cho quá trình sản xuất, kinh doanh, và tạo ra các sản phẩm hoặc dịch vụ khác, thay vì để ở (tiêu dùng).","note":"","multi":false,"id":312,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 46","q":"Yếu tố sau đây nào ảnh hưởng đến giá trị bất động sản?","opts":{"A":"Các yếu tố nội tại bất động sản như đăc điểm kinh tế, kỹ thuật, pháp lý của bất động sản","B":"Vị trí bất động sản và các yếu tố quy hoạch kinh tế, xã hội của khu vực; mức sinh lợi và triển vọng của bất động sản.","C":"Triển vọng phát triển và mức sinh lời của ngành sử dụng bất động sản","D":"Cả A, B, C đều đúng."},"ans":["D"],"exp":"Giá trị của một bất động sản không phải là một con số cố định mà được tổng hợp từ rất nhiều yếu tố khác nhau. Tất cả các phương án A, B, và C đều là những nhóm yếu tố quan trọng quyết định đến giá trị cao hay thấp của một bất động sản.","note":"","multi":false,"id":313,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 47","q":"Đâu là đặc điểm của Bất động sản:","opts":{"A":"Tính cố định về vị trí.","B":"Tính dị biệt.","C":"Tính ảnh hưởng lẫn nhau.","D":"Cả A, B, C đều đúng"},"ans":["D"],"exp":"Tất cả các phương án trên đều là những đặc tính cơ bản, độc đáo và quan trọng của bất động sản, giúp phân biệt nó với các loại hàng hóa thông thường khác.","note":"","multi":false,"id":314,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 48","q":"Nhận xét nào sau đây là sai?","opts":{"A":"Thị trường bất động sản là thị trường hoàn hảo.","B":"Thị trường bất động sản mang tính vùng và tính khu vực sâu sắc.","C":"Thị trường bất động sản có liên hệ mật thiết với thị trường vốn.","D":"Thị trường bất động sản có sự tách biệt giữa hàng hóa và địa điểm giao dịch"},"ans":["A"],"exp":"Thị trường bất động sản không phải là một thị trường hoàn hảo, mà là một thị trường không hoàn hảo. Một thị trường hoàn hảo đòi hỏi nhiều điều kiện, và thị trường bất động sản thiếu hầu hết các điều kiện này. Các điều kiện của một thị trường hoàn hảo và lý do thị trường bất động sản không đáp ứng: Sản phẩm đồng nhất: Trong một thị trường hoàn hảo, các sản phẩm phải giống hệt nhau. Tuy nhiên, mỗi bất động sản là duy nhất về vị trí, thiết kế, và các yếu tố khác. Số lượng lớn người mua và người bán: Thị trường bất động sản thường có số lượng người tham gia hạn chế hơn so với các thị trường khác, đặc biệt là ở các phân khúc cao cấp. Thông tin hoàn hảo: Thông tin về bất động sản không phải lúc nào cũng đầy đủ và dễ dàng tiếp cận cho tất cả mọi người. Dễ dàng ra vào thị trường: Việc tham gia vào thị trường bất động sản đòi hỏi nguồn vốn lớn và các thủ tục pháp lý phức tạp, không hề dễ dàng. Không có chi phí giao dịch: Giao dịch bất động sản thường đi kèm với các chi phí đáng kể như thuế, phí môi giới và chi phí pháp lý.","note":"","multi":false,"id":315,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 49","q":"Quyền sử dụng đất được gọi là hàng hóa khi:","opts":{"A":"Được mọi người cho phép tham gia vào thị trường.","B":"Có đủ điều kiện tham gia vào thị trường theo quy định của pháp luật đất đai.","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"ans":["B"],"exp":"Trong hệ thống pháp luật Việt Nam, đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu. Các cá nhân, hộ gia đình và tổ chức được Nhà nước giao quyền sử dụng đất. Quyền sử dụng đất chỉ trở thành một \"hàng hóa\" đặc biệt—tức là có thể được đem ra giao dịch, chuyển nhượng, cho thuê, thế chấp... trên thị trường—khi nó đáp ứng đầy đủ các điều kiện do pháp luật quy định.","note":"","multi":false,"id":316,"sets":{},"fix":false},{"topic":"cd11","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ11 câu 50","q":"Bất động sản được phân loại là bất động sản dịch vụ gồm:","opts":{"A":"Văn phòng, cửa hàng, siêu thị kho, bãi","B":"Khách sạn, nhà nghỉ hay nhà trọ, nhà liền kề, nhà xưởng","C":"Khách sạn, nhà nghỉ, văn phòng, cửa hàng, siêu thị","D":"Văn phòng, cửa hàng, siêu thị, nhà liền kề hay nhà vườn"},"ans":["C"],"exp":"Bất động sản dịch vụ (hay còn gọi là bất động sản thương mại) là những tài sản được sử dụng chủ yếu cho mục đích kinh doanh, cung cấp dịch vụ và tạo ra lợi nhuận trực tiếp từ hoạt động trên đó.","note":"","multi":false,"id":317,"sets":{},"fix":false},{"topic":"cd11","src":"Hướng dẫn thi CCHN (CTS)","q":"Việc quy định các nhà môi giới bất động sản bắt buộc phải có chứng chỉ hành nghề môi giới bất động sản thể hiện quyền tối thượng nào của Nhà nước đối với thị trường bất động sản?","opts":{"A":"Quyền đánh thuế tài sản bất động sản.","B":"Quyền quản lý và kiểm soát thị trường bất động sản.","C":"Quyền thu hồi đất.","D":"Quyền quy hoạch đất."},"ans":["B"],"exp":"Nhà nước quản lý, kiểm soát thị trường BĐS bằng pháp luật – trong đó có điều kiện hành nghề (chứng chỉ). Vai trò của Nhà nước: tạo khung pháp lý, xây dựng hệ thống quản lý và thông tin, điều tiết thị trường.","note":"","multi":false,"id":455,"sets":{},"fix":false},{"topic":"cd11","src":"Hướng dẫn thi CCHN (CTS)","q":"Đặc điểm nào sau đây của cung bất động sản tạo ra sự khác biệt của thị trường bất động sản so với thị trường hàng hóa khác?","opts":{"A":"Luôn có hiện tượng cung lớn hơn cầu, tạo ra dư cung thường trực.","B":"Cung có thể thay đổi liên tục để cân bằng với cầu.","C":"Cung hoàn toàn co giãn theo cầu trong mọi thời điểm.","D":"Cung ít co giãn và có tính trễ nên thường không cân bằng với lượng cầu."},"ans":["D"],"exp":"Đặc trưng cơ bản của thị trường BĐS: độ co giãn của cung kém, thời gian giao dịch dài, chi phí giao dịch cao, thanh khoản kém.","note":"","multi":false,"id":456,"sets":{},"fix":false},{"topic":"cd11","src":"Hướng dẫn thi CCHN (CTS)","q":"Phân loại thị trường bất động sản theo trình tự gia nhập thị trường, thị trường bất động sản gồm:","opts":{"A":"Khu vực đô thị; khu vực vùng ven; khu vực nông thôn.","B":"Thị trường đất sản xuất nông nghiệp; đất công nghiệp; thị trường BĐS đặc biệt.","C":"Thị trường sơ cấp; thị trường thứ cấp.","D":"Thị trường sơ cấp; thị trường khu vực đô thị."},"ans":["C"],"exp":"Theo mục đích sử dụng: đất nông nghiệp, đất ở, nhà ở, công nghiệp, thương mại, vui chơi giải trí, đặc biệt. Theo khu vực địa lý: đô thị, vùng ven, nông thôn. Theo trình tự gia nhập: sơ cấp, thứ cấp.","note":"","multi":false,"id":457,"sets":{},"fix":false},{"topic":"cd11","src":"Hướng dẫn thi CCHN (CTS)","q":"Cung bất động sản là gì?","opts":{"A":"Tổng nhu cầu mua bất động sản trên thị trường.","B":"Tổng số bất động sản mà người bán sẵn sàng và có khả năng cung cấp ra thị trường tại các mức giá khác nhau trong một khoảng thời gian nhất định.","C":"Tổng số bất động sản mà người bán sẵn sàng và có khả năng cung cấp ra thị trường bất động sản trong một khoảng thời gian nhất định.","D":"Tổng số hàng hóa bất động sản mà các nhà phát triển cần bán ra thị trường và mong muốn thu về mức lợi nhuận cao nhất."},"ans":["B"],"exp":"Điểm phân biệt B và C: cung luôn gắn với “các mức giá khác nhau”.","note":"","multi":false,"id":458,"sets":{},"fix":false},{"topic":"cd11","src":"Bộ đề CĐ11 câu 17","q":"Thị trường bất động sản là:","opts":{"A":"Một môi trường trong đó giữa người mua và người bán tác động qua lại lẫn nhau để thực hiện việc mua bán bất động sản thông qua cơ chế giá.","B":"Một hệ thống các quan hệ, thông qua đó các giao dịch về bất động sản của bên tham gia được thực hiện","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"ans":["C"],"exp":"","note":"","multi":false,"id":978,"fix":false,"sets":{}},{"topic":"cd11","src":"Bộ đề CĐ11 câu 30","q":"Nguyên nhân thị trường bất động sản mang tính vùng miền sâu sắc?","opts":{"A":"Do hàng hoá bất động sản có đăc tính này và điều kiện tự nhiên và trình độ phát triển kinh tế xã hội của các vùng là khác nhau.","B":"Do thị trường bất động sản có mối liên hệ mật thiết với thị trường vốn, tài chính","C":"Do thị trường bất động sản ngày càng chịu sự chi phối chặt chẽ của pháp luật.","D":"Tất cả sai."},"ans":["A"],"exp":"","note":"","multi":false,"id":979,"fix":false,"sets":{}},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 16","q":"Đối tượng nào sau đây không được hành nghề thẩm định giá theo quy định tại Khoản 2 Điều 45 Luật Giá 2023?","opts":{"A":"Người có Thẻ thẩm định viên về giá hết hạn.","B":"Người đang trong thời gian bị khởi tố, truy tố, xét xử.","C":"Người có bằng đại học chuyên ngành thẩm định giá.","D":"Người làm việc tại doanh nghiệp thẩm định giá."},"ans":["B"],"exp":"Cơ sở pháp lý: Khoản 1 Điều 45 Luật Giá 2023 liệt kê các đối tượng không được hành nghề thẩm định giá, bao gồm người đang trong thời gian bị khởi tố, truy tố, xét xử.","note":"","multi":false,"id":318,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02","q":"Các phương pháp định giá đất bao gồm:","opts":{"A":"Phương pháp so sánh","B":"Phương pháp thu nhập","C":"Phương pháp thặng dư và phương pháp hệ số điều chỉnh giá đất","D":"Cả 3 trường hợp trên"},"ans":["D"],"exp":"Cơ sở pháp lý: Khoản 5 Điều 158 Luật Đất đai 2024","note":"","multi":false,"id":319,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02 · Bộ đề CĐ12 câu 32 · Đề 1A câu 42","q":"Việc xây dựng Bảng giá đất chi tiết đến từng thửa đất theo Luật Đất đai 2024 yêu cầu phải có điều kiện gì về hạ tầng thông tin?","opts":{"A":"Mạng lưới internet tốc độ cao","B":"Hệ thống định vị toàn cầu","C":"Bản đồ địa chính số và cơ sở dữ liệu giá đất","D":"Hệ thống camera giám sát"},"ans":["C"],"exp":"Cơ sở pháp lý: Khoản 2 Điều 159 Luật Đất đai 2024 nêu rõ việc xây dựng Bảng giá đất đến từng thửa đất được thực hiện đối với khu vực đã có bản đồ địa chính số và cơ sở dữ liệu giá đất.","note":"","multi":false,"id":320,"sets":{"1A":42},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02","q":"Một doanh nghiệp thẩm định giá có thể bị thu hồi Giấy chứng nhận đủ điều kiện kinh doanh nếu không phát hành chứng thư thẩm định giá, báo cáo thẩm định giá trong:","opts":{"A":"6 tháng liên tục","B":"12 tháng liên tục","C":"18 tháng liên tục","D":"24 tháng liên tục"},"ans":["B"],"exp":"Cơ sở pháp lý: Điểm b Khoản 2 Điều 54 Luật Giá 2023 quy định một trong các trường hợp bị thu hồi giấy chứng nhận là \" Không phát hành chứng thư thẩm định giá, báo cáo thẩm định giá trong 12 tháng liên tục \".","note":"","multi":false,"id":321,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02","q":"Cơ quan nhà nước có thẩm quyền định giá thực hiện định giá theo các hình thức sau đây:","opts":{"A":"Giá cụ thể là mức giá mà cơ quan, tổ chức, cá nhân phải mua, bán theo đúng mức giá đó","B":"Giá tối thiểu là mức giá mà cơ quan, tổ chức, cá nhân không được định giá, mua, bán thấp hơn mức giá đó","C":"Giá tối đa là mức giá mà cơ quan, tổ chức, cá nhân không được định giá, mua, bán cao hơn mức giá đó","D":"Cả 3 trương hợp trên"},"ans":["D"],"exp":"Cơ sở pháp lý: Khoản 2 Điều 21 Luật Giá 2023","note":"","multi":false,"id":322,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02","q":"Phương thức giải quyết tranh chấp về hợp đồng thẩm định giá","opts":{"A":"Thương lượng, hòa giải trên cơ sở những cam kết đã ghi trong hợp đồng thẩm định giá.","B":"Giải quyết bằng trọng tài thương mại.","C":"Khởi kiện tại Tòa án theo quy định của pháp luật về tố tụng dân sự.","D":"Cả 3 trường hợp trên"},"ans":["D"],"exp":"Cơ sở pháp lý: Điều 58 Luật Giá 2023","note":"","multi":false,"id":323,"sets":{},"fix":false},{"topic":"cd12","src":"Tài liệu ôn thi cơ sở 02","q":"Điều kiện cấp giấy chứng nhận đủ điều kiện kinh doanh dịch vụ thẩm định giá","opts":{"A":"Doanh nghiệp phải có ít nhất 02 người có thẻ thẩm định viên về giá đủ các điều kiện đăng ký hành nghề thẩm định giá","B":"Doanh nghiệp phải có ít nhất 03 người có thẻ thẩm định viên về giá đủ các điều kiện
