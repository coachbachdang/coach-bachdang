iện nào sau đây?","opts":{"A":"Dự án được phê duyệt chủ trương đầu tư và đã có giấy phép xây dựng","B":"Đã đầu tư xây dựng hạ tầng kỹ thuật theo quy hoạch chi tiết được duyệt","C":"Đã có người mua cam kết xây dựng nhà trong 12 tháng","D":"Đã hoàn thiện thủ tục bàn giao đất"},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc tô C (phương án không có cơ sở pháp lý). Điều kiện là đã đầu tư xây dựng hạ tầng kỹ thuật theo quy hoạch.","multi":false,"id":693,"fix":true,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 36","q":"Chủ đầu tư phải thực hiện nghĩa vụ tài chính đối với nhà nước trong giai đoạn nào của dự án?","opts":{"A":"Sau khi dự án hoàn thành xây dựng","B":"Trước khi triển khai xây dựng công trình","C":"Sau khi được phê duyệt quy hoạch tổng mặt bằng","D":"Sau khi hoàn thành đền bù giải phóng mặt bằng"},"ans":["B"],"exp":"","note":"","multi":false,"id":694,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 37","q":"Khi Nhà nước thu hồi đất để thực hiện dự án đầu tư xây dựng, nguyên tắc đầu tiên cần đảm bảo là gì?","opts":{"A":"Ưu tiên giải phóng mặt bằng nhanh chóng","B":"Đảm bảo quyền lợi tối đa cho nhà đầu tư","C":"Có phương án bồi thường, hỗ trợ, tái định cư (nếu có) được phê duyệt","D":"Không cần thỏa thuận với người dân nếu đã có quyết định thu hồi đất"},"ans":["C"],"exp":"","note":"","multi":false,"id":695,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 38","q":"Khi người dân bị thu hồi đất và có đủ điều kiện tái định cư, Nhà nước phải bố trí tái định cư trong thời điểm nào?","opts":{"A":"Sau khi hoàn tất toàn bộ dự án","B":"Ngay sau khi quyết định thu hồi đất","C":"Trước hoặc cùng thời điểm thu hồi đất","D":"Trong vòng 6 tháng kể từ ngày bàn giao mặt bằng"},"ans":["C"],"exp":"","note":"","multi":false,"id":696,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 39 · Đề 1A câu 31","q":"Thủ tục cuối cùng trong quá trình thực hiện một dự án đầu tư Kinh doanh bất động sản là:","opts":{"A":"Nghiệm thu đưa công trình vào sử dụng và cấp sổ cho khách hàng","B":"Ký hợp đồng thi công giai đoạn cuối","C":"Xin phép chuyển nhượng quyền sử dụng đất","D":"Thực hiện báo cáo tài chính dự án"},"ans":["A"],"exp":"","note":"","multi":false,"id":697,"fix":false,"sets":{"1A":31}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 40","q":"Trách nhiệm của chủ đầu tư trong giai đoạn thực hiện dự án không bao gồm nội dung nào sau đây?","opts":{"A":"Bảo đảm tiến độ và chất lượng công trình","B":"Cung cấp thông tin dự án cho khách hàng","C":"Tự ý điều chỉnh quy hoạch chi tiết 1/500","D":"Ký hợp đồng mua bán theo mẫu đã đăng ký"},"ans":["C"],"exp":"","note":"","multi":false,"id":698,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 41","q":"Nếu chủ đầu tư đưa công trình chưa đủ điều kiện vào kinh doanh, hậu quả pháp lý là gì?","opts":{"A":"Bị buộc tạm dừng kinh doanh","B":"Bị xử phạt hành chính và buộc khắc phục hậu quả, thậm chí có thể bị truy cứu trách nhiệm hình sự","C":"Bị rút giấy phép xây dựng","D":"Chỉ cần nộp phạt tiền theo mức độ vi phạm"},"ans":["B"],"exp":"","note":"","multi":false,"id":699,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 42","q":"Chủ thể nào có trách nhiệm công khai thông tin dự án bất động sản đưa vào kinh doanh?","opts":{"A":"Người mua bất động sản","B":"Cơ quan quản lý nhà nước về xây dựng","C":"Chủ đầu tư dự án bất động sản","D":"Sàn giao dịch bất động sản trung gian"},"ans":["C"],"exp":"","note":"","multi":false,"id":700,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 43","q":"Chủ đầu tư phải công khai thông tin dự án bất động sản từ thời điểm nào sau đây?","opts":{"A":"Sau khi ký hợp đồng mua bán","B":"Sau khi hoàn thành xây dựng phần móng","C":"Trước khi huy động vốn, chào bán, cho thuê hoặc cho thuê mua bất động sản","D":"Sau khi nghiệm thu toàn bộ dự án"},"ans":["C"],"exp":"","note":"","multi":false,"id":701,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 44 · Đề 1A câu 20","q":"Người mua nhà ở thương mại hình thành trong tương lai có quyền nào sau đây?","opts":{"A":"Yêu cầu chủ đầu tư cam kết lợi nhuận","B":"Được tự quyết định thiết kế lại căn hộ","C":"Yêu cầu bàn giao đúng tiến độ, đúng chất lượng, và có bảo hành","D":"Không phải thanh toán nếu nhà bàn giao trễ"},"ans":["C"],"exp":"","note":"","multi":false,"id":702,"fix":false,"sets":{"1A":20}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 45","q":"Chủ đầu tư không được phép chuyển nhượng quyền sở hữu nhà ở thương mại trong trường hợp nào?","opts":{"A":"Sau khi bàn giao nhưng chưa có sổ hồng","B":"Nhà ở đang bị thế chấp, chưa được giải chấp hoặc không có thỏa thuận với bên nhận thế chấp","C":"Sau khi hoàn công nhưng chưa nghiệm thu","D":"Sau khi ký hợp đồng đặt cọc"},"ans":["B"],"exp":"","note":"","multi":false,"id":703,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 46","q":"Nội dung nào dưới đây không bắt buộc phải công khai theo quy định pháp luật khi đưa dự án vào kinh doanh?","opts":{"A":"Thông tin pháp lý dự án","B":"Quy hoạch chi tiết 1/500","C":"Tiến độ thực hiện","D":"Chiến lược marketing sản phẩm"},"ans":["D"],"exp":"","note":"","multi":false,"id":704,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 47","q":"Theo quy định hiện hành, dự án đầu tư Kinh doanh bất động sản bao gồm những loại hình nào?","opts":{"A":"Nhà ở thương mại, khu công nghiệp","B":"Nhà ở, công trình xây dựng để bán, cho thuê, cho thuê mua; quyền sử dụng đất đã có hạ tầng kỹ thuật","C":"Các công trình phúc lợi công cộng","D":"Các dự án nhà nước đầu tư không vì mục tiêu lợi nhuận"},"ans":["B"],"exp":"","note":"","multi":false,"id":705,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 48","q":"Tổng Liên đoàn Lao động Việt Nam được phép đầu tư xây dựng nhà ở xã hội bằng nguồn tài chính nào và cho đối tượng nào thuê theo Luật Nhà ở 2023?","opts":{"A":"Bằng vốn ngân sách nhà nước, cho mọi đối tượng thuê.","B":"Bằng nguồn tài chính công đoàn, cho công nhân, người lao động thuộc đối tượng được hưởng chính sách nhà ở xã hội thuê.","C":"Bằng vốn vay ưu đãi, cho cán bộ công đoàn thuê.","D":"Bằng vốn xã hội hóa, cho đoàn viên công đoàn có thu nhập cao thuê."},"ans":["B"],"exp":"","note":"","multi":false,"id":706,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 49","q":"Trường hợp người mua nhà ở xã hội bán lại nhà sau thời hạn tối thiểu 05 năm, họ được phép bán cho đối tượng nào?","opts":{"A":"Bất kỳ ai có nhu cầu mua.","B":"Chỉ được bán lại cho chủ đầu tư dự án","C":"Cho các đối tượng thuộc diện được mua nhà ở xã hội theo quy định hoặc bán lại cho chủ đầu tư (nếu chủ đầu tư có nhu cầu mua lại).","D":"Chỉ cho người có hộ khẩu thường trú tại địa phương."},"ans":["C"],"exp":"","note":"","multi":false,"id":707,"fix":false,"sets":{}},{"topic":"cd4","src":"Bộ đề CĐ4 câu 50","q":"Cơ quan chuyên môn về xây dựng thực hiện kiểm tra công tác nghiệm thu của chủ đầu tư đối với loại công trình nào theo Nghị định 06/2021/NĐ-CP?","opts":{"A":"Mọi công trình xây dựng.","B":"Chỉ công trình nhà ở riêng lẻ.","C":"Công trình quan trọng quốc gia, quy mô lớn, kỹ thuật phức tạp, sử dụng vốn công/nhà nước ngoài đầu tư công, có ảnh hưởng lớn đến an toàn, lợi ích cộng đồng.","D":"Chỉ công trình có vốn đầu tư nước ngoài."},"ans":["C"],"exp":"","note":"","multi":false,"id":708,"fix":false,"sets":{}},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Theo anh/ chị, Cơ quan nào thực hiện đăng ký, cung cấp thông tin về biện pháp bảo đảm bằng quyền sử dụng đất, tài sản gắn liền với đất?","opts":{"A":"UBND cấp tỉnh","B":"Sở Tài nguyên và Môi trường","C":"Văn phòng đăng ký đất đai","D":"UBND cấp huyện."},"ans":["C"],"exp":"Đây là cơ quan chuyên môn trực thuộc Sở Tài nguyên và Môi trường, có chức năng thực hiện việc đăng ký đất đai và tài sản gắn liền với đất, bao gồm cả việc đăng ký các biện pháp bảo đảm (như thế chấp) lên Giấy chứng nhận. Căn cứ pháp lý: Nghị định 99/2022/NĐ-CP về đăng ký biện pháp bảo đảm.","note":"","multi":false,"id":93,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Đâu là trường hợp đăng ký thuộc thẩm quyền của Văn phòng đăng ký đất đai?","opts":{"A":"Thế chấp quyền sử dụng đất.","B":"Thế chấp nhà ở, tài sản khác gắn liền với đất trong trường hợp tài sản đã được chứng nhận quyền sở hữu trên Giấy chứng nhận.","C":"Thế chấp dự án đầu tư xây dựng nhà ở, dự án đầu tư xây dựng công trình không phải là nhà ở, dự án đầu tư nông nghiệp, dự án phát triển rừng, dự án đầu tư khác có sử dụng đất đồng thời với quyền sử dụng đất được Nhà nước giao có thu tiền sử dụng đất, cho thuê theo hình thức trả tiền một lần cho cả thời gian thuê.","D":"Cả 3 trường hợp trên đều thuộc thẩm quyền đăng ký của Văn phòng đăng ký đất đai."},"ans":["D"],"exp":"Cả ba trường hợp (A, B, C) đều liên quan đến biện pháp bảo đảm bằng quyền sử dụng đất hoặc tài sản gắn liền với đất (bao gồm cả dự án có sử dụng đất). Đây là các đối tượng mà Văn phòng đăng ký đất đai có thẩm quyền đăng ký.","note":"","multi":false,"id":94,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Sở hữu chung hợp nhất được hiểu là gì?","opts":{"A":"Là sở hữu chung mà trong đó phần quyền sở hữu của mỗi chủ sở hữu được xác định đối với tài sản chung.","B":"Là sở hữu chung mà trong đó, phần quyền sở hữu của mỗi chủ sở hữu chung không được xác định đối với tài sản chung.","C":"Là sở hữu của nhiều chủ thể đối với tài sản.","D":"Là sở hữu chung hợp nhất có thể phân chia."},"ans":["B"],"exp":"Bộ luật Dân sự (BLDS) 2015 quy định 2 hình thức sở hữu chung: sở hữu chung theo phần (phương án A, các phần được xác định rõ) và sở hữu chung hợp nhất (phương án B, không xác định phần, ví dụ điển hình là tài sản chung của vợ chồng). Căn cứ pháp lý: Điều 209, BLDS 2015.","note":"","multi":false,"id":95,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Bên nhận bảo đảm xác lập quyền đối với phần hoặc toàn bộ tài sản bảo đảm là tài sản hình thành trong tương lai kể từ thời điểm nào?","opts":{"A":"Do hai bên thỏa thuận.","B":"Từ thời điểm phần hoặc toàn bộ tài sản bảo đảm này được hình thành.","C":"Từ thời điểm phần hoặc toàn bộ tài sản này đã được hoàn thành.","D":"Từ thời điểm bên bán bán tài sản"},"ans":["B"],"exp":"Tài sản hình thành trong tương lai là tài sản chưa tồn tại ở thời điểm giao kết. Quyền của bên nhận bảo đảm (ví dụ: ngân hàng) đối với tài sản đó chỉ được xác lập khi tài sản đó thực sự được hình thành (ví dụ: căn hộ đã xây xong phần móng). Căn cứ pháp lý: Điều 311 và Điều 320, BLDS 2015.","note":"","multi":false,"id":96,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Cơ quan nào thống nhất quản lý nhà nước về đăng ký biện pháp bảo đảm?","opts":{"A":"Chính phủ.","B":"Bộ Tư pháp","C":"Bộ Tài chính.","D":"Bộ Giao thông vận tải."},"ans":["B"],"exp":"Mặc dù việc đăng ký thế chấp đất đai thực hiện tại Văn phòng đăng ký đất đai (thuộc Bộ TNMT), nhưng cơ quan thống nhất quản lý nhà nước về toàn bộ hệ thống đăng ký biện pháp bảo đảm (bao gồm cả động sản, tàu bay, tàu biển...) là Bộ Tư pháp. Căn cứ pháp lý: Nghị định 99/2022/NĐ-CP.","note":"","multi":false,"id":97,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng là gì?","opts":{"A":"Là sự thoả thuận giữa các bên về việc xác lâp, thay đổi hoăc chấm dứt quyền, nghĩa vụ đối với nhau.","B":"Là sự thoả thuận giữa các bên về việc xác lập quyền, nghĩa vụ đối với nhau.","C":"Là sự thoả thuận giữa các bên về chấm dứt quyền, nghĩa vụ đối với nhau.","D":"Là sự thỏa thuận giữa các bên, theo đó bên cho vay giao tài sản cho bên vay; khi đến hạn trả, bên vay phải hoàn trả cho bên cho vay tài sản cùng loại theo đúng số lượng, chất lượng và chỉ phải trả lãi nếu có thỏa thuận hoặc pháp luật có quy định."},"ans":["A"],"exp":"Đây là định nghĩa đầy đủ và chính xác nhất. Hợp đồng không chỉ để \"xác lập\" (B) hay \"chấm dứt\" (C) mà bao gồm cả việc \"thay đổi\" quyền và nghĩa vụ. Căn cứ pháp lý: Điều 385, BLDS 2015.","note":"","multi":false,"id":98,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Quyền định đoạt tài sản được hiểu là gì?","opts":{"A":"Là quyền chuyển giao quyền sở hữu tài sản, từ bỏ quyền sở hữu, tiêu dùng hoặc tiêu hủy tài sản.","B":"Là quyền khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản.","C":"Là việc chủ thể nắm giữ, chi phối tài sản một cách trực tiếp hoặc gián tiếp như chủ thể có quyền đối với tài sản.","D":"Là việc chủ sở hữu được thực hiện mọi hành vi theo ý chí của mình để nắm giữ, chi phối tài sản của mình nhưng không được trái pháp luật, đạo đức xã hội."},"ans":["A"],"exp":"Quyền sở hữu bao gồm 3 quyền: chiếm hữu (nắm giữ, chi phối - C, D), sử dụng (khai thác công dụng - B), và định đoạt (quyết định số phận pháp lý/vật lý của tài sản - A). Căn cứ pháp lý: Điều 196, BLDS 2015.","note":"","multi":false,"id":99,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Sở hữu riêng theo quy định của pháp luật dân sự được hiểu là gì?","opts":{"A":"Là sở hữu của nhiều chủ thể đối với tài sản.","B":"Là sở hữu chung mà trong đó phần quyền sở hữu của mỗi chủ sở hữu được xác định đối với tài sản chung.","C":"Là sở hữu chung mà trong đó, phần quyền sở hữu của mỗi chủ sở hữu chung không được xác định đối với tài sản chung.","D":"Là sở hữu của một cá nhân hoặc một pháp nhân."},"ans":["D"],"exp":"Đây là hình thức sở hữu đối lập với \"sở hữu chung\" (phương án A, B, C). Căn cứ pháp lý: Điều 200, BLDS 2015.","note":"","multi":false,"id":100,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng tặng cho tài sản được hiểu là gì?","opts":{"A":"Là sự thỏa thuận giữa các bên, theo đó các bên giao tài sản và chuyển quyền sở hữu đối với tài sản cho nhau","B":"Là sự thỏa thuận giữa các bên, theo đó bên tặng cho giao tài sản của mình và chuyển quyền sở hữu cho bên được tặng cho mà không yêu cầu đền bù, bên được tặng cho đồng ý nhận.","C":"Là sự thỏa thuận giữa các bên, theo đó bên cho thuê giao tài sản cho bên thuê để sử dụng trong một thời hạn, bên thuê phải trả tiền thuê.","D":"Là sự thỏa thuận giữa các cá nhân, pháp nhân về việc cùng đóng góp tài sản, công sức để thực hiện công việc nhất định, cùng hưởng lợi và cùng chịu trách nhiệm."},"ans":["B"],"exp":"Yếu tố then chốt của hợp đồng tặng cho là \"không yêu cầu đền bù\" (miễn phí). Phương án A là Hợp đồng trao đổi tài sản. Phương án C là Hợp đồng thuê tài sản. Căn cứ pháp lý: Điều 457, BLDS 2015.","note":"","multi":false,"id":101,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"“Sự thỏa thuận giữa các bên, theo đó người sử dụng đất chuyển đổi, chuyển nhượng, cho thuê, cho thuê lại, tặng cho, thế chấp, góp vốn quyền sử dụng đất hoặc thực hiện quyền khác theo quy định của Luật đất đai cho bên kia; bên kia thực hiện quyền, nghĩa vụ theo hợp đồng với người sử dụng đất” là khái niệm của cụm từ ngữ nào?","opts":{"A":"Hợp đồng hợp tác","B":"Hợp đồng về quyền sử dụng đất","C":"Hợp đồng mượn tài sản","D":"Hợp đồng thuê khoán tài sản."},"ans":["B"],"exp":"Định nghĩa này liệt kê tất cả các hình thức giao dịch về quyền sử dụng đất, do đó nó là định nghĩa của \"Hợp đồng về quyền sử dụng đất\". Căn cứ pháp lý: Điều 500, BLDS 2015.","note":"","multi":false,"id":102,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Thời hiệu để người thừa kế yêu cầu chia di sản là bao lâu đối với bất động sản kể từ thời điểm mở thừa kế?","opts":{"A":"20 năm","B":"25 năm","C":"30 năm","D":"35 năm"},"ans":["C"],"exp":"BLDS 2015 quy định rõ thời hiệu yêu cầu chia di sản thừa kế là 30 năm đối với bất động sản và 10 năm đối với động sản, kể từ thời điểm mở thừa kế. Căn cứ pháp lý: Điều 623, BLDS 2015.","note":"","multi":false,"id":103,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Trường hợp bất động sản không phải đăng ký quyền sở hữu thì hợp đồng tặng cho có hiệu lực khi nào?","opts":{"A":"Từ thời điểm đăng ký.","B":"Từ thời điểm chuyển giao tài sản.","C":"Từ thời điểm bên được tặng cho nhận tài sản.","D":"Từ thời điểm nhận tài sản đó."},"ans":["B"],"exp":"Đối với tài sản phải đăng ký (như nhà, đất), hợp đồng có hiệu lực kể từ thời điểm đăng ký. Đối với tài sản không phải đăng ký, hợp đồng có hiệu lực kể từ thời điểm chuyển giao. Căn cứ pháp lý: Điều 458, BLDS 2015.","note":"","multi":false,"id":104,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Theo anh chị, việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm nào?","opts":{"A":"Từ thời điểm đăng ký theo quy định của Luật đất đai.","B":"Từ thời điểm giao kết hợp đồng thuê.","C":"Từ thời điểm nhận tài sản đó.","D":"Từ thời điểm chủ thể có quyền sử dụng đất chuyển giao mặt đất."},"ans":["A"],"exp":"Đây là nguyên tắc pháp lý căn bản. Quyền sử dụng đất là loại tài sản bắt buộc phải đăng ký. Mọi việc chuyển quyền (mua bán, tặng cho...) chỉ hoàn tất và có hiệu lực pháp lý khi được đăng ký tại cơ quan nhà nước có thẩm quyền (đăng bộ). Căn cứ pháp lý: Điều 503, BLDS 2015 và Luật Đất đai.","note":"","multi":false,"id":105,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"“Sự thỏa thuận giữa các bên, theo đó bên cho thuê giao tài sản cho bên thuê để sử dụng trong một thời hạn, bên thuê phải trả tiền thuê” là khái niệm cho cụm từ ngữ nào?","opts":{"A":"Hợp đồng thuê tài sản.","B":"Hợp đồng thuê khoán tài sản.","C":"Hợp đồng tặng cho tài sản.","D":"Hợp đồng trao đổi tài sản."},"ans":["A"],"exp":"Đây là định nghĩa chính xác của hợp đồng thuê. Căn cứ pháp lý: Điều 472, BLDS 2015.","note":"","multi":false,"id":106,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng mua bán tài sản là gì?","opts":{"A":"Là sự thỏa thuận giữa các bên theo đó bên bán chuyển quyền sở hữu tài sản cho bên mua và bên mua trả tiền cho bên bán.","B":"Là hợp đồng mà mỗi bên đều có nghĩa vụ đối với nhau.","C":"Là hợp đồng mà chỉ một bên có nghĩa vụ.","D":"Là hợp đồng mà hiệu lực không phụ thuộc vào hợp đồng phụ."},"ans":["A"],"exp":"Đây là định nghĩa pháp lý của hợp đồng mua bán, phân biệt với các hợp đồng khác (như trao đổi, tặng cho). Căn cứ pháp lý: Điều 430, BLDS 2015.","note":"","multi":false,"id":107,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng trao đổi tài sản được anh, chị hiểu như thế nào?","opts":{"A":"Là sự thỏa thuận giữa các bên, theo đó các bên giao tài sản và chuyển quyền sở hữu đối với tài sản cho nhau.","B":"Là sự thỏa thuận giữa các bên, theo đó bên tặng cho giao tài sản của mình và chuyển quyền sở hữu cho bên được tặng cho mà không yêu cầu đền bù, bên được tặng cho đồng ý nhận.","C":"Là sự thỏa thuận giữa các bên, theo đó bên bán chuyển quyền sở hữu tài sản cho bên mua và bên mua trả tiền cho bên bán.","D":"Là sự thỏa thuận giữa các bên về việc xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự."},"ans":["A"],"exp":"Khác với \"mua bán\" (dùng tiền), \"trao đổi\" là dùng tài sản này đổi lấy tài sản khác và các bên chuyển quyền sở hữu cho nhau. Căn cứ pháp lý: Điều 455, BLDS 2015.","note":"","multi":false,"id":108,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"“Sự thỏa thuận giữa các bên, theo đó các bên giao tài sản và chuyển quyền sở hữu đối với tài sản cho nhau” là định nghĩa cho cụm từ ngữ nào sau đây?","opts":{"A":"Hợp đồng trao đổi tài sản","B":"Hợp đồng mua bán tài sản","C":"Hợp đồng thuê tài sản.","D":"Hợp đồng thuê khoán tài sản."},"ans":["A"],"exp":"Đây là câu hỏi ngược lại của Câu 16.","note":"","multi":false,"id":109,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Anh chị cho biết hợp đồng thuê tài sản là gì?","opts":{"A":"Sự thỏa thuận giữa các bên, theo đó các bên giao tài sản và chuyển quyền sở hữu đối với tài sản cho nhau","B":"Là sự thỏa thuận giữa các bên, theo đó các bên giao tài sản và chuyển quyền sở hữu đối với tài sản cho nhau.","C":"Là sự thỏa thuận giữa các bên, theo đó bên cho thuê giao tài sản cho bên thuê để sử dụng trong một thời hạn, bên thuê phải trả tiền thuê","D":"Là sự thỏa thuận giữa các bên về việc xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự."},"ans":["C"],"exp":"Đây là câu hỏi lặp lại nội dung của Câu 14. Phương án C là định nghĩa chính xác.","note":"","multi":false,"id":110,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng về quyền sử dụng đất là gì?","opts":{"A":"Là sự thỏa thuận giữa các bên, theo đó các bên giao tài sản và chuyển quyền sở hữu đối với tài sản cho nhau","B":"Là sự thỏa thuận giữa các bên, theo đó người sử dụng đất chuyển đổi, chuyển nhượng, cho thuê, cho thuê lại, tặng cho, thế chấp, góp vốn quyền sử dụng đất hoặc thực hiện quyền khác theo quy định của Luật đất đai cho bên kia; bên kia thực hiện quyền, nghĩa vụ theo hợp đồng với người sử dụng đất.","C":"Là sự thỏa thuận giữa các cá nhân, pháp nhân về việc cùng đóng góp tài sản, công sức để thực hiện công việc nhất định, cùng hưởng lợi và cùng chịu trách nhiệm.","D":"Là sự thỏa thuận giữa các bên về việc xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự."},"ans":["B"],"exp":"Đây là câu hỏi lặp lại nội dung của Câu 10.","note":"","multi":false,"id":111,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Trong pháp luật dân sự, người thừa kế được hiểu là gì?","opts":{"A":"Là người được chỉ định trong di chúc hoặc do những người thừa kế thỏa thuận cử ra.","B":"Là cá nhân phải là người còn sống vào thời điểm mở thừa kế hoặc sinh ra và còn sống sau thời điểm mở thừa kế nhưng đã thành thai trước khi người để lại di sản chết","C":"Là người từ đủ mười lăm tuổi đến chưa đủ mười tám tuổi được lập di chúc, nếu được cha, mẹ hoặc người giám hộ đồng ý về việc lập di chúc.","D":"Là người từ chối nhận di sản."},"ans":["B"],"exp":"Đây là định nghĩa về tư cách của người thừa kế. Họ phải tồn tại (còn sống hoặc đã thành thai) tại thời điểm người để lại di sản qua đời (thời điểm mở thừa kế). Căn cứ pháp lý: Điều 613, BLDS 2015.","note":"","multi":false,"id":112,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Thừa kế theo pháp luật là gì?","opts":{"A":"Là thừa kế theo hàng thừa kế, điều kiện và trình tự thừa kế do pháp luật quy định.","B":"Là sự thể hiện ý chí của cá nhân nhằm chuyển tài sản của mình cho người khác sau khi chết.","C":"Là việc người lập di chúc dành một phần di sản để tặng cho người khác. Việc di tặng phải được ghi rõ trong di chúc.","D":"Là phần di sản có liên quan đến phần của di chúc không có hiệu lực pháp luật."},"ans":["A"],"exp":"\"Thừa kế theo pháp luật\" (còn gọi là thừa kế không di chúc) xảy ra khi không có di chúc, hoặc di chúc không hợp pháp. Khi đó, di sản được chia theo các hàng thừa kế do luật định. Căn cứ pháp lý: Điều 649, BLDS 2015.","note":"","multi":false,"id":113,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Thế chấp tài sản là gì?","opts":{"A":"Là hợp đồng mà mỗi bên đều có nghĩa vụ đối với nhau","B":"Là việc một bên dùng tài sản thuộc sở hữu của mình để bảo đảm thực hiện nghĩa vụ và không giao tài sản cho bên kia.","C":"Là hợp đồng mà chỉ một bên có nghĩa vụ.","D":"Là sự thỏa thuận giữa các bên theo đó bên bán chuyển quyền sở hữu tài sản cho bên mua và bên mua trả tiền cho bên bán."},"ans":["B"],"exp":"Đặc điểm mấu chốt của \"thế chấp\" (mortgage) là bên thế chấp vẫn giữ tài sản để sử dụng (ví dụ: thế chấp nhà nhưng vẫn ở). Ngược lại, \"cầm cố\" (pledge) là phải giao tài sản cho bên nhận cầm cố. Căn cứ pháp lý: Điều 317, BLDS 2015.","note":"","multi":false,"id":114,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Quyền dân sự được xác lập từ các căn cứ nào sau đây?","opts":{"A":"Hợp đồng","B":"Kết quả của lao động, sản xuất, kinh doanh; kết quả của hoạt động sáng tạo ra đối tượng quyền sở hữu trí tuệ.","C":"Chiếm hữu tài sản","D":"Cả 3 căn cứ trên"},"ans":["D"],"exp":"Điều 8 BLDS 2015 liệt kê rất nhiều căn cứ xác lập quyền dân sự, trong đó bao gồm cả 3 phương án: A (Hợp đồng), B (Kết quả của lao động, sản xuất, kinh doanh...), và C (Chiếm hữu - ví dụ: chiếm hữu ngay tình, liên tục, công khai có thể dẫn đến xác lập quyền sở hữu theo thời hiệu).","note":"","multi":false,"id":115,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Quyền đối với bất động sản liền kề được định nghĩa như thế nào?","opts":{"A":"Là quyền của chủ thể được khai thác công dụng và hưởng hoa lợi, lợi tức đối với tài sản thuộc quyền sở hữu của chủ thể khác trong một thời hạn nhất định.","B":"Là quyền được thực hiện trên một bất động sản nhằm phục vụ cho việc khai thác một bất động sản khác thuộc quyền sở hữu của người khác","C":"Là quyền chuyển giao quyền sở hữu tài sản, từ bỏ quyền sở hữu, tiêu dùng hoặc tiêu hủy tài sản.","D":"Là quyền khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản."},"ans":["B"],"exp":"Đây là định nghĩa của \"easement\" (quyền địa dịch) trong luật La Mã. Nó liên quan đến hai BĐS (BĐS hưởng quyền và BĐS chịu hưởng quyền, ví dụ: quyền đi qua, quyền thoát nước) thuộc các chủ sở hữu khác nhau. Căn cứ pháp lý: Điều 245, BLDS 2015.","note":"","multi":false,"id":116,"sets":{},"fix":false},{"topic":"cd5","src":"Tài liệu ôn thi cơ sở 01","q":"Quyền đối với bất động sản liền kề chấm dứt trong trường hợp nào sau đây?","opts":{"A":"Thời hạn của quyền hưởng dụng đã hết.","B":"Người hưởng dụng trở thành chủ sở hữu tài sản là đối tượng của quyền hưởng dụng.","C":"Bất động sản hưởng quyền và bất động sản chịu hưởng quyền thuộc quyền sở hữu của một người.","D":"Chủ thể có quyền bề mặt và chủ thể có quyền sử dụng đất là một."},"ans":["C"],"exp":"Quyền này tồn tại vì có 2 chủ sở hữu khác nhau. Khi hai bất động sản này \"về chung một chủ\" (hợp nhất), thì quyền và nghĩa vụ đối với BĐS liền kề đương nhiên chấm dứt. A và B là trường hợp chấm dứt \"quyền hưởng dụng\". D là trường hợp chấm dứt \"quyền bề mặt\". Căn cứ pháp lý: Khoản 1, Điều 256, BLDS 2015.","note":"","multi":false,"id":117,"sets":{},"fix":false},{"topic":"cd5","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 91/2015/QH13, một tổ chức được công nhận là pháp nhân khi có đủ các điều kiện nào?","opts":{"A":"Chỉ cần thành lập hợp pháp","B":"Có cần có tài sản","C":"Được thành lập theo quy định của pháp luật; có cơ cấu tổ chức theo quy định của Bộ Luật dân sự; có tài sản độc lập với cá nhân, pháp nhân khác và tự chịu trách nhiệm bằng tài sản của mình và nhân danh mình tham gia quan hệ pháp luật một cách độc lập.","D":"Tất cả đáp án đều đúng."},"ans":["C"],"exp":"Căn cứ PL: Điều 74","note":"","multi":false,"id":420,"sets":{},"fix":false},{"topic":"cd5","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 91/2015/QH13, Pháp nhân thương mại có mục tiêu chính là gì?","opts":{"A":"Pháp nhân thương mại là pháp nhân có mục tiêu chính là tìm kiếm lợi nhuận và lợi nhuận được chia cho các thành viên.","B":"Pháp nhân thương mại là pháp nhân không có mục tiêu chính.","C":"Pháp nhân thương mại là pháp nhân không có mục tiêu chính là tìm kiếm lợi nhuận và lợi nhuận không được chia cho các thành viên.","D":"Tất cả đáp án trên đều sai."},"ans":["A"],"exp":"Căn cứ PL: Điều 75","note":"","multi":false,"id":421,"sets":{},"fix":false},{"topic":"cd5","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 91/2015/QH13, trường hợp cá nhân giao kết hợp đồng chết, hợp đồng sẽ chấm dứt khi nào?","opts":{"A":"Hợp đồng luôn ch ấm dứt, trừ khi có thỏa thuận khác.","B":"Hợp đồng không chấm dứt mà nghĩa vụ được chuyển cho người thừa kế.","C":"Hợp đồng chấm dứt nếu hợp đồng phải do chính cá nhân đó thực hiện.","D":"Hợp đồng chấm dứt nếu việc thực hiện hợp đồng gây thiệt hại cho tài sản thừa kế."},"ans":["C"],"exp":"Căn cứ PL: Điều 396","note":"","multi":false,"id":422,"sets":{},"fix":false},{"topic":"cd5","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 91/2015/QH13, mục đích của giao dịch dân sự là gì?","opts":{"A":"Là sự tự nguyện của các bên khi tham gia giao dịch.","B":"Là lợi ích hợp pháp mà chủ thể tham gia giao dịch đạt được.","C":"Là lợi ích mà chủ thể mong muốn đạt được khi xác lập giao dịch đó.","D":"Là làm phát sinh, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự của các bên."},"ans":["C"],"exp":"Căn cứ PL: Điều 118","note":"","multi":false,"id":423,"sets":{},"fix":false},{"topic":"cd5","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Theo Luật số: 91/2015/QH13, khi giao dịch dân sự vô hiệu và các bên phải hoàn trả lại cho nhau những gì đã nhận, nếu không thể hoàn trả bằng hiện vật thì sẽ xử lý như thế nào?","opts":{"A":"Bên nhận không cần hoàn trả.","B":"Các bên phải thỏa thuận mức bồi thường bằng tiền.","C":"Hợp đồng vô hiệu từng phần.","D":"Trị giá thành tiền để hoàn trả."},"ans":["D"],"exp":"Căn cứ PL: Điều 131","note":"","multi":false,"id":424,"sets":{},"fix":false},{"topic":"cd5","src":"Bộ đề CĐ5 câu 1","q":"Theo Bộ luật Dân sự (BLDS) 2015, loại tài sản nào sau đây được xem là bất động sản?","opts":{"A":"Chỉ có đất đai.","B":"Đất đai; Nhà, công trình xây dựng gắn liền với đất đai; Tài sản khác gắn liền với đất đai, nhà, công trình xây dựng; Tài sản khác do pháp luật quy định.","C":"Chỉ có nhà ở và công trình xây dựng.","D":"Chỉ có quyền sử dụng đất."},"ans":["B"],"exp":"","note":"","multi":false,"id":709,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 2","q":"Quyền sở hữu bất động sản theo Bộ luật Dân sự 2015 bao gồm những quyền năng cơ bản nào?","opts":{"A":"Quyền sử dụng và quyền định đoạt.","B":"Quyền chiếm hữu, quyền sử dụng và quyền định đoạt.","C":"Quyền chiếm hữu và quyền sử dụng.","D":"Quyền khai thác và quyền chuyển nhượng."},"ans":["B"],"exp":"","note":"","multi":false,"id":710,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 3","q":"Theo Bộ luật Dân sự 2015, \"tài sản hình thành trong tương lai\" có thể là đối tượng của giao dịch dân sự không?","opts":{"A":"Không, chỉ tài sản hiện có mới được giao dịch.","B":"Có, bao gồm cả bất động sản chưa hình thành hoặc chưa xác lập quyền sở hữu tại thời điểm giao dịch.","C":"Chỉ áp dụng cho động sản, không áp dụng cho bất động sản.","D":"Chỉ khi có sự đồng ý của cơ quan nhà nước có thẩm quyền."},"ans":["B"],"exp":"","note":"","multi":false,"id":711,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 4","q":"Hình thức bắt buộc đối với hợp đồng mua bán bất động sản theo quy định chung của Bộ luật Dân sự 2015 là gì?","opts":{"A":"Bằng lời nói.","B":"Phải lập thành văn bản, có công chứng hoặc chứng thực (trừ trường hợp luật có quy định khác).","C":"Chỉ cần lập thành văn bản.","D":"Bằng thông điệp dữ liệu điện tử."},"ans":["B"],"exp":"","note":"","multi":false,"id":712,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 5","q":"Thời điểm chuyển quyền sở hữu bất động sản trong hợp đồng mua bán thường được xác định là khi nào?","opts":{"A":"Kể từ thời điểm ký kết hợp đồng.","B":"Kể từ thời điểm thanh toán đủ tiền.","C":"Kể từ thời điểm đăng ký quyền sở hữu tại cơ quan nhà nước có thẩm quyền, trừ thỏa thuận hoặc luật định khác.","D":"Kể từ thời điểm bàn giao bất động sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":713,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 6","q":"Hợp đồng tặng cho bất động sản có hiệu lực kể từ thời điểm nào nếu bất động sản đó phải đăng ký quyền sở hữu?","opts":{"A":"Kể từ thời điểm các bên ký hợp đồng.","B":"Kể từ thời điểm hợp đồng được công chứng/chứng thực.","C":"Kể từ thời điểm đăng ký quyền sở hữu.","D":"Kể từ thời điểm bên được tặng cho nhận tài sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":714,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 7","q":"Bên thuê bất động sản có được phép cho thuê lại không?","opts":{"A":"Không được phép trong mọi trường hợp.","B":"Được phép nếu có sự đồng ý bằng văn bản của bên cho thuê.","C":"Chỉ được phép khi thời hạn thuê còn trên 1 năm.","D":"Được phép tự do mà không cần sự đồng ý."},"ans":["B"],"exp":"","note":"","multi":false,"id":715,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 8","q":"Di sản thừa kế theo Bộ luật Dân sự 2015 bao gồm những gì?","opts":{"A":"Chỉ tài sản riêng của người chết.","B":"Chỉ phần tài sản của người chết trong tài sản chung với người khác.","C":"Tài sản riêng của người chết và phần tài sản của người chết trong tài sản chung với người khác.","D":"Chỉ bất động sản của người chết."},"ans":["C"],"exp":"","note":"","multi":false,"id":716,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 9 · Đề 2A câu 11","q":"Hình thức di chúc nào được khuyến nghị để đảm bảo tính pháp lý và tránh tranh chấp đối với di sản là bất động sản?","opts":{"A":"Di chúc miệng.","B":"Di chúc viết tay không có người làm chứng.","C":"Di chúc bằng văn bản có công chứng hoặc chứng thực.","D":"Di chúc có người làm chứng nhưng không công chứng/chứng thực."},"ans":["C"],"exp":"","note":"","multi":false,"id":717,"fix":false,"sets":{"2A":11}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 10","q":"Theo Điều 644 Bộ luật Dân sự 2015, phần di sản mà người thừa kế không phụ thuộc vào nội dung di chúc được hưởng là bao nhiêu?","opts":{"A":"Bằng một nửa (1/2) suất của một người thừa kế theo pháp luật.","B":"Bằng hai phần ba (2/3) suất của một người thừa kế theo pháp luật.","C":"Bằng một suất của một người thừa kế theo pháp luật.","D":"Tùy thuộc vào giá trị di sản."},"ans":["B"],"exp":"","note":"","multi":false,"id":718,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 11","q":"Ai thuộc hàng thừa kế thứ nhất theo pháp luật (Điều 651 Bộ luật Dân sự 2015)?","opts":{"A":"Ông bà nội, ông bà ngoại, anh chị em ruột.","B":"Vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi.","C":"Cụ nội, cụ ngoại, bác chú cậu cô dì ruột.","D":"Cháu ruột, chắt ruột."},"ans":["B"],"exp":"","note":"","multi":false,"id":719,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 12","q":"Theo Luật Hôn nhân và Gia đình (LHN&GĐ) 2014, quyền sử dụng đất mà vợ chồng có được sau khi kết hôn được xác định là tài sản gì?","opts":{"A":"Luôn là tài sản riêng của người đứng tên trên Giấy chứng nhận.","B":"Là tài sản chung, trừ trường hợp được thừa kế riêng, tặng cho riêng hoặc có được qua giao dịch bằng tài sản riêng.","C":"Luôn là tài sản chung không có ngoại lệ.","D":"Là tài sản riêng của chồng."},"ans":["B"],"exp":"","note":"","multi":false,"id":720,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 13","q":"Việc định đoạt bất động sản là tài sản chung của vợ chồng yêu cầu điều kiện gì theo Điều 35 Luật Hôn nhân và Gia đình 2014?","opts":{"A":"Chỉ cần sự đồng ý của người đứng tên trên Giấy chứng nhận.","B":"Phải có sự thỏa thuận bằng văn bản của cả vợ và chồng.","C":"Chỉ cần sự đồng ý của vợ.","D":"Có thể do một bên tự quyết định."},"ans":["B"],"exp":"","note":"","multi":false,"id":721,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 14","q":"Hậu quả pháp lý nếu một giao dịch liên quan đến bất động sản là tài sản chung được thực hiện mà thiếu sự thỏa thuận của vợ/chồng (khi pháp luật yêu cầu) là gì?","opts":{"A":"Giao dịch vẫn có hiệu lực nhưng bên còn lại được bồi thường.","B":"Giao dịch bị tạm dừng để bổ sung chữ ký.","C":"Bên còn lại có quyền yêu cầu Tòa án tuyên bố giao dịch đó vô hiệu.","D":"Giao dịch chỉ vô hiệu một phần tương ứng với phần tài sản của bên không đồng ý."},"ans":["C"],"exp":"","note":"","multi":false,"id":722,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 15","q":"Khi phân chia bất động sản là tài sản chung khi ly hôn, Tòa án KHÔNG xem xét yếu tố nào sau đây?","opts":{"A":"Hoàn cảnh của gia đình và của vợ, chồng.","B":"Công sức đóng góp của mỗi bên.","C":"Lỗi của mỗi bên trong vi phạm quyền, nghĩa vụ vợ chồng.","D":"Giới tính của vợ hoặc chồng."},"ans":["D"],"exp":"","note":"","multi":false,"id":723,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 16","q":"Đâu là sự khác biệt cơ bản giữa công chứng và chứng thực hợp đồng, giao dịch?","opts":{"A":"Công chứng do UBND thực hiện, chứng thực do Văn phòng công chứng thực hiện.","B":"Công chứng đảm bảo tính xác thực, hợp pháp về nội dung và ý chí các bên; chứng thực chủ yếu xác nhận thời gian, địa điểm, chữ ký, năng lực hành vi.","C":"Chỉ công chứng mới có giá trị pháp lý.","D":"Công chứng áp dụng cho mọi loại giao dịch, chứng thực chỉ áp dụng cho giấy tờ."},"ans":["B"],"exp":"","note":"","multi":false,"id":724,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 17","q":"Giao dịch nào sau đây về nhà ở BẮT BUỘC phải công chứng hoặc chứng thực theo Luật Nhà ở 2023 (trừ các ngoại lệ)?","opts":{"A":"Cho thuê nhà ở dưới 6 tháng.","B":"Mua bán, thuê mua, tặng cho, đổi, góp vốn, thế chấp nhà ở.","C":"Ủy quyền quản lý nhà ở.","D":"Mượn nhà ở."},"ans":["B"],"exp":"","note":"","multi":false,"id":725,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 18","q":"Hợp đồng mua bán nhà ở, công trình xây dựng giữa các cá nhân với nhau có bắt buộc công chứng/chứng thực theo Luật kinh doanh bất động sản (KD BĐS) 2023 không?","opts":{"A":"Không, chỉ cần lập văn bản.","B":"Có, bắt buộc phải công chứng hoặc chứng thực.","C":"Chỉ bắt buộc nếu giá trị trên 1 tỷ đồng.","D":"Theo yêu cầu của một trong các bên."},"ans":["B"],"exp":"","note":"","multi":false,"id":726,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 19","q":"Công chứng viên có được công chứng hợp đồng, giao dịch về bất động sản ở ngoài phạm vi tỉnh, thành phố nơi tổ chức hành nghề công chứng đặt trụ sở không?","opts":{"A":"Được phép tự do.","B":"Chỉ được công chứng trong phạm vi tỉnh/thành phố nơi đặt trụ sở, trừ di chúc, văn bản từ chối nhận di sản, văn bản ủy quyền liên quan đến BĐS.","C":"Chỉ được nếu có sự đồng ý của Sở Tư pháp địa phương nơi có BĐS.","D":"Chỉ được đối với các giao dịch không bắt buộc công chứng."},"ans":["B"],"exp":"","note":"","multi":false,"id":727,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 20","q":"Thời hạn SỞ HỮU nhà chung cư theo Luật Nhà ở 2023 được xác định như thế nào?","opts":{"A":"Có thời hạn theo thời hạn sử dụng đất của dự án.","B":"Có thời hạn theo thiết kế của tòa nhà (ví dụ 50 năm, 70 năm).","C":"Không quy định thời hạn sở hữu, chỉ có thời hạn sử dụng theo hồ sơ thiết kế và kết luận kiểm định. Quyền sử dụng đất là ổn định lâu dài.","D":"Phụ thuộc vào thỏa thuận trong hợp đồng mua bán."},"ans":["C"],"exp":"","note":"","multi":false,"id":728,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 21","q":"Người Việt Nam định cư ở nước ngoài là công dân Việt Nam có quyền về đất đai như thế nào theo Luật Đất đai 2024?","opts":{"A":"Chỉ được nhận thừa kế quyền sử dụng đất.","B":"Có đầy đủ các quyền liên quan đến đất đai như công dân trong nước.","C":"Chỉ được mua nhà ở gắn liền với đất ở.","D":"Bị hạn chế nhiều quyền so với công dân trong nước."},"ans":["B"],"exp":"","note":"","multi":false,"id":729,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 22","q":"Mục đích chính của việc yêu cầu công chứng, chứng thực đối với các giao dịch bất động sản là gì?","opts":{"A":"Tăng nguồn thu cho ngân sách nhà nước.","B":"Đảm bảo tính pháp lý, an toàn, minh bạch, hạn chế tranh chấp và tăng cường quản lý nhà nước.","C":"Tạo công việc cho các công chứng viên.","D":"Làm chậm quá trình giao dịch để các bên suy nghĩ kỹ hơn."},"ans":["B"],"exp":"","note":"","multi":false,"id":730,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 23","q":"Quyền bề mặt (một trong các quyền khác đối với bất động sản theo BLDS 2015) bao gồm quyền khai thác những gì?","opts":{"A":"Chỉ quyền khai thác mặt đất để xây dựng.","B":"Chỉ quyền khai thác lòng đất.","C":"Quyền khai thác mặt đất, lòng đất, và khoảng không gian trên mặt đất gắn với việc sở hữu công trình xây dựng trên đất đó.","D":"Quyền khai thác hoa lợi, lợi tức từ bất động sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":731,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 24 · Đề 1A câu 6","q":"Hậu quả pháp lý trực tiếp của việc một giao dịch dân sự về bất động sản có mục đích hoặc nội dung vi phạm điều cấm của luật hoặc trái đạo đức xã hội là gì?","opts":{"A":"Giao dịch chỉ bị hạn chế hiệu lực.","B":"Giao dịch bị coi là vô hiệu.","C":"Các bên phải thỏa thuận lại nội dung.","D":"Chỉ bên vi phạm phải chịu trách nhiệm."},"ans":["B"],"exp":"","note":"","multi":false,"id":732,"fix":false,"sets":{"1A":6}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 25","q":"Trường hợp ngoại lệ nào tại Điều 129 bộ luật dân sự 2015 KHÔNG yêu cầu các bên phải thực hiện lại việc công chứng, chứng thực nếu Tòa án công nhận hiệu lực giao dịch?","opts":{"A":"Khi giao dịch được xác lập bằng lời nói nhưng các bên đã thực hiện toàn bộ nghĩa vụ.","B":"Khi giao dịch bằng văn bản vi phạm quy định bắt buộc về công chứng, chứng thực nhưng một hoặc các bên đã thực hiện ít nhất 2/3 nghĩa vụ.","C":"Khi giao dịch được xác lập qua email nhưng chưa có chữ ký điện tử.","D":"Khi giao dịch chỉ thiếu chữ ký của một bên nhưng bên đó đã nhận lợi ích."},"ans":["B"],"exp":"","note":"","multi":false,"id":733,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 26","q":"Giao dịch dân sự về bất động sản được xác lập do nhầm lẫn có thể bị tuyên vô hiệu khi nào?","opts":{"A":"Khi một bên nhầm lẫn về bất kỳ chi tiết nào của giao dịch.","B":"Khi việc nhầm lẫn làm cho một bên không đạt được mục đích của việc xác lập giao dịch, và bên kia biết hoặc phải biết về sự nhầm lẫn đó.","C":"Chỉ khi cả hai bên cùng nhầm lẫn về đối tượng giao dịch.","D":"Khi sự nhầm lẫn dẫn đến thiệt hại vật chất đáng kể."},"ans":["B"],"exp":"","note":"","multi":false,"id":734,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 27","q":"Theo Bộ luật dân sự 2015, trong hợp đồng mua bán bất động sản, bên bán có nghĩa vụ chịu trách nhiệm về khuyết tật của tài sản không?","opts":{"A":"Không, bên mua phải tự kiểm tra trước khi nhận.","B":"Có, luôn phải chịu trách nhiệm về mọi khuyết tật.","C":"Có, phải chịu trách nhiệm trừ khi có thỏa thuận khác hoặc bên mua biết hoặc phải biết về khuyết tật đó.","D":"Chỉ chịu trách nhiệm đối với khuyết tật ẩn giấu."},"ans":["C"],"exp":"","note":"","multi":false,"id":735,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 28","q":"Di chúc miệng chỉ được công nhận hợp pháp trong điều kiện nào sau đây?","opts":{"A":"Người lập di chúc minh mẫn và có ít nhất 1 người làm chứng.","B":"Tính mạng người lập di chúc bị cái chết đe dọa và không thể lập di chúc bằng văn bản, có ít nhất 2 người làm chứng ghi chép lại ngay và ký tên hoặc điểm chỉ","C":"Người lập di chúc trên 70 tuổi và không biết chữ.","D":"Di chúc được ghi âm và có xác nhận của người thân."},"ans":["B"],"exp":"","note":"","multi":false,"id":736,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 29","q":"Di chúc miệng sẽ mặc nhiên bị hủy bỏ sau bao lâu kể từ ngày lập nếu người lập di chúc còn sống và minh mẫn, sáng suốt?","opts":{"A":"1 tháng.","B":"3 tháng.","C":"6 tháng.","D":"1 năm."},"ans":["B"],"exp":"","note":"","multi":false,"id":737,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 30","q":"Công chứng viên hoặc người có thẩm quyền chứng thực tại UBND cấp xã có được phép công chứng, chứng thực di chúc nếu con của họ là người được hưởng thừa kế theo di chúc đó không?","opts":{"A":"Được phép nếu người lập di chúc đồng ý.","B":"Được phép nếu giá trị di sản không lớn.","C":"Không được phép.","D":"Chỉ không được phép nếu chính họ là người hưởng thừa kế."},"ans":["C"],"exp":"","note":"","multi":false,"id":738,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 31","q":"Hàng thừa kế thứ hai theo pháp luật (Điều 651 BLDS 2015) chỉ được hưởng thừa kế khi nào?","opts":{"A":"Khi không còn ai ở hàng thừa kế thứ nhất hoặc những người đó không có quyền hưởng, từ chối nhận hoặc đã chết.","B":"Khi tổng giá trị di sản vượt quá một mức nhất định.","C":"Khi di chúc chỉ định họ là người hưởng một phần di sản."},"ans":["A"],"exp":"","note":"","multi":false,"id":739,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 32","q":"Thời hiệu yêu cầu Tòa án xác nhận quyền thừa kế của mình hoặc bác bỏ quyền thừa kế của người khác đối với di sản là bất động sản là bao nhiêu năm?","opts":{"A":"3 năm kể từ thời điểm mở thừa kế.","B":"10 năm kể từ thời điểm mở thừa kế.","C":"30 năm kể từ thời điểm mở thừa kế.","D":"Không giới hạn thời hiệu."},"ans":["B"],"exp":"","note":"","multi":false,"id":740,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 33","q":"Hoa lợi, lợi tức phát sinh từ tài sản riêng của vợ hoặc chồng trong thời kỳ hôn nhân được xác định là tài sản gì, trừ khi có thỏa thuận khác?","opts":{"A":"Luôn là tài sản riêng của người có tài sản đó.","B":"Là tài sản chung của vợ chồng.","C":"Chia đôi giữa vợ và chồng.","D":"Thuộc sở hữu nhà nước."},"ans":["B"],"exp":"","note":"","multi":false,"id":741,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 34","q":"Trường hợp nào việc định đoạt tài sản riêng của vợ/chồng phải có sự đồng ý của người kia?","opts":{"A":"Khi tài sản riêng đó là bất động sản.","B":"Khi tài sản riêng đó có giá trị lớn.","C":"Khi hoa lợi, lợi tức từ tài sản riêng đó là nguồn sống duy nhất của gia đình.","D":"Không có trường hợp nào, tài sản riêng do người đó tự quyết định."},"ans":["C"],"exp":"","note":"","multi":false,"id":742,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 35","q":"Yếu tố nào sau đây được coi là \"lao động có thu nhập\" khi Tòa án xem xét công sức đóng góp của vợ, chồng vào việc tạo lập, duy trì tài sản chung khi ly hôn?","opts":{"A":"Chỉ công việc tạo ra tiền bạc trực tiếp.","B":"Lao động trong gia đình (nội trợ, chăm sóc con cái...).","C":"Chỉ việc đóng góp bằng tài sản riêng.","D":"Chỉ công việc được trả lương theo hợp đồng lao động."},"ans":["B"],"exp":"","note":"","multi":false,"id":743,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 36","q":"Giao dịch chuyển đổi quyền sử dụng đất nông nghiệp giữa các hộ gia đình, cá nhân có bắt buộc phải công chứng, chứng thực theo Luật Đất đai 2024 không?","opts":{"A":"Bắt buộc phải công chứng.","B":"Bắt buộc phải chứng thực tại UBND xã.","C":"Không bắt buộc, nhưng có thể công chứng/chứng thực theo yêu cầu.","D":"Chỉ bắt buộc nếu giá trị đất lớn."},"ans":["C"],"exp":"","note":"","multi":false,"id":744,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 37","q":"Hợp đồng thế chấp nhà ở hình thành trong tương lai cho tổ chức tín dụng có bắt buộc phải công chứng, chứng thực theo Luật Nhà ở 2023 không?","opts":{"A":"Bắt buộc phải công chứng.","B":"Bắt buộc phải chứng thực.","C":"Không bắt buộc công chứng, chứng thực.","D":"Chỉ bắt buộc nếu giá trị vay lớn hơn giá trị nhà."},"ans":["C"],"exp":"","note":"","multi":false,"id":745,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 38","q":"Văn bản ủy quyền liên quan đến việc thực hiện các quyền đối với bất động sản có thể được công chứng ở đâu?","opts":{"A":"Chỉ tại tổ chức hành nghề công chứng nơi có bất động sản.","B":"Tại bất kỳ tổ chức hành nghề công chứng nào trên toàn quốc.","C":"Tại tổ chức hành nghề công chứng nơi người ủy quyền hoặc người được ủy quyền cư trú, hoặc nơi có bất động sản.","D":"Tại tổ chức hành nghề công chứng nơi người ủy quyền cư trú hoặc nơi có bất động sản (không bắt buộc phải là nơi đặt trụ sở của tổ chức công chứng đó)."},"ans":["B"],"exp":"","note":"Hiệu đính: tài liệu gốc tô D. Luật Công chứng: văn bản ủy quyền liên quan đến BĐS là ngoại lệ, được công chứng tại bất kỳ tổ chức hành nghề công chứng nào (xem CĐ6).","multi":false,"id":746,"fix":true,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 39","q":"Thỏa thuận đặt cọc để mua nhà ở hình thành trong tương lai theo Luật KD BĐS 2023 phải bao gồm nội dung gì về giá?","opts":{"A":"Không cần ghi giá, chỉ cần ghi số tiền cọc.","B":"Phải ghi rõ giá bán hoặc giá cho thuê mua dự kiến tại thời điểm ký thỏa thuận đặt cọc.","C":"Chỉ cần ghi khoảng giá tham khảo.","D":"Giá sẽ được xác định khi ký hợp đồng mua bán chính thức."},"ans":["B"],"exp":"","note":"","multi":false,"id":747,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 40","q":"Quy định bắt buộc thanh toán qua ngân hàng theo Điều 48 Luật KD BĐS 2023 KHÔNG áp dụng cho đối tượng nào?","opts":{"A":"Chủ đầu tư dự án bất động sản.","B":"Doanh nghiệp kinh doanh dịch vụ môi giới bất động sản.","C":"Cá nhân Kinh doanh bất động sản quy mô nhỏ hoặc bán nhà ở không nhằm mục đích kinh doanh.","D":"Doanh nghiệp kinh doanh sàn giao dịch bất động sản."},"ans":["C"],"exp":"","note":"","multi":false,"id":748,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 41","q":"Tác động tiềm ẩn của việc áp dụng bảng giá đất hàng năm theo Luật Đất đai 2024 (từ 2026) là gì?","opts":{"A":"Luôn làm giảm chi phí sử dụng đất cho người dân và doanh nghiệp.","B":"Có thể làm tăng chi phí sử dụng đất, thuê đất, thuế, phí nhưng cũng đảm bảo giá trị bồi thường khi thu hồi đất sát thị trường hơn.","C":"Không ảnh hưởng gì đến giá giao dịch thực tế trên thị trường.","D":"Chỉ áp dụng cho đất nông nghiệp."},"ans":["B"],"exp":"","note":"","multi":false,"id":749,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 42 · Đề 1A câu 49","q":"Việc Luật Đất đai 2024 không còn quy định \"hộ gia đình\" là đối tượng sử dụng đất mới có ý nghĩa gì?","opts":{"A":"Thu hồi lại đất đã cấp cho hộ gia đình trước đây.","B":"Đơn giản hóa chủ thể quan hệ pháp luật đất đai cho phù hợp với BLDS, các quyền đã cấp trước đó sẽ xử lý theo quy định chuyển tiếp.","C":"Buộc các thành viên hộ gia đình phải tách sổ đỏ riêng.","D":"Không có ý nghĩa gì quan trọng."},"ans":["B"],"exp":"","note":"","multi":false,"id":750,"fix":false,"sets":{"1A":49}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 43","q":"Người gốc Việt Nam định cư ở nước ngoài (không còn quốc tịch Việt Nam) có được phép đầu tư xây dựng nhà ở để bán, cho thuê theo Luật Đất đai 2024 không?","opts":{"A":"Không, chỉ công dân Việt Nam định cư ở nước ngoài mới được.","B":"Có, được phép đầu tư xây dựng nhà ở, công trình xây dựng để bán, cho thuê, cho thuê mua và đầu tư hạ tầng kỹ thuật để chuyển nhượng, cho thuê QSDĐ.","C":"Chỉ được mua nhà ở để ở.","D":"Chỉ được đầu tư vào dự án nhà ở xã hội."},"ans":["B"],"exp":"","note":"","multi":false,"id":751,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 44 · Đề 2A câu 47","q":"Việc xác định quyền sử dụng đất của dự án chung cư (ổn định lâu dài hay có thời hạn) thuộc phạm vi điều chỉnh chính của luật nào?","opts":{"A":"Luật Nhà ở 2023.","B":"Luật kinh doanh bất động sản 2023.","C":"Luật Xây dựng.","D":"Luật Đất đai 2024."},"ans":["D"],"exp":"","note":"","multi":false,"id":752,"fix":false,"sets":{"2A":47}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 45","q":"Nếu một cá nhân mua căn hộ chung cư sau khi kết hôn và không dùng tài sản riêng, cũng không được tặng cho riêng hay thừa kế riêng, thì việc thế chấp căn hộ này sau đó cần sự đồng ý của ai?","opts":{"A":"Chỉ cần người đứng tên trên hợp đồng mua bán.","B":"Chỉ cần người đứng tên trên Giấy chứng nhận (nếu đã có).","C":"Cần sự thỏa thuận bằng văn bản của cả hai vợ chồng.","D":"Chỉ cần thông báo cho người vợ/chồng còn lại."},"ans":["C"],"exp":"","note":"","multi":false,"id":753,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 46","q":"Hợp đồng cho thuê nhà ở với thời hạn 5 tháng có bắt buộc phải công chứng hoặc chứng thực không?","opts":{"A":"Bắt buộc công chứng.","B":"Bắt buộc chứng thực.","C":"Không bắt buộc, trừ khi các bên có nhu cầu.","D":"Bắt buộc nếu giá thuê trên 10 triệu/tháng."},"ans":["C"],"exp":"","note":"","multi":false,"id":754,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 47","q":"Khi phân chia di sản là bất động sản theo pháp luật, nếu hàng thừa kế thứ nhất còn đầy đủ (vợ, 2 con), thì những người ở hàng thừa kế thứ hai (ví dụ: anh trai của người chết) có được hưởng thừa kế không?","opts":{"A":"Có, được chia một phần nhỏ hơn.","B":"Có, nếu được những người hàng thứ nhất đồng ý.","C":"Không, vì những người ở hàng sau chỉ được hưởng nếu không còn ai ở hàng trước.","D":"Chỉ được hưởng nếu di sản có giá trị rất lớn."},"ans":["C"],"exp":"","note":"Hiệu đính: tài liệu gốc tô D. Người thừa kế hàng sau chỉ được hưởng khi không còn ai ở hàng trước (Điều 651 BLDS 2015).","multi":false,"id":755,"fix":true,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 48","q":"Một người lập di chúc truất quyền hưởng di sản của người con chưa thành niên. Di chúc này có hợp pháp về mặt nội dung truất quyền không?","opts":{"A":"Có, người lập di chúc có toàn quyền định đoạt.","B":"Không, vì con chưa thành niên thuộc diện người thừa kế không phụ thuộc vào nội dung di chúc nên không thể bị truất quyền hoàn toàn (vẫn được hưởng 2/3 suất theo pháp luật).","C":"Chỉ hợp pháp nếu người con đó hư hỏng, bất hiếu.","D":"Chỉ hợp pháp nếu người con đó đã có tài sản riêng đủ sống."},"ans":["B"],"exp":"","note":"","multi":false,"id":756,"fix":false,"sets":{}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 49 · Đề 2A câu 41","q":"Nếu hợp đồng thế chấp bất động sản đã được công chứng nhưng chưa đăng ký giao dịch bảo đảm, thì hiệu lực của hợp đồng này như thế nào?","opts":{"A":"Vô hiệu hoàn toàn.","B":"Có hiệu lực giữa các bên thế chấp và nhận thế chấp, nhưng chưa có hiệu lực đối kháng với người thứ ba.","C":"Chỉ có hiệu lực khi có tranh chấp xảy ra.","D":"Chỉ có hiệu lực về mặt hình thức."},"ans":["B"],"exp":"","note":"","multi":false,"id":757,"fix":false,"sets":{"2A":41}},{"topic":"cd5","src":"Bộ đề CĐ5 câu 50","q":"Công ty ký hợp đồng đặt cọc mua bất động sản với bên bán là cá nhân. Sau đó cá nhân bán cho người khác. Công ty có thể đòi lại tài sản hoặc kiện được không?","opts":{"A":"Không vì hợp đồng đặt cọc không phải hợp đồng chính thức","B":"Có, vì cá nhân đã vi phạm cam kết đặt cọc","C":"Không, vì tài sản đã thuộc về người khác","D":"Có, nếu có thỏa thuận rõ ràng về hủy đặt cọc"},"ans":["B"],"exp":"","note":"","multi":false,"id":758,"fix":false,"sets":{}},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01 · Bộ đề CĐ6 câu 1","q":"Theo Luật Công chứng 2024, tổ chức hành nghề công chứng bao gồm những loại hình nào?","opts":{"A":"Chỉ có Phòng Công chứng.","B":"Chỉ có Văn phòng công chứng.","C":"Phòng Công chứng và Văn phòng công chứng.","D":"Văn phòng công chứng và Công ty luật có chức năng công chứng."},"ans":["C"],"exp":"Cơ sở pháp lý: Theo Khoản 1 Điều 19 Luật Công chứng năm 2024:Tổ chức hành nghề công chứng bao gồm Phòng công chứng và Văn phòng công chứng được tổ chức và hoạt động theo quy định của Luật này và quy định khác của pháp luật có liên quan","note":"","multi":false,"id":118,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01 · Bộ đề CĐ6 câu 4 · Đề 1A câu 32","q":"Văn bản công chứng có giá trị pháp lý như thế nào?","opts":{"A":"Chỉ có giá trị tham khảo.","B":"Có hiệu lực thi hành đối với các bên và có giá trị chứng cứ.","C":"Cần phải được Tòa án phê duyệt mới có hiệu lực.","D":"Có giá trị tương đương văn bản chứng thực."},"ans":["B"],"exp":"Cơ sở pháp lý: Theo Khoản 2,3 Điều 6 Luật công chứng 2024: Văn bản công chứng có hiệu lực thi hành đối với các bên liên quan, là cơ sở để các bên tham gia giao dịch đề nghị cơ quan nhà nước có thẩm quyền thực hiện các thủ tục liên quan đến giao dịch đã được công chứng.; Văn bản công chứng có giá trị chứng cứ; những tình tiết, sự kiện trong văn bản công chứng không phải chứng minh, trừ trường hợp bị Tòa án tuyên bố là vô hiệu","note":"","multi":false,"id":119,"sets":{"1A":32},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01 · Bộ đề CĐ6 câu 6","q":"Trường hợp nào sau đây vẫn bắt buộc phải công chứng hoặc chứng thực theo quy định của Luật Đất đai 2024?","opts":{"A":"Hợp đồng cho thuê Quyền sử dụng đất giữa hai doanh nghiệp.","B":"Hợp đồng chuyển nhượng Quyền sử dụng đất mà một bên là doanh nghiệp kinh doanh BĐS.","C":"Văn bản về thừa kế Quyền sử dụng đất giữa các cá nhân.","D":"Hợp đồng chuyển đổi Quyền sử dụng đất nông nghiệp."},"ans":["C"],"exp":"Cơ sở pháp lý: Theo Khoản 3 Điều 27 Luật đai 2024: Mặc dù Luật Đất đai 2024 có nhiều ngoại lệ không bắt buộc công chứng/chứng thực khi có DN KDBĐS tham gia, nhưng văn bản về thừa kế QSDĐ vẫn thuộc trường hợp bắt buộc phải công chứng hoặc chứng thực","note":"","multi":false,"id":120,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Doanh nghiệp kinh doanh BĐS có thể lựa chọn công chứng tại tổ chức hành nghề công chứng nào?","opts":{"A":"Chỉ tại Phòng Công chứng nơi doanh nghiệp đặt trụ sở chính.","B":"Chỉ tại Văn phòng công chứng nơi có BĐS.","C":"Tại bất kỳ Phòng Công chứng hoặc Văn phòng công chứng nào trên toàn quốc.","D":"Tại Phòng Công chứng hoặc Văn phòng công chứng trong phạm vi tỉnh/thành phố nơi có BĐS."},"ans":["D"],"exp":"Cơ sở pháp lý: Theo Điều 44 Luật công chứng 2024: Pháp luật quy định công chứng viên chỉ được công chứng hợp đồng, giao dịch về BĐS trong phạm vi tỉnh, thành phố trực thuộc trung ương nơi tổ chức hành nghề công chứng đặt trụ sở","note":"","multi":false,"id":121,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Thời hạn công chứng hợp đồng, giao dịch thông thường là bao lâu kể từ ngày nhận đủ hồ sơ hợp lệ?","opts":{"A":"Không quá 01 ngày làm việc.","B":"Không quá 02 ngày làm việc.","C":"Không quá 05 ngày làm việc.","D":"Không quá 10 ngày làm việc."},"ans":["B"],"exp":"Cơ sở pháp lý: Theo Điều 45 Luật Công chứng 2024:Theo quy định thời hạn công chứng thông thường là không quá 02 ngày làm việc. Đối với trường hợp phức tạp, có thể kéo dài nhưng không quá 10 ngày làm việc.","note":"","multi":false,"id":122,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Hợp đồng trong kinh doanh bất động sản phải công chứng","opts":{"A":"Được ký kết giữa một bên là Doanh nghiệp và một bên là cá nhân","B":"Được ký kết giữa hai bên là Doanh nghiệp kinh doanh bất động sản","C":"Được ký kết giữa một bên là Doanh nghiệp kinh doanh bất động sản với cá nhân","D":"Được ký kết giữa các bên là cá nhân"},"ans":["D"],"exp":"Cơ sở pháp lý: Điều 44 Luật kinh doanh bất động sản 2023: Hợp đồng mua bán, thuê mua nhà ở, công trình xây dựng, phần diện tích sàn xây dựng trong công trình xây dựng mà các bên tham gia giao dịch là cá nhân phải công chứng hoặc chứng thực","note":"","multi":false,"id":123,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Người yêu cầu công chứng khi đến tổ chức hành nghề công chứng thực hiện giao dịch thì phải:","opts":{"A":"Ghi phiếu cầu công chứng","B":"Không ghi phiếu yêu cầu công chứng","C":"Theo sự hướng dẫn của công chứng viên","D":"Ghi lại thông tin cá nhân"},"ans":["B"],"exp":"Cơ sở pháp lý: Theo Khoản 1, Điều 42 Luật Công chứng 2024: Theo Luật công chứng 2024: Liệt kê các loại giấy tờ cần thiết trong hồ sơ yêu cầu công chứng: dự thảo giao dịch, bản sao giấy tờ tù thân, giấy tờ liên quan đến tài sản (nếu có), giấy tờ khác theo quy định luật. Trong danh mục này không nhắc đến Phiếu yêu cầu công chứng, đã bỏ thủ tục ghi phiếu yêu cầu công chứng như Luật công chứng 2014","note":"","multi":false,"id":124,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Ủy ban nhân dân xã, phường (gọi chung là Ủy ban nhân dân cấp xã) có thẩm quyền và trách nhiệm:","opts":{"A":"Chứng thực bản sao từ bản chính các giấy tờ, văn bản do cơ quan có thẩm quyền của Việt Nam cấp hoặc chứng nhận; chữ ký trong các giấy tờ, văn bản, trừ việc chứng thực chữ ký người dịch","B":"Chứng thực hợp đồng, giao dịch liên quan đến tài sản là động sản; hợp đồng, giao dịch liên quan đến thực hiện các quyền của người sử dụng đất theo quy định của Luật Đất đai; hợp đồng, giao dịch về nhà ở theo quy định của Luật Nhà ở","C":"Chứng thực di chúc; văn bản từ chối nhận di sản; văn bản thỏa thuận phân chia di sản, văn bản khai nhận di sản mà di sản là tài sản","D":"Cả 3 đều đúng"},"ans":["D"],"exp":"Cơ sở pháp lý: Căn cứ theo khoản 2 Điều 5 Nghị định 23/2015/NĐ-CP, ngày 16/02/2015 và SĐBS Nghị định 120/2025/NĐ-CP, ngày 11/06/2025","note":"","multi":false,"id":125,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Thời hạn chứng thực hợp đồng, giao dịch kể từ ngày nhận đủ hồ sơ yêu cầu chứng thực:","opts":{"A":"Không quá 02 ngày làm việc","B":"Không quá 10 ngày làm việc","C":"Có thể kéo dài hơn 02 ngày làm việc","D":"Theo yêu cầu của người chứng thực"},"ans":["A"],"exp":"Cơ sở pháp lý: Căn cứ theo Điều 37 Nghị định 23/2015/NĐ-CP, ngày 16/02/2015: Thời hạn chứng thực hợp đồng, giao dịch không quá 02 (hai) ngày làm việc, kể từ ngày nhận đủ hồ sơ yêu cầu chứ ,{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Chia tài sản chung chung vợ chồng trong thời kỳ hôn nhân, phải:","opts":{"A":"Công chứng, chứng thực","B":"Không công chứng, chứng thực","C":"Thỏa thuận bằng văn bản và không buộc công chứng, chứng thực","D":"Thỏa thuận bằng văn bản và có công chứng"},"ans":["D"],"exp":"Cơ sở pháp lý: Căn cứ theo khoản 2 Điều 38 Luật hôn nhân và gia đình 2014: Chia tài sản chung trong thời kỳ hôn nhân: Thỏa thuận về việc chia tài sản chung phải lập thành văn bản. Văn bản này được công chứng theo yêu cầu của vợ chồng hoặc theo quy định của pháp luật.","note":"","multi":false,"id":135,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Việc xác lập chế độ tài sản của vợ chồng trước khi kết hôn:","opts":{"A":"Thỏa thuận sau khi kết hôn có công chứng, chứng thực","B":"Thỏa thuận bằng văn bản","C":"Lập thành văn bản, có công chứng hoặc chứng thực","D":"Thỏa thuận này phải được lập trước khi kết hôn, bằng hình thức văn bản có công chứng hoặc chứng thực"},"ans":["D"],"exp":"Cơ sở pháp lý: Căn cứ điều 47 Luật hôn nhân và gia đình 2014: Trong trường hợp hai bên kết hôn lựa chọn chế độ tài sản theo thỏa thuận thì thỏa thuận này phải được lập trước khi kết hôn, bằng hình thức văn bản có công chứng hoặc chứng thực.","note":"","multi":false,"id":136,"sets":{},"fix":false},{"topic":"cd6","src":"Tài liệu ôn thi cơ sở 01","q":"Công chứng ngoài trụ sở của tổ chức hành nghề công chứng:","opts":{"A":"Phụ nữ đang mang thai hoặc nuôi con nhỏ dưới 12 tháng tuổi","B":"Người cao tuổi, người khuyết tật hoặc có khó khăn trong việc đi lại","C":"Không thể đi lại được vì lý do sức khỏe; đang điều trị nội trú hoặc bị cách ly theo chỉ định của cơ sở y tế","D":"Cả 3 trường hợp trên"},"ans":["D"],"exp":"Cơ sở pháp lý: Căn cứ Điều 46 Luật công chứng 2024: Việc công chứng có thể được thực hiện ngoài trụ sở của tổ chức hành nghề công chứng nếu người yêu cầu công chứng thuộc các trường hợp sau đây:Lập di chúc tại chỗ ở theo quy định của Bộ luật Dân sự;Không thể đi lại được vì lý do sức khỏe; đang điều trị nội trú hoặc bị cách ly theo chỉ định của cơ sở y tế;Đang bị tạm giữ, tạm giam; đang thi hành án phạt tù; đang bị áp dụng biện pháp xử lý hành chính;Có lý do chính đáng khác theo quy định của Chính phủ.: “Phụ nữ đang mang thai hoặc nuôi con nhỏ dưới 12 tháng tuổi…” (Điều 43 NĐ 104/2025/NĐCP)","note":"","multi":false,"id":137,"sets":{},"fix":false},{"topic":"cd6","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Luật số: 46/2024/QH15- Luật Công chứng, “Công chứng” là gì?","opts":{"A":"Công chứng là dịch vụ công do công chứng viên của tổ chức hành nghề công chứng thực hiện để chứng nhận tính xác thực, hợp pháp của giao dịch mà luật quy định phải công chứng, luật giao Chính phủ quy định phải công chứng hoặc cá nhân, tổ chức tự nguyện yêu cầu công chứng.","B":"Công chứng là dịch vụ ghi nhận các sự kiện, hành vi có thật theo yêu cầu của cơ quan, tổ chức, cá nhân trong phạm vi toàn quốc","C":"Công chứng là việc cơ quan, tổ chức có thẩm quyền căn cứ vào bản chính để chứng thực bản sao là đúng với bản chính.","D":"Tất cả đáp án trên đều đúng."},"ans":["A"],"exp":"Căn cứ PL: K1 Điều 2","note":"","multi":false,"id":425,"sets":{},"fix":false},{"topic":"cd6","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Luật số: 46/2024/QH15- Luật Công chứng, văn bản công chứng có giá trị pháp lý như thế nào?","opts":{"A":"Chỉ có giá trị tham khảo.","B":"Có hiệu lực thi hành đối với các bên và có giá trị chứng cứ.","C":"Cần phải được Tòa án phê duyệt mới có hiệu lực.","D":"Có giá trị tương đương văn bản chứng thực"},"ans":["B"],"exp":"Căn cứ PL: K2 Điều 6","note":"","multi":false,"id":426,"sets":{},"fix":false},{"topic":"cd6","src":"Bài giảng ôn thi cơ sở (ThS. Phan Thị Hồng Oanh)","q":"Luật số: 46/2024/QH15- Luật Công chứng, doanh nghiệp kinh doanh bất động sản có thể lựa chọn công chứng tại tổ chức hành nghề công chứng nào?","opts":{"A":"Chỉ tại Phòng Công chứng nơi doanh nghiệp đặt trụ sở chính.","B"
